# managed by noixdev.infra (nginx role): site node. Changes here are overwritten.
# HTTP: ACME challenges, and a 301 to HTTPS.
server {
    listen 80;
    server_name node.example.test;
    access_log /var/log/nginx/node.access.log main;
    error_log /var/log/nginx/node.error.log;
    # ACME http-01 challenges (certbot's webroot).
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/noixdev/acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    ssl_certificate /etc/ssl/noixdev-test/example.test.crt;
    ssl_certificate_key /etc/ssl/noixdev-test/example.test.key;
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 127.0.0.53 valid=300s;
    resolver_timeout 5s;
    server_name node.example.test;
    access_log /var/log/nginx/node.access.log main;
    error_log /var/log/nginx/node.error.log;
    client_max_body_size 64m;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    include /etc/nginx/noixdev/hardening.conf;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }
}
