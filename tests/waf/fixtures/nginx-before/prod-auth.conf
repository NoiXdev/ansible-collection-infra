# managed by noixdev.infra (nginx role): site prod. Changes here are overwritten.
# HTTP: ACME challenges, and a 301 to HTTPS.
server {
    listen 80;
    server_name prod.example.test;
    access_log /var/log/nginx/prod.access.log main;
    error_log /var/log/nginx/prod.error.log;
    # ACME http-01 challenges (certbot's webroot).
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/noixdev/acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# The redirect domains: a 301 to https://prod.example.test.
server {
    listen 80;
    server_name www.prod.example.test;
    access_log /var/log/nginx/prod.access.log main;
    error_log /var/log/nginx/prod.error.log;
    # ACME http-01 challenges (certbot's webroot).
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/noixdev/acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 301 https://prod.example.test$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    ssl_certificate /etc/letsencrypt/live/prod/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/prod/privkey.pem;
    server_name www.prod.example.test;
    access_log /var/log/nginx/prod.access.log main;
    error_log /var/log/nginx/prod.error.log;
    location / {
        return 301 https://prod.example.test$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    ssl_certificate /etc/letsencrypt/live/prod/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/prod/privkey.pem;
    server_name prod.example.test;
    access_log /var/log/nginx/prod.access.log main;
    error_log /var/log/nginx/prod.error.log;
    client_max_body_size 64m;
    root /srv/prod/public;
    # www-data is in every site's group: a link to a file of another owner
    # (another environment's, say) is not followed, in every part of the
    # path, the root's own path too (a site user's link current re-pointed
    # at another site's tree). A deploy's current -> releases/N works when
    # the site user owns the link and the release.
    disable_symlinks if_not_owner;
    index index.php index.html;
    # Basic auth. Only this server block has it: the ACME challenges are
    # answered by the port 80 blocks above.
    auth_basic "Restricted";
    auth_basic_user_file /etc/nginx/noixdev/htpasswd/prod;
    satisfy any;
    allow 192.0.2.10;
    deny all;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    include /etc/nginx/noixdev/hardening.conf;

    # The noix error pages, for the errors nginx answers itself; the app's
    # own answers pass unchanged (no fastcgi_intercept_errors or
    # proxy_intercept_errors). ^~: no regex location (the hardening's
    # dotfiles) takes the path. The release behind the link current is
    # root's, as the link is: disable_symlinks if_not_owner follows it.
    error_page 403 /.noix-error/403.html;
    error_page 404 /.noix-error/404.html;
    error_page 413 /.noix-error/413.html;
    error_page 414 /.noix-error/414.html;
    error_page 429 /.noix-error/429.html;
    error_page 500 /.noix-error/500.html;
    error_page 502 /.noix-error/502.html;
    error_page 503 /.noix-error/503.html;
    error_page 504 /.noix-error/504.html;
    location ^~ /.noix-error/ {
        internal;
        # The page of an error before the login (a rate limit) needs none.
        auth_basic off;
        allow all;
        # The redirect to the page keeps the request's headers: without this
        # a 413 (body too large) fails again here and nginx shows its own.
        client_max_body_size 0;
        alias /var/www/noix-error-pages/current/pages/en/;
    }

    # Only the front controller and the listed scripts go to PHP.
    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass unix:/run/php/production.sock;
    }

    location = /setup/install.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass unix:/run/php/production.sock;
    }

    # Any other PHP file is never run and never served as text.
    location ~* \.(?:php[0-9]*|phtml|phar)$ {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }
}
