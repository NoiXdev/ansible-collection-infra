# managed by noixdev.infra (nginx role): site node. Changes here are overwritten.
# HTTP: ACME challenges, and a 301 to HTTPS.
server {
    listen 80;
    server_name node.example.test;
    access_log /var/log/nginx/node.access.log main;
    error_log /var/log/nginx/node.error.log;
    # ACME http-01 challenges (certbot's webroot).
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/noixdev/acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    ssl_certificate /etc/ssl/noixdev-test/example.test.crt;
    ssl_certificate_key /etc/ssl/noixdev-test/example.test.key;
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 127.0.0.53 valid=300s;
    resolver_timeout 5s;
    server_name node.example.test;
    access_log /var/log/nginx/node.access.log main;
    error_log /var/log/nginx/node.error.log;
    client_max_body_size 64m;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    include /etc/nginx/noixdev/hardening.conf;

    # The noix error pages, for the errors nginx answers itself; the app's
    # own answers pass unchanged (no fastcgi_intercept_errors or
    # proxy_intercept_errors). ^~: no regex location (the hardening's
    # dotfiles) takes the path. The release behind the link current is
    # root's, as the link is: disable_symlinks if_not_owner follows it.
    error_page 403 /.noix-error/403.html;
    error_page 404 /.noix-error/404.html;
    error_page 413 /.noix-error/413.html;
    error_page 414 /.noix-error/414.html;
    error_page 429 /.noix-error/429.html;
    error_page 500 /.noix-error/500.html;
    error_page 502 /.noix-error/502.html;
    error_page 503 /.noix-error/503.html;
    error_page 504 /.noix-error/504.html;
    location ^~ /.noix-error/ {
        internal;
        # The redirect to the page keeps the request's headers: without this
        # a 413 (body too large) fails again here and nginx shows its own.
        client_max_body_size 0;
        alias /var/www/noix-error-pages/current/pages/en/;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }
}
