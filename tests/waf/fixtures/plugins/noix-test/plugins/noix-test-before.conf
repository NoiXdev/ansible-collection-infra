# Text that looks like Jinja stays as it is: {{ noix }} {% noix %} {# noix #}
# Refuses ?noixprobe=<greeting>. It does not check
# tx.noix-test-plugin_enabled on purpose: the role, not the plugin, keeps it
# off for the sites that do not list it.
SecRule ARGS:noixprobe "@streq %{tx.noix-test-plugin_greeting}" \
    "id:9590010,\
    phase:2,\
    deny,\
    status:403,\
    log,\
    msg:'noix-test probe'"

# Logs every request with an X-Secret-Token header (its value would be the
# matched data): the role keeps credential headers out of plugin rules too.
SecRule REQUEST_HEADERS:X-Secret-Token "@rx ." \
    "id:9590011,\
    phase:1,\
    pass,\
    log,\
    severity:'NOTICE',\
    msg:'noix-test secret header'"

# Logs every request with an X-Noix-Mark header, in phase 1: a request of a
# site without noix-test must not log it (the role removes the rule there).
SecRule REQUEST_HEADERS:X-Noix-Mark "@rx ." \
    "id:9590012,\
    phase:1,\
    pass,\
    log,\
    severity:'NOTICE',\
    msg:'noix-test mark header'"
