# Which files each suite of tests/all.sh depends on. tests/attest.sh reruns
# an entry only when one of its files changed since its last green signed
# run, and carries the others; the release check proves each carried entry
# against this map at the tested commit. Read by .github/scripts/attest_carry.py
# (check-map checks it against all_suites and roles/).
#
# Per changed file, in this order:
#   [ignore]        the file touches no suite (ignore wins over everything);
#   [shared]        every suite;
#   [suite <name>]  that suite; a file may touch several;
#   no match        every suite.
# A pattern ending in "/" matches every path below it; any other pattern is an
# fnmatch pattern on the whole path, where "*" also matches "/".
#
# A suite lists its test files, every role its playbooks converge (with the
# roles they pull in through meta dependencies, include_role and
# import_role, transitively) and every fixture it reads outside its own
# directory. When in doubt, map more: a missing path lets a suite be carried
# although a file it uses changed.
#
# Role dependencies (none through meta/main.yml, all through include_role):
#   docker_check: pulled in by anubis, dashy, dns, graylog, harbor, listmonk,
#                 mailcow, n8n, nginx, paperless, portainer, pulsix_manager,
#                 pulsix_worker, postal, tandoor, traefik, vaultwarden, waf,
#                 watchtower
#   error_pages_export: pulled in by cloudpanel, mailcow, nginx
#   docker: named by docker_check (its "run noixdev.infra.docker" message), so
#           every suite with docker_check lists it too
# check-map enforces this: each suite lists every role that its listed roles
# (tasks/, handlers/, meta/) and its own test files name as noixdev.infra.<r>.

[ignore]
README.md
CHANGELOG.md
CONTRIBUTING.md
CODE_OF_CONDUCT.md
SECURITY.md
LICENSE
.ansible-lint
.gitignore
roles/*/README.md
.github/ISSUE_TEMPLATE/
.github/pull_request_template.md
.github/workflows/
.github/release/

[shared]
plugins/
meta/
galaxy.yml
tests/all.sh
tests/attest.sh
tests/attest/
tests/lib/
tests/suites.conf
.github/scripts/
.github/tests-allowed-signers

