---
- name: Converge the host roles
  hosts: testhost
  vars:
    base_timezone: Europe/Berlin
    base_nonlocal_bind: true
    base_sshd_listen_addresses: ["{{ ansible_facts['default_ipv4']['address'] }}"]
    base_sshd_allow_users: [root]
    base_static_routes:
      - to: 192.0.2.0/24
        via: "{{ ansible_facts['default_ipv4']['gateway'] }}"
    docker_mtu: 1450
    security_allowlist: [192.0.2.0/24, "2001:db8::/32"]
    fail2ban_ignoreip: [127.0.0.1/8, "::1", 198.51.100.7]
    crowdsec_allowlist: [203.0.113.0/24]
    # Not the default, so the port override is exercised end to end.
    crowdsec_lapi_port: 8081
  roles:
    - noixdev.infra.base
    - noixdev.infra.docker
    - noixdev.infra.fail2ban
    - noixdev.infra.crowdsec

- name: Install Tailscale without joining
  hosts: testhost
  tasks:
    - name: Run the tailscale role without an auth key
      block:
        - name: Include the tailscale role
          ansible.builtin.include_role:
            name: noixdev.infra.tailscale
      rescue:
        - name: Expect the missing auth key, nothing else
          ansible.builtin.assert:
            that: "'tailscale_auth_key is empty' in ansible_failed_result.msg"
