---
# The three sites of converge.yml with its default knobs. Every request goes
# to 127.0.0.1 with the site's name (curl --resolve); the headers and the body
# come back together (HTTP/1.1, so the header names keep their case). prod's
# certificate is Pebble's (pebble.yml), for its domain and its redirect
# domain.
- name: Verify the nginx sites
  hosts: testhost
  vars:
    nginx_verify_prod_names: [prod.example.test, www.prod.example.test]
    # The noix error page for 404 (theme classic, the role's default).
    nginx_verify_noix_404: ['data-code="404"', ep-theme-classic]
    nginx_verify_headers:
      - "X-Content-Type-Options: nosniff\r"
      - "Referrer-Policy: strict-origin-when-cross-origin\r"
      - "X-Frame-Options: SAMEORIGIN\r"
      - "Strict-Transport-Security: max-age=31536000\r"
      - "Server: nginx\r"
    nginx_verify_requests:
      # The front controller, from the pool as app_prod.
      - url: https://prod.example.test/
        status: 200
        contains: ['"script":"index.php"', '"user":"app_prod"', '"https":"on"']
      - url: https://prod.example.test/setup/install.php
        status: 200
        contains: [install ran]
      # The file exists: a .php file that is not listed never runs, and its
      # source is never served.
      - url: https://prod.example.test/uploads/evil.php
        status: 404
        absent: ["<?php", evil ran]
      # Neither the case nor another PHP extension serves the source.
      - url: https://prod.example.test/uploads/evil.PHP
        status: 404
        absent: ["<?php", evil upper ran]
      - url: https://prod.example.test/uploads/evil.phtml
        status: 404
        absent: ["<?php", evil phtml ran]
      # A path after the front controller that ends in .php is a PHP file
      # that is not listed.
      - url: https://prod.example.test/index.php/x.php
        status: 404
        absent: ['"script"']
      # No PATH_INFO: a path below a script reaches the front controller, and
      # the script in front of it does not run.
      - url: https://prod.example.test/index.php/foo
        status: 200
        contains: ['"script":"index.php"', '"uri":"\/index.php\/foo"']
      - url: https://prod.example.test/uploads/evil.php/foo
        status: 200
        contains: ['"script":"index.php"']
        absent: [evil ran, "<?php"]
      - url: https://prod.example.test/setup/install.php/x
        status: 200
        contains: ['"script":"index.php"']
        absent: [install ran]
      - url: https://prod.example.test/missing/route?a=1
        status: 200
        contains: ['"script":"index.php"', '"uri":"\/missing\/route?a=1"']
      - url: http://prod.example.test/x?y=1
        status: 301
        contains: ["Location: https://prod.example.test/x?y=1\r"]
      - url: https://www.prod.example.test/x?y=1
        status: 301
        contains: ["Location: https://prod.example.test/x?y=1\r"]
      - url: http://www.prod.example.test/x
        status: 301
        contains: ["Location: https://prod.example.test/x\r"]
      - url: https://prod.example.test/
        status: 200
        contains: "{{ nginx_verify_headers }}"
        absent: [includeSubDomains, preload, "Server: nginx/"]
      - url: https://prod.example.test/.well-known/x.txt
        status: 200
        contains: [well-known]
      - url: https://node.example.test/app
        status: 200
        contains: [node upstream, "X-Forwarded-Proto: https", "X-Forwarded-Host: node.example.test", "X-Forwarded-For: 127.0.0.1"]
      - url: https://node.example.test/app
        status: 200
        contains: "{{ nginx_verify_headers }}"
      - url: https://static.example.test/
        status: 200
        contains: "{{ ['static index'] + nginx_verify_headers }}"
      # Blocked: every file exists. nginx's own 404 is the noix error page.
      - url: https://prod.example.test/.env
        status: 404
        contains: "{{ nginx_verify_noix_404 }}"
        absent: [APP_KEY]
      - {url: "https://prod.example.test/.git/config", status: 404}
      - {url: "https://prod.example.test/composer.json", status: 404}
      - {url: "https://prod.example.test/composer.lock", status: 404}
      - {url: "https://prod.example.test/dump.sql", status: 404}
      # Compressed dumps too, in any case.
      - {url: "https://prod.example.test/dump.sql.gz", status: 404, absent: [-- dump, backup]}
      - {url: "https://prod.example.test/dump.sql.bz2", status: 404, absent: [-- dump, backup]}
      - {url: "https://prod.example.test/dump.sql.xz", status: 404, absent: [-- dump, backup]}
      - {url: "https://prod.example.test/dump.sql.zst", status: 404, absent: [-- dump, backup]}
      - {url: "https://prod.example.test/dump.sql.zip", status: 404, absent: [-- dump, backup]}
      - {url: "https://prod.example.test/dump.sql.7z", status: 404, absent: [-- dump, backup]}
      - {url: "https://prod.example.test/dump.sql.lz4", status: 404, absent: [-- dump, backup]}
      - {url: "https://prod.example.test/dump.sql.lzma", status: 404, absent: [-- dump, backup]}
      - {url: "https://prod.example.test/Dump.SQL.GZ", status: 404, absent: [-- dump, backup]}
      - {url: "https://prod.example.test/a.bak.gz", status: 404, absent: [-- dump, backup]}
      - {url: "https://prod.example.test/a.bak", status: 404}
      - {url: "https://prod.example.test/a.swp", status: 404}
      - {url: "https://prod.example.test/a~", status: 404}
      # The app's own 404 passes through unchanged (no intercept).
      - url: https://prod.example.test/app-404
        status: 404
        contains: ['"script":"index.php"', '"uri":"\/app-404"']
        absent: [data-code=]
      # A missing static file and a body over client_max_body_size (64m, by
      # its Content-Length alone): nginx's own answers, the noix pages.
      - url: https://static.example.test/missing.html
        status: 404
        contains: "{{ nginx_verify_noix_404 }}"
      - url: https://prod.example.test/upload
        status: 413
        args: [-X, POST, -H, "Content-Length: 70000000"]
        contains: ['data-code="413"', ep-theme-classic]
      # The pages' own location answers internal redirects only.
      - url: https://prod.example.test/.noix-error/500.html
        status: 404
        contains: "{{ nginx_verify_noix_404 }}"
  tasks:
    - name: Ask the sites
      ansible.builtin.command:
        argv: >-
          {{ ['curl', '--http1.1', '-sS', '-k', '-D', '-', '--max-time', '10',
              '--resolve', nginx_verify_host ~ ':80:127.0.0.1', '--resolve', nginx_verify_host ~ ':443:127.0.0.1']
             + item.args | default([]) + [item.url] }}
      vars:
        nginx_verify_host: "{{ item.url | urlsplit('hostname') }}"
      loop: "{{ nginx_verify_requests }}"
      loop_control:
        label: "{{ item.url }}"
      register: nginx_verify_responses
      changed_when: false

    - name: Check the answers
      ansible.builtin.assert:
        that:
          - item.stdout is search('^HTTP/1.1 ' ~ (item.item.status) ~ ' ')
          - item.item.contains | default([]) | reject('in', item.stdout) | list | length == 0
          - item.item.absent | default([]) | select('in', item.stdout) | list | length == 0
        fail_msg: "{{ item.item.url }} answered: {{ item.stdout }}"
        quiet: true
      loop: "{{ nginx_verify_responses.results }}"
      loop_control:
        label: "{{ item.item.url }}"

    # Without -k: the system trust store has Pebble's root (pebble.yml).
    - name: Ask prod's domains over HTTPS with the system's trust store
      ansible.builtin.command:
        argv: [curl, -sS, -o, /dev/null, -w, "%{http_code}", --max-time, "10", --resolve, "{{ item }}:443:127.0.0.1", "https://{{ item }}/"]
      loop: "{{ nginx_verify_prod_names }}"
      register: nginx_verify_trusted
      changed_when: false
      failed_when: nginx_verify_trusted.rc != 0

    - name: Read the issuers of prod's certificates
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail;
          openssl s_client -connect 127.0.0.1:443 -servername {{ item }} -verify_return_error </dev/null 2>/dev/null
          | openssl x509 -noout -issuer -ext subjectAltName
        executable: /bin/bash
      loop: "{{ nginx_verify_prod_names }}"
      register: nginx_verify_issuers
      changed_when: false

    - name: Check that prod has Pebble's certificate for its domains
      ansible.builtin.assert:
        that:
          - nginx_verify_trusted.results | map(attribute='stdout') | list == ['200', '301']
          - nginx_verify_issuers.results | rejectattr('stdout', 'search', 'issuer=.*Pebble Intermediate') | list | length == 0
          # Each name gets the one certificate with exactly both names.
          - nginx_verify_issuers.results | map(attribute='stdout') | map('regex_findall', 'DNS:[^,\\s]+') | map('sort') | unique | list
            == [nginx_verify_sans | sort]
        fail_msg: "{{ nginx_verify_issuers.results | map(attribute='stdout') | list }}"
      vars:
        nginx_verify_sans: "{{ nginx_verify_prod_names | map('regex_replace', '^', 'DNS:') | list }}"

    # The challenge root is root's; certbot writes there as root. A file there
    # answers on port 80 for every TLS site's domains and redirect domains,
    # before the redirect to HTTPS.
    # certbot removes the directories it made after each challenge.
    - name: Create the challenge directory
      ansible.builtin.file:
        path: /var/lib/noixdev/acme/.well-known/acme-challenge
        state: directory
        owner: root
        group: root
        mode: "0755"
      changed_when: false

    - name: Put a file in the challenge root
      ansible.builtin.copy:
        content: "noixdev challenge\n"
        dest: /var/lib/noixdev/acme/.well-known/acme-challenge/noixdev-verify
        owner: root
        group: root
        mode: "0644"
      changed_when: false

    - name: Ask for the challenge on port 80
      ansible.builtin.command:
        argv: [curl, --http1.1, -sS, -D, "-", --max-time, "10", --resolve, "{{ item }}:80:127.0.0.1",
               "http://{{ item }}/.well-known/acme-challenge/noixdev-verify"]
      loop: "{{ nginx_verify_prod_names + ['node.example.test', 'static.example.test'] }}"
      register: nginx_verify_challenge
      changed_when: false

    - name: Remove the file from the challenge root
      ansible.builtin.file:
        path: /var/lib/noixdev/acme/.well-known/acme-challenge/noixdev-verify
        state: absent
      changed_when: false

    - name: Check the challenge answers
      ansible.builtin.assert:
        that:
          - item.stdout is search('^HTTP/1.1 200 ')
          - "'noixdev challenge' in item.stdout"
        fail_msg: "{{ item.item }} answered: {{ item.stdout }}"
        quiet: true
      loop: "{{ nginx_verify_challenge.results }}"
      loop_control:
        label: "{{ item.item }}"

    # The workers run as www-data, not as the package's nginx user: a request
    # body above client_body_buffer_size and a proxied response above the
    # proxy buffers (to a client slower than the upstream) go through the
    # temp files in /var/cache/nginx.
    - name: Create a request body of 1 MiB
      ansible.builtin.command:
        argv: [truncate, -s, 1M, /root/nginx-verify-upload]
      changed_when: false

    - name: Upload it to the PHP site and download 4 MiB through the proxy site
      ansible.builtin.command:
        argv: "{{ ['curl', '-sS', '-k', '--max-time', '30', '--resolve', item.host ~ ':443:127.0.0.1'] + item.args
                  + ['https://' ~ item.host ~ item.path] }}"
      loop:
        - host: prod.example.test
          path: /upload
          args: [-H, "Content-Type: application/octet-stream", --data-binary, "@/root/nginx-verify-upload"]
        - host: node.example.test
          path: /big
          args: [--limit-rate, 2M, -o, /dev/null, -w, "%{http_code} %{size_download}"]
      loop_control:
        label: "{{ item.host }}{{ item.path }}"
      register: nginx_verify_large
      changed_when: false

    - name: Check the upload and the download
      ansible.builtin.assert:
        that:
          - "'\"body\":1048576' in nginx_verify_large.results[0].stdout"
          - nginx_verify_large.results[1].stdout == '200 4194304'
        fail_msg: "{{ nginx_verify_large.results | map(attribute='stdout') | list }}"

    - name: Ask for TLS 1.1 and TLS 1.2
      ansible.builtin.shell:
        cmd: >-
          openssl s_client -connect 127.0.0.1:443 -servername prod.example.test
          -{{ item }} -cipher DEFAULT@SECLEVEL=0 </dev/null 2>&1
      loop: [tls1_1, tls1_2]
      register: nginx_verify_tls
      changed_when: false
      failed_when: false

    - name: Check that only TLS 1.2 is accepted
      ansible.builtin.assert:
        that:
          - nginx_verify_tls.results[0].rc != 0
          # The server's alert 70 (protocol_version) to a client that offered
          # TLS 1.1 (security level 0 lets OpenSSL offer it); a client that
          # refused on its own ("no protocols available") would not pass.
          - nginx_verify_tls.results[0].stdout is search('alert protocol version.*SSL alert number 70')
          - nginx_verify_tls.results[1].rc == 0
          - "nginx_verify_tls.results[1].stdout is search('Protocol *: TLSv1[.]2')"
        fail_msg: >-
          TLS 1.1: {{ nginx_verify_tls.results[0].stdout }} TLS 1.2: {{ nginx_verify_tls.results[1].stdout }}

    # curl: 52 is an empty reply (444), 35 a failed handshake.
    - name: Ask the default server
      ansible.builtin.command:
        argv: "{{ ['curl', '-sS', '-k', '--max-time', '10', '--resolve', 'unknown.example.test:80:127.0.0.1',
                   '--resolve', 'unknown.example.test:443:127.0.0.1', item.url] }}"
      loop:
        - {url: http://unknown.example.test/, rc: 52}
        - {url: https://unknown.example.test/, rc: 35}
      loop_control:
        label: "{{ item.url }}"
      register: nginx_verify_default
      changed_when: false
      failed_when: nginx_verify_default.rc != item.rc

    - name: Echo through the proxy site's WebSocket
      ansible.builtin.command:
        argv: [python3, /usr/local/bin/noixdev-test-upstream, ws-check, 127.0.0.1, "443", node.example.test, noixdev-echo]
      register: nginx_verify_ws
      changed_when: false
      failed_when: nginx_verify_ws.rc != 0 or nginx_verify_ws.stdout != 'noixdev-echo'

    - name: Read the nginx processes and www-data's groups
      ansible.builtin.command:
        argv: "{{ item }}"
      loop:
        - [ps, -o, user=, -o, args=, -C, nginx]
        - [id, -nG, www-data]
        - [apt-config, dump, Unattended-Upgrade::Origins-Pattern]
      register: nginx_verify_state
      changed_when: false

    - name: Check the workers, the groups and the updates
      ansible.builtin.assert:
        that:
          - nginx_verify_workers | length > 0
          - nginx_verify_workers | reject('match', '^www-data ') | list | length == 0
          - nginx_verify_masters | length == 1
          - nginx_verify_masters[0] is match('^root ')
          - "'app_prod' in nginx_verify_state.results[1].stdout.split()"
          - "'origin=nginx,codename=' ~ ansible_facts['distribution_release'] in nginx_verify_state.results[2].stdout"
        fail_msg: "{{ nginx_verify_state.results | map(attribute='stdout') | list }}"
      vars:
        nginx_verify_workers: "{{ nginx_verify_state.results[0].stdout_lines | select('search', 'worker process') | list }}"
        nginx_verify_masters: "{{ nginx_verify_state.results[0].stdout_lines | select('search', 'master process') | list }}"
