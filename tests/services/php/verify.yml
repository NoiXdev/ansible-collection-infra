---
# The knobs are converge.yml's: pass the same -e to both.
- name: Verify the php pools
  hosts: testhost
  vars:
    php_test_staging: true
    php_test_staging_version: "8.4"
    php_test_staging_memory_limit: 192M
    php_test_staging_user: app_staging
    php_test_extra: false
    php_test_extra_version: "8.4"
    # false: the pools run in the packages' php<v>-fpm services (classic mode).
    php_fpm_per_pool_service: true
    php_test_pools: >-
      {{ [{'name': 'production', 'version': '8.3'}]
         + ([{'name': 'staging', 'version': php_test_staging_version}] if php_test_staging | bool else [])
         + ([{'name': 'extra', 'version': php_test_extra_version}] if php_test_extra | bool else []) }}
    php_test_pool_versions: "{{ php_test_pools | map(attribute='version') | unique | list }}"
    php_test_request:
      REQUEST_METHOD: GET
      SCRIPT_NAME: /app.php
    # The response body, one line of JSON after the headers.
    php_test_production_report: "{{ php_verify_production.stdout_lines | last | from_json }}"
    php_test_staging_report: "{{ php_verify_staging.stdout_lines | last | from_json }}"
  tasks:
    - name: Install the test script
      ansible.builtin.copy:
        src: app.php
        dest: "/srv/{{ item.dir }}/app.php"
        owner: "{{ item.user }}"
        group: "{{ item.user }}"
        mode: "0644"
      loop:
        - {dir: prod, user: app_prod}
        - {dir: staging, user: app_staging}

    - name: Read the error_reporting value of E_ALL & ~E_DEPRECATED
      ansible.builtin.command:
        argv: [php8.3, -n, -r, "echo E_ALL & ~E_DEPRECATED;"]
      register: php_verify_error_reporting
      changed_when: false

    - name: Ask production
      ansible.builtin.command:
        argv: [cgi-fcgi, -bind, -connect, /run/php/production.sock]
      environment: "{{ php_test_request | combine({'SCRIPT_FILENAME': '/srv/prod/app.php'}) }}"
      register: php_verify_production
      changed_when: false

    - name: Check production
      ansible.builtin.assert:
        that:
          - php_test_production_report.version is match('8\.3\.')
          - php_test_production_report.user == 'app_prod'
          - php_test_production_report.app_env is false
          - php_test_production_report.open_basedir in ['', none]
          - php_test_production_report.error_reporting == php_verify_error_reporting.stdout
        fail_msg: "production reports {{ php_test_production_report }}"

    # A reload is a signal: the new config may need a moment.
    - name: Ask staging
      ansible.builtin.command:
        argv: [cgi-fcgi, -bind, -connect, /run/php/staging.sock]
      environment: "{{ php_test_request | combine({'SCRIPT_FILENAME': '/srv/staging/app.php'}) }}"
      register: php_verify_staging
      changed_when: false
      until: php_test_staging_report.memory_limit == php_test_staging_memory_limit
      retries: 10
      delay: 1
      when: php_test_staging | bool

    - name: Check staging
      ansible.builtin.assert:
        that:
          - php_test_staging_report.version is match(php_test_staging_version | regex_escape ~ '\.')
          - php_test_staging_report.user == php_test_staging_user
          - php_test_staging_report.app_env == 'staging'
          - php_test_staging_report.note == 'a "b"; c=$d e'
          - "'/srv/staging' in php_test_staging_report.open_basedir.split(':')"
          - "'/srv/staging/tmp' in php_test_staging_report.open_basedir.split(':')"
          - php_test_staging_report.memory_limit == php_test_staging_memory_limit
          - php_test_staging_report.session_save_path == '/srv/staging/tmp/session'
          - php_test_staging_report.upload_tmp_dir == '/srv/staging/tmp/upload'
          - php_test_staging_report.sys_temp_dir == '/srv/staging/tmp/sys'
        fail_msg: "staging reports {{ php_test_staging_report }}"
      when: php_test_staging | bool

    - name: Read the sockets
      ansible.builtin.command:
        argv: [stat, -c, "%a %U %G", "/run/php/{{ item }}.sock"]
      loop: "{{ ['production'] + (['staging'] if php_test_staging | bool else []) }}"
      register: php_verify_sockets
      changed_when: false

    - name: Check the sockets
      ansible.builtin.assert:
        that: php_verify_sockets.results[0].stdout == '660 app_prod www-data'
            and (not php_test_staging | bool or php_verify_sockets.results[1].stdout == '660 ' ~ php_test_staging_user ~ ' www-data')
        fail_msg: "{{ php_verify_sockets.results | map(attribute='stdout') | list }}"

    - name: Answer the ping
      ansible.builtin.command:
        argv: [cgi-fcgi, -bind, -connect, /run/php/production.sock]
      environment:
        REQUEST_METHOD: GET
        SCRIPT_NAME: /php-fpm-ping
        SCRIPT_FILENAME: /php-fpm-ping
      register: php_verify_ping
      changed_when: false
      failed_when: php_verify_ping.stdout_lines | last != 'pong'

    - name: Connect to production as www-data
      ansible.builtin.command:
        cmd: su www-data -s /bin/sh -c 'SCRIPT_FILENAME=/srv/prod/app.php REQUEST_METHOD=GET cgi-fcgi -bind -connect /run/php/production.sock'
      register: php_verify_www_data
      changed_when: false
      failed_when: php_verify_www_data.stdout is not search('"user":"app_prod"')

    # cgi-fcgi exits with the errno of the failed connect: 13 is EACCES.
    - name: Connect to production as a user outside www-data
      ansible.builtin.command:
        cmd: su outsider -s /bin/sh -c 'SCRIPT_FILENAME=/srv/prod/app.php REQUEST_METHOD=GET cgi-fcgi -bind -connect /run/php/production.sock'
      register: php_verify_outsider
      changed_when: false
      failed_when: php_verify_outsider.rc != 13 or php_verify_outsider.stderr is not search('Could not connect')

    # The package services, the instances, and the pool files in pool.d that
    # carry the role's header.
    - name: Read the package services, the instances and the CLI
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          for v in 8.3 8.4; do
            echo "$v active=$(systemctl is-active php$v-fpm)"
            echo "$v enabled=$(systemctl is-enabled php$v-fpm)"
            echo "$v www=$(test -e /etc/php/$v/fpm/pool.d/www.conf && echo present || echo absent)"
          done
          for p in production staging extra; do
            echo "$p instance=$(systemctl is-active php-fpm@$p) $(systemctl is-enabled php-fpm@$p)"
          done
          echo "instance_configs=$(find /etc/php-fpm -mindepth 1 2>/dev/null | wc -l)"
          echo "managed=$(grep -lis 'managed by noixdev.infra' /etc/php/*/fpm/pool.d/*.conf | sort | paste -sd ' ' -)"
          echo "cli=$(php --version | head -1)"
          echo "cli_error_reporting=$(php -r 'echo ini_get("error_reporting");')"
        executable: /bin/bash
      register: php_verify_packages
      changed_when: false

    - name: Check the CLI
      ansible.builtin.assert:
        that:
          - "'8.3 www=absent' in php_verify_packages.stdout_lines"
          - "'8.4 www=absent' in php_verify_packages.stdout_lines"
          - php_verify_packages.stdout is search('^cli=PHP 8\.3\.', multiline=True)
          - ('cli_error_reporting=' ~ php_verify_error_reporting.stdout) in php_verify_packages.stdout_lines
        fail_msg: "{{ php_verify_packages.stdout_lines }}"

    - name: Check the instances and the package services (one master per pool)
      ansible.builtin.assert:
        that:
          - "'8.3 active=inactive' in php_verify_packages.stdout_lines"
          - "'8.3 enabled=disabled' in php_verify_packages.stdout_lines"
          - "'8.4 active=inactive' in php_verify_packages.stdout_lines"
          - "'8.4 enabled=disabled' in php_verify_packages.stdout_lines"
          - php_test_pools | map(attribute='name') | map('regex_replace', '$', ' instance=active enabled')
            | difference(php_verify_packages.stdout_lines) | length == 0
          - "'managed=' in php_verify_packages.stdout_lines"
        fail_msg: "{{ php_verify_packages.stdout_lines }}"
      when: php_fpm_per_pool_service | bool

    # Only the versions with pools run; the instances and their configs are gone.
    - name: Check the instances and the package services (classic mode)
      ansible.builtin.assert:
        that:
          - php_test_pool_versions | map('regex_replace', '$', ' active=active') | difference(php_verify_packages.stdout_lines) | length == 0
          - php_test_pool_versions | map('regex_replace', '$', ' enabled=enabled') | difference(php_verify_packages.stdout_lines) | length == 0
          - (['8.3', '8.4'] | difference(php_test_pool_versions)) | map('regex_replace', '$', ' active=inactive')
            | difference(php_verify_packages.stdout_lines) | length == 0
          - (['8.3', '8.4'] | difference(php_test_pool_versions)) | map('regex_replace', '$', ' enabled=disabled')
            | difference(php_verify_packages.stdout_lines) | length == 0
          - "'production instance=inactive disabled' in php_verify_packages.stdout_lines"
          - "'staging instance=inactive disabled' in php_verify_packages.stdout_lines"
          - "'instance_configs=0' in php_verify_packages.stdout_lines"
          - ('managed=' ~ php_test_managed | sort | join(' ')) in php_verify_packages.stdout_lines
        fail_msg: "{{ php_verify_packages.stdout_lines }}"
      vars:
        php_test_managed: >-
          {{ php_test_pools | map(attribute='version') | map('regex_replace', '^', '/etc/php/')
             | zip(php_test_pools | map(attribute='name'))
             | map('join', '/fpm/pool.d/') | map('regex_replace', '$', '.conf') | list }}
      when: not php_fpm_per_pool_service | bool

    # The rolling restart, its apt hook and the PPA in unattended-upgrades:
    # one master per pool only (classic mode: the package's own restart).
    - name: Read the update files and apt's config
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          for f in /usr/local/sbin/php-fpm-rolling-restart /etc/apt/apt.conf.d/99noixdev-php-fpm-restart /etc/apt/apt.conf.d/52noixdev-php-ppa; do
            if [ -e "$f" ]; then echo "$f $(stat -c '%a %U %G' "$f")"; else echo "$f absent"; fi
          done
          apt-config dump | grep -E '^(Unattended-Upgrade::Origins-Pattern|DPkg::(Pre|Post)-Invoke)::' || true
        executable: /bin/bash
      register: php_verify_updates
      changed_when: false

    - name: Check the update files (one master per pool)
      ansible.builtin.assert:
        that:
          - "'/usr/local/sbin/php-fpm-rolling-restart 755 root root' in php_verify_updates.stdout_lines"
          - "'/etc/apt/apt.conf.d/99noixdev-php-fpm-restart 644 root root' in php_verify_updates.stdout_lines"
          - "'/etc/apt/apt.conf.d/52noixdev-php-ppa 644 root root' in php_verify_updates.stdout_lines"
          - php_test_origin in php_verify_updates.stdout_lines
          - php_verify_updates.stdout_lines | select('match', '^DPkg::Pre-Invoke::.*php-fpm-rolling-restart --dpkg-pre-invoke') | list | length == 1
          - php_verify_updates.stdout_lines | select('match', '^DPkg::Post-Invoke::.*php-fpm-rolling-restart --dpkg-post-invoke') | list | length == 1
        fail_msg: "{{ php_verify_updates.stdout_lines }}"
      vars:
        php_test_origin: >-
          Unattended-Upgrade::Origins-Pattern:: "origin=LP-PPA-ondrej-php,codename={{ ansible_facts['distribution_release'] }}";
      when: php_fpm_per_pool_service | bool

    - name: Check the update files (classic mode)
      ansible.builtin.assert:
        that:
          - "'/usr/local/sbin/php-fpm-rolling-restart absent' in php_verify_updates.stdout_lines"
          - "'/etc/apt/apt.conf.d/99noixdev-php-fpm-restart absent' in php_verify_updates.stdout_lines"
          - "'/etc/apt/apt.conf.d/52noixdev-php-ppa absent' in php_verify_updates.stdout_lines"
          - php_verify_updates.stdout_lines | select('match', '^(Unattended-Upgrade|DPkg)::')
            | select('search', 'ondrej|php-fpm-rolling-restart') | list | length == 0
        fail_msg: "{{ php_verify_updates.stdout_lines }}"
      when: not php_fpm_per_pool_service | bool
