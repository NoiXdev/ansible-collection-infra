---
# The test host: Docker and Traefik, and what run.sh calls on the host. The
# vaultwarden role runs only when run.sh passes test_vaultwarden=true.
- name: Converge
  hosts: all
  vars_files: [vars.yml]
  pre_tasks:
    # The base role installs ca-certificates and curl on the servers; the test
    # image has neither.
    - name: Install the packages the tests call
      ansible.builtin.apt:
        name: [ca-certificates, curl]
        state: present
        update_cache: true
        cache_valid_time: 3600
  roles:
    - noixdev.infra.docker
    - noixdev.infra.traefik
    - role: noixdev.infra.vaultwarden
      when: test_vaultwarden | default(false) | bool
