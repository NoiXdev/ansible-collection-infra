---
# Checks an installation on the test host as run.sh's settings make it: the
# containers of the compose project (web, smtp, submission, worker, with the
# own MariaDB mariadb, with the spam and virus checks rspamd and clamav, each
# running with the pinned image; no runner left), web on the project network
# and the Traefik network without a published port, smtp, submission and
# worker on the host's network (smtp and submission with NET_BIND_SERVICE and
# only their ports in the environment), MariaDB, rspamd and ClamAV on the
# project network alone, published on 127.0.0.1 alone and healthy (rspamd's
# controller settings 0440 root:11333), no secret in any environment; the
# files: the compose file 0644, the config directory 0750 root:999,
# postal.yml and signing.key each 0440 root:999, signing.key a 2048-bit RSA
# key, postal.yml with the values the role owns, the smtp section of
# postal_mail, the rspamd, clamav, oidc and gelf sections, the relays and IP
# pools, and the database target; the Traefik labels of web (every traefik.*
# label, exactly).
# Extra variables: verify_submission (default true: the submission service
# runs), verify_mail_host and verify_mail_port (postal_mail's host and port;
# empty host: the role writes no host), verify_spam_threshold (the
# default_spam_threshold the run set, empty for none), verify_smtp_bind (the
# address of the SMTP servers: :: with IPv6, else 0.0.0.0), and the Traefik
# settings of the run: verify_entrypoints, verify_ui_entrypoints and
# verify_ui_middlewares (comma-separated, empty: none),
# verify_track_hostnames (the tracking host names besides track.mail.test)
# and verify_track_customers (the verified customer tracking domains, sorted,
# of the router postal-track-customers with the resolver http; empty: no such
# router), verify_smtp_hostname (postal_smtp_hostname) and verify_smtp_tls
# (postal_smtp_tls: off, the suite's default, files or traefik; with traefik
# and an SMTP host name of its own the router postal-smtp, the script and its
# timer; with files or traefik smtp.cert and smtp.key 0440 root:999 and
# STARTTLS on in postal.yml, with off none of these), verify_database
# (mariadb, or mariadb_external at verify_db_host and verify_db_port: no
# mariadb service), verify_db_name and verify_db_prefix (postal_db_name and
# postal_message_db_prefix), verify_spam (none or rspamd) with verify_rspamd_password
# (whether postal.yml gives Postal rspamd's password), verify_clamav,
# verify_workers (the worker's replicas, each running), verify_relays
# (postal_smtp_relays, comma-separated), verify_ip_pools, verify_oidc_name
# (the name of the enabled OIDC provider; empty: no oidc section) and
# verify_gelf_host, verify_gelf_port and verify_gelf_facility (empty host: no
# gelf section).
- name: Verify
  hosts: all
  gather_facts: false
  vars:
    verify_dir: /opt/postal
    verify_defaults: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/../../roles/postal/defaults/main.yml') | from_yaml }}"
    verify_image: "{{ verify_defaults.postal_image }}:{{ verify_defaults.postal_version }}"
    verify_mariadb_image: "{{ verify_defaults.postal_mariadb_image }}"
    verify_submission: true
    verify_mail_host: ""
    verify_mail_port: 25
    verify_spam_threshold: ""
    verify_smtp_bind: "::"
    verify_entrypoints: ""
    verify_ui_entrypoints: ""
    verify_ui_middlewares: ""
    verify_track_hostnames: ""
    verify_track_customers: ""
    verify_smtp_hostname: postal.test
    verify_smtp_tls: "off"
    verify_database: mariadb
    verify_db_host: postal-mariadb
    verify_db_port: 3307
    verify_db_name: postal
    verify_db_prefix: postal
    verify_spam: none
    verify_rspamd_password: false
    verify_clamav: false
    verify_workers: 1
    verify_relays: smtp://localhost:1025
    verify_ip_pools: false
    verify_oidc_name: ""
    verify_gelf_host: ""
    verify_gelf_port: 12201
    verify_gelf_facility: postal
    verify_rspamd_image: "{{ verify_defaults.postal_rspamd_image }}"
    verify_clamav_image: "{{ verify_defaults.postal_clamav_image }}"
    # The services that do not run Postal's image, with their images.
    verify_helpers: >-
      {{ ({'mariadb': verify_mariadb_image} if verify_database == 'mariadb' else {})
         | combine({'rspamd': verify_rspamd_image} if verify_spam == 'rspamd' else {})
         | combine({'clamav': verify_clamav_image} if verify_clamav | bool else {}) }}
    verify_services: >-
      {{ ['smtp', 'web', 'worker'] + (['submission'] if verify_submission | bool else [])
         + verify_helpers.keys() | list }}
    verify_all: "{{ verify_inspect.stdout | from_json }}"
    # One container per service (of the worker's replicas the last one).
    verify_by_service: >-
      {%- set found = {} -%}
      {%- for container in verify_all -%}
      {%-   set _ = found.update({container.Config.Labels['com.docker.compose.service']: container}) -%}
      {%- endfor -%}
      {{ found }}
    # MARIADB_ALLOW_EMPTY_ROOT_PASSWORD is a switch: root logs in through the
    # socket only.
    verify_env_names: >-
      {{ verify_all | map(attribute='Config.Env') | flatten | map('regex_replace', '=.*$', '') | unique
         | reject('eq', 'MARIADB_ALLOW_EMPTY_ROOT_PASSWORD') | sort }}
  tasks:
    - name: Find the containers of the compose project
      ansible.builtin.command:
        argv: [docker, ps, --all, --quiet, --filter, label=com.docker.compose.project=postal]
      register: verify_ids
      changed_when: false

    - name: Inspect the containers
      ansible.builtin.command:
        argv: "{{ ['docker', 'inspect'] + verify_ids.stdout_lines }}"
      register: verify_inspect
      changed_when: false

    - name: Check the containers of the project
      ansible.builtin.assert:
        that:
          - verify_all | length == verify_services | length + verify_workers | int - 1
          - verify_by_service.keys() | sort == verify_services | sort
          - verify_worker_count | int == verify_workers | int
          - verify_all | rejectattr('State.Running') | list | length == 0
          - verify_all | rejectattr('HostConfig.RestartPolicy.Name', 'eq', 'unless-stopped') | list | length == 0
          - verify_services | reject('in', verify_helpers) | map('extract', verify_by_service) | map(attribute='Config.Image')
            | reject('eq', verify_image) | list | length == 0
          - verify_helpers.keys() | map('extract', verify_by_service) | map(attribute='Config.Image') | list
            == verify_helpers.values() | list
          - verify_helpers.keys() | map('extract', verify_by_service) | map(attribute='State.Health.Status')
            | reject('eq', 'healthy') | list | length == 0
        fail_msg: >-
          The project does not run {{ verify_services | sort | join(', ') }} (one
          container each, {{ verify_workers }} of the worker, running, restarted
          unless stopped, the pinned images, {{ verify_helpers.keys() | join(', ') }}
          healthy):
          {{ verify_all | map(attribute='Name') | list }},
          {{ verify_all | map(attribute='State.Status') | list }},
          {{ verify_all | map(attribute='Config.Image') | list }}.
      vars:
        verify_worker_count: >-
          {%- set n = namespace(count=0) -%}
          {%- for container in verify_all if container.Config.Labels['com.docker.compose.service'] == 'worker' -%}
          {%-   set n.count = n.count + 1 -%}
          {%- endfor -%}
          {{ n.count }}

    - name: Check the web container
      ansible.builtin.assert:
        that:
          - verify_web.HostConfig.NetworkMode != 'host'
          - verify_web.NetworkSettings.Networks.keys() | sort == ['postal_default', 'proxy']
          - verify_web.HostConfig.PortBindings | default({}, true) | length == 0
          - verify_web.NetworkSettings.Ports | default({}, true) | dict2items | selectattr('value') | list | length == 0
          - verify_web.Config.Cmd == ['postal', 'web-server']
        fail_msg: >-
          web is not on the project network and proxy alone, without a
          published port, running postal web-server:
          {{ verify_web.NetworkSettings.Networks.keys() | list }},
          {{ verify_web.NetworkSettings.Ports }}, {{ verify_web.Config.Cmd }}.
      vars:
        verify_web: "{{ verify_by_service.web }}"

    # Empty entrypoints mean Traefik's default entrypoints: no label.
    - name: Check the Traefik labels of web
      ansible.builtin.assert:
        that: verify_labels == verify_expected
        fail_msg: "web's Traefik labels are {{ verify_labels }}, not {{ verify_expected }}."
      vars:
        verify_labels: >-
          {{ verify_by_service.web.Config.Labels | dict2items | selectattr('key', 'match', '^traefik[.]') | items2dict }}
        verify_track_rule: >-
          {%- set rules = [] -%}
          {%- for name in ['track.mail.test'] + (verify_track_hostnames | split(',') | select | list) -%}
          {%-   set _ = rules.append('Host(`' ~ name ~ '`)') -%}
          {%- endfor -%}
          {{ rules | join(' || ') }}
        verify_customers: "{{ verify_track_customers | split(',') | select | list }}"
        verify_customers_rule: >-
          {%- set rules = [] -%}
          {%- for name in verify_customers -%}
          {%-   set _ = rules.append('Host(`' ~ name ~ '`)') -%}
          {%- endfor -%}
          {{ rules | join(' || ') }}
        verify_api: "PathPrefix(`/api/`) || Path(`/.well-known/jwks.json`)"
        verify_routers:
          - name: postal-api
            rule: "Host(`postal.test`) && ({{ verify_api }})"
            entrypoints: "{{ verify_entrypoints }}"
            priority: "101"
            middlewares: postal-strip-track
          - name: postal-ui
            rule: "Host(`postal.test`) && !({{ verify_api }})"
            entrypoints: "{{ verify_ui_entrypoints }}"
            priority: "100"
            middlewares: "{{ (['postal-strip-track'] + (verify_ui_middlewares | split(',') | select | list)) | join(',') }}"
          - name: postal-track
            rule: "{{ verify_track_rule }}"
            entrypoints: "{{ verify_entrypoints }}"
            priority: "101"
            middlewares: postal-set-track
        verify_customer_routers: >-
          {{ [{'name': 'postal-track-customers', 'rule': verify_customers_rule, 'entrypoints': verify_entrypoints,
               'priority': '101', 'middlewares': 'postal-set-track', 'certresolver': 'http'}]
             if verify_customers | length > 0 else [] }}
        verify_smtp_routers: >-
          {{ [{'name': 'postal-smtp', 'rule': 'Host(`' ~ verify_smtp_hostname ~ '`) && (' ~ verify_api ~ ')',
               'entrypoints': verify_entrypoints, 'priority': '101', 'middlewares': 'postal-strip-track'}]
             if verify_smtp_tls == 'traefik' and verify_smtp_hostname != 'postal.test' else [] }}
        verify_expected: >-
          {%- set found = {
            'traefik.enable': 'true',
            'traefik.docker.network': 'proxy',
            'traefik.http.middlewares.postal-strip-track.headers.customrequestheaders.X-Postal-Track-Host': '0',
            'traefik.http.middlewares.postal-set-track.headers.customrequestheaders.X-Postal-Track-Host': '1',
            'traefik.http.services.postal.loadbalancer.server.port': '5000',
          } -%}
          {%- for r in verify_routers + verify_customer_routers + verify_smtp_routers -%}
          {%-   set prefix = 'traefik.http.routers.' ~ r.name -%}
          {%-   set _ = found.update({prefix ~ '.rule': r.rule, prefix ~ '.priority': r.priority,
                                     prefix ~ '.middlewares': r.middlewares, prefix ~ '.service': 'postal'}) -%}
          {%-   if r.entrypoints | length > 0 -%}
          {%-     set _ = found.update({prefix ~ '.entrypoints': r.entrypoints}) -%}
          {%-   endif -%}
          {%-   if r.certresolver is defined -%}
          {%-     set _ = found.update({prefix ~ '.tls.certresolver': r.certresolver}) -%}
          {%-   endif -%}
          {%- endfor -%}
          {{ found }}

    - name: Check the services on the host's network
      ansible.builtin.assert:
        that:
          - verify_container.HostConfig.NetworkMode == 'host'
          - verify_container.Config.Cmd == item.cmd
          - verify_container.HostConfig.CapAdd | default([], true) | map('regex_replace', '^CAP_', '') | sort == item.caps
          - verify_container.Config.Env | select('match', '^(PORT|HEALTH_SERVER_PORT)=') | sort == item.env
          - verify_container.Config.StopTimeout | default(0, true) | int == 60
        fail_msg: >-
          {{ item.name }} is not on the host's network running {{ item.cmd }}
          with the capabilities {{ item.caps }}, the ports {{ item.env }} and a
          grace of 60 seconds: {{ verify_container.HostConfig.NetworkMode }},
          {{ verify_container.Config.Cmd }}, {{ verify_container.HostConfig.CapAdd }},
          {{ verify_container.Config.Env | select('match', '^(PORT|HEALTH_SERVER_PORT)=') | list }},
          {{ verify_container.Config.StopTimeout }}.
      vars:
        verify_container: "{{ verify_by_service[item.name] }}"
      loop: >-
        {{ [{'name': 'smtp', 'cmd': ['postal', 'smtp-server'], 'caps': ['NET_BIND_SERVICE'],
             'env': ['HEALTH_SERVER_PORT=9091', 'PORT=25']},
            {'name': 'worker', 'cmd': ['postal', 'worker'], 'caps': [], 'env': []}]
           + ([{'name': 'submission', 'cmd': ['postal', 'smtp-server'], 'caps': ['NET_BIND_SERVICE'],
                'env': ['HEALTH_SERVER_PORT=9092', 'PORT=587']}] if verify_submission | bool else []) }}
      loop_control:
        label: "{{ item.name }}"

    - name: Check the MariaDB container
      ansible.builtin.assert:
        that:
          - verify_mariadb.HostConfig.NetworkMode != 'host'
          - verify_mariadb.NetworkSettings.Networks.keys() | list == ['postal_default']
          - >-
            verify_mariadb.HostConfig.PortBindings == {'3307/tcp': [{'HostIp': '127.0.0.1', 'HostPort': '3307'}]}
        fail_msg: >-
          MariaDB is not on the project network alone, published on
          127.0.0.1:3307 only: {{ verify_mariadb.NetworkSettings.Networks.keys() | list }},
          {{ verify_mariadb.HostConfig.PortBindings }}.
      vars:
        verify_mariadb: "{{ verify_by_service.mariadb }}"
      when: verify_database == 'mariadb'

    # Only Postal's worker on the host's network asks them, at their ports on
    # 127.0.0.1.
    - name: Check the rspamd and ClamAV containers
      ansible.builtin.assert:
        that:
          - verify_container.HostConfig.NetworkMode != 'host'
          - verify_container.NetworkSettings.Networks.keys() | list == ['postal_default']
          - >-
            verify_container.HostConfig.PortBindings
            == {item.inner ~ '/tcp': [{'HostIp': '127.0.0.1', 'HostPort': item.port | string}]}
        fail_msg: >-
          {{ item.name }} is not on the project network alone, published on
          127.0.0.1:{{ item.port }} only:
          {{ verify_container.NetworkSettings.Networks.keys() | list }},
          {{ verify_container.HostConfig.PortBindings }}.
      vars:
        verify_container: "{{ verify_by_service[item.name] }}"
      loop: >-
        {{ ([{'name': 'rspamd', 'inner': 11334, 'port': 11334}] if verify_spam == 'rspamd' else [])
           + ([{'name': 'clamav', 'inner': 3310, 'port': 3310}] if verify_clamav | bool else []) }}
      loop_control:
        label: "{{ item.name }}"

    # The values are not shown: the names only.
    - name: Check that no environment holds a secret
      ansible.builtin.assert:
        that: verify_env_names | select('search', '(?i)pass|secret|key|token|pwd') | list | length == 0
        fail_msg: "An environment holds a variable that looks like a secret: {{ verify_env_names }}."

    - name: Stat the files
      ansible.builtin.stat:
        path: "{{ item }}"
        get_checksum: false
      loop:
        - "{{ verify_dir }}/compose.yaml"
        - "{{ verify_dir }}/config"
        - "{{ verify_dir }}/config/postal.yml"
        - "{{ verify_dir }}/config/signing.key"
        - "{{ verify_dir }}/config/rspamd-controller.inc"
      register: verify_stat

    - name: Check the modes of the files
      ansible.builtin.assert:
        that:
          - verify_stat.results[0].stat.mode == '0644'
          - verify_stat.results[1].stat.isdir
          - verify_stat.results[1].stat.mode == '0750'
          - verify_stat.results[1].stat.uid == 0
          - verify_stat.results[1].stat.gid == 999
          - verify_stat.results[2:4] | map(attribute='stat.mode') | unique == ['0440']
          - verify_stat.results[2:4] | map(attribute='stat.uid') | unique == [0]
          - verify_stat.results[2:4] | map(attribute='stat.gid') | unique == [999]
          - verify_stat.results[4].stat.exists == (verify_spam == 'rspamd')
          - verify_spam != 'rspamd' or verify_stat.results[4].stat.mode == '0440'
          - verify_spam != 'rspamd' or verify_stat.results[4].stat.uid == 0
          - verify_spam != 'rspamd' or verify_stat.results[4].stat.gid == 11333
        fail_msg: >-
          The compose file is not 0644, the config directory not 0750
          root:999, postal.yml and signing.key not 0440 root:999, or
          rspamd-controller.inc not 0440 root:11333 with rspamd (and absent
          without):
          {{ verify_stat.results | map(attribute='stat') | map('dict2items')
             | map('selectattr', 'key', 'in', ['path', 'mode', 'uid', 'gid']) | map('items2dict') | list }}.

    - name: Read the size of the signing key
      ansible.builtin.command:
        argv: [openssl, pkey, -in, "{{ verify_dir }}/config/signing.key", -noout, -text]
      register: verify_key
      changed_when: false
      no_log: true

    - name: Check the signing key
      ansible.builtin.assert:
        that: >-
          verify_key.stdout_lines[0] | default('') == 'Private-Key: (2048 bit, 2 primes)'
        fail_msg: "signing.key is not a 2048-bit RSA key: {{ verify_key.stdout_lines[0] | default('') }}"

    # It holds every secret: read and parsed without output, and the message
    # names only the values that are no secret.
    - name: Read postal.yml
      ansible.builtin.slurp:
        src: "{{ verify_dir }}/config/postal.yml"
      register: verify_config_read
      no_log: true

    - name: Parse postal.yml
      ansible.builtin.set_fact:
        verify_config: "{{ verify_config_read.content | b64decode | from_yaml }}"
      no_log: true

    - name: Check postal.yml
      ansible.builtin.assert:
        that:
          - verify_config.version == 2
          - >-
            verify_config.web_server == {'default_bind_address': '0.0.0.0', 'default_port': 5000}
          - verify_config.postal.web_hostname == 'postal.test'
          - verify_config.postal.smtp_hostname == verify_smtp_hostname
          - verify_config.postal.trusted_proxies == ['172.31.255.254']
          - verify_config.postal.signing_key_path == '/config/signing.key'
          - verify_config.main_db.host == verify_db_host
          - verify_config.main_db.port == verify_db_port | int
          - verify_config.main_db.database == verify_db_name
          - verify_config.message_db.host == verify_db_host
          - verify_config.message_db.port == verify_db_port | int
          - verify_config.message_db.database_name_prefix == verify_db_prefix
          - verify_config.rails.secret_key | length == 128
          - verify_config.smtp_server.default_port == 25
          - verify_config.smtp_server.default_bind_address == verify_smtp_bind
          - verify_config.smtp_server.default_health_server_port == 9091
          - verify_config.smtp_server.tls_enabled == (verify_smtp_tls != 'off')
          - verify_config.smtp_server.tls_certificate_path == '/config/smtp.cert'
          - verify_config.smtp_server.tls_private_key_path == '/config/smtp.key'
          - verify_config.worker.default_health_server_port == 9090
          - verify_config.dns.return_path_domain == 'rp.mail.test'
          - verify_config.dns.mx_records == ['mx.mail.test']
          - verify_config.postal.default_spam_threshold | default('') | string == verify_spam_threshold | string
          - verify_config.postal.smtp_relays == verify_relays | split(',')
          - verify_config.postal.use_ip_pools == verify_ip_pools | bool
          - verify_config.postal.allowed_request_destinations == ['127.0.0.1']
          - verify_config.worker.threads == 2
          - verify_smtp_plain == verify_smtp_expected
          - (verify_config.smtp.username | default('')) == ''
          - (verify_config.smtp.password | default('')) == ''
        fail_msg: >-
          postal.yml lacks a value the role owns (the bind address
          {{ verify_config.web_server | default({}) }}, trusted_proxies
          {{ verify_config.postal.trusted_proxies | default('') }}, the
          databases {{ verify_config.main_db.database | default('') }} on
          {{ verify_config.main_db.host | default('') }}:{{ verify_config.main_db.port | default('') }}
          with the prefix {{ verify_config.message_db.database_name_prefix | default('') }},
          the spam threshold {{ verify_config.postal.default_spam_threshold | default('none') }},
          the SMTP address {{ verify_config.smtp_server.default_bind_address | default('') }},
          the SMTP host name {{ verify_config.postal.smtp_hostname | default('') }}, STARTTLS
          {{ verify_config.smtp_server.tls_enabled | default('') }} with
          {{ verify_config.smtp_server.tls_certificate_path | default('') }} and
          {{ verify_config.smtp_server.tls_private_key_path | default('') }},
          the relays {{ verify_config.postal.smtp_relays | default('') }}, the
          allowed request destinations
          {{ verify_config.postal.allowed_request_destinations | default('') }},
          a Rails secret of 128 characters), or its smtp section is
          {{ verify_smtp_plain }}, not {{ verify_smtp_expected }}.
      vars:
        verify_smtp_plain: "{{ verify_config.smtp | default({}) | dict2items | rejectattr('key', 'in', ['username', 'password']) | items2dict }}"
        verify_smtp_expected: >-
          {{ {'from_name': 'Postal', 'from_address': 'postal@mail.test'}
             | combine({'host': verify_mail_host, 'port': verify_mail_port | int, 'authentication_type': none}
                       if verify_mail_host | length > 0 else {}) }}

    # The sections the role writes only when they are on; the message names
    # the keys of the sections, never the values of the secret ones.
    - name: Check the optional sections of postal.yml
      ansible.builtin.assert:
        that:
          - >-
            (verify_config.rspamd | default({}) | dict2items | rejectattr('key', 'eq', 'password') | items2dict)
            == ({'enabled': true, 'host': '127.0.0.1', 'port': 11334, 'ssl': false} if verify_spam == 'rspamd' else {})
          - ('password' in verify_config.rspamd | default({})) == (verify_rspamd_password | bool)
          - (verify_config.rspamd.password | default('') | length > 0) == (verify_rspamd_password | bool)
          - verify_config.spamd is not defined
          - >-
            verify_config.clamav | default({})
            == ({'enabled': true, 'host': '127.0.0.1', 'port': 3310} if verify_clamav | bool else {})
          - (verify_config.oidc is defined) == (verify_oidc_name | length > 0)
          - verify_oidc_name | length == 0 or verify_config.oidc.enabled is true
          - verify_oidc_name | length == 0 or verify_config.oidc.name == verify_oidc_name
          - verify_oidc_name | length == 0 or verify_config.oidc.secret | default('') | length > 0
          - >-
            verify_config.gelf | default({})
            == ({'host': verify_gelf_host, 'port': verify_gelf_port | int, 'facility': verify_gelf_facility}
                if verify_gelf_host | length > 0 else {})
        fail_msg: >-
          postal.yml has the sections rspamd (keys
          {{ verify_config.rspamd | default({}) | list }}), clamav
          {{ verify_config.clamav | default('none') }}, oidc (keys
          {{ verify_config.oidc | default({}) | list }}, name
          {{ verify_config.oidc.name | default('none') }}) and gelf
          {{ verify_config.gelf | default('none') }}, not those of rspamd
          {{ verify_spam }} (password {{ verify_rspamd_password }}), ClamAV
          {{ verify_clamav }}, OIDC {{ verify_oidc_name or 'off' }} and GELF to
          {{ verify_gelf_host or 'nowhere' }}.

    - name: Stat the files of SMTP TLS
      ansible.builtin.stat:
        path: "{{ item }}"
        get_checksum: false
      loop:
        - "{{ verify_dir }}/config/smtp.cert"
        - "{{ verify_dir }}/config/smtp.key"
        - /usr/local/sbin/postal-smtp-cert
        - /etc/systemd/system/postal-smtp-cert.service
        - /etc/systemd/system/postal-smtp-cert.timer
      register: verify_tls_stat

    - name: Read the state of the timer of SMTP TLS
      ansible.builtin.command:
        argv: [systemctl, show, --property=ActiveState, --property=UnitFileState, postal-smtp-cert.timer]
      register: verify_timer
      changed_when: false

    - name: Check the files of SMTP TLS
      ansible.builtin.assert:
        that:
          - verify_certs | map(attribute='exists') | unique == [verify_smtp_tls != 'off']
          - verify_smtp_tls == 'off' or verify_certs | map(attribute='mode') | unique == ['0440']
          - verify_smtp_tls == 'off' or verify_certs | map(attribute='uid') | unique == [0]
          - verify_smtp_tls == 'off' or verify_certs | map(attribute='gid') | unique == [999]
          - verify_tools | map(attribute='exists') | unique == [verify_smtp_tls == 'traefik']
          - verify_smtp_tls != 'traefik' or verify_tools[0].mode == '0755'
          - >-
            verify_timer.stdout_lines | sort
            == (['ActiveState=active', 'UnitFileState=enabled'] if verify_smtp_tls == 'traefik'
                else ['ActiveState=inactive', 'UnitFileState='])
        fail_msg: >-
          With postal_smtp_tls {{ verify_smtp_tls }} smtp.cert and smtp.key
          must {{ 'not exist' if verify_smtp_tls == 'off' else 'be 0440 root:999' }}
          and the script with its units and an active timer
          {{ 'must exist' if verify_smtp_tls == 'traefik' else 'must not' }}:
          {{ verify_tls_stat.results | map(attribute='stat') | map('dict2items')
             | map('selectattr', 'key', 'in', ['path', 'exists', 'mode', 'uid', 'gid']) | map('items2dict') | list }},
          {{ verify_timer.stdout_lines }}.
      vars:
        verify_certs: "{{ verify_tls_stat.results[:2] | map(attribute='stat') | list }}"
        verify_tools: "{{ verify_tls_stat.results[2:] | map(attribute='stat') | list }}"

    - name: Read the database target
      ansible.builtin.slurp:
        src: "{{ verify_dir }}/database-target"
      register: verify_target

    - name: Check the database target
      ansible.builtin.assert:
        that: (verify_target.content | b64decode | from_yaml) == verify_target_expected
        fail_msg: "The database target is not {{ verify_target_expected }}: {{ verify_target.content | b64decode }}"
      vars:
        verify_target_expected: >-
          {{ {'database': verify_database}
             | combine({'host': verify_db_host, 'port': verify_db_port | int}
                       if verify_database == 'mariadb_external' else {}) }}
