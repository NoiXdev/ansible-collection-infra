# noixdev test cache: the overrides of Ubuntu's acng.conf.
# Log every request (the report counts hits and misses).
VerboseLog: 1
# Keep what the suites fetch for a month; the indices are checked upstream on
# every request anyway.
ExThreshold: 30
# Fetch an index that changed upstream whole, never by Range or If-Range: a
# resumed download of a file that changed meanwhile (the archive's mirrors
# behind one name do not always agree) mixes two versions, and apt then sees
# a bad signature.
VfileUseRangeOps: -1
