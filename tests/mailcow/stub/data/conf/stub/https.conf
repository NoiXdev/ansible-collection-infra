events {}
http {
  server {
    listen 443 ssl;
    ssl_certificate /ssl/cert.pem;
    ssl_certificate_key /ssl/key.pem;
    # An integrated Roundcube (data/web/rc), broken by the stub composer.
    location = /rc/ {
      if (-f /web/rc/BROKEN) {
        return 500 "roundcube broken\n";
      }
      if (!-f /web/rc/index.php) {
        return 404;
      }
      return 200 "roundcube stub\n";
    }
    location / {
      return 200 "mailcow stub\n";
    }
  }
}
