---
# The anubis role (nginx mode) first, then mailcow with mailcow_anubis_url:
# the documented order, also for a first install.
- name: Converge with Anubis
  hosts: all
  vars_files: [vars.yml, anubis-vars.yml]
  roles:
    - noixdev.infra.anubis
    - noixdev.infra.mailcow
  post_tasks:
    # run.sh reads this line.
    - name: Show the facts of the role
      ansible.builtin.debug:
        msg: >-
          mailcow facts: updated={{ mailcow_updated }} last_backup={{ mailcow_last_backup }}
          roundcube_new={{ mailcow_roundcube_updated }}
