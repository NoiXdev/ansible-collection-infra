---
# Test-only values for the redirect mode part (redirect.sh); nothing here is a
# real secret.
traefik_dir: /opt/traefik
traefik_docker_allow_empty_services: true
traefik_acme_email: test@example.test
# Unreachable on purpose: Traefik serves its default certificate.
traefik_acme_ca_server: https://127.0.0.1:14000/dir
traefik_acme_challenge: http
traefik_acme_http_entrypoint: web
traefik_entrypoints:
  - { name: web, port: 80, bind: [127.0.0.1], redirect_to: sec }
  - { name: sec, port: 443, bind: [127.0.0.1], tls: true, as_default: true }
anubis_traefik_entrypoints: [sec]
anubis_redirect_domains: ["*.example.test"]
anubis_private_key: 1f2e3d4c5b6a79881f2e3d4c5b6a79881f2e3d4c5b6a79881f2e3d4c5b6a7988
anubis_policy_allow:
  - { name: test-api, action: ALLOW, path_regex: ^/api/ }
fixtures_dir: /opt/anubis-fixtures
fixtures_whoami_image: traefik/whoami:v1.12.0
fixtures_backend_image: python:3.13-alpine
fixtures_basic_auth_user: "noix:{SHA}/HKQ8zY7tklKNV5+ZFweKLDLiA0="
