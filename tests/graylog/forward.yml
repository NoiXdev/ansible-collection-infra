---
# The sender host of the forward scenarios: the syslog_forward role with the
# targets run.sh passes, and with sender_docker=true the docker role first
# (forward_down starts containers with the GELF log driver there); with
# sender_fail_after=true a task after the role fails, as a later role of a
# play would.
- name: Converge the sender
  hosts: all
  tasks:
    - name: Run the docker role
      ansible.builtin.include_role:
        name: noixdev.infra.docker
      when: sender_docker | default(false) | bool

    - name: Run the syslog_forward role
      ansible.builtin.include_role:
        name: noixdev.infra.syslog_forward

    - name: Fail after the role
      ansible.builtin.fail:
        msg: The task after the role failed.
      when: sender_fail_after | default(false) | bool
