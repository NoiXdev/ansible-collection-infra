---
all:
  hosts:
    harborhost:
      ansible_connection: community.docker.docker
      ansible_host: "{{ test_host }}"
      ansible_python_interpreter: /usr/bin/python3
      # Harbor before v2.16 publishes amd64 images only. On amd64 this changes
      # nothing; on arm64 the images run emulated.
      ansible_docker_extra_env:
        DOCKER_DEFAULT_PLATFORM: linux/amd64
