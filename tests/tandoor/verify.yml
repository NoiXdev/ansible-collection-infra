---
# Checks a fresh install through Traefik: containers, environment and mounts;
# the browser login (CSRF) and an API token; the admin's space and a recipe;
# no open registration, but an invite that lets a new user sign up; and a
# password reset mail in Mailpit. With tandoor_s3 (-e @s3.yml): the S3
# settings, the secret key only in its file, and a recipe image that is an
# object in the bucket, behind a signed URL, and not on the host. Tandoor
# rate-limits logins (3 a minute),
# signups (2) and password resets (1) per client address, so this playbook
# logs in once and runs once per installation.
- name: Verify
  hosts: all
  gather_facts: false
  vars_files: [vars.yml]
  vars:
    tandoor_dir: /opt/tandoor
    verify_base: http://127.0.0.1
    verify_origin: http://tandoor.test
    verify_host:
      Host: tandoor.test
    verify_mailpit: http://127.0.0.1:8025
    verify_s3: "{{ (tandoor_s3 | default({})).access_key | default('') | length > 0 }}"
    # A PNG of one pixel.
    verify_png: iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==
    # The mails in Mailpit to the admin (verify_mail is registered below).
    verify_reset_mails: >-
      {%- set found = [] -%}
      {%- for m in (verify_mail.json | default({})).messages | default([]) -%}
      {%-   if tandoor_admin_email in m.To | map(attribute='Address') | list -%}
      {%-     set _ = found.append(m) -%}
      {%-   endif -%}
      {%- endfor -%}
      {{ found }}
  tasks:
    - name: Find the containers of the compose project
      ansible.builtin.command:
        argv: [docker, ps, --all, --quiet, --filter, label=com.docker.compose.project=tandoor]
      register: verify_ids
      changed_when: false

    - name: Inspect the containers
      ansible.builtin.command:
        argv: "{{ ['docker', 'inspect'] + verify_ids.stdout_lines }}"
      register: verify_inspect
      changed_when: false

    - name: Stat the compose file
      ansible.builtin.stat:
        path: "{{ tandoor_dir }}/compose.yaml"
      register: verify_compose

    - name: Read the compose file
      ansible.builtin.slurp:
        src: "{{ tandoor_dir }}/compose.yaml"
      register: verify_compose_content

    - name: Check the containers, their ports, environment and mounts, and the compose file
      ansible.builtin.assert:
        that:
          - containers | sort == ['db', 'web']
          - containers.values() | map(attribute='State.Running') | select | list | length == 2
          - web.State.Health.Status == 'healthy'
          - db.State.Health.Status == 'healthy'
          # No published port: Tandoor is reached through Traefik only.
          - containers.values() | map(attribute='HostConfig.PortBindings') | select | list | length == 0
          - "'NOIX_TEST=a$b' in web.Config.Env"
          - "'TZ=Etc/UTC' in web.Config.Env"
          - "'ENABLE_SIGNUP=0' in web.Config.Env"
          - "'ALLOWED_HOSTS=tandoor.test' in web.Config.Env"
          - "'CSRF_TRUSTED_ORIGINS=http://tandoor.test' in web.Config.Env"
          # Traefik and the image's own nginx each add to X-Forwarded-For.
          - "'ALLAUTH_TRUSTED_PROXY_COUNT=2' in web.Config.Env"
          - "'EMAIL_HOST=mailpit' in web.Config.Env"
          - "'EMAIL_PORT=1025' in web.Config.Env"
          - "'EMAIL_USE_TLS=0' in web.Config.Env"
          - "'EMAIL_USE_SSL=0' in web.Config.Env"
          - "'DEFAULT_FROM_EMAIL=recipes@example.test' in web.Config.Env"
          - ('SECRET_KEY=' ~ tandoor_secret_key) in web.Config.Env
          - ('POSTGRES_PASSWORD=' ~ tandoor_db_password) in web.Config.Env
          - ('POSTGRES_PASSWORD=' ~ tandoor_db_password) in db.Config.Env
          - web.Config.Env | select('match', 'DJANGO_SUPERUSER_') | list | length == 0
          # The database on the data directory, not on an anonymous volume.
          - db.Mounts | length == 1
          - db.Mounts[0].Type == 'bind'
          - db.Mounts[0].Source == tandoor_dir ~ '/data/postgres'
          - db.Mounts[0].Destination == '/var/lib/postgresql'
          # Local media on the data directory and on the API router; none
          # with S3.
          - >-
            web.Mounts | selectattr('Destination', 'equalto', '/opt/recipes/mediafiles') | map(attribute='Source') | list
            == ([] if verify_s3 else [tandoor_dir ~ '/data/mediafiles'])
          - (web.Config.Labels['traefik.http.routers.tandoor-api.rule'] is search('/media/')) != verify_s3
          - (web.Mounts | selectattr('Destination', 'equalto', '/opt/recipes/staticfiles') | first).Type == 'volume'
          - verify_compose.stat.mode == '0600'
        fail_msg: "{{ verify_inspect.stdout }}"
        quiet: true
      vars:
        containers: >-
          {%- set found = {} -%}
          {%- for c in verify_inspect.stdout | from_json -%}
          {%-   set _ = found.update({c.Config.Labels['com.docker.compose.service']: c}) -%}
          {%- endfor -%}
          {{ found }}
        web: "{{ containers.web }}"
        db: "{{ containers.db }}"

    - name: Check the S3 settings of the web container
      ansible.builtin.assert:
        that:
          - ('S3_ACCESS_KEY=' ~ tandoor_s3.access_key) in web.Config.Env
          - ('S3_BUCKET_NAME=' ~ tandoor_s3.bucket) in web.Config.Env
          - ('S3_ENDPOINT_URL=' ~ tandoor_s3.endpoint) in web.Config.Env
          - ('S3_REGION_NAME=' ~ tandoor_s3.region) in web.Config.Env
          - "'S3_QUERYSTRING_AUTH=1' in web.Config.Env"
          - "'S3_SECRET_ACCESS_KEY_FILE=/run/secrets/s3-secret' in web.Config.Env"
          - web.Config.Env | select('match', 'S3_SECRET_ACCESS_KEY=') | list | length == 0
          - secret_mount | length == 1
          - secret_mount[0].Type == 'bind'
          - secret_mount[0].Source == tandoor_dir ~ '/s3-secret'
          - not secret_mount[0].RW
        fail_msg: "{{ web.Config.Env | reject('match', '(SECRET_KEY|POSTGRES_PASSWORD|EMAIL_HOST_PASSWORD)=') | list }} {{ web.Mounts }}"
        quiet: true
      vars:
        web: "{{ verify_inspect.stdout | from_json | selectattr('Name', 'search', '-web-') | first }}"
        secret_mount: "{{ web.Mounts | selectattr('Destination', 'equalto', '/run/secrets/s3-secret') | list }}"
      when: verify_s3

    # A task of its own: its failure message must not show what it found.
    # The compose file would hold it with $ doubled.
    - name: Check that the S3 secret key is in neither the compose file nor docker inspect
      ansible.builtin.assert:
        that:
          - tandoor_s3.secret_key not in verify_inspect.stdout
          - tandoor_s3.secret_key not in (verify_compose_content.content | b64decode)
          - (tandoor_s3.secret_key | replace('$', '$$')) not in (verify_compose_content.content | b64decode)
        fail_msg: The S3 secret key is in the compose file or in docker inspect.
        quiet: true
      when: verify_s3

    - name: Stat the S3 secret file
      ansible.builtin.stat:
        path: "{{ tandoor_dir }}/s3-secret"
      register: verify_s3_secret_stat
      when: verify_s3

    - name: Read the S3 secret file
      ansible.builtin.slurp:
        src: "{{ tandoor_dir }}/s3-secret"
      register: verify_s3_secret
      no_log: true
      when: verify_s3

    - name: Check the S3 secret file
      ansible.builtin.assert:
        that:
          - verify_s3_secret_stat.stat.pw_name == 'root'
          - verify_s3_secret_stat.stat.mode == '0600'
          - (verify_s3_secret.content | b64decode) == tandoor_s3.secret_key
        fail_msg: >-
          {{ tandoor_dir }}/s3-secret must be root's, mode 0600, and hold the
          secret key: {{ verify_s3_secret_stat.stat.pw_name }}
          {{ verify_s3_secret_stat.stat.mode }}
        quiet: true
      when: verify_s3

    # The single-page app's login: the page sets the CSRF cookie, the login
    # goes to allauth's browser API with the token, as Tandoor's UI sends it.
    - name: Open the login page through Traefik
      ansible.builtin.uri:
        url: "{{ verify_base }}/account/login/"
        headers: "{{ verify_host }}"
      register: verify_page

    # The CSRF check is on: a login from another origin is refused before
    # the view (no login attempt counted).
    - name: Refuse a login from another origin
      ansible.builtin.uri:
        url: "{{ verify_base }}/_allauth/browser/v1/auth/login"
        method: POST
        headers: >-
          {{ verify_host | combine({'Cookie': 'csrftoken=' ~ verify_page.cookies.csrftoken,
                                    'X-CSRFToken': verify_page.cookies.csrftoken,
                                    'Origin': 'http://evil.test'}) }}
        body_format: json
        body:
          username: "{{ tandoor_admin_user }}"
          password: "{{ tandoor_admin_password }}"
        return_content: true
        status_code: [403]
      register: verify_evil
      failed_when: verify_evil.status != 403 or 'CSRF' not in verify_evil.content

    - name: Log in through Traefik
      ansible.builtin.uri:
        url: "{{ verify_base }}/_allauth/browser/v1/auth/login"
        method: POST
        headers: >-
          {{ verify_host | combine({'Cookie': 'csrftoken=' ~ verify_page.cookies.csrftoken,
                                    'X-CSRFToken': verify_page.cookies.csrftoken,
                                    'Origin': verify_origin}) }}
        body_format: json
        body:
          username: "{{ tandoor_admin_user }}"
          password: "{{ tandoor_admin_password }}"
        status_code: [200]
      register: verify_login

    # Django rotates the CSRF token on login.
    - name: Note the session of the admin
      ansible.builtin.set_fact:
        verify_session: >-
          {{ verify_host | combine({'Cookie': 'csrftoken=' ~ verify_csrf ~ '; sessionid=' ~ verify_login.cookies.sessionid,
                                    'X-CSRFToken': verify_csrf, 'Origin': verify_origin}) }}
      vars:
        verify_csrf: "{{ verify_login.cookies.csrftoken | default(verify_page.cookies.csrftoken) }}"

    # An API token as Tandoor 2.x hands them to apps (tda_..., Bearer).
    - name: Create an API token for the admin
      ansible.builtin.uri:
        url: "{{ verify_base }}/api/access-token/"
        method: POST
        headers: "{{ verify_session }}"
        body_format: json
        body:
          scope: read write
          expires: "2099-12-31T00:00:00Z"
        status_code: [201]
      register: verify_token_created

    - name: Note the API headers
      ansible.builtin.set_fact:
        verify_api: "{{ verify_host | combine({'Authorization': 'Bearer ' ~ verify_token_created.json.token}) }}"

    # The role made it on install; without it the API answers 500.
    - name: Read the admin's space
      ansible.builtin.uri:
        url: "{{ verify_base }}/api/space/current/"
        headers: "{{ verify_api }}"
        status_code: [200]

    - name: Create a recipe with the token
      ansible.builtin.uri:
        url: "{{ verify_base }}/api/recipe/"
        method: POST
        headers: "{{ verify_api }}"
        body_format: json
        body:
          name: Noix test soup
          steps: []
        status_code: [201]
      register: verify_recipe

    - name: Write a test image
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - import base64, sys; open(sys.argv[1], 'wb').write(base64.b64decode(sys.argv[2]))
          - /tmp/noix-test.png
          - "{{ verify_png }}"
        creates: /tmp/noix-test.png
      when: verify_s3

    - name: Upload an image of the recipe
      ansible.builtin.uri:
        url: "{{ verify_base }}/api/recipe/{{ verify_recipe.json.id }}/image/"
        method: PUT
        headers: "{{ verify_api }}"
        body_format: form-multipart
        body:
          image:
            filename: /tmp/noix-test.png
            mime_type: image/png
        remote_src: true
        status_code: [200]
      when: verify_s3

    - name: Read the recipe
      ansible.builtin.uri:
        url: "{{ verify_base }}/api/recipe/{{ verify_recipe.json.id }}/"
        headers: "{{ verify_api }}"
      register: verify_recipe_read
      when: verify_s3

    # Path-style: the endpoint, then the bucket, then the key.
    - name: Note the image URL and its key
      ansible.builtin.set_fact:
        verify_image_url: "{{ verify_recipe_read.json.image | default('', true) }}"
        verify_image_key: >-
          {{ (verify_recipe_read.json.image | default('', true) | urlsplit('path'))
             | regex_replace('^/' ~ tandoor_s3.bucket ~ '/', '') }}
      when: verify_s3

    - name: Check that the image URL is signed and points into the bucket
      ansible.builtin.assert:
        that:
          - verify_image_url.startswith(tandoor_s3.endpoint ~ '/' ~ tandoor_s3.bucket ~ '/')
          - "'X-Amz-Signature=' in verify_image_url"
        fail_msg: "{{ verify_recipe_read.json | to_json }}"
        quiet: true
      when: verify_s3

    - name: Download the image with its signed URL
      ansible.builtin.uri:
        url: "{{ verify_image_url }}"
        status_code: [200]
      register: verify_image
      failed_when: verify_image.status != 200 or verify_image.content_type != 'image/png'
      when: verify_s3

    - name: Refuse the image without the signature
      ansible.builtin.uri:
        url: "{{ verify_image_url.split('?') | first }}"
        status_code: [403]
      when: verify_s3

    # The keys are on the command line. The next task fails with the answer.
    - name: Look up the image in the bucket
      ansible.builtin.command:
        argv:
          - docker
          - run
          - --rm
          - "--network={{ traefik_network | default('proxy') }}"
          - "--env=AWS_ACCESS_KEY_ID={{ tandoor_s3.access_key }}"
          - "--env=AWS_SECRET_ACCESS_KEY={{ tandoor_s3.secret_key }}"
          - "--env=AWS_DEFAULT_REGION={{ tandoor_s3.region }}"
          - "{{ s3_aws_cli_image }}"
          - "--endpoint-url={{ tandoor_s3.endpoint }}"
          - s3api
          - head-object
          - "--bucket={{ tandoor_s3.bucket }}"
          - "--key={{ verify_image_key }}"
      register: verify_object
      changed_when: false
      failed_when: false
      no_log: true
      when: verify_s3

    - name: Check that the image is an object in the bucket
      ansible.builtin.assert:
        that: verify_object.rc == 0
        fail_msg: "{{ verify_image_key }}: {{ verify_object.stderr | default('') }}"
        quiet: true
      when: verify_s3

    - name: Look for the image on the host
      ansible.builtin.find:
        paths: ["{{ tandoor_dir }}"]
        patterns: ["{{ verify_image_key | basename }}"]
        recurse: true
      register: verify_image_on_host
      when: verify_s3

    - name: Check that the image is not on the host
      ansible.builtin.assert:
        that: verify_image_on_host.matched == 0
        fail_msg: "{{ verify_image_on_host.files | map(attribute='path') | list }}"
        quiet: true
      when: verify_s3

    - name: Read the server settings
      ansible.builtin.uri:
        url: "{{ verify_base }}/api/server-settings/current/"
        headers: "{{ verify_host }}"
      register: verify_server

    - name: Check that the UI offers no registration
      ansible.builtin.assert:
        that: not (verify_server.json.enable_signup | bool)
        fail_msg: "{{ verify_server.json | to_json }}"
        quiet: true

    - name: Open the signup page without an invite
      ansible.builtin.uri:
        url: "{{ verify_base }}/account/signup/"
        headers: "{{ verify_host }}"
      register: verify_signup_page

    - name: Refuse a signup without an invite
      ansible.builtin.uri:
        url: "{{ verify_base }}/_allauth/browser/v1/auth/signup"
        method: POST
        headers: >-
          {{ verify_host | combine({'Cookie': 'csrftoken=' ~ verify_signup_page.cookies.csrftoken,
                                    'X-CSRFToken': verify_signup_page.cookies.csrftoken,
                                    'Origin': verify_origin}) }}
        body_format: json
        body:
          username: intruder
          email: intruder@example.test
        status_code: [403]

    - name: Read the groups
      ansible.builtin.uri:
        url: "{{ verify_base }}/api/group/"
        headers: "{{ verify_api }}"
      register: verify_groups

    - name: Create an invite through the API
      ansible.builtin.uri:
        url: "{{ verify_base }}/api/invite-link/"
        method: POST
        headers: "{{ verify_api }}"
        body_format: json
        body:
          group: "{{ verify_group_list | selectattr('name', 'equalto', 'user') | first }}"
          valid_until: "2099-12-31"
        status_code: [201]
      register: verify_invite
      vars:
        verify_group_list: "{{ verify_groups.json.results | default(verify_groups.json) }}"

    # The invite link puts its token into a new session and sends the browser
    # to the signup page, where the signup is open for that session only.
    - name: Follow the invite link
      ansible.builtin.uri:
        url: "{{ verify_base }}/invite/{{ verify_invite.json.uuid }}"
        headers: "{{ verify_host }}"
        follow_redirects: none
        status_code: [302]
      register: verify_invite_link

    # A response that is not followed has no cookies of its own in the
    # result, only its Set-Cookie header.
    - name: Note the session of the invite
      ansible.builtin.set_fact:
        verify_invited_session: "{{ verify_invite_link.set_cookie | regex_search('sessionid=([^;]+)', '\\1') | first }}"

    - name: Open the signup page with the invite
      ansible.builtin.uri:
        url: "{{ verify_base }}/account/signup/"
        headers: "{{ verify_host | combine({'Cookie': 'sessionid=' ~ verify_invited_session}) }}"
      register: verify_invited_page

    - name: Sign up with the invite
      ansible.builtin.uri:
        url: "{{ verify_base }}/_allauth/browser/v1/auth/signup"
        method: POST
        headers: >-
          {{ verify_host | combine({'Cookie': 'sessionid=' ~ verify_invited_session
                                              ~ '; csrftoken=' ~ verify_invited_page.cookies.csrftoken,
                                    'X-CSRFToken': verify_invited_page.cookies.csrftoken,
                                    'Origin': verify_origin}) }}
        body_format: json
        body:
          username: invitee
          email: invitee@example.test
        status_code: [200]

    - name: Read the members of the admin's space
      ansible.builtin.uri:
        url: "{{ verify_base }}/api/user-space/"
        headers: "{{ verify_api }}"
      register: verify_members

    - name: Check that the invited user joined the admin's space
      ansible.builtin.assert:
        that: "'invitee' in verify_member_list | map(attribute='user') | map(attribute='username')"
        fail_msg: "{{ verify_members.json | to_json }}"
        quiet: true
      vars:
        verify_member_list: "{{ verify_members.json.results | default(verify_members.json) }}"

    - name: Open the password reset page
      ansible.builtin.uri:
        url: "{{ verify_base }}/account/password-reset"
        headers: "{{ verify_host }}"
      register: verify_reset_page

    - name: Request a password reset for the admin
      ansible.builtin.uri:
        url: "{{ verify_base }}/_allauth/browser/v1/auth/password/request"
        method: POST
        headers: >-
          {{ verify_host | combine({'Cookie': 'csrftoken=' ~ verify_reset_page.cookies.csrftoken,
                                    'X-CSRFToken': verify_reset_page.cookies.csrftoken,
                                    'Origin': verify_origin}) }}
        body_format: json
        body:
          email: "{{ tandoor_admin_email }}"
        status_code: [200]

    - name: Wait for the reset mail in Mailpit
      ansible.builtin.uri:
        url: "{{ verify_mailpit }}/api/v1/messages"
      register: verify_mail
      until: verify_reset_mails | length > 0
      retries: 30
      delay: 2

    - name: Check the sender of the reset mail
      ansible.builtin.assert:
        that: verify_reset_mails[0].From.Address == 'recipes@example.test'
        fail_msg: "{{ verify_mail.json | to_json }}"
        quiet: true
