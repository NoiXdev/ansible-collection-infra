---
# Test-only values for the s3 scenario (-e @s3.yml); nothing here is a real
# secret. RustFS (converge.yml) takes these keys as its own; s3.test is its
# name on the Traefik network and on the test host. The secret keys hold a $
# that must reach Tandoor verbatim; run.sh rotates to s3_rotated_secret_key
# and back.
converge_s3: true
s3_rustfs_image: rustfs/rustfs:1.0.5
s3_aws_cli_image: amazon/aws-cli:2.31.0
s3_secret_key: test-s3-se$cret-key-0
s3_rotated_secret_key: test-s3-ro$tated-key-0
tandoor_s3:
  access_key: test-s3-access-key
  secret_key: "{{ s3_secret_key }}"
  bucket: recipes
  endpoint: http://s3.test:9000
  region: us-east-1
