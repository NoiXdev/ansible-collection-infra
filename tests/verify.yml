---
- name: Verify
  hosts: all
  vars_files: [vars.yml]
  tasks:
    - name: Manager answers health checks
      ansible.builtin.uri:
        url: http://127.0.0.1:8080/healthz
      register: verify_health
      retries: 30
      delay: 2
      until: verify_health.status == 200

    - name: Traefik routes the manager
      ansible.builtin.uri:
        url: http://127.0.0.1/healthz
        headers: { Host: pulsix.test }
      register: verify_routed
      retries: 15
      delay: 2
      until: verify_routed.status == 200

    - name: Traefik routes Portainer
      ansible.builtin.uri:
        url: http://127.0.0.1/
        headers: { Host: portainer.test }
        status_code: [200, 307]
      register: verify_portainer
      retries: 15
      delay: 2
      until: verify_portainer.status in [200, 307]

    - name: Portainer created the admin from the password file
      ansible.builtin.uri:
        url: http://127.0.0.1/api/auth
        method: POST
        headers: { Host: portainer.test }
        body_format: json
        body: { username: admin, password: "{{ portainer_admin_password }}" }
      register: verify_portainer_login
      retries: 15
      delay: 2
      until: verify_portainer_login.status == 200
      failed_when: verify_portainer_login.json.jwt | default('') | length == 0

    - name: Traefik answers on a separate host port
      ansible.builtin.uri:
        url: http://127.0.0.1:18081/
        headers: { Host: nobody.test }
        status_code: [404]
      register: verify_host_port
      retries: 15
      delay: 2
      until: verify_host_port.status == 404

    - name: A redirect goes to the target's host port
      ansible.builtin.uri:
        url: http://127.0.0.1:8082/x
        headers: { Host: nobody.test }
        follow_redirects: none
        status_code: [301, 308]
      register: verify_redirect
      retries: 15
      delay: 2
      until: verify_redirect.status in [301, 308]
      failed_when: verify_redirect.location | default('') != 'https://nobody.test:18081/x'

    - name: Read the static configuration
      ansible.builtin.slurp:
        src: /opt/traefik/traefik.yml
      register: verify_static

    - name: Static configuration has entrypoint middlewares, responding timeouts and allowEmptyServices
      ansible.builtin.assert:
        that:
          - verify_static_cfg.providers.docker.allowEmptyServices is sameas true
          - verify_static_cfg.entryPoints.alt.http.middlewares == ['test-header@file']
          - verify_static_cfg.entryPoints.web.http.middlewares
            == ['error-pages-compress@file', 'error-pages-errors@file']
          - verify_static_cfg.entryPoints['alt-redirect'].http.middlewares is not defined
          - verify_static_cfg.entryPoints.alt.transport.respondingTimeouts.readTimeout == '600s'
          - verify_static_cfg.entryPoints.alt.transport.respondingTimeouts.writeTimeout == '0s'
          - verify_static_cfg.entryPoints.alt.transport.respondingTimeouts.idleTimeout is not defined
          - verify_static_cfg.entryPoints.web.transport is not defined
        quiet: true
      vars:
        verify_static_cfg: "{{ verify_static.content | b64decode | from_yaml }}"

    - name: The error pages container is healthy and locked down
      ansible.builtin.command:
        cmd: >-
          docker inspect -f '{{ '{{' }}.State.Health.Status{{ '}}' }} {{ '{{' }}.Config.User{{ '}}' }}
          {{ '{{' }}.HostConfig.ReadonlyRootfs{{ '}}' }}'
          traefik-error-pages-1
      register: verify_ep_container
      retries: 30
      delay: 2
      until: verify_ep_container.stdout is match('healthy ')
      changed_when: false
      failed_when: verify_ep_container.stdout != 'healthy 65532:65532 true'

    - name: The error pages container keeps its maintenance flag in a volume
      ansible.builtin.command:
        cmd: docker exec traefik-error-pages-1 /error-pages maintenance status
      register: verify_ep_maintenance
      changed_when: false
      failed_when: verify_ep_maintenance.rc != 0 or verify_ep_maintenance.stdout != 'off'

    - name: An unknown host gets the 404 page
      ansible.builtin.uri:
        url: http://127.0.0.1/
        headers: { Host: nobody.test }
        status_code: [404]
        return_content: true
      register: verify_ep_404
      retries: 15
      delay: 2
      until: verify_ep_404.status == 404 and 'ep-theme-terminal' in verify_ep_404.content
      failed_when: >-
        verify_ep_404.status != 404
        or 'ep-theme-terminal' not in verify_ep_404.content
        or 'sha256-' not in verify_ep_404.content_security_policy | default('')

    - name: A guarded host gets the internal page
      ansible.builtin.uri:
        url: http://127.0.0.1/
        headers: { Host: db.internal.test }
        status_code: [403]
        return_content: true
      register: verify_ep_internal
      failed_when: >-
        verify_ep_internal.status != 403
        or 'ep-theme-terminal' not in verify_ep_internal.content

    # uri cannot return a compressed body, so read only the headers.
    - name: Error pages are compressed
      ansible.builtin.command:
        cmd: >-
          python3 -I -c "import http.client as h;
          c = h.HTTPConnection('127.0.0.1');
          c.request('GET', '/', headers={'Host': 'nobody.test', 'Accept-Encoding': 'gzip'});
          r = c.getresponse(); print(r.status, r.getheader('Content-Encoding'))"
      register: verify_ep_gzip
      changed_when: false
      failed_when: verify_ep_gzip.stdout != '404 gzip'

    - name: A refused backend gets the 502 page
      ansible.builtin.uri:
        url: http://127.0.0.1/
        headers: { Host: broken.test }
        status_code: [502]
        return_content: true
      register: verify_ep_502
      retries: 15
      delay: 2
      until: verify_ep_502.status == 502
      failed_when: verify_ep_502.status != 502 or 'ep-theme-terminal' not in verify_ep_502.content

    # allowEmptyServices keeps the router of an unhealthy container (without it
    # the host falls through to the catch-all: 404). Traefik v3.7 then renders
    # the service with one server without a URL and answers 500, which
    # traefik_error_pages_status does not cover by default; a 503 must still
    # get the page.
    - name: An unhealthy backend keeps its router
      ansible.builtin.uri:
        url: http://127.0.0.1/
        headers: { Host: unhealthy.test }
        status_code: [500, 503]
        return_content: true
      register: verify_ep_unhealthy
      retries: 15
      delay: 2
      until: verify_ep_unhealthy.status in [500, 503]
      failed_when: >-
        verify_ep_unhealthy.status not in [500, 503]
        or (verify_ep_unhealthy.status == 503 and 'ep-theme-terminal' not in verify_ep_unhealthy.content)

    - name: API clients get JSON
      ansible.builtin.uri:
        url: http://127.0.0.1/
        headers: { Host: nobody.test, Accept: application/json }
        status_code: [404]
      register: verify_ep_json
      failed_when: verify_ep_json.status != 404 or verify_ep_json.json.code | default(0) != 404

    - name: The catch-all also serves an entrypoint without the errors middleware
      ansible.builtin.uri:
        url: http://127.0.0.1:18081/
        headers: { Host: nobody.test }
        status_code: [404]
        return_content: true
      register: verify_ep_alt
      failed_when: >-
        verify_ep_alt.status != 404
        or 'ep-theme-terminal' not in verify_ep_alt.content
        or verify_ep_alt.x_test_entrypoint | default('') != 'alt'

    - name: Worker endpoint is published
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 8444
        timeout: 30

    - name: Read the setup token
      ansible.builtin.command:
        cmd: docker compose run --rm --no-deps cli setup-token
        chdir: /opt/pulsix
      register: verify_setup
      changed_when: false

    - name: Complete the setup wizard
      ansible.builtin.uri:
        url: http://127.0.0.1:8080/api/v1/setup/complete
        method: POST
        body_format: json
        body:
          admin_email: test@example.test
          admin_password: correct horse battery staple
          admin_name: Test
          org_slug: test
          org_name: Test
          setup_token: "{{ verify_setup.stdout | regex_search('Setup token: *(\\S+)', '\\1') | first }}"
        status_code: [200, 201]
      when: "'already completed' not in verify_setup.stdout"

    - name: Local workers enroll
      ansible.builtin.command:
        cmd: "docker compose exec -T worker-{{ item.name }} test -s /etc/pulsix-worker/cert.pem"
        chdir: /opt/pulsix
      register: verify_bundle
      retries: 30
      delay: 3
      until: verify_bundle.rc == 0
      changed_when: false
      loop: "{{ pulsix_manager_workers }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Local workers stay up
      ansible.builtin.command:
        cmd: "docker inspect -f '{{ '{{' }}.State.Status{{ '}}' }} {{ '{{' }}.RestartCount{{ '}}' }}' pulsix-worker-{{ item.name }}-1"
      register: verify_state
      changed_when: false
      failed_when: verify_state.stdout != 'running 0'
      loop: "{{ pulsix_manager_workers }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Max concurrency reaches the worker
      ansible.builtin.command:
        cmd: docker inspect -f '{{ '{{' }}json .Config.Env{{ '}}' }}' pulsix-worker-ctl-2-1
      register: verify_env
      changed_when: false
      failed_when: "'PULSIX_MAX_CONCURRENT=2' not in verify_env.stdout"

    - name: Local workers report in
      ansible.builtin.command:
        cmd: >-
          docker compose exec -T db psql -U pulsix -d pulsix -tA
          -c "SELECT count(*) FROM workers WHERE name = '{{ item.name }}' AND last_seen IS NOT NULL"
        chdir: /opt/pulsix
      register: verify_seen
      retries: 20
      delay: 3
      until: verify_seen.stdout == '1'
      changed_when: false
      loop: "{{ pulsix_manager_workers }}"
      loop_control:
        label: "{{ item.name }}"

    - name: DNS answers a record with its address
      ansible.builtin.command:
        cmd: dig +short @127.0.0.1 app.internal.test A
      register: verify_dns_a
      retries: 10
      delay: 1
      until: verify_dns_a.stdout | trim == '192.0.2.10'
      changed_when: false

    - name: DNS answers a known name without that type as empty NOERROR
      ansible.builtin.command:
        cmd: dig @127.0.0.1 app.internal.test AAAA
      register: verify_dns_nodata
      changed_when: false

    - name: Check the empty answer
      ansible.builtin.assert:
        that:
          - "'status: NOERROR' in verify_dns_nodata.stdout"
          - "'ANSWER: 0' in verify_dns_nodata.stdout"
        quiet: true

    - name: DNS answers an IPv6 record
      ansible.builtin.command:
        cmd: dig +short @127.0.0.1 dual.internal.test AAAA
      register: verify_dns_aaaa
      changed_when: false

    - name: Check the IPv6 record
      ansible.builtin.assert:
        that: verify_dns_aaaa.stdout | trim == '2001:db8::11'
        quiet: true

    - name: DNS answers a record that follows a tailnet peer
      ansible.builtin.command:
        cmd: "dig +short @127.0.0.1 {{ item.name }} {{ item.type }}"
      register: verify_dns_peer
      retries: 10
      delay: 1
      until: verify_dns_peer.stdout | trim == item.address
      changed_when: false
      loop:
        - { name: peer-a.example.test, type: A, address: 100.64.0.10 }
        - { name: peer-a.example.test, type: AAAA, address: "fd7a:115c:a1e0::a" }
        - { name: self.example.test, type: A, address: 100.64.0.1 }
      loop_control:
        label: "{{ item.name }} {{ item.type }}"

    - name: DNS has no record for a peer that is not on the tailnet
      ansible.builtin.command:
        cmd: dig @127.0.0.1 peer-missing.example.test A
      register: verify_dns_missing
      changed_when: false

    - name: Check the missing peer has no record
      ansible.builtin.assert:
        that: "'ANSWER: 0' in verify_dns_missing.stdout"
        quiet: true

    - name: DNS forwards other names
      ansible.builtin.command:
        cmd: dig @127.0.0.1 example.com A
      register: verify_dns_forward
      changed_when: false

    - name: Check the forwarded answer
      ansible.builtin.assert:
        that:
          - "'status: NOERROR' in verify_dns_forward.stdout"
          - "verify_dns_forward.stdout is not search('ANSWER: 0')"
        quiet: true

    - name: DNS does not serve the host's /etc/hosts
      ansible.builtin.command:
        cmd: dig +short @127.0.0.1 leak.internal.test A
      register: verify_dns_leak
      changed_when: false

    - name: Check that the /etc/hosts entry is not answered
      ansible.builtin.assert:
        that: "'203.0.113.7' not in verify_dns_leak.stdout"
        quiet: true

    - name: DNS refuses clients outside dns_allow
      ansible.builtin.command:
        cmd: dig @192.0.2.53 app.internal.test A
      register: verify_dns_refused
      changed_when: false

    - name: Check the refusal
      ansible.builtin.assert:
        that: "'status: REFUSED' in verify_dns_refused.stdout"
        quiet: true

    - name: Inspect the DNS container
      ansible.builtin.command:
        cmd: >-
          docker inspect dns-coredns-1
          --format '{{ '{{' }}.HostConfig.ReadonlyRootfs{{ '}}' }} {{ '{{' }}.HostConfig.NetworkMode{{ '}}' }} {{ '{{' }}.HostConfig.SecurityOpt{{ '}}' }}'
      register: verify_dns_inspect
      changed_when: false

    - name: Check the DNS container
      ansible.builtin.assert:
        that: verify_dns_inspect.stdout | trim == 'true host [no-new-privileges:true]'
        quiet: true

# A remote worker over the published endpoint. Its identity is seeded from
# the manager CLI's bundle, standing in for a redeemed token (minting a
# token needs an interactive browser session): the role must treat it as
# enrolled, and the worker must reach the manager through host:8444 with
# the endpoint's server name.
- name: Verify a remote worker
  hosts: all
  vars:
    remote_dir: /opt/pulsix-remote
    remote_name: edge-2
  tasks:
    - name: Issue a bundle for the remote worker
      ansible.builtin.command:
        cmd: "docker compose run --rm --no-deps cli worker add --zone default --name {{ remote_name }}"
        chdir: /opt/pulsix
        creates: "{{ remote_dir }}/{{ remote_name }}/identity/cert.pem"
      register: verify_bundle_out
      no_log: true

    - name: Seed the remote worker's identity
      when: "'BEGIN' in verify_bundle_out.stdout | default('')"
      block:
        - name: Create the identity directory
          ansible.builtin.file:
            path: "{{ item }}"
            state: directory
            owner: "65532"
            group: "65532"
            mode: "0700"
          loop:
            - "{{ remote_dir }}"
            - "{{ remote_dir }}/{{ remote_name }}"
            - "{{ remote_dir }}/{{ remote_name }}/identity"

        - name: Write the identity files
          ansible.builtin.copy:
            dest: "{{ remote_dir }}/{{ remote_name }}/identity/{{ item.0 }}"
            content: "{{ item.1 }}\n"
            owner: "65532"
            group: "65532"
            mode: "0600"
          loop: "{{ ['cert.pem', 'key.pem', 'ca.pem'] | zip(verify_pem_blocks) | list }}"
          vars:
            verify_pem_blocks: "{{ verify_bundle_out.stdout | regex_findall('-----BEGIN [A-Z ]+-----[\\s\\S]*?-----END [A-Z ]+-----') }}"
          no_log: true

    - name: Find the host address
      ansible.builtin.command:
        cmd: hostname -i
      register: verify_host_ip
      changed_when: false

    - name: Run the remote worker role
      ansible.builtin.include_role:
        name: noixdev.infra.pulsix_worker
      vars:
        pulsix_worker_dir: "{{ remote_dir }}"
        pulsix_worker_manager_addr: "{{ verify_host_ip.stdout | trim }}:8444"
        pulsix_worker_instances:
          - name: "{{ remote_name }}"

    - name: Remote worker reports in
      ansible.builtin.command:
        cmd: >-
          docker compose exec -T db psql -U pulsix -d pulsix -tA
          -c "SELECT count(*) FROM workers WHERE name = '{{ remote_name }}' AND last_seen IS NOT NULL"
        chdir: /opt/pulsix
      register: verify_remote_seen
      retries: 20
      delay: 3
      until: verify_remote_seen.stdout == '1'
      changed_when: false

    - name: Traefik routes Dashy
      ansible.builtin.uri:
        url: http://127.0.0.1/
        headers: { Host: dashy.test }
      register: verify_dashy
      retries: 30
      delay: 2
      until: verify_dashy.status == 200

    - name: Dashy serves the rendered config with the lock-down keys
      ansible.builtin.uri:
        url: http://127.0.0.1/conf.yml
        headers: { Host: dashy.test }
        return_content: true
      register: verify_dashy_conf
      failed_when: >-
        'title: Test' not in verify_dashy_conf.content
        or 'preventWriteToDisk: true' not in verify_dashy_conf.content
        or 'preventLocalSave: true' not in verify_dashy_conf.content
        or 'disableConfiguration: true' not in verify_dashy_conf.content

    - name: Inspect the Dashy container
      ansible.builtin.command:
        argv:
          - docker
          - inspect
          - -f
          - >-
            {{ '{{' }}json .HostConfig.PortBindings{{ '}}' }}
            {{ '{{' }}range .Mounts{{ '}}' }}{{ '{{' }}.Destination{{ '}}' }}={{ '{{' }}.RW{{ '}}' }};{{ '{{' }}end{{ '}}' }}
          - dashy-dashy-1
      register: verify_dashy_inspect
      changed_when: false

    - name: Dashy publishes no port and mounts the config read-only
      ansible.builtin.assert:
        that:
          - verify_dashy_inspect.stdout.split()[0] in ['{}', 'null']
          - "'/app/user-data/conf.yml=false;' in verify_dashy_inspect.stdout"
        quiet: true
