---
# What the backups of the test host talk to, started inside the test host:
# the S3 target, a server that records every report it receives, and a database
# in the compose project "shop" for the dump tests. run.sh writes the .env file
# with the generated keys and passwords.
name: shop

services:
  minio:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?}
      MINIO_DEFAULT_BUCKETS: ${S3_BUCKET:?}
    ports:
      - 127.0.0.1:9000:9000

  capture:
    image: python:3.13-alpine
    command: [python3, /capture.py]
    configs:
      - source: capture
        target: /capture.py
    volumes:
      - /srv/capture:/srv/capture
    ports:
      - 127.0.0.1:9099:9099

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: ${DB_PASSWORD:?}
      POSTGRES_DB: shop
    healthcheck:
      test: [CMD-SHELL, pg_isready -U shop -d shop]
      interval: 2s
      timeout: 5s
      retries: 30

configs:
  capture:
    content: |
      # Appends one line per request to /srv/capture/reports.log.
      from http.server import BaseHTTPRequestHandler, HTTPServer


      class Capture(BaseHTTPRequestHandler):
          def answer(self):
              length = int(self.headers.get("Content-Length") or 0)
              body = self.rfile.read(length).decode("utf-8", "replace")
              if self.command != "GET":
                  line = " ".join([self.command, self.path, body.replace("\n", " ")])
                  with open("/srv/capture/reports.log", "a", encoding="utf-8") as log:
                      log.write(line + "\n")
              self.send_response(200)
              self.send_header("Content-Length", "0")
              self.end_headers()

          do_GET = do_POST = do_PUT = answer

          def log_message(self, *args):
              pass


      HTTPServer(("0.0.0.0", 9099), Capture).serve_forever()
