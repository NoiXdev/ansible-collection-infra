---
argument_specs:
  main:
    short_description: Portainer server or agent
    options:
      portainer_mode:
        type: str
        choices: [server, agent]
        description: Run the Portainer server or an agent a server connects to.
      portainer_version:
        type: str
        description: Version of both images; server and agents must match.
      portainer_dir:
        type: path
        description: Directory of the compose project.
      portainer_project:
        type: str
        description: Compose project name.
      portainer_mtu:
        type: int
        description: MTU of the compose network.
      portainer_agent_secret:
        type: str
        description: Shared secret of server and agents (AGENT_SECRET). Keep it in a vault.
      portainer_admin_password:
        type: str
        description: >-
          Server only. Password (at least 12 characters) of the user admin, which
          Portainer creates on a start without an admin. Keep it in a vault. Empty
          leaves the admin to the setup page. Changing it later does not change an
          existing admin's password.
      portainer_host:
        type: str
        description: Server only. Host name Traefik routes to the UI; empty adds no route.
      portainer_traefik_network:
        type: str
        description: Server only. External network Traefik routes on.
      portainer_traefik_entrypoint:
        type: str
        description: Server only. Traefik entrypoint for the route; empty uses Traefik's default.
      portainer_bind:
        type: list
        elements: str
        description: Server only. Addresses the UI port 9443 is published on.
      portainer_agent_bind:
        type: list
        elements: str
        description: Agent only. Addresses the agent port 9001 is published on.
      portainer_agent_register_url:
        type: str
        description: >-
          Agent only. Base URL of the Portainer server (http:// or https://) this
          host registers itself on as an environment. Empty registers nothing.
      portainer_agent_register_address:
        type: str
        description: >-
          Agent only. Address the registration URL's host name is pinned to (curl
          --resolve). Empty uses normal name resolution.
      portainer_agent_register_api_token:
        type: str
        description: >-
          Agent only. Portainer access token (header X-API-Key) used to register.
          Required when portainer_agent_register_url is set. Keep it in a vault.
      portainer_agent_register_name:
        type: str
        description: Agent only. Name of the environment; defaults to the inventory host name.
      portainer_agent_register_endpoint:
        type: str
        description: >-
          Agent only. Address the server dials to reach this agent; defaults to
          the first portainer_agent_bind address on port 9001.
