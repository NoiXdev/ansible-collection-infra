---
- name: Check the agent settings
  ansible.builtin.assert:
    that:
      - portainer_agent_bind | length > 0
      - portainer_agent_secret | length > 0
    fail_msg: An agent needs portainer_agent_bind and portainer_agent_secret.
    quiet: true
  when: portainer_mode == 'agent'

- name: Check the admin password
  ansible.builtin.assert:
    that: portainer_admin_password | length >= 12
    fail_msg: portainer_admin_password needs at least 12 characters.
    quiet: true
  when: portainer_mode == 'server' and portainer_admin_password | length > 0

- name: Create the Portainer directory
  ansible.builtin.file:
    path: "{{ portainer_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Write the secret environment
  ansible.builtin.copy:
    dest: "{{ portainer_dir }}/portainer.env"
    content: |
      # Managed by Ansible
      {% if portainer_agent_secret %}
      AGENT_SECRET={{ portainer_agent_secret }}
      {% endif %}
    owner: root
    group: root
    mode: "0600"
  no_log: true
  register: portainer_env

- name: Write the admin password file
  ansible.builtin.copy:
    dest: "{{ portainer_dir }}/admin_password"
    content: "{{ portainer_admin_password }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  register: portainer_admin_password_file
  when: portainer_mode == 'server' and portainer_admin_password | length > 0

- name: Remove the admin password file
  ansible.builtin.file:
    path: "{{ portainer_dir }}/admin_password"
    state: absent
  when: portainer_mode != 'server' or portainer_admin_password | length == 0

- name: Write the compose file
  ansible.builtin.template:
    src: "compose.{{ portainer_mode }}.yaml.j2"
    dest: "{{ portainer_dir }}/compose.yaml"
    owner: root
    group: root
    mode: "0644"

- name: Start Portainer
  community.docker.docker_compose_v2:
    project_src: "{{ portainer_dir }}"
    project_name: "{{ portainer_project }}"
    state: present
    pull: missing
    recreate: "{{ 'always' if portainer_env is changed or portainer_admin_password_file is changed else 'auto' }}"
    remove_orphans: true
