---
- name: Restart crowdsec
  ansible.builtin.systemd_service:
    name: crowdsec
    state: restarted

- name: Reload crowdsec
  ansible.builtin.systemd_service:
    name: crowdsec
    state: reloaded

- name: Restart crowdsec-firewall-bouncer
  ansible.builtin.systemd_service:
    name: crowdsec-firewall-bouncer
    state: restarted
    daemon_reload: true
