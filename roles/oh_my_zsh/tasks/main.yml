---
- name: Check the version
  ansible.builtin.assert:
    that: oh_my_zsh_version is string and oh_my_zsh_version is match('^[0-9a-f]{40}$')
    fail_msg: "oh_my_zsh_version must be a full 40-character commit SHA, not '{{ oh_my_zsh_version }}'."
    quiet: true

# The theme name goes into a path in the checkout and into each ~/.zshrc.
- name: Check the theme name
  ansible.builtin.assert:
    that: oh_my_zsh_theme is string and oh_my_zsh_theme is match('^[A-Za-z0-9._-]+\\Z')
    fail_msg: "oh_my_zsh_theme must be a name of letters, digits, '.', '_' and '-', not '{{ oh_my_zsh_theme }}'."
    quiet: true

- name: Check the plugin names
  ansible.builtin.assert:
    that: item is string and item is match('^[A-Za-z0-9._-]+\\Z')
    fail_msg: "oh_my_zsh_plugins: '{{ item }}' is not a name of letters, digits, '.', '_' and '-'."
    quiet: true
  loop: "{{ oh_my_zsh_plugins }}"

- name: Look up the users
  ansible.builtin.command:
    cmd: getent passwd {{ item | quote }}
  loop: "{{ oh_my_zsh_users }}"
  register: oh_my_zsh_passwd
  changed_when: false
  failed_when: false
  check_mode: false

- name: Check that every user exists
  ansible.builtin.assert:
    that: item.rc == 0
    fail_msg: "oh_my_zsh_users: the user '{{ item.item }}' does not exist on this host; create it first."
    quiet: true
  loop: "{{ oh_my_zsh_passwd.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Look at each home
  ansible.builtin.stat:
    path: "{{ item.stdout.split(':')[5] }}"
    get_checksum: false
    get_mime: false
    get_attributes: false
  loop: "{{ oh_my_zsh_passwd.results }}"
  loop_control:
    label: "{{ item.item }}"
  register: oh_my_zsh_homes

# Writing a ~/.zshrc would otherwise create a missing home, owned by root.
- name: Check that every home exists
  ansible.builtin.assert:
    that: item.stat.isdir | default(false)
    fail_msg: >-
      oh_my_zsh_users: the home {{ item.item.stdout.split(':')[5] }} of the user '{{ item.item.item }}'
      does not exist or is not a directory; create it first.
    quiet: true
  loop: "{{ oh_my_zsh_homes.results }}"
  loop_control:
    label: "{{ item.item.item }}"

- name: Install zsh and git
  ansible.builtin.apt:
    name: "{{ oh_my_zsh_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Check Oh My Zsh out at the pinned commit
  ansible.builtin.git:
    repo: "{{ oh_my_zsh_repo }}"
    dest: "{{ oh_my_zsh_dir }}"
    version: "{{ oh_my_zsh_version }}"
    update: true
    force: false
  environment:
    GIT_CONFIG_GLOBAL: /dev/null

# Readable for everyone, writable only by root, whatever the umask of the
# clone was. X keeps the execute bits that git set (git status stays clean).
- name: Make the checkout root's and read-only for everyone else
  ansible.builtin.file:
    path: "{{ oh_my_zsh_dir }}"
    state: directory
    owner: root
    group: root
    mode: "u=rwX,go=rX"
    recurse: true
    follow: false

- name: Install the noix theme
  ansible.builtin.copy:
    src: noix.zsh-theme
    dest: "{{ oh_my_zsh_dir }}/custom/themes/noix.zsh-theme"
    owner: root
    group: root
    mode: "0644"
  when: oh_my_zsh_theme == 'noix' and oh_my_zsh_theme_content | length == 0

- name: Install the theme given in oh_my_zsh_theme_content
  ansible.builtin.copy:
    content: "{{ oh_my_zsh_theme_content }}\n"
    dest: "{{ oh_my_zsh_dir }}/custom/themes/{{ oh_my_zsh_theme }}.zsh-theme"
    owner: root
    group: root
    mode: "0644"
  when: oh_my_zsh_theme_content | length > 0

# The cache in ~/.cache/oh-my-zsh is left to Oh My Zsh, which creates it as
# the user: the home is the user's, and a link there must not make root
# change what it points at.

# As the user, for the same reason: the copy reads and writes only what the
# user could. A link as ~/.zshrc is not copied (its target stays as it is),
# and an existing backup is never overwritten.
- name: Keep a ~/.zshrc that the role did not write
  ansible.builtin.command:
    argv:
      - runuser
      - -u
      - "{{ item.item }}"
      - --
      - /bin/sh
      - -c
      - |
        rc="$1/.zshrc" pre="$1/.zshrc.pre-oh_my_zsh"
        [ -f "$rc" ] && [ ! -L "$rc" ] || exit 0
        [ -e "$pre" ] || [ -L "$pre" ] && exit 0
        IFS= read -r first <"$rc" || true
        case "$first" in "# Managed by noixdev.infra (oh_my_zsh role)."*) exit 0 ;; esac
        cp -p "$rc" "$pre" && echo kept
      - sh
      - "{{ item.stdout.split(':')[5] }}"
  loop: "{{ oh_my_zsh_passwd.results }}"
  loop_control:
    label: "{{ item.item }}"
  register: oh_my_zsh_kept
  changed_when: oh_my_zsh_kept.stdout == 'kept'

- name: Write ~/.zshrc
  ansible.builtin.template:
    src: zshrc.j2
    dest: "{{ item.stdout.split(':')[5] }}/.zshrc"
    owner: "{{ item.item }}"
    group: "{{ item.stdout.split(':')[3] }}"
    mode: "0644"
  loop: "{{ oh_my_zsh_passwd.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Set the login shell to zsh
  ansible.builtin.user:
    name: "{{ item }}"
    shell: "{{ oh_my_zsh_shell }}"
  loop: "{{ oh_my_zsh_users }}"
  when: oh_my_zsh_login_shell | bool
