---
anubis_image: ghcr.io/techarohq/anubis:v1.28.2
# Compose project directory: compose.yaml, policy.yaml and ed25519.key (and
# staged/, where new settings are tried first). The compose project is
# anubis; the service and container are noixdev-anubis, the only DNS name of
# Anubis on its networks: http://noixdev-anubis:8923.
anubis_dir: /opt/anubis

# New settings (policy, anubis_env, image, key) first run in a throwaway
# container without a network; the running Anubis is replaced only when that
# gets healthy, else the run fails and nothing changes.
#
# traefik: the container joins anubis_traefik_network and, once healthy, the
# role writes the Traefik objects to anubis_traefik_dynamic_dir/anubis.yml:
#   anubis@file            the chain to add to a router or an entrypoint:
#                          anubis-strip, anubis-challenge, anubis-check
#   anubis-strip@file      deletes a client-sent X-Original-Uri and
#                          X-Forwarded-Uri (the paths Anubis checks)
#   anubis-challenge@file  turns Anubis's 401 into the challenge page
#   anubis-check@file      forwardAuth to Anubis
#   router anubis-<entrypoint> per anubis_traefik_entrypoints entry, for
#   PathPrefix(`/.within.website/`) at priority 100000, to service anubis
# Same-host mode (anubis_public_url empty): every 401 from behind anubis@file
# (the backend's, the router's own middlewares' such as basicAuth, also on
# ALLOWed paths) reaches the client as the challenge page, without
# WWW-Authenticate and body: routers whose legitimate clients get a 401
# (registries, Basic auth, token APIs, SPAs) must not use it, and an
# entrypoint with such a router must not carry it.
# Redirect mode (anubis_public_url set, see below): no anubis-challenge, so
# the chain is anubis-strip and anubis-check and a 401 passes through
# unchanged; the routers match only the Anubis host,
# Host(`<host of anubis_public_url>`) && PathPrefix(`/.within.website/`),
# and the role's policy no longer carries the anubis-own-paths rule (the
# Anubis host answers its own paths itself).
# nginx mode passes upstream 401s through.
# nginx: the container joins anubis_nginx_network, which the role creates
# (an internal bridge network, so it never becomes a gateway of the nginx
# container that joins it; Anubis has no internet access there), and
# anubis_networks; no Traefik objects (the role's own anubis.yml of traefik
# mode is removed). nginx's auth_request asks http://noixdev-anubis:8923:
# the nginx container joins anubis_nginx_network (the mailcow role does that
# for nginx-mailcow).
# host: for an nginx on the host itself (the nginx role's sites with anubis:
# true). The container publishes 127.0.0.1:anubis_host_port (its 8923) and
# nothing else, joins none of the other modes' networks (only compose's own
# project network, which the published port needs) and writes no Traefik
# objects (the role's own anubis.yml of traefik mode is removed). nginx's
# auth_request asks http://127.0.0.1:<anubis_host_port>.
#
# One mode per host: the container is noixdev-anubis in every mode, and
# anubis_networks applies to nginx mode only, so Traefik routers, an nginx in
# a container (mailcow's) and the host's nginx cannot share one host's Anubis.
anubis_mode: traefik
# The traefik role's network and file provider directory when it set them.
anubis_traefik_network: "{{ traefik_network | default('proxy') }}"
anubis_traefik_dynamic_dir: "{{ traefik_dir | default('/opt/traefik') }}/dynamic"
# Entrypoints that get the /.within.website/ router: every entrypoint with a
# router that uses anubis@file (required in traefik mode; each one of
# traefik_entrypoints when that is set). In redirect mode (anubis_public_url)
# it names the entrypoints that serve the Anubis host instead: such an
# entrypoint must not carry anubis@file (the Anubis host would check itself
# and loop; the role refuses it when traefik_entrypoints is set), while
# routers on other entrypoints may use anubis@file without being listed. With
# traefik_entrypoints defined (as a play or group variable: the role cannot
# see it in another role's vars) the role also refuses, in redirect mode, a
# TCP entrypoint that publishes the port of anubis_public_url (host_port, else
# port; 443 without a port in the URL) and carries anubis@file, listed or not,
# and a list that names none of the entrypoints publishing that port. Without
# one publishing it (a load balancer maps the port) the check passes.
# TLS entrypoints only: Anubis's cookies are Secure, so a browser on plain
# HTTP is challenged on every visit, unless anubis_env sets COOKIE_SECURE:
# "false". The routers have no tls section of their own: the entrypoint must
# set TLS at entrypoint level, as the traefik role does (tls: true), else
# HTTPS requests for /.within.website/ miss them and no challenge can be
# solved.
anubis_traefik_entrypoints: []
# nginx mode: Anubis's own network (created when missing; an existing one
# must be internal) and further existing networks to join. Only containers
# trusted like the nginx container itself may join it: every member reaches
# nginx's listeners there, internal ones included (mailcow's rspamd and auth
# listeners, and 80/443 from a private address whose X-Forwarded-For
# mailcow's nginx believes). Anubis itself never connects to nginx.
anubis_nginx_network: noixdev-anubis
anubis_networks: []
# host mode: the loopback port Anubis is published on (the nginx role's
# nginx_anubis_port).
anubis_host_port: 8923

# Host names pass-challenge may redirect to after a solved challenge, each
# with at least one dot; *.example.com covers its subdomains (a bare * or
# *.* is refused). A host on another port than 80/443 is matched with its
# port (host:8443). Required: every host Anubis protects; on a host missing
# here the challenge shows but pass-challenge answers 400.
anubis_redirect_domains: []

# Redirect mode (traefik mode only). Empty: Anubis answers on the host it
# protects (same-host mode). Set to the Anubis host's own URL,
# https://host[:port] without a path or trailing slash (https only: http://
# is refused, a browser drops Anubis's Secure cookie there and would loop).
# anubis_cookie_domain, the domain the pass cookie is valid for (no port, at
# least one dot; the Anubis host and every anubis_redirect_domains entry lie
# within it), and anubis_private_key are then required, and anubis_env cannot
# set COOKIE_DOMAIN or COOKIE_DYNAMIC_DOMAIN (same-host mode may still set
# COOKIE_DOMAIN there). anubis_cookie_domain without anubis_public_url is
# refused. Limits: the protected apps must be served over HTTPS too, and DNS
# and the certificate of the Anubis host are the operator's job; the role
# creates neither. The Anubis host needs the same address families (A and
# AAAA) as every protected host: Anubis ties the pass cookie to the visitor's
# address, so a dual-stack browser that solves over IPv4 and returns over IPv6
# is challenged again and loops.
anubis_public_url: ""
anubis_cookie_domain: ""

# Leading zeros of the proof of work for every client the policy weighs above
# 0 (browsers get 10 from the default bot list). Unlike Anubis's own default
# thresholds (metarefresh for weight 1-9, difficulty 2 for browsers, more
# above), the role has one tier: weight 0 or less passes, anything above gets
# the proof of work at this difficulty.
anubis_difficulty: 4
# Anubis bot rules before the default bot list, such as
#   - name: api
#     action: ALLOW
#     path_regex: ^/api/
# A path_regex is matched against the request path AND Anubis's own check
# path /.within.website/x/cmd/anubis/api/check: a rule that matches that path
# (such as .* or ^/\.within) lets every request through.
anubis_policy_allow: []
# Anubis's impressum block: {footer: HTML, page: {title: ..., body: HTML}}.
anubis_impressum: {}

# 64 hex digits (ed25519 seed). Empty: the role generates one on the host
# once and keeps it (also a key written from this variable earlier), so
# cookies survive restarts. A new key ends every issued cookie. Required with
# anubis_public_url: servers that share a cookie domain must share the key.
anubis_private_key: ""

# Extra container environment (such as COOKIE_SECURE or SLOG_LEVEL). It
# cannot set BIND, METRICS_BIND, TARGET, PUBLIC_URL, REDIRECT_DOMAINS,
# DIFFICULTY, ED25519_PRIVATE_KEY_HEX(_FILE) or HS512_SECRET, and in
# redirect mode (anubis_public_url) not COOKIE_DOMAIN or COOKIE_DYNAMIC_DOMAIN
# either; same-host mode may set COOKIE_DOMAIN. Names without
# = or whitespace, values without line breaks. The values are written to
# compose.yaml (mode 0600) and to a 0600 env file for the check container,
# never to the command line or the log; a secret here belongs in a vault.
anubis_env: {}
anubis_cpus: "0.5"
anubis_memory: 256M
# Seconds to wait for the container's health check after a start.
anubis_health_timeout: 60
