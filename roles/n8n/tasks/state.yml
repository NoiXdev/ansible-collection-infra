---
# Reads the host and sets n8n_state:
#   install      no compose file
#   update       n8n_version is newer than the installed version
#   reconfigure  the compose file the role writes differs from the one on
#                disk (another n8n_workers among it: queue mode, Valkey and
#                the workers are services of the compose file)
#   noop         everything as the role writes it
#   restore_interrupted
#                an update that did not finish (n8n_update_marker, step
#                update) and n8n_restore_interrupted: main.yml restores its
#                backup and does nothing else
# Also sets n8n_installed (a compose file exists), n8n_compose_before (the
# compose file on disk, which a rollback puts back), n8n_compose_on_disk (it
# parsed, which n8n_installed_version reads), n8n_marker_read and n8n_marker
# (the marker of a failed update), n8n_update_in_progress (the marker of an
# update that did not finish parsed, empty without one),
# n8n_owner_password_hash (the owner's bcrypt hash, which the compose file
# holds; not made for a restore of an interrupted update, which writes no
# compose file of its own), n8n_data_present (the
# subdirectories of n8n_data_subdirs that exist) and n8n_down (the expected
# services that are not running). Refuses, before any change: first an
# n8n_data_dir that is not a mountpoint (with n8n_data_dir_mountpoint) and an
# installation without its data subdirectories (an unmounted volume); then a
# marker of a failed update (one of a failed rollback refuses every version,
# one of a rollback that worked the failed version), then a compose file that
# is not YAML, an install that did not complete (its marker), an update that
# did not finish (n8n_update_marker with step update, read into
# n8n_update_in_progress; without n8n_restore_interrupted, or with it but
# without the copy of the compose file or the dump), a marker of it the role
# did not write, n8n_restore_interrupted without an update to restore, a
# compose file without an n8n version, a downgrade (not for a restore), an
# encryption key whose sha256 is not
# the installation's fingerprint (or no fingerprint), an n8n_db_password
# that the database does not take, and a PostgreSQL major other than the
# database's. The only changes it can make are pulling the pinned n8n image on
# a host without an n8n container, which the owner's hash is made with, and
# removing what an interrupted update left that nothing needs: a marker of an
# update in progress beside update-failed (the rollback ran), and, after every
# refusal, the partial backup and the marker of an update stopped during its
# backup (the compose file is as before it), or the copy of a marker that was
# removed by hand.

# A block volume that is not mounted leaves its mountpoint as an empty
# directory on the root filesystem; an install there would put the data
# beside the volume.
- name: Check that the data directory is a mountpoint
  ansible.builtin.command:
    argv: [mountpoint, -q, "{{ n8n_data_dir }}"]
  register: n8n_data_dir_mounted
  changed_when: false
  failed_when: false
  when: n8n_data_dir_mountpoint | bool

- name: Refuse a data directory that is not a mountpoint
  ansible.builtin.fail:
    msg: >-
      n8n_data_dir_mountpoint is on, but {{ n8n_data_dir }} is not a
      mountpoint: is the volume mounted? The role changes nothing. Mount the
      volume at {{ n8n_data_dir }}, then run the role again.
  when:
    - n8n_data_dir_mountpoint | bool
    - n8n_data_dir_mounted.rc != 0

- name: Read the compose file
  ansible.builtin.slurp:
    src: "{{ n8n_compose_file }}"
  register: n8n_compose_read
  failed_when: false
  # It holds the encryption key and the passwords.
  no_log: true

- name: Look for the data subdirectories
  ansible.builtin.stat:
    path: "{{ n8n_data_dir }}/{{ item }}"
    get_checksum: false
  loop: "{{ n8n_data_subdirs }}"
  register: n8n_subdirs_stat

- name: Note what is on the host
  ansible.builtin.set_fact:
    n8n_compose_before: "{{ n8n_compose_read.content | default('') | b64decode }}"
    n8n_installed: "{{ n8n_compose_read.content is defined }}"
    n8n_data_present: >-
      {{ n8n_subdirs_stat.results | selectattr('stat.exists') | map(attribute='item') | list }}
  no_log: true

# Only install creates the subdirectories, and the containers do not create a
# missing one, so their absence beside a compose file is data that is not
# there (an unmounted volume), never a state to repair. Before every other
# refusal, the marker of a failed update among them: on every path the
# role would start n8n on an empty volume or fail on it.
- name: Refuse an installation without its data
  ansible.builtin.fail:
    msg: >-
      n8n is installed in {{ n8n_dir }} ({{ n8n_compose_file }}), but
      {{ n8n_data_dir }} lacks {{ n8n_data_missing | join(', ') }}: is the
      volume mounted? The role changes nothing and creates none of them.
      Mount the volume (or put the data back) at {{ n8n_data_dir }}, then run
      the role again.
  vars:
    # In the order of n8n_data_subdirs, which difference does not keep.
    n8n_data_missing: "{{ n8n_data_subdirs | reject('in', n8n_data_present) | list }}"
  when:
    - n8n_installed
    - n8n_data_missing | length > 0

# Written by update.yml after a failed update; it names the failed version.
- name: Read the marker of a failed update
  ansible.builtin.slurp:
    src: "{{ n8n_marker_file }}"
  register: n8n_marker_read
  failed_when: false

# Left by a run that stopped during an update (update.yml). Not secret: the
# versions, the step, the backup and the time.
- name: Read the marker of an update in progress
  ansible.builtin.slurp:
    src: "{{ n8n_update_marker }}"
  register: n8n_update_marker_read
  failed_when: false

# Beside update-failed, the rescue of the update wrote that marker and was
# stopped before it removed this one: the rollback ran, and update-failed
# decides below.
- name: Remove the marker of an update in progress beside a failed update
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ n8n_update_marker_files }}"
  when:
    - n8n_update_marker_read.content is defined
    - n8n_marker_read.content is defined

- name: Note that no update is in progress
  ansible.builtin.set_fact:
    n8n_update_in_progress: {}

# A marker that is not YAML parses to nothing and is refused below. It holds
# no secret: the copy of the compose file is never read here.
- name: Check the marker of an update in progress
  when:
    - n8n_update_marker_read.content is defined
    - n8n_marker_read.content is not defined
  block:
    - name: Parse the marker of the update in progress
      ansible.builtin.set_fact:
        n8n_update_in_progress: "{{ n8n_update_marker_yaml if n8n_update_marker_yaml is mapping else {'step': none} }}"
      vars:
        n8n_update_marker_yaml: "{{ n8n_update_marker_read.content | b64decode | from_yaml }}"
  rescue:
    - name: Note a marker that is not YAML
      ansible.builtin.set_fact:
        n8n_update_in_progress: {step: null}

# A marker that is not YAML cannot say which version failed.
- name: Check the marker of a failed update
  when: n8n_marker_read.content is defined
  block:
    - name: Parse the marker
      ansible.builtin.set_fact:
        n8n_marker: "{{ n8n_marker_yaml if n8n_marker_yaml is mapping else {} }}"
      vars:
        n8n_marker_yaml: "{{ n8n_marker_read.content | b64decode | from_yaml }}"
  rescue:
    - name: Fail on a marker that is not YAML
      ansible.builtin.fail:
        msg: >-
          {{ n8n_marker_file }} exists, but it is not YAML, so the role cannot
          tell which n8n update failed and changes nothing. Check n8n, then
          remove the file (rm {{ n8n_marker_file }}).

# The rollback failed (or the marker does not say it worked): the database
# may be empty or half restored, and the backup holds the data. Any version
# would take a backup of that database, come up healthy and remove the
# marker, the last pointer to the real backup, so every version is refused,
# before every other refusal: a rollback that failed before it put the
# previous compose file back leaves the failed version in it, and an older
# pin must hear this, not the downgrade refusal.
- name: Refuse every version after a failed rollback
  ansible.builtin.fail:
    msg: >-
      {{ n8n_marker_file }} exists: the n8n update to
      {{ n8n_marker.failed_version | default('?') }} failed on
      {{ n8n_marker.time | default('?') }}, and rolling back failed too
      ({{ n8n_marker.restore_error | default('?') }}). The database may be
      empty or half restored; the data is in the backup {{ n8n_backup }}.
      The role refuses every version and changes nothing until n8n is
      restored. {{ n8n_restore_hint }} Then check n8n (its workflows and
      credentials) and remove the marker (rm {{ n8n_marker_file }}).
  vars:
    n8n_backup: "{{ n8n_marker.backup | default('?', true) }}"
  when:
    - n8n_marker_read.content is defined
    - not n8n_marker.rolled_back_to | default(none)

# A marker that names no version blocks every version.
- name: Refuse the version of a failed update
  ansible.builtin.fail:
    msg: >-
      {{ n8n_marker_file }} exists: the n8n update to {{ n8n_version }}
      failed on {{ n8n_marker.time | default('?') }} (rolled back to
      {{ n8n_marker.rolled_back_to }}; backup
      {{ n8n_marker.backup | default('?') }}). The role does not try
      {{ n8n_version }} again and changes nothing while the marker names it.
      To try again, remove it (rm {{ n8n_marker_file }}); or set n8n_version
      to another version, and the marker is removed once a run with it
      succeeds.
  when:
    - n8n_marker_read.content is defined
    - (n8n_marker.failed_version | default(n8n_version) | string) == n8n_version | string

# Once, in a no_log task: an error of the YAML parser can quote a line of the
# file, which holds the encryption key and the passwords, so a file that is
# not YAML gets a message of its own without the error. One that is YAML but
# not a mapping parses as empty and names no version, which is refused below.
- name: Check that the compose file is YAML
  block:
    - name: Parse the compose file
      ansible.builtin.set_fact:
        n8n_compose_on_disk: "{{ n8n_compose_parsed if n8n_compose_parsed is mapping else {} }}"
      vars:
        n8n_compose_parsed: "{{ (n8n_compose_before or '{}') | from_yaml }}"
      no_log: true
  rescue:
    - name: Fail on a compose file that is not YAML
      ansible.builtin.fail:
        msg: >-
          {{ n8n_compose_file }} is not YAML, so the role cannot tell what is
          installed and changes nothing. The parser's error is not shown: it
          can quote a line of the file, which holds the encryption key and
          the passwords. Put back the compose file the role wrote (docker
          compose config --quiet in {{ n8n_dir }} shows the error).

- name: Look for the marker of an install in progress
  ansible.builtin.stat:
    path: "{{ n8n_install_marker }}"
    get_checksum: false
  register: n8n_install_marker_stat

- name: Refuse an install that did not complete
  ansible.builtin.fail:
    msg: >-
      {{ n8n_install_marker }} exists: an install of n8n in {{ n8n_dir }} did
      not complete, so the database may be half made. The role changes
      nothing. {{ n8n_install_hint }}
  when: n8n_install_marker_stat.stat.exists

- name: Refuse a marker of an update in progress the role did not write
  ansible.builtin.fail:
    msg: >-
      {{ n8n_update_marker }} exists, but it is not YAML or lacks step or
      to_version (or, with step update, backup), so the role cannot tell how
      far the n8n update in {{ n8n_dir }} got and changes nothing. Check n8n,
      then remove it with its copy (rm
      {{ n8n_update_marker_files | join(' ') }}).
  when:
    - n8n_update_in_progress | length > 0
    - >-
      n8n_update_in_progress.step | default(none) not in ['backup', 'update']
      or not n8n_update_in_progress.to_version | default('', true) | string is match('^\d+\.\d+\.\d+$')
      or (n8n_update_in_progress.step == 'update'
          and not n8n_update_in_progress.backup | default('', true) | string is match('^/'))

# Step update: the compose file may name the new version, the database may be
# migrated or half migrated, and n8n may run either version or neither.
# Rolling back on its own would lose what changed since, if the update had in
# fact finished and only the marker's removal was lost; the operator decides.
- name: Refuse to run after an interrupted update
  ansible.builtin.fail:
    msg: >-
      {{ n8n_update_marker }} exists: the n8n update from
      {{ n8n_update_in_progress.from_version | default('?') }} to
      {{ n8n_update_in_progress.to_version }} did not finish (the run that
      started it on {{ n8n_update_in_progress.time | default('?') }}
      stopped after its backup), and the backup from before it is
      {{ n8n_update_in_progress.backup }}. n8n in {{ n8n_dir }}
      may run either version or neither, with a database the new version may
      have migrated; the role changes nothing. To go back to
      {{ n8n_update_in_progress.from_version | default('?') }},
      set n8n_restore_interrupted: true for one run to restore it (the
      compose file from before the update, and the database and the n8n home
      from the backup), or remove {{ n8n_update_marker }} to keep n8n as it
      is now, then check it and run the role again.
  when:
    - n8n_update_in_progress.step | default(none) == 'update'
    - not n8n_restore_interrupted | bool

- name: Look for what the restore of the interrupted update needs
  ansible.builtin.stat:
    path: "{{ item }}"
    get_checksum: false
  loop:
    - "{{ n8n_update_marker_compose }}"
    - "{{ n8n_update_in_progress.backup | default('') }}/n8n.dump"
  register: n8n_restore_needs
  when:
    - n8n_update_in_progress.step | default(none) == 'update'
    - n8n_restore_interrupted | bool

- name: Refuse a restore without the copy of the compose file or the dump
  ansible.builtin.fail:
    msg: >-
      n8n_restore_interrupted is set to restore the backup
      {{ n8n_update_in_progress.backup }} of the interrupted n8n update
      from {{ n8n_update_in_progress.from_version | default('?') }} to
      {{ n8n_update_in_progress.to_version }}, but
      {{ n8n_restore_missing | join(' and ') }}
      {{ 'is' if n8n_restore_missing | length == 1 else 'are' }} missing,
      so the role cannot restore it and changes nothing.
      {{ n8n_restore_hint }} Then remove {{ n8n_update_marker }} and
      run the role again without the variable.
  vars:
    n8n_backup: "{{ n8n_update_in_progress.backup }}"
    n8n_restore_missing: >-
      {{ n8n_restore_needs.results | rejectattr('stat.exists') | map(attribute='item') | list }}
  when:
    - n8n_update_in_progress.step | default(none) == 'update'
    - n8n_restore_interrupted | bool
    - n8n_restore_missing | length > 0

# A variable left set must never turn a later interruption into a rollback
# of its own. An update stopped during its backup changed nothing to restore.
- name: Refuse n8n_restore_interrupted without an interrupted update
  ansible.builtin.fail:
    msg: >-
      n8n_restore_interrupted is set, but there is no interrupted update in
      {{ n8n_dir }}; remove the variable{{ (' (' ~ n8n_update_marker
      ~ ' records an update that stopped during its backup, before anything changed;'
      ~ ' the next run without the variable cleans it up and updates)')
      if n8n_update_in_progress.step | default(none) == 'backup' else '' }}.
  when:
    - n8n_restore_interrupted | bool
    - n8n_update_in_progress.step | default(none) != 'update'

- name: Check the installed version
  when: n8n_installed
  block:
    - name: Check that the compose file names the n8n version
      ansible.builtin.assert:
        that: n8n_installed_version is match('^\d+\.\d+\.\d+$')
        fail_msg: >-
          The n8n image in {{ n8n_compose_file }} has no tag X.Y.Z, so the
          role cannot tell which n8n version is installed and changes
          nothing. Put back the compose file the role wrote.
        quiet: true

    # n8n cannot migrate its database down.
    - name: Refuse a downgrade
      ansible.builtin.fail:
        msg: >-
          n8n_version {{ n8n_version }} is lower than the installed version
          {{ n8n_installed_version }} in {{ n8n_dir }}; the role refuses to
          downgrade, n8n cannot migrate its database down, and changes
          nothing. Set n8n_version to {{ n8n_installed_version }} or newer.
      # A restore puts the previous compose file back, whatever n8n_version is.
      when:
        - n8n_version is version(n8n_installed_version, '<')
        - n8n_update_in_progress.step | default(none) != 'update'

# n8n encrypts the credentials in the database with the key: with another
# one it cannot decrypt them, and the next start can make that permanent.
# install.yml records the key's sha256; an installation without the record
# (lost, or made by hand) is refused too, as the role could not tell a
# changed key. The record is root's only and the comparison no_log: a plain
# hash of the key is a quick test of a guessed key.
- name: Check the encryption key
  when: n8n_installed
  block:
    - name: Look for the fingerprint of the encryption key
      ansible.builtin.stat:
        path: "{{ n8n_key_fingerprint_file }}"
        get_checksum: false
      register: n8n_fingerprint_stat

    - name: Refuse an installation without the fingerprint of its key
      ansible.builtin.fail:
        msg: >-
          {{ n8n_key_fingerprint_file }} does not exist, but n8n is installed
          in {{ n8n_dir }}. The role records there the fingerprint (sha256) of
          the encryption key the installation was made with; without it, it
          cannot tell whether n8n_encryption_key is that key, and with another
          key n8n could not decrypt the credentials. The role changes nothing
          and does not write the fingerprint itself. Write it from the key
          the running n8n uses: in {{ n8n_dir }} run (umask 077; docker
          compose exec -T n8n sh -c 'printf %s "$N8N_ENCRYPTION_KEY" |
          sha256sum' | cut -d' ' -f1 >{{ n8n_key_fingerprint_file }}), then
          run the role again; it then refuses an n8n_encryption_key that is
          not that key.
      when: not n8n_fingerprint_stat.stat.exists

    - name: Read the fingerprint of the encryption key
      ansible.builtin.slurp:
        src: "{{ n8n_key_fingerprint_file }}"
      register: n8n_fingerprint_read
      no_log: true

    - name: Compare n8n_encryption_key with the fingerprint
      ansible.builtin.set_fact:
        n8n_key_matches: >-
          {{ n8n_fingerprint_read.content | b64decode | trim == n8n_encryption_key | string | hash('sha256') }}
      no_log: true

    - name: Refuse another encryption key
      ansible.builtin.fail:
        msg: >-
          n8n_encryption_key is not the key of the installation in
          {{ n8n_dir }}: its sha256 differs from the fingerprint in
          {{ n8n_key_fingerprint_file }}, which the install wrote. n8n
          encrypts the credentials in the database with the key, so with
          another one it could not decrypt them; the role does not change the
          key of an installation and changes nothing. Set n8n_encryption_key
          back to the installation's key (docker compose exec n8n printenv
          N8N_ENCRYPTION_KEY in {{ n8n_dir }} shows it).
      when: not n8n_key_matches | bool

# PostgreSQL takes POSTGRES_PASSWORD only when it creates the cluster: on an
# existing one a new n8n_db_password would reach n8n but not the database,
# and n8n could not connect. The compose file on disk records the password
# the role wrote last (with $ doubled, as the template writes it); compared
# in a no_log task, so that neither password is in the output.
- name: Compare n8n_db_password with the compose file
  ansible.builtin.set_fact:
    n8n_db_password_changed: >-
      {{ (((n8n_compose_on_disk.services | default({})).db | default({})).environment | default({})).POSTGRES_PASSWORD
         | default('') | string | replace('$$', '$') != n8n_db_password | string }}
  no_log: true
  when: n8n_installed

# A new password may be the database's already, set by hand as the refusal
# below says. Asked over the network as n8n connects (the local socket and
# 127.0.0.1 need no password); the password goes through stdin into the
# environment of psql (the x keeps trailing newlines), and the task is
# no_log. The next task fails with the error.
- name: Check that the database takes the new n8n_db_password
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - exec
      - -T
      - db
      - sh
      - -c
      - >-
        PGPASSWORD="$(cat; echo x)"; PGPASSWORD="${PGPASSWORD%x}"; export PGPASSWORD;
        PGCONNECT_TIMEOUT=10 exec psql --host=db --username=n8n --dbname=n8n
        --no-psqlrc --tuples-only --command='SELECT 1'
    chdir: "{{ n8n_dir }}"
    stdin: "{{ n8n_db_password }}"
    stdin_add_newline: false
  register: n8n_hidden
  changed_when: false
  failed_when: false
  no_log: true
  when:
    - n8n_installed
    - n8n_db_password_changed | bool

- name: Refuse an n8n_db_password the database does not take
  ansible.builtin.fail:
    msg: >-
      n8n_db_password differs from the password in {{ n8n_compose_file }},
      and the database does not take it ({{ n8n_hidden_error }}). PostgreSQL
      takes a password only when it creates the database, so n8n could not
      connect with the new one; the role changes nothing. To change the
      password, set it in the database first: in {{ n8n_dir }} run docker
      compose exec db psql -U n8n -d postgres and enter \password n8n (an
      ALTER USER n8n PASSWORD that keeps the password off the command line),
      then run the role again with the new n8n_db_password. Or set
      n8n_db_password back to the old one.
  when:
    - n8n_installed
    - n8n_db_password_changed | bool
    - n8n_hidden.rc != 0

# The PostgreSQL image keeps its cluster in a directory per major below the
# mount (18/docker; main.yml refuses images older than 18): another major
# starts an empty cluster or none at all, so the one cluster's PG_VERSION must
# name the major of n8n_postgres_image. More than one cluster (an old one left
# by pg_upgrade) is refused: which one is current cannot be told, and a stale
# one would start with old data. Up to three levels deep, above the
# PG_VERSION files of the databases inside a cluster.
- name: Look for the PostgreSQL cluster
  ansible.builtin.find:
    paths: "{{ n8n_data_dir }}/postgres"
    patterns: [PG_VERSION]
    file_type: file
    recurse: true
    depth: 3
  register: n8n_pg_version_files
  when: n8n_installed

- name: Read the PostgreSQL major of the cluster
  ansible.builtin.slurp:
    src: "{{ item }}"
  loop: "{{ n8n_pg_version_files.files | default([]) | map(attribute='path') | sort }}"
  register: n8n_pg_version_read

- name: Refuse more than one PostgreSQL cluster
  ansible.builtin.fail:
    msg: >-
      {{ n8n_data_dir }}/postgres holds more than one PostgreSQL cluster:
      {{ n8n_pg_clusters | join(', ') }}. The role cannot tell which one n8n
      uses (an old one left by pg_upgrade would start with old data) and
      changes nothing. Move every cluster but the current one out of
      {{ n8n_data_dir }}/postgres, then run the role again.
  vars:
    n8n_pg_clusters: >-
      {%- set found = [] -%}
      {%- for read in n8n_pg_version_read.results -%}
      {%-   set _ = found.append(read.item ~ ' (PostgreSQL ' ~ (read.content | b64decode | trim) ~ ')') -%}
      {%- endfor -%}
      {{ found }}
  when: n8n_pg_version_read.results | length > 1

- name: Refuse another PostgreSQL major
  ansible.builtin.fail:
    msg: >-
      n8n_postgres_image {{ n8n_postgres_image }} is PostgreSQL
      {{ n8n_postgres_major }}, but the database in
      {{ n8n_data_dir }}/postgres is PostgreSQL {{ n8n_pg_major }}
      ({{ n8n_pg_version_read.results[0].item }}). A new major does not read
      the old cluster; the role changes nothing. Set n8n_postgres_image back
      to PostgreSQL {{ n8n_pg_major }}, or upgrade the cluster (pg_upgrade,
      or a dump restored into the new major) first.
  vars:
    n8n_pg_major: "{{ n8n_pg_version_read.results[0].content | b64decode | trim }}"
  when:
    - n8n_pg_version_read.results | length == 1
    - n8n_postgres_major != n8n_pg_major

# A restore of an interrupted update writes the compose file of its copy, not
# this run's, so it needs no hash (and the n8n container may be one of the
# interrupted update's that cannot make it).
- name: Prepare the owner's password hash
  when: n8n_update_in_progress.step | default(none) != 'update'
  block:
    # The owner's hash is made in an n8n image (n8n_owner_hash_script): the one
    # the installed n8n container runs, which is on the host and known to work,
    # so that an update makes it before anything changes (update.yml checks the
    # new image once it runs). Without a container (a fresh install), the pinned
    # image, pulled when the host lacks it. bcrypt with the same salt gives the
    # same hash in either.
    - name: Find the n8n container
      ansible.builtin.command:
        argv:
          - docker
          - ps
          - --all
          - --quiet
          - --filter
          - label=com.docker.compose.project={{ n8n_project }}
          - --filter
          - label=com.docker.compose.service=n8n
      register: n8n_container
      changed_when: false
      when: n8n_installed

    - name: Read the image of the n8n container
      ansible.builtin.command:
        argv: [docker, inspect, --format, "{{ '{{.Image}}' }}", "{{ n8n_container.stdout_lines | first }}"]
      register: n8n_container_image
      changed_when: false
      when: n8n_container.stdout_lines | default([]) | length > 0

    - name: Note the image the owner's hash is made in
      ansible.builtin.set_fact:
        n8n_hash_image: >-
          {{ n8n_container_image.stdout
             if n8n_container_image.stdout | default('') | length > 0
             else n8n_image ~ ':' ~ n8n_version }}

    - name: Look for the n8n image
      ansible.builtin.command:
        argv: [docker, image, inspect, --format, "{{ '{{.Id}}' }}", "{{ n8n_hash_image }}"]
      register: n8n_image_inspect
      changed_when: false
      failed_when: false

    - name: Pull the n8n image
      ansible.builtin.command:
        argv: [docker, pull, --quiet, "{{ n8n_hash_image }}"]
      changed_when: true
      when: n8n_image_inspect.rc != 0

    # The key and the password go through stdin, never a command line, and the
    # task is no_log; the container has no network. The next task fails with the
    # error.
    - name: Make the owner's password hash
      ansible.builtin.command:
        argv:
          - docker
          - run
          - --rm
          - --interactive
          - --pull=never
          - --network=none
          - --entrypoint=node
          - "{{ n8n_hash_image }}"
          - --eval
          - "{{ n8n_owner_hash_script }}"
        stdin: "{{ {'key': n8n_encryption_key | string, 'password': n8n_owner_password | string} | to_json }}"
        stdin_add_newline: false
      register: n8n_hidden
      changed_when: false
      failed_when: false
      no_log: true

    - name: Fail when the owner's password hash was not made
      ansible.builtin.fail:
        msg: >-
          The owner's password hash could not be made in {{ n8n_hash_image }}
          ({{ n8n_hidden_error }}). The role changes nothing.
      when: n8n_hidden.rc != 0 or n8n_hidden.stdout is not match('^\$2b\$10\$[./A-Za-z0-9]{53}$')

    - name: Note the owner's password hash
      ansible.builtin.set_fact:
        n8n_owner_password_hash: "{{ n8n_hidden.stdout }}"
      no_log: true

- name: Read the services that run
  ansible.builtin.command:
    argv: [docker, compose, ps, --format, "{{ '{{.Service}}' }}", --status, running]
    chdir: "{{ n8n_dir }}"
  register: n8n_ps
  changed_when: false
  when: n8n_installed

# After every refusal. Step backup: the compose file and the database are as
# before the update, and n8n and its workers stopped; the run goes on as any
# other, which with the same n8n_version tries the update again and starts
# the stack (a run without changes fails on the stopped containers, as it
# does for any). A backup being made is below <name>.partial, which only an
# interrupted backup leaves.
- name: Find the partial backups of an update stopped during its backup
  ansible.builtin.find:
    paths: "{{ n8n_backup_dir }}"
    file_type: directory
    patterns: ['^\d{8}T\d{6}Z-\d+\.\d+\.\d+\.partial$']
    use_regex: true
  register: n8n_partial_backups
  when: n8n_update_in_progress.step | default(none) == 'backup'

- name: Remove what an update stopped during its backup left
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ (n8n_partial_backups.files | default([]) | map(attribute='path') | sort) + n8n_update_marker_files }}"
  when: n8n_update_in_progress.step | default(none) == 'backup'

# It holds the secrets: left when the marker was removed by hand, as its
# refusal offers.
- name: Remove the copy of an update in progress without its marker
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ n8n_update_marker_files | difference([n8n_update_marker]) }}"
  when: n8n_update_marker_read.content is not defined

- name: Decide what to do
  ansible.builtin.set_fact:
    n8n_down: "{{ n8n_services | difference(n8n_ps.stdout_lines | default([])) }}"
    n8n_state: >-
      {{ 'restore_interrupted' if n8n_update_in_progress.step | default(none) == 'update'
         else 'install' if not n8n_installed
         else 'update' if n8n_version is version(n8n_installed_version, '>')
         else 'reconfigure' if n8n_compose_before != n8n_compose
         else 'noop' }}
  no_log: true
