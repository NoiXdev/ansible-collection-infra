---
argument_specs:
  main:
    short_description: Node.js from NodeSource, with pinned global npm packages
    description:
      - >-
        Installs the nodejs package of one major series from the NodeSource apt repository,
        pinned to that series; the distro's nodejs is never installed.
      - >-
        A nodejs of another series that is installed already (the distro's, for example)
        is refused before any change; a series change is a separate, deliberate step.
    options:
      nodejs_version:
        type: str
        description: Major series to install, for example "24".
      nodejs_npm_packages:
        type: list
        elements: dict
        description: Global npm packages, each pinned to an exact version.
        options:
          name:
            type: str
            required: true
            description: npm package name.
          version:
            type: str
            required: true
            description: Exact version (x.y.z); a range or a tag such as latest is refused.
      nodejs_apt_url:
        type: str
        description: NodeSource repository URL of the series.
      nodejs_apt_suite:
        type: str
        description: Suite of the repository (NodeSource uses nodistro).
      nodejs_apt_key_url:
        type: str
        description: Where the repository key is downloaded from.
      nodejs_apt_key_fingerprint:
        type: str
        description: Fingerprint the key must carry; any other key is removed and the run fails.
