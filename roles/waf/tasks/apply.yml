---
# After the checks: render the new files next to the running ones, try them
# in a throwaway container (nginx -t, no network), put them in place, start
# or reload the WAF and wait until it serves them; Traefik's waf.yml comes
# last (written in traefik mode, removed in host mode). A failed try leaves
# the running WAF, its files and waf.yml unchanged. The plugins' archives
# come first: a refusal of one changes nothing but the plugin cache.
- name: Fetch and check the plugins
  ansible.builtin.import_tasks: plugins.yml

- name: Create the waf directory
  ansible.builtin.file:
    path: "{{ waf_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create the directory for new settings
  ansible.builtin.file:
    path: "{{ waf_staged_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

# The plugins' files, next to the other settings.
- name: Create the directories for the plugins' files
  ansible.builtin.file:
    path: "{{ item }}/plugins"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: ["{{ waf_staged_dir }}", "{{ waf_dir }}"]

# The WAF's user writes request bodies there; nobody else reads them.
- name: Create the spool directory
  ansible.builtin.file:
    path: "{{ waf_spool_dir }}"
    state: directory
    owner: "{{ waf_uid }}"
    group: "{{ waf_uid }}"
    mode: "0700"

# A checksum of both nginx files (nginx.conf without the id itself) and the
# plugins' files, each led by its name and kind (modsecurity.conf names
# them), which the health check server answers: after a reload the role
# waits until nginx serves it.
- name: Note the id of the new settings
  ansible.builtin.set_fact:
    waf_config_id: >-
      {%- set plugin_text = [] -%}
      {%- for file in waf_plugin_files -%}
      {%- set _ = plugin_text.append(file.name ~ '-' ~ file.kind ~ ':\n' ~ file.content) -%}
      {%- endfor -%}
      {{ (lookup('ansible.builtin.template', 'nginx.conf.j2', template_vars={'waf_config_id': ''})
          ~ lookup('ansible.builtin.template', 'modsecurity.conf.j2')
          ~ plugin_text | join('\n----\n')) | hash('sha256') }}

- name: Render the new settings
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ waf_staged_dir }}/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ waf_files }}"
  register: waf_render

- name: Stage the plugins' files
  ansible.builtin.copy:
    content: "{{ item.content }}"
    dest: "{{ waf_staged_dir }}/plugins/{{ item.name }}-{{ item.kind }}.conf"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ waf_plugin_files }}"
  loop_control:
    label: "{{ item.name }}-{{ item.kind }}.conf"
  register: waf_plugin_stage

# A plugin's files, staged or in place, that no plugin of waf_plugin_files
# has any more (a plugin removed from waf_plugins, or a kind it dropped). In
# check mode the files of a plugin whose archive is not in the cache stay.
- name: Find the plugin files staged and in place
  ansible.builtin.find:
    paths: ["{{ waf_staged_dir }}/plugins", "{{ waf_dir }}/plugins"]
    file_type: any
    hidden: true
  register: waf_plugin_present

- name: Note the plugin files of no plugin
  ansible.builtin.set_fact:
    waf_plugin_strays: >-
      {%- set strays = {waf_staged_dir: [], waf_dir: []} -%}
      {%- set keep = waf_plugin_paths | list -%}
      {%- for name in waf_plugin_pending -%}
      {%- for kind in waf_plugin_kinds -%}
      {%- set _ = keep.append('plugins/' ~ name ~ '-' ~ kind ~ '.conf') -%}
      {%- endfor -%}
      {%- endfor -%}
      {%- for file in waf_plugin_present.files -%}
      {%- set base = file.path | dirname | dirname -%}
      {%- if base in strays and 'plugins/' ~ file.path | basename not in keep -%}
      {%- set _ = strays[base].append(file.path) -%}
      {%- endif -%}
      {%- endfor -%}
      {{ strays }}

- name: Remove the staged plugin files of no plugin
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ waf_plugin_strays[waf_staged_dir] }}"
  register: waf_plugin_unstage

- name: Read the new settings' checksums
  ansible.builtin.stat:
    path: "{{ waf_staged_dir }}/{{ item }}"
    get_attributes: false
    get_mime: false
  loop: "{{ waf_files + waf_plugin_paths }}"
  register: waf_staged_stat

- name: Read the running settings' checksums
  ansible.builtin.stat:
    path: "{{ waf_dir }}/{{ item }}"
    get_attributes: false
    get_mime: false
  loop: "{{ waf_files + waf_plugin_paths }}"
  register: waf_running_stat

- name: Note the plugin files in place of no plugin
  ansible.builtin.set_fact:
    waf_plugin_stale: "{{ waf_plugin_strays[waf_dir] }}"

# In check mode the new settings are not written: a rendering that would
# change them is the change, and so is a plugin archive not yet downloaded.
- name: Note whether the settings change
  ansible.builtin.set_fact:
    waf_settings_change: >-
      {{ (waf_render is changed or waf_plugin_stage is changed or waf_plugin_unstage is changed
          or waf_plugin_stale | length > 0 or waf_plugin_pending | length > 0) if ansible_check_mode else
         (waf_staged_stat.results | map(attribute='stat') | map(attribute='checksum', default='') | list
          != waf_running_stat.results | map(attribute='stat') | map(attribute='checksum', default='') | list
          or waf_plugin_stale | length > 0) }}

- name: Try the new settings in a check container
  when: waf_settings_change
  block:
    - name: Remove a leftover check container
      ansible.builtin.command:
        argv: [docker, rm, --force, "{{ waf_check_name }}"]
      changed_when: false
      failed_when: false

    # As the WAF runs, but without a network: nginx -t parses both files and
    # the Core Rule Set of the (new) image.
    - name: Test the new settings
      ansible.builtin.command:
        argv:
          - docker
          - run
          - --rm
          - --name
          - "{{ waf_check_name }}"
          - --network
          - none
          - --read-only
          - --tmpfs
          - "/tmp:size={{ waf_tmp_size }}"
          - --tmpfs
          - "{{ waf_spool_mount }}:uid={{ waf_uid }},gid={{ waf_uid }},mode=0700"
          - --cap-drop
          - ALL
          - --security-opt
          - no-new-privileges:true
          - --user
          - "{{ waf_uid }}:{{ waf_uid }}"
          - --memory
          - "{{ waf_memory }}"
          - --cpus
          - "{{ waf_cpus }}"
          - --volume
          - "{{ waf_staged_dir }}:{{ waf_conf_dir }}:ro"
          - --entrypoint
          - nginx
          - "{{ waf_image }}"
          - -t
      register: waf_check
      changed_when: false
      failed_when: false
  always:
    - name: Remove the check container
      ansible.builtin.command:
        argv: [docker, rm, --force, "{{ waf_check_name }}"]
      changed_when: false
      failed_when: false

- name: Fail when nginx refuses the new settings
  ansible.builtin.fail:
    msg: >-
      waf: nginx -t refused the new settings in a check container, so the running WAF, its files
      in {{ waf_dir }} and Traefik's waf.yml are unchanged. Output:
      {{ (waf_check.stderr ~ ' ' ~ waf_check.stdout) | trim }}
  when:
    - waf_settings_change
    - not ansible_check_mode
    - waf_check.rc != 0

# Removed once the running nginx has loaded the new files, so a run that
# stops before the reload leaves the reload to the next run.
- name: Note the reload for the new settings
  ansible.builtin.copy:
    dest: "{{ waf_reload_marker }}"
    content: ""
    owner: root
    group: root
    mode: "0644"
  when: waf_settings_change

# The rules first: compose.yaml may recreate the container. In check mode
# only the plugin files already staged.
- name: Put the new plugin files in place
  ansible.builtin.copy:
    src: "{{ waf_staged_dir }}/{{ item }}"
    dest: "{{ waf_dir }}/{{ item }}"
    remote_src: true
    owner: root
    group: root
    mode: "0644"
  loop: >-
    {{ waf_staged_stat.results | selectattr('stat.exists') | map(attribute='item')
       | select('in', waf_plugin_paths) | list }}

- name: Remove the plugin files of no plugin
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ waf_plugin_stale }}"

- name: Put the new settings in place
  ansible.builtin.copy:
    src: "{{ waf_staged_dir }}/{{ item }}"
    dest: "{{ waf_dir }}/{{ item }}"
    remote_src: true
    owner: root
    group: root
    mode: "0644"
  loop: [modsecurity.conf, nginx.conf, compose.yaml]

# Recreates the container on a new image or compose setting, and starts a
# stopped one; either reads the files in place.
- name: Start the WAF
  community.docker.docker_compose_v2:
    project_src: "{{ waf_dir }}"
    project_name: waf
    state: present
    pull: missing
    remove_orphans: true
  register: waf_compose

- name: Look for a pending reload
  ansible.builtin.stat:
    path: "{{ waf_reload_marker }}"
    get_checksum: false
    get_attributes: false
    get_mime: false
  register: waf_reload_stat

# Without dropping connections; the files passed nginx -t.
- name: Reload the WAF with the new settings
  ansible.builtin.command:
    argv: [docker, exec, "{{ waf_name }}", nginx, -s, reload]
  changed_when: true
  when:
    - waf_reload_stat.stat.exists
    - waf_compose is not changed

- name: Note when the health check starts
  ansible.builtin.set_fact:
    waf_health_start: "{{ now().timestamp() }}"

# retries is an upper bound; the deadline ends the wait after
# waf_health_timeout seconds. In check mode nothing was started or reloaded,
# so nothing is waited for.
- name: Wait until the WAF is healthy
  ansible.builtin.command:
    argv: [docker, inspect, --format, "{{ '{{.State.Status}} {{.State.Health.Status}}' }}", "{{ waf_name }}"]
  register: waf_health
  changed_when: false
  failed_when: false
  until: >-
    waf_health.stdout == 'running healthy'
    or now().timestamp() - waf_health_start | float >= waf_health_timeout | int
  retries: "{{ waf_health_timeout | int + 1 }}"
  delay: 1
  when: not ansible_check_mode

- name: Fail when the WAF is not healthy
  ansible.builtin.fail:
    msg: >-
      waf: the WAF is not healthy after {{ waf_health_timeout }} seconds (container state:
      {{ waf_health.stdout | default('') or waf_health.stderr | default('unknown') }}). Every
      site behind it answers 502 until it is. See docker logs {{ waf_name }}.
  when:
    - not ansible_check_mode
    - waf_health.stdout != 'running healthy'

# nginx parses the new files after the reload signal while the old workers
# still serve; the health check answers the id of the files it serves.
- name: Wait until the WAF serves the new settings
  ansible.builtin.command:
    argv: [docker, exec, "{{ waf_name }}", curl, -fsS, "http://127.0.0.1:{{ waf_health_port }}/healthz"]
  register: waf_served
  changed_when: false
  failed_when: false
  until: >-
    waf_served.stdout | trim == waf_config_id
    or now().timestamp() - waf_health_start | float >= waf_health_timeout | int
  retries: "{{ waf_health_timeout | int + 1 }}"
  delay: 1
  when: not ansible_check_mode

- name: Fail when the WAF does not serve the new settings
  ansible.builtin.fail:
    msg: >-
      waf: the WAF does not serve the new settings after {{ waf_health_timeout }} seconds (it
      answers {{ waf_served.stdout | default('') | trim or waf_served.stderr | default('') | trim }}).
      See docker logs {{ waf_name }}.
  when:
    - not ansible_check_mode
    - waf_served.stdout | trim != waf_config_id

- name: Remove the note of the reload
  ansible.builtin.file:
    path: "{{ waf_reload_marker }}"
    state: absent

# The image's own versions, for the run's output: what changes with
# waf_image. Read-only (a throwaway container without a network, never a
# pull), so it runs in check mode too.
- name: Read the versions in the image
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - --pull
      - never
      - --network
      - none
      - --read-only
      - --cap-drop
      - ALL
      - --security-opt
      - no-new-privileges:true
      - --user
      - "{{ waf_uid }}:{{ waf_uid }}"
      - --entrypoint
      - sh
      - "{{ waf_image }}"
      - -c
      - "{{ waf_versions_script }}"
  register: waf_versions
  changed_when: false
  failed_when: false
  check_mode: false

- name: Report the versions in the image
  ansible.builtin.debug:
    msg: >-
      waf: {{ waf_image }} has the Core Rule Set
      {{ waf_versions.stdout_lines | select('match', '^crs=') | map('regex_replace', '^crs=', '') | first | default('') or 'unknown' }}
      and ModSecurity
      {{ waf_versions.stdout_lines | select('match', '^modsecurity=') | map('regex_replace', '^modsecurity=', '') | first | default('') or 'unknown' }}

# Only once the WAF serves the sites: a new router never points at a WAF
# that does not know its site yet. The traefik role leaves files it did not
# write alone.
- name: Write the Traefik objects
  ansible.builtin.template:
    src: traefik.yml.j2
    dest: "{{ waf_traefik_file }}"
    owner: root
    group: root
    mode: "0644"
  when: waf_mode == 'traefik'

# Left by traefik mode, it would route the sites to a WAF that is no longer
# on Traefik's network. Only the role's own file (its marker line): a file of
# that name from elsewhere stays.
- name: Look for the role's Traefik objects in host mode
  ansible.builtin.command:
    argv: [grep, -qxF, -e, "{{ waf_traefik_marker }}", --, "{{ waf_traefik_file }}"]
  register: waf_traefik_own
  changed_when: false
  failed_when: false
  check_mode: false
  when: waf_mode == 'host'

- name: Remove the role's Traefik objects in host mode
  ansible.builtin.file:
    path: "{{ waf_traefik_file }}"
    state: absent
  when:
    - waf_mode == 'host'
    - waf_traefik_own.rc == 0

- name: Install the report of the WAF's events
  ansible.builtin.template:
    src: noix-waf-report.j2
    dest: "{{ waf_report }}"
    owner: root
    group: root
    mode: "0755"
