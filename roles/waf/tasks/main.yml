---
# Docker comes from the playbook (the docker role or Docker's own packages),
# not from a role dependency; fail early and clearly when it is missing.
- name: Check for Docker
  ansible.builtin.include_role:
    name: noixdev.infra.docker_check

# Every refusal comes before the first change on the host.
- name: Check the settings
  ansible.builtin.import_tasks: check.yml

- name: Run the WAF
  ansible.builtin.import_tasks: apply.yml
