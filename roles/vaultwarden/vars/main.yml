---
# The compose project name: compose's default for the directory.
vaultwarden_project: "{{ vaultwarden_dir | basename }}"
# Mode 0644: it holds no secret, which reach the containers as files of
# vaultwarden_secrets_dir.
vaultwarden_compose_file: "{{ vaultwarden_dir }}/compose.yaml"
# Mode 0700. Mode 0600 files, only those in use: admin_token, database_url,
# smtp_password, push_installation_key.
vaultwarden_secrets_dir: "{{ vaultwarden_dir }}/secrets"
# The database the installation was made with (sqlite, postgres, or the
# external server and database), so that another one is refused.
vaultwarden_target_file: "{{ vaultwarden_dir }}/database-target"

# The subdirectories of vaultwarden_data_dir whose absence means the data is
# missing (an unmounted volume): only install creates them.
vaultwarden_data_subdirs: "{{ ['vaultwarden'] + (['postgres'] if vaultwarden_database == 'postgres' else []) }}"
vaultwarden_backup_dir: "{{ vaultwarden_data_dir }}/backups"
# Written after a failed update; that version is not tried again while it
# exists.
vaultwarden_marker_file: "{{ vaultwarden_dir }}/update-failed"
# Written before an install creates anything and removed once Vaultwarden is
# healthy; while it exists every run refuses.
vaultwarden_install_marker: "{{ vaultwarden_dir }}/install-incomplete"
# Written before the first change of an update and removed once it is healthy
# or rolled back; a run that stopped in between leaves it, with a copy of the
# compose file and of the secrets directory it replaces, for the next run.
vaultwarden_update_marker: "{{ vaultwarden_dir }}/update-in-progress"
vaultwarden_update_marker_compose: "{{ vaultwarden_dir }}/update-in-progress.compose.yaml"
vaultwarden_update_marker_secrets: "{{ vaultwarden_dir }}/update-in-progress.secrets"

# The oldest release the role runs.
vaultwarden_min_version: 1.37.0
# PostgreSQL majors: the own container from 18 on (see vaultwarden_postgres_image),
# an external server from 15 on.
vaultwarden_postgres_major: >-
  {%- set name = (vaultwarden_postgres_image | string).split('@')[0].rpartition('/')[2] -%}
  {{ (name.rpartition(':')[2] if ':' in name else '') | regex_search('^[0-9]+') | default('', true) }}

# The settings the role sets itself; vaultwarden_env must not hold them, nor
# a key with one of the prefixes or the suffix below.
vaultwarden_env_owned:
  - DOMAIN
  - DATABASE_URL
  - ADMIN_TOKEN
  - DISABLE_ADMIN_TOKEN
  - SIGNUPS_ALLOWED
  - INVITATIONS_ALLOWED
  - INVITATION_ORG_NAME
  - PASSWORD_HINTS_ALLOWED
  - DATA_FOLDER
  - CONFIG_FILE
  - ENV_FILE
vaultwarden_env_owned_prefixes: [PUSH_, SMTP_, ROCKET_]
vaultwarden_env_owned_suffix: _FILE

# The admin token the role accepts: an Argon2id PHC string.
vaultwarden_admin_hash_pattern: '^\$argon2id\$v=19\$m=\d+,t=\d+,p=\d+\$[A-Za-z0-9+/]+\$[A-Za-z0-9+/]+$'

# vaultwarden_smtp with the defaults of its keys that it leaves out.
vaultwarden_smtp_settings: >-
  {{ {'host': '', 'port': 587, 'security': 'starttls', 'username': '', 'password': '', 'from': '', 'from_name': 'Vaultwarden'}
     | combine(vaultwarden_smtp if vaultwarden_smtp is mapping else {}) }}

# The services of the compose project.
vaultwarden_services: [vaultwarden]
# Where the container reads the secrets files (vaultwarden_secrets_dir, bound
# read-only).
vaultwarden_container_secrets_dir: /run/secrets-vw
# Written by the first save on the admin page; it overrides every setting the
# role writes, so state.yml refuses it.
vaultwarden_config_json: "{{ vaultwarden_data_dir }}/vaultwarden/config.json"
# Bitwarden's relay and identity server of each vaultwarden_push_region.
vaultwarden_push_uris:
  us: {relay: "https://push.bitwarden.com", identity: "https://identity.bitwarden.com"}
  eu: {relay: "https://api.bitwarden.eu", identity: "https://identity.bitwarden.eu"}
# What install records in vaultwarden_target_file; no credentials.
vaultwarden_database_target:
  database: "{{ vaultwarden_database }}"

# The compose file as the role writes it; compared with the one on disk. It
# needs vaultwarden_secrets, which state.yml sets.
vaultwarden_compose: "{{ lookup('ansible.builtin.template', 'compose.yaml.j2') }}"

# The task that failed and its error: for a command the last line of stderr
# that names an error (else its last line), for anything else the first line
# of the message.
vaultwarden_failure: >-
  {%- set stderr = (ansible_failed_result.stderr | default('') | trim).splitlines() -%}
  {%- set errors = stderr | select('search', 'Error:') | list -%}
  {{ ansible_failed_task.name }}:
  {{ (errors or stderr or ['']) | last | trim
     if ansible_failed_result.msg | default('') is search('non-zero return code')
     else ((ansible_failed_result.msg | default('') | trim).splitlines() or ['']) | first }}

# After a failed install: nothing in it should be worth keeping yet, so what
# it made is removed and the next run installs afresh.
vaultwarden_install_hint: >-
  It left a partial installation, which the role does not take for a
  finished one. To install again, first check that nothing in it is worth
  keeping (accounts and items in Vaultwarden), then run docker compose down
  in {{ vaultwarden_dir }} (if {{ vaultwarden_compose_file }} exists), remove
  {{ vaultwarden_compose_file }}, {{ vaultwarden_secrets_dir }},
  {{ vaultwarden_target_file }}, {{ vaultwarden_install_marker }} and the
  subdirectories {{ vaultwarden_data_subdirs | join(' and ') }} of
  {{ vaultwarden_data_dir }}, then run the role again.
