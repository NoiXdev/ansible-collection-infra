---
# The compose project name: compose's default for the directory.
vaultwarden_project: "{{ vaultwarden_dir | basename }}"
# Mode 0644: it holds no secret, which reach the containers as files of
# vaultwarden_secrets_dir.
vaultwarden_compose_file: "{{ vaultwarden_dir }}/compose.yaml"
# Mode 0700. Mode 0600 files, only those in use: admin_token, database_url
# and db_password (the own PostgreSQL), smtp_password, push_installation_key.
vaultwarden_secrets_dir: "{{ vaultwarden_dir }}/secrets"
# The database the installation was made with (sqlite, postgres, or the
# external server and database), so that another one is refused.
vaultwarden_target_file: "{{ vaultwarden_dir }}/database-target"

# The subdirectories of vaultwarden_data_dir whose absence means the data is
# missing (an unmounted volume): only install creates them.
vaultwarden_data_subdirs: "{{ ['vaultwarden'] + (['postgres'] if vaultwarden_database == 'postgres' else []) }}"
vaultwarden_backup_dir: "{{ vaultwarden_data_dir }}/backups"
# Written after a failed update; that version is not tried again while it
# exists.
vaultwarden_marker_file: "{{ vaultwarden_dir }}/update-failed"
# Written before an install creates anything and removed once Vaultwarden is
# healthy; while it exists every run refuses.
vaultwarden_install_marker: "{{ vaultwarden_dir }}/install-incomplete"
# Written before the first change of an update and removed once it is healthy
# or rolled back; a run that stopped in between leaves it, with a copy of the
# compose file and of the secrets directory it replaces, for the next run.
vaultwarden_update_marker: "{{ vaultwarden_dir }}/update-in-progress"
vaultwarden_update_marker_compose: "{{ vaultwarden_dir }}/update-in-progress.compose.yaml"
vaultwarden_update_marker_secrets: "{{ vaultwarden_dir }}/update-in-progress.secrets"
# Removed together, the marker first: a run stopped in between leaves only a
# copy, never a marker without its copies.
vaultwarden_update_marker_files:
  - "{{ vaultwarden_update_marker }}"
  - "{{ vaultwarden_update_marker_compose }}"
  - "{{ vaultwarden_update_marker_secrets }}"
# The name of a complete backup below vaultwarden_backup_dir:
# <UTC time>-<from version>-to-<to version>. Pruning takes only these, not
# the <backup>-failed directories of rolled back updates.
vaultwarden_backup_pattern: '^\d{8}T\d{6}Z-\d+\.\d+\.\d+-to-\d+\.\d+\.\d+$'

# The oldest release the role runs.
vaultwarden_min_version: 1.37.0
# PostgreSQL majors: the own container from 18 on (see vaultwarden_postgres_image),
# an external server from 15 on.
vaultwarden_postgres_major: >-
  {%- set name = (vaultwarden_postgres_image | string).split('@')[0].rpartition('/')[2] -%}
  {{ (name.rpartition(':')[2] if ':' in name else '') | regex_search('^[0-9]+') | default('', true) }}

# The settings the role sets itself; vaultwarden_env must not hold them, nor
# a key with one of the prefixes or the suffix below.
vaultwarden_env_owned:
  - DOMAIN
  - DATABASE_URL
  - ADMIN_TOKEN
  - DISABLE_ADMIN_TOKEN
  - SIGNUPS_ALLOWED
  - INVITATIONS_ALLOWED
  - INVITATION_ORG_NAME
  - PASSWORD_HINTS_ALLOWED
  - DATA_FOLDER
  - CONFIG_FILE
  - ENV_FILE
vaultwarden_env_owned_prefixes: [PUSH_, SMTP_, ROCKET_]
vaultwarden_env_owned_suffix: _FILE

# The admin token the role accepts: an Argon2id PHC string.
vaultwarden_admin_hash_pattern: '^\$argon2id\$v=19\$m=\d+,t=\d+,p=\d+\$[A-Za-z0-9+/]+\$[A-Za-z0-9+/]+$'

# vaultwarden_smtp with the defaults of its keys that it leaves out.
vaultwarden_smtp_settings: >-
  {{ {'host': '', 'port': 587, 'security': 'starttls', 'username': '', 'password': '', 'from': '', 'from_name': 'Vaultwarden'}
     | combine(vaultwarden_smtp if vaultwarden_smtp is mapping else {}) }}

# The services of the compose project.
vaultwarden_services: "{{ ['vaultwarden'] + (['db'] if vaultwarden_database == 'postgres' else []) }}"
# Where the container reads the secrets files (vaultwarden_secrets_dir, bound
# read-only).
vaultwarden_container_secrets_dir: /run/secrets-vw
# Written by the first save on the admin page; it overrides every setting the
# role writes, so state.yml refuses it.
vaultwarden_config_json: "{{ vaultwarden_data_dir }}/vaultwarden/config.json"
# Bitwarden's relay and identity server of each vaultwarden_push_region.
vaultwarden_push_uris:
  us: {relay: "https://push.bitwarden.com", identity: "https://identity.bitwarden.com"}
  eu: {relay: "https://api.bitwarden.eu", identity: "https://identity.bitwarden.eu"}
# What install records in vaultwarden_target_file; no credentials. With the
# external server also where it is.
vaultwarden_database_target: >-
  {{ {'database': vaultwarden_database}
     | combine({'host': vaultwarden_db_host | string, 'port': vaultwarden_db_port | int, 'name': vaultwarden_db_name | string}
               if vaultwarden_database == 'postgres_external' else {}) }}
# The external server and database as the refusals name them.
vaultwarden_external_target: "{{ vaultwarden_db_host }}:{{ vaultwarden_db_port | int }}/{{ vaultwarden_db_name }}"

# The own PostgreSQL's database and user as Vaultwarden's DATABASE_URL names
# them (the host is the compose service db). The role writes the URL, which
# holds the password percent-encoded, only to the secrets file database_url:
# Jinja's urlencode leaves / alone, so that is encoded here.
vaultwarden_postgres_url: >-
  postgresql://{{ vaultwarden_db_user | string | urlencode | replace('/', '%2F') }}:{{
  vaultwarden_db_password | string | urlencode | replace('/', '%2F') }}@db:5432/{{ vaultwarden_db_name }}

# The same for the external server: host (an IPv6 address in brackets), port
# and database, and the TLS mode as libpq takes it in the URL.
vaultwarden_external_url: >-
  postgresql://{{ vaultwarden_db_user | string | urlencode | replace('/', '%2F') }}:{{
  vaultwarden_db_password | string | urlencode | replace('/', '%2F') }}@{{
  ('[' ~ vaultwarden_db_host ~ ']') if ':' in vaultwarden_db_host | string else vaultwarden_db_host }}:{{
  vaultwarden_db_port | int }}/{{ vaultwarden_db_name | string | urlencode | replace('/', '%2F')
  }}?sslmode={{ vaultwarden_db_sslmode }}

# The compose file as the role writes it; compared with the one on disk. It
# needs vaultwarden_secrets, which state.yml sets.
vaultwarden_compose: "{{ lookup('ansible.builtin.template', 'compose.yaml.j2') }}"

# The oldest PostgreSQL major the role runs against as an external server.
vaultwarden_external_min_major: 15
# The repository of vaultwarden_postgres_image (without tag or digest), for
# the client image of the external server's major.
vaultwarden_postgres_repository: >-
  {%- set image = (vaultwarden_postgres_image | string).split('@')[0] -%}
  {{ image.rpartition('/')[0] ~ ('/' if '/' in image else '') ~ image.rpartition('/')[2].partition(':')[0] }}

# The command of a psql check of the external server (the query is appended)
# in a one-off container of vaultwarden_external_image on Docker's default
# bridge. The password goes through stdin into the environment of psql (the x
# keeps trailing newlines): Ansible's own environment keyword would put it on
# the command line of the module's shell, where ps shows it.
vaultwarden_external_psql:
  - docker
  - run
  - --rm
  - --interactive
  - --env
  - "PGSSLMODE={{ vaultwarden_db_sslmode }}"
  - --env
  - PGCONNECT_TIMEOUT=10
  - --entrypoint
  - sh
  - "{{ vaultwarden_external_image }}"
  - -c
  - >-
    PGPASSWORD="$(cat; echo x)"; PGPASSWORD="${PGPASSWORD%x}"; export PGPASSWORD; exec psql "$@"
  - sh
  - "--host={{ vaultwarden_db_host }}"
  - "--port={{ vaultwarden_db_port | int }}"
  - "--username={{ vaultwarden_db_user }}"
  - "--dbname={{ vaultwarden_db_name }}"
  - --no-psqlrc
  - --tuples-only
  - --no-align
  - --command

# The same for pg_dump and pg_restore of an update and its rollback: a
# one-off container of vaultwarden_client_image (the server's major), with the
# options of vaultwarden_external_docker, then the mounts a task adds, then
# vaultwarden_external_shell with the task's script (which gets the
# connection options of vaultwarden_external_login as "$@"). The password goes
# through stdin into the environment, as for vaultwarden_external_psql.
vaultwarden_external_docker:
  - docker
  - run
  - --rm
  - --interactive
  - --env
  - "PGSSLMODE={{ vaultwarden_db_sslmode }}"
  - --env
  - PGCONNECT_TIMEOUT=10
vaultwarden_external_shell: >-
  PGPASSWORD="$(cat; echo x)"; PGPASSWORD="${PGPASSWORD%x}"; export PGPASSWORD; set -eu;
vaultwarden_external_login:
  - "--host={{ vaultwarden_db_host }}"
  - "--port={{ vaultwarden_db_port | int }}"
  - "--username={{ vaultwarden_db_user }}"
  - "--dbname={{ vaultwarden_db_name }}"

# The database check of health.yml: the tables Vaultwarden reads on a login
# and for the vault. Vaultwarden itself turns an error of such a read into
# "no such user" (prelogin answers 200 on a broken users table), so the role
# reads them itself.
vaultwarden_db_check_sql: SELECT (SELECT count(*) FROM users) + (SELECT count(*) FROM ciphers)
# For SQLite with the host's Python (the image has no sqlite3): the file
# opened without creating it, read only.
vaultwarden_db_check_sqlite: |
  import sqlite3, sys, urllib.parse
  db = sqlite3.connect('file:' + urllib.parse.quote(sys.argv[1]) + '?mode=rw', uri=True, timeout=10)
  db.execute('PRAGMA query_only = 1')
  print(db.execute(sys.argv[2]).fetchone()[0])

# The error of a psql check of the external server: the last line of stderr
# that names an error (else its last line), from the result the task that
# fails sets as vaultwarden_external_result. psql quotes the server's error,
# never the password.
vaultwarden_external_error: >-
  {%- set stderr = (vaultwarden_external_result.stderr | default('') | trim).splitlines() -%}
  {{ ((stderr | select('search', '(?i)error|fatal') | list) or stderr
      or ['exit code ' ~ vaultwarden_external_result.rc | default('?') | string]) | last | trim }}

# The error of the psql check of a new vaultwarden_db_password: the last line
# of stderr that names an error (else its last line), no value of it.
vaultwarden_hidden_error: >-
  {%- set stderr = (vaultwarden_hidden.stderr | default('') | trim).splitlines() -%}
  {{ ((stderr | select('search', 'Error:') | list) or stderr
      or ['exit code ' ~ vaultwarden_hidden.rc | default('?') | string]) | last | trim }}

# The task that failed and its error: for a command the last line of stderr
# that names an error (else its last line), for anything else the first line
# of the message.
vaultwarden_failure: >-
  {%- set stderr = (ansible_failed_result.stderr | default('') | trim).splitlines() -%}
  {%- set errors = stderr | select('search', 'Error:') | list -%}
  {{ ansible_failed_task.name }}:
  {{ (errors or stderr or ['']) | last | trim
     if ansible_failed_result.msg | default('') is search('non-zero return code')
     else ((ansible_failed_result.msg | default('') | trim).splitlines() or ['']) | first }}

# After a failed install: nothing in it should be worth keeping yet, so what
# it made is removed and the next run installs afresh.
vaultwarden_install_hint: >-
  It left a partial installation, which the role does not take for a
  finished one. To install again, first check that nothing in it is worth
  keeping (accounts and items in Vaultwarden), then run docker compose down
  in {{ vaultwarden_dir }} (if {{ vaultwarden_compose_file }} exists), remove
  {{ vaultwarden_compose_file }}, {{ vaultwarden_secrets_dir }},
  {{ vaultwarden_target_file }}, {{ vaultwarden_install_marker }} and the
  subdirectories {{ vaultwarden_data_subdirs | join(' and ') }} of
  {{ vaultwarden_data_dir }}, then run the role again.

# After a failed rollback: how to put the backup vaultwarden_backup back by
# hand, with the step of the database mode.
vaultwarden_restore_hint: >-
  Roll back by hand in {{ vaultwarden_dir }}: run docker compose stop; copy
  {{ vaultwarden_restore_from }}/compose.yaml to {{ vaultwarden_compose_file }}
  and the files of {{ vaultwarden_restore_from }}/secrets into
  {{ vaultwarden_secrets_dir }};{{ (' ' ~ vaultwarden_restore_hint_database[vaultwarden_database])
  if vaultwarden_restore_hint_database[vaultwarden_database] else '' }} put the
  entries of {{ vaultwarden_restore_from }}/vaultwarden in place of those of
  {{ vaultwarden_data_dir }}/vaultwarden (cp -a; keep the directory itself);
  then run docker compose up -d.
vaultwarden_restore_from: "{{ vaultwarden_backup | default('?', true) }}"
vaultwarden_restore_hint_database:
  sqlite: ""
  postgres: >-
    run docker compose up -d db; recreate the database (docker compose exec -T
    db psql -U {{ vaultwarden_db_user }} -d postgres -c 'DROP DATABASE IF EXISTS
    {{ vaultwarden_db_name }} WITH (FORCE)' -c 'CREATE DATABASE
    {{ vaultwarden_db_name }} OWNER {{ vaultwarden_db_user }}') and load the dump
    with docker compose exec -T db pg_restore --single-transaction -U
    {{ vaultwarden_db_user }} -d {{ vaultwarden_db_name }} <
    {{ vaultwarden_restore_from }}/vaultwarden.dump;
  postgres_external: >-
    in the database {{ vaultwarden_external_target }}, in one transaction, drop
    the schema public with everything in it and create it again (DROP SCHEMA
    public CASCADE; CREATE SCHEMA public), then load
    {{ vaultwarden_restore_from }}/vaultwarden.dump (pg_restore --no-owner
    --no-privileges -f - of PostgreSQL {{ vaultwarden_external_major | default("the server's major") }}
    into psql --single-transaction);
