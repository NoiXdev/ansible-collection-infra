---
# Writes vaultwarden_secrets (file name to content, set by state.yml) to
# vaultwarden_secrets_dir, root's only, and removes the files of secrets no
# longer in use (an admin page switched off, SMTP without a login). The
# container reads them through <KEY>_FILE on its start. The tasks that touch
# a secret are no_log, so a failure gets a message of its own that quotes
# nothing of them.

- name: Write the secrets
  block:
    - name: Create the secrets directory
      ansible.builtin.file:
        path: "{{ vaultwarden_secrets_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Write the secrets files
      ansible.builtin.copy:
        dest: "{{ vaultwarden_secrets_dir }}/{{ item.key }}"
        content: "{{ item.value }}"
        owner: root
        group: root
        mode: "0600"
      loop: "{{ vaultwarden_secrets | dict2items }}"
      no_log: true

    - name: Find the secrets files
      ansible.builtin.find:
        paths: "{{ vaultwarden_secrets_dir }}"
        file_type: any
        hidden: true
      register: vaultwarden_secrets_found

    - name: Remove the secrets files no longer in use
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop: >-
        {{ vaultwarden_secrets_found.files | map(attribute='path')
           | reject('in', vaultwarden_secrets.keys() | map('regex_replace', '^', vaultwarden_secrets_dir ~ '/') | list)
           | sort }}

  rescue:
    - name: Fail with the task that could not write the secrets
      ansible.builtin.fail:
        msg: >-
          The secrets of Vaultwarden could not be written to
          {{ vaultwarden_secrets_dir }} ({{ ansible_failed_task.name }}); the
          error is not shown, as it can quote a secret. A running Vaultwarden
          keeps the secrets it started with. Check the directory (its owner,
          the free space), then run the role again.
