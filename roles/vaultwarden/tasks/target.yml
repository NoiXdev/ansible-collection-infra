---
# Writes vaultwarden_target_file: the database this installation keeps its
# vault in (vaultwarden_database_target, no credentials). Included by install
# and, for an installation that has no usable file (removed as the refusal of
# a changed target says when the database moved, or never written), by
# main.yml once every refusal and check has passed. A later run whose
# settings name another target refuses.
- name: Write the database target
  ansible.builtin.copy:
    dest: "{{ vaultwarden_target_file }}"
    content: |
      # Written by the noixdev.infra.vaultwarden role: the database this
      # installation keeps its vault in. Remove it only when the database
      # really moved (a dump restored elsewhere); the next run records the
      # target its settings name.
      {{ vaultwarden_database_target | to_nice_yaml(sort_keys=false) }}
    owner: root
    group: root
    mode: "0644"
