---
# Reads the host and sets vaultwarden_state:
#   install      no compose file
#   update       vaultwarden_version is newer than the installed version
#   reconfigure  the compose file the role writes differs from the one on
#                disk, a secrets file from what the role writes, or a
#                restart is pending (vaultwarden_restart_marker)
#   noop         everything as the role writes it
#   restore_interrupted
#                an update that did not finish (vaultwarden_update_marker,
#                step update) and vaultwarden_restore_interrupted: main.yml
#                restores its backup and does nothing else
# Also sets vaultwarden_installed (a compose file exists),
# vaultwarden_compose_before (the compose file on disk),
# vaultwarden_compose_on_disk (it parsed), vaultwarden_installed_version,
# vaultwarden_installed_database (from vaultwarden_target_file, empty
# without it) and vaultwarden_installed_target (the external server and
# database it records, empty when it names none), vaultwarden_marker_read
# and vaultwarden_marker (the marker of a failed update),
# vaultwarden_update_in_progress (the marker of an update that did not
# finish parsed, empty without one), vaultwarden_secrets (file name to
# content of the secrets the role writes), vaultwarden_secrets_changed,
# vaultwarden_db_password_changed, vaultwarden_restart_pending and
# vaultwarden_down (the services that are not running). Refuses, before any
# change and in this order: a vaultwarden_data_dir that is not a mountpoint
# (with vaultwarden_data_dir_mountpoint), an installation of another
# database mode, an external installation of another server or database, an
# installation without its data subdirectories (an unmounted volume), after
# a failed update every version when its rollback failed too, else the
# failed version, a config.json saved on the admin page, a compose file that
# is not YAML, an install that did not complete (its marker), a marker of an
# update in progress the role did not write, an update that did not finish
# (step update; without vaultwarden_restore_interrupted, or with it but
# without what its backup must hold), vaultwarden_restore_interrupted
# without an update to restore, a compose file without a Vaultwarden
# version, a downgrade (not for a restore), with the own PostgreSQL a
# vaultwarden_db_password the database does not take and a cluster of
# another major or more than one, and with the external one a server the
# role cannot run its client for or log in to, older than 15, whose
# database the user does not own, or (on install) that holds tables
# (external.yml; it also sets vaultwarden_external_major and
# vaultwarden_client_image). The only changes it makes remove what an
# interrupted update left that nothing needs: a marker of an update in
# progress beside update-failed of the same backup (the rollback ran; before
# the refusal of update-failed, else after every refusal), and, after every
# refusal, the partial backup and the marker of an update stopped during its
# backup (nothing else had changed), or the copies of a marker that was
# removed by hand.

# A block volume that is not mounted leaves its mountpoint as an empty
# directory on the root filesystem; an install there would put the data
# beside the volume.
- name: Check that the data directory is a mountpoint
  ansible.builtin.command:
    argv: [mountpoint, -q, "{{ vaultwarden_data_dir }}"]
  register: vaultwarden_data_dir_mounted
  changed_when: false
  failed_when: false
  when: vaultwarden_data_dir_mountpoint | bool

- name: Refuse a data directory that is not a mountpoint
  ansible.builtin.fail:
    msg: >-
      vaultwarden_data_dir_mountpoint is on, but {{ vaultwarden_data_dir }}
      is not a mountpoint: is the volume mounted? The role changes nothing.
      Mount the volume at {{ vaultwarden_data_dir }}, then run the role
      again.
  when:
    - vaultwarden_data_dir_mountpoint | bool
    - vaultwarden_data_dir_mounted.rc != 0

# The role writes no secret into it, but one changed by hand could hold one,
# so it is read, noted and parsed in no_log tasks.
- name: Read the compose file
  ansible.builtin.slurp:
    src: "{{ vaultwarden_compose_file }}"
  register: vaultwarden_compose_read
  failed_when: false
  no_log: true

- name: Look for the data subdirectories
  ansible.builtin.stat:
    path: "{{ vaultwarden_data_dir }}/{{ item }}"
    get_checksum: false
  loop: "{{ vaultwarden_data_subdirs }}"
  register: vaultwarden_subdirs_stat

- name: Note what is on the host
  ansible.builtin.set_fact:
    vaultwarden_compose_before: "{{ vaultwarden_compose_read.content | default('') | b64decode }}"
    vaultwarden_installed: "{{ vaultwarden_compose_read.content is defined }}"
    vaultwarden_data_present: >-
      {{ vaultwarden_subdirs_stat.results | selectattr('stat.exists') | map(attribute='item') | list }}
  no_log: true

# Not secret: the database mode (and for an external server where it is).
- name: Read the database target
  ansible.builtin.slurp:
    src: "{{ vaultwarden_target_file }}"
  register: vaultwarden_target_read
  failed_when: false
  when: vaultwarden_installed

- name: Note the installed database
  ansible.builtin.set_fact:
    vaultwarden_installed_database: "{{ vaultwarden_target_recorded.database | default('') }}"
    vaultwarden_installed_target: >-
      {{ (vaultwarden_target_recorded.host | string ~ ':' ~ vaultwarden_target_recorded.port | string
          ~ '/' ~ vaultwarden_target_recorded.name | string)
         if vaultwarden_target_recorded.host is defined and vaultwarden_target_recorded.port is defined
            and vaultwarden_target_recorded.name is defined
         else '' }}
  vars:
    vaultwarden_target_parsed: "{{ (vaultwarden_target_read.content | default('') | b64decode or '{}') | from_yaml }}"
    vaultwarden_target_recorded: "{{ vaultwarden_target_parsed if vaultwarden_target_parsed is mapping else {} }}"

# Vaultwarden cannot move between database backends, and with another one it
# would make an empty vault: refused before the data check, which would take
# the other mode's missing subdirectory for an unmounted volume.
- name: Refuse an installation of another database mode
  ansible.builtin.fail:
    msg: >-
      vaultwarden_database {{ vaultwarden_database }} was set, but the
      installation in {{ vaultwarden_dir }} was made with the database
      {{ vaultwarden_installed_database }} ({{ vaultwarden_target_file }}).
      Vaultwarden has no tool to move its data between database modes, and
      with another one it would start an empty vault; the role changes
      nothing. Set vaultwarden_database back to
      {{ vaultwarden_installed_database }}. Moving to another mode is manual
      work: dump and convert the data, then remove
      {{ vaultwarden_target_file }}.
  when:
    - vaultwarden_installed
    - vaultwarden_installed_database | length > 0
    - vaultwarden_installed_database != vaultwarden_database

# The same mode, another server or database: Vaultwarden would build its
# schema in an empty database there and the team would see an empty vault.
# User and password may change (the login check of external.yml catches a
# wrong pair).
- name: Refuse an installation of another external database
  ansible.builtin.fail:
    msg: >-
      The settings name the external database {{ vaultwarden_external_target }}
      (vaultwarden_db_host, vaultwarden_db_port, vaultwarden_db_name), but the
      installation in {{ vaultwarden_dir }} was made with
      {{ ('the database ' ~ vaultwarden_installed_target) if vaultwarden_installed_target | length > 0
         else 'a database that ' ~ vaultwarden_target_file ~ ' does not name in full' }}
      ({{ vaultwarden_target_file }}). Vaultwarden would build an empty schema
      in the other database and start an empty vault; the role changes
      nothing. Set the three back to
      {{ vaultwarden_installed_target if vaultwarden_installed_target | length > 0
         else 'those of the database the installation was made with' }}. If the database really moved (a dump
      restored elsewhere), remove {{ vaultwarden_target_file }} and run the
      role again.
  when:
    - vaultwarden_installed
    - vaultwarden_database == 'postgres_external'
    - vaultwarden_installed_database == 'postgres_external'
    - vaultwarden_installed_target != vaultwarden_external_target

# Only install creates the subdirectories, and compose does not create a
# missing one (create_host_path: false), so their absence beside a compose
# file is data that is not there (an unmounted volume), never a state to
# repair: Vaultwarden would start on an empty vault.
- name: Refuse an installation without its data
  ansible.builtin.fail:
    msg: >-
      Vaultwarden is installed in {{ vaultwarden_dir }}
      ({{ vaultwarden_compose_file }}), but {{ vaultwarden_data_dir }} lacks
      {{ vaultwarden_data_missing | join(', ') }}: is the volume mounted? The
      role changes nothing and creates none of them. Mount the volume (or put
      the data back) at {{ vaultwarden_data_dir }}, then run the role again.
  vars:
    # In the order of vaultwarden_data_subdirs, which difference does not keep.
    vaultwarden_data_missing: "{{ vaultwarden_data_subdirs | reject('in', vaultwarden_data_present) | list }}"
  when:
    - vaultwarden_installed
    - vaultwarden_data_missing | length > 0

# Written by update.yml after a failed update; it names the failed version.
# Not secret: the versions, the backup, the time and the error.
- name: Read the marker of a failed update
  ansible.builtin.slurp:
    src: "{{ vaultwarden_marker_file }}"
  register: vaultwarden_marker_read
  failed_when: false

# Left by a run that stopped during an update (update.yml). Not secret: the
# versions, the step, the backup and the time.
- name: Read the marker of an update in progress
  ansible.builtin.slurp:
    src: "{{ vaultwarden_update_marker }}"
  register: vaultwarden_update_marker_read
  failed_when: false

# Whether it exists, which a read that failed does not tell.
- name: Look for the marker of an update in progress
  ansible.builtin.stat:
    path: "{{ vaultwarden_update_marker }}"
    get_checksum: false
  register: vaultwarden_update_marker_stat

- name: Note that no update is in progress
  ansible.builtin.set_fact:
    vaultwarden_update_in_progress: {}

# A marker that is not YAML parses to nothing and is refused below, as is one
# that exists but cannot be read (a directory). It holds no secret: the
# copies of the compose file and the secrets are never read here.
- name: Note a marker of an update in progress that cannot be read
  ansible.builtin.set_fact:
    vaultwarden_update_in_progress: {step: null}
  when:
    - vaultwarden_update_marker_stat.stat.exists
    - vaultwarden_update_marker_read.content is not defined

- name: Check the marker of an update in progress
  when: vaultwarden_update_marker_read.content is defined
  block:
    - name: Parse the marker of the update in progress
      ansible.builtin.set_fact:
        vaultwarden_update_in_progress: >-
          {{ vaultwarden_update_marker_yaml if vaultwarden_update_marker_yaml is mapping else {'step': none} }}
      vars:
        vaultwarden_update_marker_yaml: "{{ vaultwarden_update_marker_read.content | b64decode | from_yaml }}"
  rescue:
    - name: Note a marker of an update in progress that is not YAML
      ansible.builtin.set_fact:
        vaultwarden_update_in_progress: {step: null}

# A marker that is not YAML cannot say which version failed.
- name: Check the marker of a failed update
  when: vaultwarden_marker_read.content is defined
  block:
    - name: Parse the marker of a failed update
      ansible.builtin.set_fact:
        vaultwarden_marker: "{{ vaultwarden_marker_yaml if vaultwarden_marker_yaml is mapping else {} }}"
      vars:
        vaultwarden_marker_yaml: "{{ vaultwarden_marker_read.content | b64decode | from_yaml }}"
  rescue:
    - name: Fail on a marker of a failed update that is not YAML
      ansible.builtin.fail:
        msg: >-
          {{ vaultwarden_marker_file }} exists, but it is not YAML, so the role
          cannot tell which Vaultwarden update failed and changes nothing.
          Check Vaultwarden, then remove the file (rm
          {{ vaultwarden_marker_file }}).

# update-failed of the same backup (both take it from vaultwarden_backup) was
# written by the rescue of this update, which was stopped before it removed
# the marker of the update in progress: the rollback ran, and update-failed
# decides below. An update-failed of another backup is left from an earlier
# update that was rolled back (it stays through updates to other versions),
# so this marker is checked as without one. So is a marker with step backup,
# whoever wrote update-failed: the compose file is as before the update, and
# it is cleaned up as without update-failed.
- name: Compare the backups of the two markers
  ansible.builtin.set_fact:
    vaultwarden_update_rolled_back: >-
      {{ vaultwarden_marker_read.content is defined
         and vaultwarden_update_in_progress.step | default(none) == 'update'
         and vaultwarden_update_in_progress.backup | default('', true) | string is match('^/')
         and (vaultwarden_marker.backup | default('', true) | string) == (vaultwarden_update_in_progress.backup | string) }}

# When update-failed refuses this run, the marker of the update in progress
# it records goes first: nothing needs it (the rollback ran), and once
# update-failed is removed as its refusal says, the next run would take it
# for an update that did not finish. Every other refusal leaves both, and the
# run that gets past them all removes it at the end.
- name: Remove the marker of an update in progress beside the failed update that refuses this run
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ vaultwarden_update_marker_files }}"
  when:
    - vaultwarden_update_rolled_back | bool
    - >-
      not vaultwarden_marker.rolled_back_to | default(none)
      or (vaultwarden_marker.failed_version | default(vaultwarden_version) | string) == vaultwarden_version | string

- name: Note that the rolled back update is not in progress
  ansible.builtin.set_fact:
    vaultwarden_update_in_progress: {}
  when: vaultwarden_update_rolled_back | bool

# The rollback failed (or the marker does not say it worked): the database
# may be empty or half restored, and the backup holds the data. Any version
# would take a backup of that database, come up healthy and remove the
# marker, the last pointer to the real backup, so every version is refused,
# before the version checks: a rollback that failed before it put the
# previous compose file back leaves the failed version in it, and an older
# pin must hear this, not the downgrade refusal.
- name: Refuse every version after a failed rollback
  ansible.builtin.fail:
    msg: >-
      {{ vaultwarden_marker_file }} exists: the Vaultwarden update to
      {{ vaultwarden_marker.failed_version | default('?') }} failed on
      {{ vaultwarden_marker.time | default('?') }}, and rolling back failed
      too ({{ vaultwarden_marker.restore_error | default('?') }}). The
      database and the data may be empty or half restored; they are in the
      backup {{ vaultwarden_backup }}. The role refuses every version and
      changes nothing until Vaultwarden is restored. {{ vaultwarden_restore_hint }}
      Then check Vaultwarden (log in, open an item) and remove the marker (rm
      {{ vaultwarden_marker_file }}). {{ vaultwarden_marker_restore_note }}
  vars:
    vaultwarden_backup: "{{ vaultwarden_marker.backup | default('?', true) }}"
  when:
    - vaultwarden_marker_read.content is defined
    - not vaultwarden_marker.rolled_back_to | default(none)

# A marker that names no version blocks every version.
- name: Refuse the version of a failed update
  ansible.builtin.fail:
    msg: >-
      {{ vaultwarden_marker_file }} exists: the Vaultwarden update to
      {{ vaultwarden_version }} failed on {{ vaultwarden_marker.time | default('?') }}
      (rolled back to {{ vaultwarden_marker.rolled_back_to }}; backup
      {{ vaultwarden_marker.backup | default('?') }}). The role does not try
      {{ vaultwarden_version }} again and changes nothing while the marker
      names it. To try again, remove it (rm {{ vaultwarden_marker_file }}); or
      set vaultwarden_version to another version, and the marker is removed
      once a run with it succeeds. {{ vaultwarden_marker_restore_note }}
  when:
    - vaultwarden_marker_read.content is defined
    - (vaultwarden_marker.failed_version | default(vaultwarden_version) | string) == vaultwarden_version | string

# The first save on the admin page writes config.json, and Vaultwarden takes
# its values over every setting the role writes (the admin token, SMTP and
# its password among them), so the role would no longer own the settings it
# writes. Its values can be secrets: it is read and parsed in no_log tasks,
# and only the key names are shown. User management on the admin page writes
# no config.json.
- name: Look for a config.json of the admin page
  ansible.builtin.stat:
    path: "{{ vaultwarden_config_json }}"
    get_checksum: false
  register: vaultwarden_config_json_stat

- name: Read the keys of config.json
  when: vaultwarden_config_json_stat.stat.exists
  block:
    - name: Read config.json
      ansible.builtin.slurp:
        src: "{{ vaultwarden_config_json }}"
      register: vaultwarden_config_json_read
      no_log: true

    - name: Note the keys of config.json
      ansible.builtin.set_fact:
        vaultwarden_config_json_keys: "{{ (vaultwarden_config_json_parsed | list | sort) if vaultwarden_config_json_parsed is mapping else none }}"
      vars:
        vaultwarden_config_json_parsed: "{{ vaultwarden_config_json_read.content | b64decode | from_json }}"
      no_log: true
  rescue:
    - name: Note a config.json that cannot be read or is not JSON
      ansible.builtin.set_fact:
        vaultwarden_config_json_keys: null

- name: Refuse a config.json that is not a JSON object
  ansible.builtin.fail:
    msg: >-
      {{ vaultwarden_config_json }} exists, but it cannot be read or is not a
      JSON object (the error is not shown: it can quote the file, whose
      values can be secrets). Vaultwarden takes the settings of that file
      over the ones the role writes, so the role changes nothing while it
      exists. Move the settings you want to keep into the role's variables
      or vaultwarden_env, then remove the file (rm
      {{ vaultwarden_config_json }}) and run the role again.
  when:
    - vaultwarden_config_json_stat.stat.exists
    - vaultwarden_config_json_keys is none

- name: Refuse the settings saved on the admin page
  ansible.builtin.fail:
    msg: >-
      {{ vaultwarden_config_json }} exists: a save on the admin page wrote it,
      and Vaultwarden takes its settings over the ones the role writes. It
      holds {{ vaultwarden_config_json_keys | join(', ') if vaultwarden_config_json_keys | length > 0 else 'no settings' }}
      (the values are not shown). The role changes nothing while it exists.
      Move the settings you want to keep into the role's variables (SMTP,
      the admin token, push, signups) or vaultwarden_env (the other ones,
      upper-case: log_level is LOG_LEVEL), then remove the file (rm
      {{ vaultwarden_config_json }}) and run the role again. Saving settings
      on the admin page writes it again; managing users there does not.
  when:
    - vaultwarden_config_json_stat.stat.exists
    - vaultwarden_config_json_keys is not none

# A file that is not YAML gets a message of its own, without the parser's
# error (it can quote a line). One that is YAML but not a mapping parses as
# empty and names no version, which is refused below.
- name: Check that the compose file is YAML
  block:
    - name: Parse the compose file
      ansible.builtin.set_fact:
        vaultwarden_compose_on_disk: "{{ vaultwarden_compose_parsed if vaultwarden_compose_parsed is mapping else {} }}"
      vars:
        vaultwarden_compose_parsed: "{{ (vaultwarden_compose_before or '{}') | from_yaml }}"
      no_log: true
  rescue:
    - name: Fail on a compose file that is not YAML
      ansible.builtin.fail:
        msg: >-
          {{ vaultwarden_compose_file }} is not YAML, so the role cannot tell
          what is installed and changes nothing. Put back the compose file the
          role wrote (docker compose config --quiet in {{ vaultwarden_dir }}
          shows the error).

- name: Look for the marker of an install in progress
  ansible.builtin.stat:
    path: "{{ vaultwarden_install_marker }}"
    get_checksum: false
  register: vaultwarden_install_marker_stat

- name: Refuse an install that did not complete
  ansible.builtin.fail:
    msg: >-
      {{ vaultwarden_install_marker }} exists: an install of Vaultwarden in
      {{ vaultwarden_dir }} did not complete. The role changes nothing.
      {{ vaultwarden_install_hint }}
  when: vaultwarden_install_marker_stat.stat.exists

- name: Refuse a marker of an update in progress the role did not write
  ansible.builtin.fail:
    msg: >-
      {{ vaultwarden_update_marker }} exists, but it is not YAML or lacks
      step or to_version (or, with step update, backup), so the role cannot
      tell how far the Vaultwarden update in {{ vaultwarden_dir }} got and
      changes nothing. Check Vaultwarden, then remove it with its copies (rm
      -r {{ vaultwarden_update_marker_files | join(' ') }}).
  when:
    - vaultwarden_update_in_progress | length > 0
    - >-
      vaultwarden_update_in_progress.step | default(none) not in ['backup', 'update']
      or not vaultwarden_update_in_progress.to_version | default('', true) | string is match('^\d+\.\d+\.\d+$')
      or (vaultwarden_update_in_progress.step == 'update'
          and not vaultwarden_update_in_progress.backup | default('', true) | string is match('^/'))

# Step update: the compose file and the secrets may be the new version's, the
# database may be migrated or half migrated, and Vaultwarden may run either
# version or neither. Rolling back on its own would lose what changed since,
# if the update had in fact finished and only the marker's removal was lost;
# the operator decides.
- name: Refuse to run after an interrupted update
  ansible.builtin.fail:
    msg: >-
      {{ vaultwarden_update_marker }} exists: the Vaultwarden update from
      {{ vaultwarden_update_in_progress.from_version | default('?') }} to
      {{ vaultwarden_update_in_progress.to_version }} did not finish (the run
      that started it on {{ vaultwarden_update_in_progress.time | default('?') }}
      stopped after its backup), and the backup from before it is
      {{ vaultwarden_update_in_progress.backup }}. Vaultwarden in
      {{ vaultwarden_dir }} may run either version or neither, with a
      database the new version may have migrated; the role changes nothing.
      To go back to {{ vaultwarden_update_in_progress.from_version | default('?') }},
      set vaultwarden_restore_interrupted: true for one run to restore it
      (the compose file, the secrets, the data{{ ' and the database' if vaultwarden_database != 'sqlite' else '' }}
      from the backup), or remove {{ vaultwarden_update_marker }} to keep
      Vaultwarden as it is now, then check it and run the role again.
  when:
    - vaultwarden_update_in_progress.step | default(none) == 'update'
    - not vaultwarden_restore_interrupted | bool

- name: Look for what the restore of the interrupted update needs
  ansible.builtin.stat:
    path: "{{ vaultwarden_update_in_progress.backup }}/{{ item }}"
    get_checksum: false
  loop: "{{ ['compose.yaml', 'secrets', 'vaultwarden'] + (['vaultwarden.dump'] if vaultwarden_database != 'sqlite' else []) }}"
  register: vaultwarden_restore_needs
  when:
    - vaultwarden_update_in_progress.step | default(none) == 'update'
    - vaultwarden_restore_interrupted | bool

- name: Refuse a restore without its backup
  ansible.builtin.fail:
    msg: >-
      vaultwarden_restore_interrupted is set to restore the backup
      {{ vaultwarden_update_in_progress.backup }} of the interrupted
      Vaultwarden update from
      {{ vaultwarden_update_in_progress.from_version | default('?') }} to
      {{ vaultwarden_update_in_progress.to_version }}, but it lacks
      {{ vaultwarden_restore_missing | join(', ') }}, so the role cannot
      restore it and changes nothing. {{ vaultwarden_restore_hint }} Then
      remove {{ vaultwarden_update_marker }} and run the role again without
      the variable.
  vars:
    vaultwarden_backup: "{{ vaultwarden_update_in_progress.backup }}"
    vaultwarden_restore_missing: >-
      {{ vaultwarden_restore_needs.results | rejectattr('stat.exists') | map(attribute='item') | list }}
  when:
    - vaultwarden_update_in_progress.step | default(none) == 'update'
    - vaultwarden_restore_interrupted | bool
    - vaultwarden_restore_missing | length > 0

# A variable left set must never turn a later interruption into a rollback
# of its own. An update stopped during its backup changed nothing to restore.
- name: Refuse vaultwarden_restore_interrupted without an interrupted update
  ansible.builtin.fail:
    msg: >-
      vaultwarden_restore_interrupted is set, but there is no interrupted
      update in {{ vaultwarden_dir }}; remove the variable{{ (' (' ~ vaultwarden_update_marker
      ~ ' records an update that stopped during its backup, before anything changed;'
      ~ ' the next run without the variable cleans it up and updates)')
      if vaultwarden_update_in_progress.step | default(none) == 'backup' else '' }}.
      The role changes nothing.
  when:
    - vaultwarden_restore_interrupted | bool
    - vaultwarden_update_in_progress.step | default(none) != 'update'

- name: Note the installed version
  ansible.builtin.set_fact:
    vaultwarden_installed_version: >-
      {{ ((((vaultwarden_compose_on_disk.services | default({})).vaultwarden | default({})).image | default(''))
          | string).rpartition(':')[2] }}

- name: Check the installed version
  when: vaultwarden_installed
  block:
    - name: Check that the compose file names the Vaultwarden version
      ansible.builtin.assert:
        that: vaultwarden_installed_version is match('^\d+\.\d+\.\d+$')
        fail_msg: >-
          The Vaultwarden image in {{ vaultwarden_compose_file }} has no tag
          X.Y.Z, so the role cannot tell which version is installed and
          changes nothing. Put back the compose file the role wrote.
        quiet: true

    # Vaultwarden migrates its database on start and cannot migrate it down.
    - name: Refuse a downgrade
      ansible.builtin.fail:
        msg: >-
          vaultwarden_version {{ vaultwarden_version }} is lower than the
          installed version {{ vaultwarden_installed_version }} in
          {{ vaultwarden_dir }}; the role refuses to downgrade, as Vaultwarden
          cannot migrate its database down, and changes nothing. Set
          vaultwarden_version to {{ vaultwarden_installed_version }} or newer.
      # A restore puts the previous compose file back, whatever
      # vaultwarden_version is.
      when:
        - vaultwarden_version is version(vaultwarden_installed_version, '<')
        - vaultwarden_update_in_progress.step | default(none) != 'update'

# What the secrets files hold (only those in use): the Argon2id hash of the
# admin token, with PostgreSQL the database URL (the password
# percent-encoded) and with the own one the password itself for the db
# service, the SMTP password (with a login) and the push installation key.
- name: Note the secrets the role writes
  ansible.builtin.set_fact:
    vaultwarden_secrets: >-
      {{ ({'admin_token': vaultwarden_admin_token_hash | string}
          if vaultwarden_admin_token_hash | string | length > 0 else {})
         | combine({'database_url': vaultwarden_postgres_url | string, 'db_password': vaultwarden_db_password | string}
                   if vaultwarden_database == 'postgres' else {})
         | combine({'database_url': vaultwarden_external_url | string}
                   if vaultwarden_database == 'postgres_external' else {})
         | combine({'smtp_password': vaultwarden_smtp_settings.password | string}
                   if vaultwarden_smtp_settings.host | string | length > 0
                      and vaultwarden_smtp_settings.username | string | length > 0 else {})
         | combine({'push_installation_key': vaultwarden_push_installation_key | string}
                   if vaultwarden_push_installation_id | string | length > 0 else {}) }}
  no_log: true

- name: Find the secrets files
  ansible.builtin.find:
    paths: "{{ vaultwarden_secrets_dir }}"
    file_type: any
    hidden: true
  register: vaultwarden_secrets_on_disk
  when: vaultwarden_installed

- name: Read the secrets files
  ansible.builtin.slurp:
    src: "{{ item }}"
  loop: "{{ vaultwarden_secrets_on_disk.files | default([]) | map(attribute='path') | sort }}"
  register: vaultwarden_secrets_read
  failed_when: false
  no_log: true

# What the files hold, by name (a file that cannot be read as none), computed
# once for the two comparisons below.
- name: Note the secrets files
  ansible.builtin.set_fact:
    vaultwarden_secrets_disk: >-
      {%- set found = {} -%}
      {%- for read in vaultwarden_secrets_read.results | default([]) -%}
      {%-   set _ = found.update({read.item | basename: (read.content | b64decode) if read.content is defined else none}) -%}
      {%- endfor -%}
      {{ found }}
  no_log: true

# A file that cannot be read compares as changed, so a reconfigure writes it.
# vaultwarden_db_password_changed: the password file of the db service (the
# one the database was made with, or last given) is not the password given.
- name: Compare the secrets files with what the role writes
  ansible.builtin.set_fact:
    vaultwarden_secrets_changed: "{{ vaultwarden_secrets_disk != vaultwarden_secrets }}"
    vaultwarden_db_password_changed: >-
      {{ vaultwarden_installed and vaultwarden_database == 'postgres'
         and vaultwarden_secrets_disk.db_password | default(none) != vaultwarden_secrets.db_password }}
  no_log: true

- name: Read the services that run
  ansible.builtin.command:
    argv: [docker, compose, ps, --format, "{{ '{{.Service}}' }}", --status, running]
    chdir: "{{ vaultwarden_dir }}"
  register: vaultwarden_ps
  changed_when: false
  when: vaultwarden_installed

# PostgreSQL takes POSTGRES_PASSWORD_FILE only when it creates the cluster: on
# an existing one a new vaultwarden_db_password would reach Vaultwarden but
# not the database, which Vaultwarden could not connect to. The secrets
# directory records the password the role wrote last; compared in a no_log
# task above, so that neither password is in the output.
# A new password may be the database's already, set by hand as the refusal
# below says. Asked over the network as Vaultwarden connects (the local socket
# needs no password); the password goes through stdin into the environment of
# psql (the x keeps trailing newlines), and the task is no_log. The next task
# fails with the error.
- name: Check that the database takes the new vaultwarden_db_password
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - exec
      - -T
      - db
      - sh
      - -c
      - >-
        PGPASSWORD="$(cat; echo x)"; PGPASSWORD="${PGPASSWORD%x}"; export PGPASSWORD;
        PGCONNECT_TIMEOUT=10 exec psql --host=db --username="$POSTGRES_USER" --dbname="$POSTGRES_DB"
        --no-psqlrc --tuples-only --command='SELECT 1'
    chdir: "{{ vaultwarden_dir }}"
    stdin: "{{ vaultwarden_db_password }}"
    stdin_add_newline: false
  register: vaultwarden_hidden
  changed_when: false
  failed_when: false
  no_log: true
  when:
    - vaultwarden_installed
    - vaultwarden_database == 'postgres'
    - vaultwarden_db_password_changed | bool
    - "'db' in vaultwarden_ps.stdout_lines"

- name: Refuse a vaultwarden_db_password the database does not take
  ansible.builtin.fail:
    msg: >-
      vaultwarden_db_password differs from the password in
      {{ vaultwarden_secrets_dir }}/db_password, and the database does not
      take it ({{ 'the db service is not running, so the role cannot ask'
      if 'db' not in vaultwarden_ps.stdout_lines else vaultwarden_hidden_error }}).
      PostgreSQL takes a password only when it creates the database, so
      Vaultwarden could not connect with the new one; the role changes
      nothing. To change the password, set it in the database first: in
      {{ vaultwarden_dir }} run docker compose exec db psql -U
      {{ vaultwarden_db_user }} -d postgres and enter \password
      {{ vaultwarden_db_user }} (an ALTER USER {{ vaultwarden_db_user }}
      PASSWORD that keeps the password off the command line), then run the
      role again with the new vaultwarden_db_password. Or set
      vaultwarden_db_password back to the old one.
  when:
    - vaultwarden_installed
    - vaultwarden_database == 'postgres'
    - vaultwarden_db_password_changed | bool
    - "'db' not in vaultwarden_ps.stdout_lines or vaultwarden_hidden.rc != 0"

# The PostgreSQL image keeps its cluster in a directory per major below the
# mount (18/docker; main.yml refuses images older than 18): another major
# starts an empty cluster or none at all, so the one cluster's PG_VERSION must
# name the major of vaultwarden_postgres_image. More than one cluster (an old
# one left by pg_upgrade) is refused: which one is current cannot be told, and
# a stale one would start with old data. Up to three levels deep, above the
# PG_VERSION files of the databases inside a cluster.
- name: Look for the PostgreSQL cluster
  ansible.builtin.find:
    paths: "{{ vaultwarden_data_dir }}/postgres"
    patterns: [PG_VERSION]
    file_type: file
    recurse: true
    depth: 3
  register: vaultwarden_pg_version_files
  when:
    - vaultwarden_installed
    - vaultwarden_database == 'postgres'

- name: Read the PostgreSQL major of the cluster
  ansible.builtin.slurp:
    src: "{{ item }}"
  loop: "{{ vaultwarden_pg_version_files.files | default([]) | map(attribute='path') | sort }}"
  register: vaultwarden_pg_version_read

- name: Refuse more than one PostgreSQL cluster
  ansible.builtin.fail:
    msg: >-
      {{ vaultwarden_data_dir }}/postgres holds more than one PostgreSQL
      cluster: {{ vaultwarden_pg_clusters | join(', ') }}. The role cannot
      tell which one Vaultwarden uses (an old one left by pg_upgrade would
      start with old data) and changes nothing. Move every cluster but the
      current one out of {{ vaultwarden_data_dir }}/postgres, then run the
      role again.
  vars:
    vaultwarden_pg_clusters: >-
      {%- set found = [] -%}
      {%- for read in vaultwarden_pg_version_read.results -%}
      {%-   set _ = found.append(read.item ~ ' (PostgreSQL ' ~ (read.content | b64decode | trim) ~ ')') -%}
      {%- endfor -%}
      {{ found }}
  when: vaultwarden_pg_version_read.results | length > 1

- name: Refuse another PostgreSQL major
  ansible.builtin.fail:
    msg: >-
      vaultwarden_postgres_image {{ vaultwarden_postgres_image }} is
      PostgreSQL {{ vaultwarden_postgres_major }}, but the database in
      {{ vaultwarden_data_dir }}/postgres is PostgreSQL
      {{ vaultwarden_pg_major }}
      ({{ vaultwarden_pg_version_read.results[0].item }}). A new major does
      not read the old cluster; the role changes nothing. Set
      vaultwarden_postgres_image back to PostgreSQL {{ vaultwarden_pg_major }},
      or upgrade the cluster (pg_upgrade, or a dump restored into the new
      major) first.
  vars:
    vaultwarden_pg_major: "{{ vaultwarden_pg_version_read.results[0].content | b64decode | trim }}"
  when:
    - vaultwarden_pg_version_read.results | length == 1
    - vaultwarden_postgres_major != vaultwarden_pg_major

# Last of the refusals: it needs the network, the rest only the host.
- name: Check the external PostgreSQL
  ansible.builtin.include_tasks: external.yml
  when: vaultwarden_database == 'postgres_external'

# After every refusal. Step backup: the compose file, the secrets and the
# database are as before the update, and Vaultwarden stopped; the run goes on
# as any other, which with the same vaultwarden_version tries the update
# again and starts Vaultwarden (a run without changes fails on the stopped
# container, as it does for any). A backup being made is below
# <name>.partial, which only an interrupted backup leaves.
- name: Find the partial backups of an update stopped during its backup
  ansible.builtin.find:
    paths: "{{ vaultwarden_backup_dir }}"
    file_type: directory
    patterns: ["{{ vaultwarden_backup_partial_pattern }}"]
    use_regex: true
  register: vaultwarden_partial_backups
  when: vaultwarden_update_in_progress.step | default(none) == 'backup'

- name: Remove what an update stopped during its backup left
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ (vaultwarden_partial_backups.files | default([]) | map(attribute='path') | sort) + vaultwarden_update_marker_files }}"
  when: vaultwarden_update_in_progress.step | default(none) == 'backup'

# After every refusal, so that a refused run leaves both markers;
# update-failed decides on the next run as on this one.
- name: Remove the marker of an update in progress beside its failed update
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ vaultwarden_update_marker_files }}"
  when: vaultwarden_update_rolled_back | bool

# They hold the secrets: left when the marker was removed by hand, as its
# refusal offers, or by a run stopped while it removed the marker and them.
# Only without a marker: one that exists but cannot be read is refused above.
- name: Remove the copies of an update in progress without its marker
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ vaultwarden_update_marker_files | difference([vaultwarden_update_marker]) }}"
  when: not vaultwarden_update_marker_stat.stat.exists

# Written by reconfigure.yml before it writes the secrets and the compose
# file, and removed by main.yml once a run ends healthy: a run stopped in
# between leaves files that equal the settings while the container still runs
# with the old ones (it reads them on start only), so the next run restarts
# it.
- name: Look for a pending restart
  ansible.builtin.stat:
    path: "{{ vaultwarden_restart_marker }}"
    get_checksum: false
  register: vaultwarden_restart_marker_stat

- name: Decide what to do
  ansible.builtin.set_fact:
    vaultwarden_down: "{{ vaultwarden_services | difference(vaultwarden_ps.stdout_lines | default([])) }}"
    vaultwarden_restart_pending: "{{ vaultwarden_installed and vaultwarden_restart_marker_stat.stat.exists }}"
    vaultwarden_state: >-
      {{ 'restore_interrupted' if vaultwarden_update_in_progress.step | default(none) == 'update'
         else 'install' if not vaultwarden_installed
         else 'update' if vaultwarden_version is version(vaultwarden_installed_version, '>')
         else 'reconfigure' if vaultwarden_compose_before != vaultwarden_compose or vaultwarden_secrets_changed | bool
                               or vaultwarden_restart_marker_stat.stat.exists
         else 'noop' }}
