---
# Same installation, other settings: the secrets and the compose file are
# written, Vaultwarden brought to them, and checked. Vaultwarden reads its
# settings (the secrets files among them) only on start, so a changed secret
# alone, which leaves the compose file as it is, restarts it too. A run
# stopped after the secrets are written and before that restart would leave
# files that equal the settings while the container runs with the old ones,
# so vaultwarden_restart_marker is written first; while it exists every run
# reconfigures and restarts, and main.yml removes it once a run ends healthy.

- name: Note the restart before the secrets change
  ansible.builtin.copy:
    dest: "{{ vaultwarden_restart_marker }}"
    content: |
      # Written by the noixdev.infra.vaultwarden role before it changed the
      # secrets of Vaultwarden, and removed once Vaultwarden runs on them.
      # While it exists the role restarts Vaultwarden.
    owner: root
    group: root
    mode: "0644"
  when: vaultwarden_secrets_changed | bool

- name: Write the secrets
  ansible.builtin.include_tasks: secrets.yml

- name: Write the compose file
  ansible.builtin.copy:
    dest: "{{ vaultwarden_compose_file }}"
    content: "{{ vaultwarden_compose }}"
    owner: root
    group: root
    mode: "0644"

- name: Start Vaultwarden with the new configuration
  community.docker.docker_compose_v2:
    project_src: "{{ vaultwarden_dir }}"
    state: present
    pull: missing
    remove_orphans: true
    recreate: "{{ 'always' if vaultwarden_secrets_changed | bool or vaultwarden_restart_pending | bool else 'auto' }}"

- name: Check that Vaultwarden is healthy
  ansible.builtin.include_tasks: health.yml

- name: Fail when Vaultwarden is not healthy
  ansible.builtin.fail:
    msg: >-
      Vaultwarden in {{ vaultwarden_dir }} is not healthy within
      {{ vaultwarden_health_timeout }} seconds after the reconfigure
      ({{ vaultwarden_health_lines | join('; ') }}); see docker compose logs
      in {{ vaultwarden_dir }}.
  when: not vaultwarden_healthy
