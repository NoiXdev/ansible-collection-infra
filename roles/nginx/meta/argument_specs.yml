---
argument_specs:
  main:
    short_description: nginx from nginx.org, hardened, with PHP-pool, proxy and static sites
    description:
      - >-
        Installs nginx of one stable series from nginx.org's repository (Ubuntu 24.04 and 26.04;
        any other release is refused before any change), pinned to that series. Ubuntu's nginx
        packages are pinned out, and unattended-upgrades installs nginx.org's updates within the
        series. An installed nginx of another series, or one that is not nginx.org's (Ubuntu's
        nginx or nginx-common), is refused before any change.
      - >-
        Global hardening: server_tokens off, TLS 1.2 and 1.3 with Mozilla's intermediate ciphers,
        session tickets off, workers as www-data. A default server closes the connection for an
        unknown host name on 80 (444) and rejects the TLS handshake on 443.
      - >-
        nginx_sites is the complete list: each site is /etc/nginx/sites/<name>.conf, with logs
        /var/log/nginx/<name>.access.log and <name>.error.log. A site that leaves the list is
        removed; its web root, logs and certificate stay. www-data joins each site's group, and
        leaves a group no listed site uses any more.
      - >-
        Every config change is tested with nginx -t before nginx reloads; a config nginx rejects
        is never left in place: the run's files are put back and the run fails naming nginx's
        error.
      - >-
        tls letsencrypt: certbot from Ubuntu's archive, with the webroot challenge, gets one
        certificate per site, named after the site (/etc/letsencrypt/live/<name>/), for its
        domains and redirect domains. A site first gets its HTTP block, then its certificate,
        then its TLS block; a run asks again only when the certificate is missing or its names
        differ from the site's. certbot.timer renews the certificates, and the deploy hook
        /etc/letsencrypt/renewal-hooks/deploy/noixdev-nginx reloads nginx after nginx -t.
      - >-
        A certificate request that fails does not stop the other sites: the run fails at the
        end naming each site and domain that failed, and those sites keep what they had (the
        HTTP block of a new site, or the TLS block with the certificate it has) until a later
        run gets the certificate.
      - >-
        The site entries are checked by the role, not here, so that every message names the
        entry; an unknown key in an entry is refused.
    options:
      nginx_version:
        type: str
        description: major.minor stable series to install, for example "1.30".
      nginx_apt_url:
        type: str
        description: The repository URL.
      nginx_apt_suite:
        type: str
        description: Suite of the repository; the host's release codename by default.
      nginx_apt_key_url:
        type: str
        description: Where the repository key is downloaded from.
      nginx_apt_key_fingerprint:
        type: str
        description: Fingerprint the key must carry; any other key is removed and the run fails.
      nginx_sites:
        type: list
        elements: dict
        description:
          - The complete list of sites on the host. Each entry takes exactly these keys.
          - name (required), ^[a-z0-9_-]+$, at most 64 characters, unique.
          - >-
            domains (required), a list of at least one lower-case host name; the first is the
            canonical name. redirect_domains, a list, answer with a 301 to the canonical name. A
            domain belongs to one site.
          - >-
            user (required), the site's system user; it must exist and must not be root. group,
            the site's group, by default the user's primary group (never gid 0); www-data joins
            it, so web roots must be group-readable.
          - >-
            One backend at most. php_pool, the name of a php pool, served by fastcgi to
            /run/php/<php_pool>.sock; only php_front_controller (index.php by default) and the
            paths in php_scripts (below root) go to PHP, any other .php file returns 404. proxy,
            an http(s) upstream URL, with WebSocket upgrades and X-Forwarded-* headers. Neither
            serves root as static files.
          - >-
            root, the document root (an absolute path); required for php_pool and static sites.
            A link below root is followed only when it has the same owner as its target
            (disable_symlinks if_not_owner); the path of root itself is not checked.
          - >-
            tls, letsencrypt (the default; nginx_acme_email is then required), off (HTTP only),
            or {cert, key} with the paths of an existing certificate and key. With TLS, port 80
            answers ACME challenges (/.well-known/acme-challenge/ from /var/lib/noixdev/acme) and
            otherwise with a 301 to HTTPS, for the domains and the redirect domains.
          - >-
            hardening (true by default): the headers X-Content-Type-Options nosniff,
            Referrer-Policy strict-origin-when-cross-origin and X-Frame-Options SAMEORIGIN, HSTS
            (max-age one year, no includeSubDomains) unless hsts is false, and 404 for dotfiles
            and dot-dirs except /.well-known/, composer.json, composer.lock, *.sql, *.bak, *.swp
            and *~.
          - headers, a dict of headers to add or replace; an empty value removes one.
          - rate_limit, the name of a zone of nginx_rate_limit_zones; a request over the rate and burst gets 503.
          - client_max_body_size, 64m by default.
          - user_includes, true by default (deploy snippets).
          - >-
            basic_auth, {users: [{name, password}], allow: [address or CIDR]}: Basic auth for the
            whole site, except the ACME challenges (answered on port 80). The role hashes the
            passwords (SHA-512 crypt, with a salt taken from the site and the user name, so a
            rerun changes nothing; the controller needs passlib) into
            /etc/nginx/noixdev/htpasswd/<site>, root:www-data 0640; a site that drops basic_auth
            or leaves the list loses its file. User names have no ":" and no control characters
            and are listed once; passwords are one-line strings. With allow, those addresses pass
            without a password (satisfy any) and everyone else needs one; without it every
            address needs one. The passwords are handled in no_log tasks only.
          - anubis (false by default) is not supported yet by this version.
          - extra, raw config inside the site's server block.
      nginx_http_extra:
        type: str
        description: Raw config at http level.
      nginx_real_ip_from:
        type: list
        elements: str
        description: Proxies (addresses or CIDRs) whose X-Forwarded-For is trusted.
      nginx_resolvers:
        type: list
        elements: str
        description: >-
          DNS resolvers (host or host:port) nginx asks for the OCSP responder of a {cert, key}
          site; 127.0.0.53 (systemd-resolved) by default. Empty: the responder's addresses from
          the last config load.
      nginx_rate_limit_zones:
        type: list
        elements: dict
        description:
          - Rate-limit zones per client address, used by a site's rate_limit.
          - name (^[a-z0-9_]+$, unique), rate (10r/s or 60r/m, for example) and burst (a whole number).
      nginx_error_pages:
        type: bool
        description: The noix error pages for nginx's own error responses.
      nginx_user_includes:
        type: bool
        description: Deploy snippets for every site; false turns them off.
      nginx_include_user:
        type: str
        description: The user whose snippets are included at http level; none when empty.
      nginx_acme_email:
        type: str
        description: The Let's Encrypt account address; required when a site uses tls letsencrypt.
      nginx_acme_server:
        type: str
        description: >-
          The ACME directory (an https URL) certbot asks; Let's Encrypt's production directory by
          default. certbot keeps it per certificate for the renewals.
