---
# The releases nginx.org has packages for.
nginx_supported_releases: [noble, resolute]

# The origin nginx.org's Release files name, and the Maintainer field of its
# packages (what dpkg keeps of an installed package; Ubuntu's say "Ubuntu
# Developers").
nginx_apt_origin: nginx
nginx_vendor_maintainer: NGINX Packaging

# The packages the apt pin covers: nginx.org's nginx and modules, and Ubuntu's
# nginx-common, nginx-core, libnginx-mod-* and the rest.
nginx_apt_packages: nginx nginx-* libnginx-*

# Installed packages of these names that are not nginx.org's are refused.
nginx_distro_packages: [nginx, nginx-common, nginx-core, nginx-full, nginx-light, nginx-extras]

# Mozilla's "intermediate" TLS configuration (guidelines 6.0). The hybrid
# post-quantum group needs OpenSSL 3.5, which 24.04 does not have.
nginx_tls_ciphers: >-
  ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305
nginx_tls_curves: >-
  {{ 'X25519:prime256v1:secp384r1' if ansible_facts['distribution_release'] == 'noble'
     else 'X25519MLKEM768:X25519:prime256v1:secp384r1' }}

# The directory of each site's config, and the role's own files.
nginx_sites_dir: /etc/nginx/sites
nginx_role_dir: /etc/nginx/noixdev
# The groups www-data joined for the sites, so the next run can leave the
# ones no listed site uses any more.
nginx_groups_state: /etc/nginx/noixdev/site-groups
# The Basic auth users of each site with basic_auth (one file per site, named
# after it): root's, and readable by the workers (www-data) through the group.
nginx_htpasswd_dir: /etc/nginx/noixdev/htpasswd

# Where certbot keeps a tls letsencrypt site's certificate (cert name: the
# site's name).
nginx_letsencrypt_live: /etc/letsencrypt/live
# certbot's webroot: the http-01 tokens, served as /.well-known/acme-challenge/
# on port 80 of every TLS site's domains and redirect domains. Root's only.
nginx_acme_root: /var/lib/noixdev/acme
# Run by certbot after each renewal.
nginx_acme_hook: /etc/letsencrypt/renewal-hooks/deploy/noixdev-nginx
nginx_acme_sites: "{{ nginx_sites_public | selectattr('tls', 'eq', 'letsencrypt') | list }}"
# After the requests of tasks/acme.yml (nginx_acme_requests): the sites that
# got their certificate (rc 0), and one entry per request that did not. A
# result without rc (an error before certbot returned, which failed_when:
# false hides) is a failure; a skipped one (check mode) is neither. certbot
# names the domains whose challenge failed (Domain:, Detail:); for another
# error, its last line or the module's message.
nginx_acme_issued: >-
  {{ nginx_acme_requests.results | selectattr('rc', 'defined') | selectattr('rc', 'eq', 0)
     | map(attribute='item.name') | list }}
nginx_acme_failures: >-
  {%- set failures = [] -%}
  {%- for result in nginx_acme_requests.results
        if not (result.skipped | default(false)) and result.rc | default(none) != 0 -%}
  {%-   set output = result.stdout | default('') ~ '\n' ~ result.stderr | default('') -%}
  {%-   set domains = output | regex_findall('(?m)^\s*Domain: (\S+)') | unique | list -%}
  {%-   set details = output | regex_findall('(?m)^\s*Detail: (.*\S)') -%}
  {%-   set lines = output.splitlines() | map('trim') | select | list -%}
  {%-   set fallback = result.msg | default('certbot exited with ' ~ result.rc | default('no return code')) -%}
  {%-   set _ = failures.append('site ' ~ result.item.name ~ ' ('
                                ~ (domains or (result.item.domains + result.item.redirect_domains)) | join(', ') ~ ': '
                                ~ ((details | join('; ')) if details else (lines | last | default(fallback)))
                                ~ ')') -%}
  {%- endfor -%}
  {{ failures }}
# A site whose request failed keeps what it had: its HTTP block, or its TLS
# block with the certificate it has (a new name that failed).
nginx_acme_failed_msg: >-
  nginx: certbot got no certificate for {{ nginx_acme_failures | join('; ') }};
  {{ 'that site keeps what it had' if nginx_acme_failures | length == 1 else 'those sites keep what they had' }}
  (its HTTP block, or its TLS block with the certificate it has), and the next run asks again

nginx_site_keys:
  - name
  - domains
  - redirect_domains
  - user
  - group
  - php_pool
  - proxy
  - root
  - php_front_controller
  - php_scripts
  - tls
  - hardening
  - hsts
  - headers
  - rate_limit
  - client_max_body_size
  - basic_auth
  - anubis
  - user_includes
  - extra

nginx_site_defaults:
  redirect_domains: []
  php_front_controller: index.php
  php_scripts: []
  tls: letsencrypt
  hardening: true
  hsts: true
  headers: {}
  client_max_body_size: 64m
  anubis: false
  user_includes: true
  extra: ""

# The sites with their defaults and only the keys the role knows, without
# basic_auth (it holds passwords): every loop and template uses these. A loop
# prints its items with -v, also with a label. Instead of basic_auth an entry
# has basic_auth_on and basic_auth_allow (the allowlist, no passwords); the
# htpasswd template alone reads the users, in a no_log task. The key names of
# each entry, in list order, are nginx_sites_key_names.
nginx_sites_key_names: "{{ nginx_sites | map('dict2items') | map('map', attribute='key') | map('list') | list }}"
# YAML reads an unquoted tls: off as false; both mean off here.
nginx_sites_public: >-
  {%- set sites = [] -%}
  {%- for site in nginx_sites -%}
  {%- set known = site | dict2items | selectattr('key', 'in', nginx_site_keys | difference(['basic_auth'])) | items2dict -%}
  {%- set auth = {'basic_auth_on': 'basic_auth' in site,
                  'basic_auth_allow': (site.basic_auth.allow | default([])) if site.get('basic_auth') is mapping else []} -%}
  {%- set entry = nginx_site_defaults | combine(known, auth) -%}
  {%- set _ = sites.append(entry | combine({'tls': 'off'}) if entry.tls is sameas false else entry) -%}
  {%- endfor -%}
  {{ sites }}
nginx_site_names: "{{ nginx_sites_public | map(attribute='name', default='') | list }}"

# Each site's group: the one it names, or its user's primary group. Needs the
# getent facts of tasks/validate.yml.
nginx_gid_names: >-
  {{ dict(ansible_facts.getent_group.values() | map(attribute=1) | zip(ansible_facts.getent_group.keys())) }}
nginx_site_groups: >-
  {{ dict(nginx_site_names | zip(nginx_sites_public | map(attribute='user')
       | map('extract', ansible_facts.getent_passwd) | map(attribute=2) | map('extract', nginx_gid_names)))
     | combine(dict(nginx_sites_public | selectattr('group', 'defined') | map(attribute='name')
       | zip(nginx_sites_public | selectattr('group', 'defined') | map(attribute='group')))) }}

# The Basic auth files no listed site has basic_auth for.
nginx_htpasswd_stale: >-
  {{ nginx_htpasswd_files.files | map(attribute='path')
     | reject('in', nginx_sites_public | selectattr('basic_auth_on') | map(attribute='name')
              | map('regex_replace', '^(.*)$', nginx_htpasswd_dir ~ '/\1') | list)
     | sort }}

# The groups www-data joins (each site's), the ones it was in before this run
# (the getent facts of tasks/validate.yml), and the ones it joined for the
# sites in earlier runs (nginx_groups_state, read in tasks/sites.yml). Before
# the join the state records the earlier ones and those it joins now; after
# the leave, only those still in use.
nginx_groups_current: "{{ nginx_site_groups.values() | unique | sort }}"
nginx_groups_before: >-
  {{ ansible_facts.getent_group | dict2items | selectattr('value.2', 'search', '(^|,)www-data(,|$)')
     | map(attribute='key') | list }}
nginx_groups_previous: >-
  {{ (nginx_groups_state_file.content | default('') | b64decode).splitlines()
     | reject('match', '^#') | reject('eq', '') | list }}
nginx_groups_recorded: >-
  {{ nginx_groups_previous | union(nginx_groups_current | difference(nginx_groups_before)) | sort }}
nginx_groups_kept: "{{ nginx_groups_recorded | intersect(nginx_groups_current) | sort }}"
nginx_groups_header: "# managed by noixdev.infra (nginx role): the groups www-data joined for the sites."

# IPv6 listeners only where the host has IPv6.
nginx_ipv6: "{{ ansible_facts.all_ipv6_addresses | default([]) | length > 0 }}"
