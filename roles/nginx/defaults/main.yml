---
# major.minor stable series from nginx.org's repository (1.30 is the stable
# series as of 2026-11; 1.31 is mainline). Updates within the series come
# through unattended-upgrades. An nginx of another series that is installed
# already is refused, never replaced.
nginx_version: "1.30"

nginx_apt_url: https://nginx.org/packages/ubuntu
nginx_apt_suite: "{{ ansible_facts['distribution_release'] }}"
nginx_apt_key_url: https://nginx.org/keys/nginx_signing.key
# The key that signs the repository (nginx signing key <signing-key-2@nginx.com>).
nginx_apt_key_fingerprint: 8540A6F18833A80E9C1653A42FD21310B49F6B46

# The complete list of sites on the host: a site that is not listed is removed
# (its config; its web root, logs and certificate stay).
#   - name: prod                       # ^[a-z0-9_-]+$, unique
#     domains: [shop.example.test]     # the first is the canonical name
#     redirect_domains: [www.shop.example.test]   # 301 to the canonical name
#     user: app_prod                   # must exist, never root
#     group: app_prod                  # the user's primary group by default;
#                                      # nginx's www-data joins it
#     # One backend at most: php_pool or proxy; neither serves root as static
#     # files.
#     php_pool: production             # fastcgi to /run/php/production.sock
#     root: /srv/prod/public           # required for php_pool and static
#     php_front_controller: index.php  # the default
#     php_scripts: [setup/install.php] # other .php files passed to PHP
#     # proxy: http://127.0.0.1:3000   # with WebSocket upgrades
#     tls: letsencrypt                 # the default; off, or {cert, key}
#     hardening: true                  # headers, HSTS, blocked paths
#     hsts: true
#     headers: {}                      # added or replaced; "" removes one
#     rate_limit: default              # a zone of nginx_rate_limit_zones
#     client_max_body_size: 64m
#     anubis: false                    # Anubis checks every request first
#     extra: ""                        # raw config inside the server block
nginx_sites: []

# Raw config at http level.
nginx_http_extra: ""

# Proxies whose X-Forwarded-For is trusted (a CDN or a load balancer in
# front); addresses or CIDRs.
nginx_real_ip_from: []

# Rate-limit zones a site can name in rate_limit, per client address.
nginx_rate_limit_zones:
  - name: default
    rate: 10r/s
    burst: 20

# The DNS resolvers nginx asks for the OCSP responder of a {cert, key} site
# (stapling), as host or host:port; systemd-resolved's stub by default. Empty:
# nginx uses the responder's addresses from its last config load (and logs
# "no resolver defined" on each update).
nginx_resolvers: [127.0.0.53]

# The noix error pages for nginx's own error responses (the 4xx and 5xx nginx
# answers itself, such as a blocked path, a body over client_max_body_size, a
# rate limit or a pool that does not answer); an app's own answers pass
# unchanged (no fastcgi_intercept_errors or proxy_intercept_errors). The
# error_pages_export role runs nginx_error_pages_image once in Docker and
# writes static files to nginx_error_pages_dir (current/pages/<language>/),
# again only when the image, theme, environment or codes change. Docker must
# run on the host (the docker role); without it the run is refused before any
# change. Every site serves the pages of the export's default language for
# nginx_error_pages_codes at /.noix-error/<code>.html (internal). false: no
# error_page lines (the exported files stay).
nginx_error_pages: true
nginx_error_pages_image: noixdev/error-pages:1.0.0
nginx_error_pages_theme: classic
# The export's environment (LANGUAGES, DEFAULT_LANGUAGE, ...). THEME is
# nginx_error_pages_theme and SHOW_DETAILS is always false; MAINTENANCE,
# MAINTENANCE_UNTIL, LISTEN and CONFIG_FILE are ignored.
nginx_error_pages_env: {}
nginx_error_pages_codes: [403, 404, 413, 414, 429, 500, 502, 503, 504]
nginx_error_pages_dir: /var/www/noix-error-pages
nginx_error_pages_export_script: /usr/local/sbin/noix-error-pages-export

# Anubis for the sites with anubis: true: the anubis role in host mode on this
# host, published on 127.0.0.1:nginx_anubis_port (its anubis_host_port). A run
# with such a site is refused before any change while nothing answers there.
nginx_anubis_port: 8923

# Deploy snippets (per site in ~<user>/.config/nginx/<name>/, and at http
# level in ~<nginx_include_user>/.config/nginx/global/) are not supported yet
# by this version of the role: nginx_user_includes true, a non-empty
# nginx_include_user and a site's user_includes true are refused before any
# change.
nginx_user_includes: false
nginx_include_user: ""

# Let's Encrypt (tls letsencrypt, through certbot from Ubuntu's archive): the
# account address (required when a site uses tls letsencrypt) and the ACME
# directory. Each site's certificate is /etc/letsencrypt/live/<name>/, for its
# domains and redirect domains; certbot.timer renews it, and a deploy hook
# reloads nginx.
nginx_acme_email: ""
nginx_acme_server: https://acme-v02.api.letsencrypt.org/directory
