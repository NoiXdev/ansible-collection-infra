---
- name: Create the role's nginx directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ nginx_role_dir }}"
    - "{{ nginx_sites_dir }}"

# The package's conf.d/default.conf (a server for localhost) goes; dpkg does
# not bring back a conffile that was removed.
- name: Apply the global config
  ansible.builtin.include_tasks: apply.yml
  vars:
    nginx_apply_files:
      - {src: nginx.conf.j2, dest: /etc/nginx/nginx.conf, mode: "0644"}
      - {src: default-server.conf.j2, dest: /etc/nginx/conf.d/00-default.conf, mode: "0644"}
      - {src: hardening.conf.j2, dest: "{{ nginx_role_dir }}/hardening.conf", mode: "0644"}
    nginx_apply_remove:
      - /etc/nginx/conf.d/default.conf
