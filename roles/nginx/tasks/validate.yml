---
# Every message names the entry. The site loops use nginx_sites_public (the
# known keys with their defaults, without basic_auth); the key check alone
# reads the key names of the entries as given. Each check relies on the ones
# before it.
- name: Check the series and the global settings
  ansible.builtin.assert:
    that:
      - nginx_version is string and nginx_version is match('^[0-9]+[.][0-9]+$')
      - nginx_http_extra is string
      - nginx_acme_email is string
      - nginx_acme_email == '' or nginx_acme_email is match('^[^@\s]+@[^@\s]+$')
      - nginx_acme_server is string and nginx_acme_server is match('^https://\S+$')
      - nginx_error_pages is boolean
      - nginx_user_includes is boolean
      - nginx_include_user is string
      - nginx_anubis_port | string is match('^[0-9]+$')
      - nginx_anubis_port | int >= 1 and nginx_anubis_port | int <= 65535
    fail_msg: >-
      nginx: nginx_version must be a major.minor series such as "1.30", nginx_http_extra a
      string, nginx_acme_email empty or an address, nginx_acme_server an https URL,
      nginx_error_pages and nginx_user_includes true or false, nginx_include_user a user name,
      nginx_anubis_port a port number
    quiet: true

# The paths go into the site configs and the export script as they are.
- name: Check the error pages settings
  ansible.builtin.assert:
    that:
      - nginx_error_pages_image is string and nginx_error_pages_image | length > 0
      - nginx_error_pages_theme is string and nginx_error_pages_theme is match('^[A-Za-z0-9_-]+$')
      - nginx_error_pages_env is mapping
      - nginx_error_pages_codes is sequence and nginx_error_pages_codes is not string and nginx_error_pages_codes is not mapping
      - nginx_error_pages_codes | length > 0
      - nginx_error_pages_codes | map('string') | reject('match', '^[45][0-9][0-9]$') | list | length == 0
      - nginx_error_pages_dir is string and nginx_error_pages_dir is match('^(/[A-Za-z0-9._@+=,~-]+)+$')
      - nginx_error_pages_dir | split('/') | select('in', ['.', '..']) | list | length == 0
      - nginx_error_pages_export_script is string and nginx_error_pages_export_script is match('^(/[A-Za-z0-9._@+=,~-]+)+$')
    fail_msg: >-
      nginx: the error pages need an image, a theme name (^[A-Za-z0-9_-]+$), nginx_error_pages_env
      a mapping, nginx_error_pages_codes a list of 4xx and 5xx status codes, and
      nginx_error_pages_dir and nginx_error_pages_export_script absolute paths without spaces,
      quotes or . and .. parts
    quiet: true
  when: nginx_error_pages

- name: Check the trusted proxies
  ansible.builtin.assert:
    that: item is string and item is match('^[0-9A-Fa-f.:]+(/[0-9]{1,3})?$')
    fail_msg: "nginx: nginx_real_ip_from has {{ item }}, which is not an address or CIDR"
    quiet: true
  loop: "{{ nginx_real_ip_from }}"

- name: Check that no trusted proxy range covers every address
  ansible.builtin.assert:
    that: item is not match('.*/0+$')
    fail_msg: >-
      nginx: nginx_real_ip_from has {{ item }}, a range of every address; any client could forge
      the address the allow lists and rate limits see. Only proxies you control belong there
    quiet: true
  loop: "{{ nginx_real_ip_from }}"

- name: Check the resolvers
  ansible.builtin.assert:
    that: item is string and item is match('^([0-9.]+|\[[0-9A-Fa-f:]+\]|[A-Za-z0-9.-]+)(:[0-9]+)?$')
    fail_msg: "nginx: nginx_resolvers has {{ item }}, which is not an address, [IPv6 address] or host name with an optional :port"
    quiet: true
  loop: "{{ nginx_resolvers }}"

- name: Check the rate-limit zones
  ansible.builtin.assert:
    that:
      - item.keys() | difference(['name', 'rate', 'burst']) | length == 0
      - item.name is defined and item.name is string and item.name is match('^[a-z0-9_]+$')
      - nginx_rate_limit_zones | map(attribute='name', default='') | select('eq', item.name) | list | length == 1
      - item.rate is defined and item.rate is string and item.rate is match('^[0-9]+r/[sm]$')
      - item.burst | default(0) | string is match('^[0-9]+$')
    fail_msg: >-
      nginx: nginx_rate_limit_zones entry {{ item.name | default('#' ~ (nginx_index + 1)) }} is
      invalid; it takes a unique name (^[a-z0-9_]+$), a rate such as 10r/s or 60r/m, and a burst
      (a whole number)
    quiet: true
  loop: "{{ nginx_rate_limit_zones }}"
  loop_control:
    index_var: nginx_index
    label: "{{ item.name | default('#' ~ (nginx_index + 1)) }}"

- name: Check the site keys
  ansible.builtin.assert:
    that: nginx_unknown | length == 0
    fail_msg: >-
      nginx: nginx_sites entry {{ nginx_entry }} has unknown keys ({{ nginx_unknown | join(', ') }});
      its keys are {{ nginx_site_keys | join(', ') }}
    quiet: true
  vars:
    nginx_entry: "{{ nginx_sites_public[nginx_index].name | default('#' ~ (nginx_index + 1)) }}"
    nginx_unknown: "{{ item | difference(nginx_site_keys) | sort }}"
  loop: "{{ nginx_sites_key_names }}"
  loop_control:
    index_var: nginx_index
    label: "{{ nginx_entry }}"

- name: Check the site names
  ansible.builtin.assert:
    that:
      - item.name is defined and item.name is string
      - item.name is match('^[a-z0-9_-]+$') and item.name | length <= 64
    fail_msg: >-
      nginx: nginx_sites entry '{{ item.name | default('#' ~ (nginx_index + 1)) }}' has an invalid
      name; it must match ^[a-z0-9_-]+$ and be at most 64 characters long
    quiet: true
  loop: "{{ nginx_sites_public }}"
  loop_control:
    index_var: nginx_index
    label: "{{ item.name | default('#' ~ (nginx_index + 1)) }}"

- name: Check that every site name is used once
  ansible.builtin.assert:
    that: nginx_site_names | select('eq', item.name) | list | length == 1
    fail_msg: "nginx: nginx_sites has more than one entry named {{ item.name }}"
    quiet: true
  loop: "{{ nginx_sites_public }}"
  loop_control:
    label: "{{ item.name }}"

# Lower-case host names: they are server_names and certificate names.
- name: Check the domains
  ansible.builtin.assert:
    that:
      - item.domains is defined and item.domains is sequence and item.domains is not string and item.domains is not mapping
      - item.domains | length > 0
      - item.redirect_domains is sequence and item.redirect_domains is not string and item.redirect_domains is not mapping
      - nginx_domains | reject('string') | list | length == 0
      - nginx_domains | reject('match', nginx_hostname) | list | length == 0
      - nginx_domains | unique | length == nginx_domains | length
    fail_msg: >-
      nginx: nginx_sites entry {{ item.name }} has invalid domains; domains is a list of at least
      one host name and redirect_domains a list (lower-case names such as shop.example.test, each
      listed once)
    quiet: true
  vars:
    nginx_hostname: '^(?=.{1,253}$)[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?([.][a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?)*$'
    nginx_domains: "{{ (item.domains | default([]) | list) + (item.redirect_domains | list) }}"
  loop: "{{ nginx_sites_public }}"
  loop_control:
    label: "{{ item.name }}"

- name: Check that every domain belongs to one site
  ansible.builtin.assert:
    that: nginx_taken | length == 0
    fail_msg: >-
      nginx: nginx_sites entry {{ item.name }} lists the domain {{ nginx_first[0] }}, which entry
      {{ nginx_first[1] }} lists too; a domain belongs to one site
    quiet: true
  vars:
    nginx_first: "{{ nginx_taken | first | default(['', '']) }}"
    nginx_taken: >-
      {%- set taken = [] -%}
      {%- for other in nginx_sites_public[:nginx_index] -%}
      {%- for domain in item.domains + item.redirect_domains if domain in other.domains + other.redirect_domains -%}
      {%- set _ = taken.append([domain, other.name]) -%}
      {%- endfor -%}
      {%- endfor -%}
      {{ taken }}
  loop: "{{ nginx_sites_public }}"
  loop_control:
    index_var: nginx_index
    label: "{{ item.name }}"

- name: Read the system users
  ansible.builtin.getent:
    database: passwd

- name: Read the system groups
  ansible.builtin.getent:
    database: group

- name: Check that every site user exists
  ansible.builtin.assert:
    that: item.user is defined and item.user is string and item.user in ansible_facts.getent_passwd
    fail_msg: >-
      nginx: nginx_sites entry {{ item.name }} has the user {{ item.user | default('(none)') }},
      which does not exist; the role does not create users
    quiet: true
  loop: "{{ nginx_sites_public }}"
  loop_control:
    label: "{{ item.name }}"

- name: Check that no site belongs to root
  ansible.builtin.assert:
    that:
      - item.user != 'root'
      - ansible_facts.getent_passwd[item.user][1] | int != 0
    fail_msg: "nginx: nginx_sites entry {{ item.name }} has the user {{ item.user }}; a site belongs to an unprivileged user"
    quiet: true
  loop: "{{ nginx_sites_public }}"
  loop_control:
    label: "{{ item.name }}"

- name: Check the site groups
  ansible.builtin.assert:
    that: item.group is string and item.group in ansible_facts.getent_group
    fail_msg: "nginx: nginx_sites entry {{ item.name }} has the group {{ item.group }}, which does not exist"
    quiet: true
  loop: "{{ nginx_sites_public | selectattr('group', 'defined') }}"
  loop_control:
    label: "{{ item.name }}"

- name: Check the primary groups of the site users
  ansible.builtin.assert:
    that: ansible_facts.getent_passwd[item.user][2] in nginx_gid_names
    fail_msg: >-
      nginx: nginx_sites entry {{ item.name }} has the user {{ item.user }}, whose primary group
      (gid {{ ansible_facts.getent_passwd[item.user][2] }}) has no group entry; set group
    quiet: true
  loop: "{{ nginx_sites_public | rejectattr('group', 'defined') }}"
  loop_control:
    label: "{{ item.name }}"

# www-data joins each site's group.
- name: Check that no site has the root group
  ansible.builtin.assert:
    that:
      - nginx_site_groups[item.name] != 'root'
      - ansible_facts.getent_group[nginx_site_groups[item.name]][1] | int != 0
    fail_msg: >-
      nginx: nginx_sites entry {{ item.name }} has the group {{ nginx_site_groups[item.name] }}
      (gid {{ ansible_facts.getent_group[nginx_site_groups[item.name]][1] }}); www-data joins a
      site's group, which must not be root
    quiet: true
  loop: "{{ nginx_sites_public }}"
  loop_control:
    label: "{{ item.name }}"

- name: Check the backends
  ansible.builtin.assert:
    that:
      - item.php_pool is not defined or item.proxy is not defined
    fail_msg: "nginx: nginx_sites entry {{ item.name }} has php_pool and proxy; a site has one backend at most"
    quiet: true
  loop: "{{ nginx_sites_public }}"
  loop_control:
    label: "{{ item.name }}"

- name: Check the web roots
  ansible.builtin.assert:
    that: item.root is defined
    fail_msg: >-
      nginx: nginx_sites entry {{ item.name }}
      {{- (' has php_pool ' ~ item.php_pool ~ ' but no root') if item.php_pool is defined
          else ' has no backend and no root; a static site serves its root' }}
    quiet: true
  loop: "{{ nginx_sites_public | rejectattr('proxy', 'defined') }}"
  loop_control:
    label: "{{ item.name }}"

# Paths and names go into the config as they are: no spaces, quotes, ;, { or
# }, $ or . and .. parts.
- name: Check the backend settings
  ansible.builtin.assert:
    that:
      - item.php_pool is not defined or (item.php_pool is string and item.php_pool is match('^[a-z0-9_-]+$'))
      - item.proxy is not defined or (item.proxy is string and item.proxy is match(nginx_url))
      - item.root is not defined or (item.root is string and item.root is match(nginx_path))
      - nginx_root_parts | select('in', ['.', '..']) | list | length == 0
      - item.php_front_controller is string and item.php_front_controller is match(nginx_script)
      - item.php_scripts is sequence and item.php_scripts is not string and item.php_scripts is not mapping
      - item.php_scripts | reject('string') | list | length == 0
      - item.php_scripts | reject('match', nginx_script) | list | length == 0
    fail_msg: >-
      nginx: nginx_sites entry {{ item.name }} has an invalid php_pool, proxy, root,
      php_front_controller or php_scripts; php_pool is a pool name (^[a-z0-9_-]+$), proxy an
      http(s) URL such as http://127.0.0.1:3000, root an absolute path, and the scripts paths
      below root ending in .php, all without spaces, quotes or . and .. parts
    quiet: true
  vars:
    nginx_path: '^(/[A-Za-z0-9._@+=,~-]+)+/?$'
    nginx_url: '^https?://[A-Za-z0-9.\[\]:_-]+(/[A-Za-z0-9._~%/-]*)?$'
    nginx_script: '^(?!.*(^|/)[.]{1,2}(/|$))[A-Za-z0-9_.-]+(/[A-Za-z0-9_.-]+)*[.]php$'
    nginx_root_parts: "{{ item.root | default('/') | string | split('/') }}"
  loop: "{{ nginx_sites_public }}"
  loop_control:
    label: "{{ item.name }}"

# The export writes the error pages as root: no site root (its user's to
# write) holds nginx_error_pages_dir or lies inside it.
- name: Check that no web root overlaps the error pages
  ansible.builtin.assert:
    that:
      - not (nginx_root ~ '/').startswith(nginx_error_pages_dir ~ '/')
      - not (nginx_error_pages_dir ~ '/').startswith(nginx_root ~ '/')
    fail_msg: >-
      nginx: nginx_sites entry {{ item.name }} has the root {{ item.root }}, which overlaps
      nginx_error_pages_dir {{ nginx_error_pages_dir }}; the error pages are root's
    quiet: true
  vars:
    nginx_root: "{{ item.root | regex_replace('/$', '') }}"
  loop: "{{ nginx_sites_public | selectattr('root', 'defined') }}"
  loop_control:
    label: "{{ item.name }}"
  when: nginx_error_pages

- name: Check the TLS settings
  ansible.builtin.assert:
    that: >-
      item.tls in ['letsencrypt', 'off']
      or (item.tls is mapping and item.tls.keys() | sort == ['cert', 'key']
          and item.tls.cert is string and item.tls.cert is match(nginx_path)
          and item.tls.key is string and item.tls.key is match(nginx_path))
    fail_msg: >-
      nginx: nginx_sites entry {{ item.name }} has an invalid tls; it is letsencrypt, off, or
      {cert, key} with the absolute paths of a certificate and its key
    quiet: true
  vars:
    nginx_path: '^(/[A-Za-z0-9._@+=,~-]+)+$'
  loop: "{{ nginx_sites_public }}"
  loop_control:
    label: "{{ item.name }}"

- name: Check the Let's Encrypt address
  ansible.builtin.assert:
    that: nginx_acme_email | length > 0
    fail_msg: "nginx: nginx_sites entry {{ item.name }} uses tls letsencrypt, and nginx_acme_email is empty"
    quiet: true
  loop: "{{ nginx_sites_public | selectattr('tls', 'eq', 'letsencrypt') }}"
  loop_control:
    label: "{{ item.name }}"

- name: Check the switches and headers
  ansible.builtin.assert:
    that:
      - item.hardening is boolean and item.hsts is boolean
      - item.user_includes is boolean and item.anubis is boolean
      - item.headers is mapping
      - nginx_headers | rejectattr('key', 'match', '^[A-Za-z0-9-]+$') | list | length == 0
      - nginx_headers | rejectattr('value', 'string') | list | length == 0
      - nginx_headers | selectattr('value', 'search', '[\r\n\x00]') | list | length == 0
      - item.client_max_body_size | string is match('^[0-9]+[kKmMgG]?$')
      - item.extra is string
    fail_msg: >-
      nginx: nginx_sites entry {{ item.name }} has an invalid hardening, hsts, user_includes,
      anubis, headers, client_max_body_size or extra; the switches are true or false, headers
      names (^[A-Za-z0-9-]+$) with one-line string values, client_max_body_size a size such as
      64m, and extra a string
    quiet: true
  vars:
    nginx_headers: "{{ item.headers | dict2items if item.headers is mapping else [] }}"
  loop: "{{ nginx_sites_public }}"
  loop_control:
    label: "{{ item.name }}"

- name: Check the rate limits
  ansible.builtin.assert:
    that: item.rate_limit in nginx_rate_limit_zones | map(attribute='name') | list
    fail_msg: >-
      nginx: nginx_sites entry {{ item.name }} has rate_limit {{ item.rate_limit }}, which
      nginx_rate_limit_zones does not define ({{ nginx_rate_limit_zones | map(attribute='name') | join(', ') }})
    quiet: true
  loop: "{{ nginx_sites_public | selectattr('rate_limit', 'defined') }}"
  loop_control:
    label: "{{ item.name }}"

# basic_auth holds passwords: the checks run in no_log tasks and a message
# names the site and the user, never a password (or a hash). The problems are
# collected first, so one message lists them all.
- name: Check the Basic auth settings
  ansible.builtin.assert:
    that: nginx_auth_problems | length == 0
    fail_msg: >-
      nginx: nginx_sites entry {{ item.name | default('#' ~ (nginx_index + 1)) }} has an invalid
      basic_auth: {{ nginx_auth_problems | join('; ') }}. It is {users: [{name, password}], allow:
      [address or CIDR]}: at least one user, names without ":" or control characters, not starting with # or a space, and listed
      once, one-line string passwords (quote a number), and allow entries such as 192.0.2.10 or
      192.0.2.0/24
    quiet: true
  vars:
    nginx_auth_address: '^[0-9A-Fa-f.:]+(/[0-9]{1,3})?$'
    nginx_auth_problems: >-
      {%- set problems = [] -%}
      {%- set auth = item.basic_auth -%}
      {%- if auth is not mapping -%}
      {%-   set _ = problems.append('basic_auth is not a mapping') -%}
      {%- else -%}
      {%-   set unknown = auth.keys() | difference(['users', 'allow']) | sort -%}
      {%-   if unknown | length > 0 -%}
      {%-     set _ = problems.append('unknown keys (' ~ unknown | join(', ') ~ ')') -%}
      {%-   endif -%}
      {%-   set users = auth.users | default(none) -%}
      {%-   if users is not sequence or users is string or users is mapping or users | length == 0 -%}
      {%-     set _ = problems.append('users is a list of at least one user') -%}
      {%-   else -%}
      {%-     set names = [] -%}
      {%-     for user in users -%}
      {%-       set position = loop.index -%}
      {%-       if user is not mapping -%}
      {%-         set _ = problems.append('user #' ~ position ~ ' is not a mapping with name and password') -%}
      {%-       else -%}
      {%-         set extra = user.keys() | difference(['name', 'password']) | sort -%}
      {%-         if extra | length > 0 -%}
      {%-           set _ = problems.append('user #' ~ position ~ ' has unknown keys (' ~ extra | join(', ') ~ ')') -%}
      {%-         endif -%}
      {%-         set name = user.name | default(none) -%}
      {%-         set name_ok = name is string and name | length > 0 and name is not search('[:\\x00-\\x1f\\x7f]') and name is not search('^[#\\s]') -%}
      {%-         if not name_ok -%}
      {%-           set _ = problems.append('user #' ~ position ~ ' has no name, or a name with ":", a control character or a leading # or space') -%}
      {%-         else -%}
      {%-           if name in names -%}
      {%-             set _ = problems.append('user ' ~ name ~ ' is listed twice') -%}
      {%-           endif -%}
      {%-           set _ = names.append(name) -%}
      {%-         endif -%}
      {%-         set label = ('user ' ~ name) if name_ok else 'user #' ~ position -%}
      {%-         set password = user.password | default(none) -%}
      {%-         if password is not string or password | length == 0 or password is search('[\\r\\n\\x00]') -%}
      {%-           set _ = problems.append(label ~ ' has no password, or a password that is not a one-line string') -%}
      {%-         endif -%}
      {%-       endif -%}
      {%-     endfor -%}
      {%-   endif -%}
      {%-   set allow = auth.allow | default([]) -%}
      {%-   if allow is not sequence or allow is string or allow is mapping -%}
      {%-     set _ = problems.append('allow is a list of addresses or CIDRs') -%}
      {%-   elif allow | reject('string') | list | length > 0 or allow | reject('match', nginx_auth_address) | list | length > 0 -%}
      {%-     set _ = problems.append('allow has an entry that is not an address or CIDR') -%}
      {%-   endif -%}
      {%- endif -%}
      {{ problems }}
  loop: "{{ nginx_sites | selectattr('basic_auth', 'defined') }}"
  loop_control:
    index_var: nginx_index
    label: "{{ item.name | default('#' ~ (nginx_index + 1)) }}"
  no_log: true

# Deploy snippets come with a later version of the role; until then a host or
# a site that asks for them is refused rather than served without them.
- name: Check for deploy snippets, which this version does not support yet
  ansible.builtin.assert:
    that:
      - not nginx_user_includes
      - nginx_include_user | length == 0
    fail_msg: >-
      nginx: {{ 'nginx_user_includes is true' if nginx_user_includes else 'nginx_include_user is set' }};
      deploy snippets are not supported yet by this version of the role
    quiet: true

- name: Check for site deploy snippets, which this version does not support yet
  ansible.builtin.assert:
    that: not item.user_includes
    fail_msg: >-
      nginx: nginx_sites entry {{ item.name }} sets user_includes; deploy snippets are not
      supported yet by this version of the role
    quiet: true
  loop: "{{ nginx_sites_public }}"
  loop_control:
    label: "{{ item.name }}"

# Anubis answers a request it challenges with a 401 (error_page 401), which
# would replace Basic auth's 401 (and its WWW-Authenticate) with the
# challenge page: a browser could never log in.
- name: Check that no site has Basic auth and Anubis
  ansible.builtin.assert:
    that: not (item.basic_auth_on and item.anubis)
    fail_msg: >-
      nginx: nginx_sites entry {{ item.name }} has basic_auth and anubis; Anubis would answer
      Basic auth's 401 with its challenge, so a site has one of them at most
    quiet: true
  loop: "{{ nginx_sites_public }}"
  loop_control:
    label: "{{ item.name }}"

# The challenge is the 401 nginx gets from Anubis; a noix page for 401 would
# replace it.
- name: Check that the error pages leave Anubis's 401 alone
  ansible.builtin.assert:
    that: nginx_error_pages_codes | map('int') | select('eq', 401) | list | length == 0
    fail_msg: >-
      nginx: nginx_error_pages_codes has 401, and nginx_sites entry {{ nginx_anubis_sites[0].name }}
      sets anubis, whose challenge is a 401; remove 401 from the codes
    quiet: true
  when:
    - nginx_error_pages
    - nginx_anubis_sites | length > 0

# The hashes come from password_hash, which needs passlib (or libxcrypt) on the
# controller; without it the run would fail after earlier changes. The probe
# hashes a fixed text, not a password.
- name: Check that the controller can hash the Basic auth passwords
  ansible.builtin.set_fact:
    nginx_hash_probe: "{{ 'probe' | password_hash('sha512', 'abcdefghabcdefgh', rounds=5000) }}"
  when: nginx_sites | selectattr('basic_auth', 'defined') | list | length > 0
  register: nginx_hash_check
  ignore_errors: true
  no_log: true

- name: Refuse basic_auth when the controller cannot hash
  ansible.builtin.fail:
    msg: >-
      nginx: basic_auth needs passlib on the controller (the Python that runs ansible-playbook)
      to hash the passwords as SHA-512 crypt; install it there (pip install passlib)
  when: nginx_hash_check is failed
