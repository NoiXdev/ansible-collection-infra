---
- name: Create the role's nginx directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ nginx_role_dir }}"
    - "{{ nginx_sites_dir }}"

- name: Read the groups www-data joined for the sites
  ansible.builtin.slurp:
    src: "{{ nginx_groups_state }}"
  register: nginx_groups_state_file
  failed_when: false

# A tls letsencrypt site gets its TLS block once its certificate is there
# (certbot's cert name is the site's name); until then only its HTTP block,
# which answers the challenges of the request in acme.yml.
- name: Look for the Let's Encrypt certificates
  ansible.builtin.stat:
    path: "{{ nginx_letsencrypt_live }}/{{ item.name }}/fullchain.pem"
  loop: "{{ nginx_sites_public | selectattr('tls', 'eq', 'letsencrypt') }}"
  loop_control:
    label: "{{ item.name }}"
  register: nginx_letsencrypt_certs

# www-data reads the web roots through each site's group. A group that no
# listed site uses any more is left below, after the configs changed; only
# the groups www-data joined for a site, recorded in nginx_groups_state
# before it joins them: a run that fails after the join still leaves them
# when their site goes.
- name: Record the groups www-data joins for the sites
  ansible.builtin.copy:
    content: "{{ nginx_groups_content }}"
    dest: "{{ nginx_groups_state }}"
    owner: root
    group: root
    mode: "0644"
  vars:
    nginx_groups_content: "{{ ([nginx_groups_header] + nginx_groups_recorded) | join('\n') ~ '\n' }}"

- name: Let www-data join the site groups
  ansible.builtin.user:
    name: www-data
    groups: "{{ nginx_groups_current }}"
    append: true
  when: nginx_groups_current | length > 0
  # Workers get their groups when they start: a reload starts new ones.
  notify: Reload nginx

- name: Find the site configs
  ansible.builtin.find:
    paths: "{{ nginx_sites_dir }}"
    patterns: "*.conf"
    file_type: any
  register: nginx_site_files

# The Basic auth users: root's files in a directory of the role, never in a
# site user's reach. They are written before the site configs that name them
# and, for a site that no longer has basic_auth, removed after the configs
# stopped naming them.
- name: Create the directory of the Basic auth users
  ansible.builtin.file:
    path: "{{ nginx_htpasswd_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Find the files of Basic auth users
  ansible.builtin.find:
    paths: "{{ nginx_htpasswd_dir }}"
    patterns: '^[a-z0-9_-]+$'
    use_regex: true
    file_type: any
  register: nginx_htpasswd_files

# no_log: the template hashes the passwords.
- name: Write the Basic auth users
  ansible.builtin.include_tasks: apply.yml
  vars:
    nginx_apply_no_log: true
    nginx_apply_files: >-
      {%- set files = [] -%}
      {%- for site in nginx_sites_public if site.basic_auth_on -%}
      {%- set _ = files.append({'src': 'htpasswd.j2', 'dest': nginx_htpasswd_dir ~ '/' ~ site.name, 'mode': '0640',
                                'group': 'www-data', 'site': site}) -%}
      {%- endfor -%}
      {{ files }}
  when: nginx_sites_public | selectattr('basic_auth_on') | list | length > 0

# Varnish's front key for the varnish sites: read from the varnish role's
# file, and written into a root-only include (nginx's master reads it as
# root) before the site configs that include it; it leaves after the last
# varnish site's config stopped including it. Never shown: the read, the
# check and the write log nothing of it.
- name: Read Varnish's front key
  ansible.builtin.slurp:
    src: "{{ nginx_varnish_key_file }}"
  register: nginx_varnish_key_read
  when: nginx_varnish_sites | length > 0
  no_log: true

- name: Check Varnish's front key
  ansible.builtin.fail:
    msg: >-
      nginx: the front key in {{ nginx_varnish_key_file }} is not 64 hexadecimal digits; delete
      the file and run the varnish role, which creates a new one
  when:
    - nginx_varnish_sites | length > 0
    - nginx_varnish_front_key is not match('^[0-9a-f]{64}$')

- name: Write Varnish's front key for nginx
  ansible.builtin.include_tasks: apply.yml
  vars:
    nginx_apply_no_log: true
    nginx_apply_files:
      - {src: varnish-front.conf.j2, dest: "{{ nginx_varnish_front_conf }}", mode: "0600"}
  when: nginx_varnish_sites | length > 0

# The global config (nginx_global_files) and the site configs in one call,
# one nginx -t: a rate limit zone or an nginx_http_extra definition leaves
# in the same run as the site that stops using it, and comes in with the
# site that starts to.
- name: Apply the global config and the site configs
  ansible.builtin.include_tasks: apply.yml
  vars:
    nginx_letsencrypt_ready: >-
      {{ nginx_letsencrypt_certs.results | selectattr('stat.exists') | map(attribute='item.name') | list }}
    nginx_apply_files: >-
      {%- set files = nginx_global_files | list -%}
      {%- for site in nginx_sites_public -%}
      {%- if site.tls is mapping -%}
      {%-   set tls_files = site.tls -%}
      {%- elif site.tls == 'letsencrypt' and site.name in nginx_letsencrypt_ready -%}
      {%-   set tls_files = {'cert': nginx_letsencrypt_live ~ '/' ~ site.name ~ '/fullchain.pem',
                             'key': nginx_letsencrypt_live ~ '/' ~ site.name ~ '/privkey.pem'} -%}
      {%- else -%}
      {%-   set tls_files = {} -%}
      {%- endif -%}
      {%- set _ = files.append({'src': 'site.conf.j2', 'dest': nginx_sites_dir ~ '/' ~ site.name ~ '.conf', 'mode': '0644',
                                'site': site | combine({'tls_files': tls_files})}) -%}
      {%- endfor -%}
      {{ files }}
    nginx_apply_remove: >-
      {{ nginx_global_remove + (nginx_site_files.files | map(attribute='path')
         | reject('in', nginx_site_names | map('regex_replace', '^(.*)$', nginx_sites_dir ~ '/\1.conf') | list)
         | sort) }}

- name: Look for Varnish's front key of nginx
  ansible.builtin.stat:
    path: "{{ nginx_varnish_front_conf }}"
    get_checksum: false
  register: nginx_varnish_front_stat
  when: nginx_varnish_sites | length == 0

- name: Remove Varnish's front key of nginx without varnish sites
  ansible.builtin.include_tasks: apply.yml
  vars:
    nginx_apply_files: []
    nginx_apply_remove: ["{{ nginx_varnish_front_conf }}"]
  when:
    - nginx_varnish_sites | length == 0
    - nginx_varnish_front_stat.stat.exists

- name: Remove the Basic auth users of the sites without basic_auth
  ansible.builtin.include_tasks: apply.yml
  vars:
    nginx_apply_files: []
    nginx_apply_remove: "{{ nginx_htpasswd_stale }}"
  when: nginx_htpasswd_stale | length > 0

- name: Let www-data leave the groups no site uses any more
  ansible.builtin.command:
    argv: [gpasswd, -d, www-data, "{{ item }}"]
  loop: "{{ nginx_groups_previous | difference(nginx_groups_current) | select('in', nginx_groups_before) | sort }}"
  changed_when: true
  notify: Reload nginx

- name: Forget the groups www-data left
  ansible.builtin.copy:
    content: "{{ nginx_groups_content }}"
    dest: "{{ nginx_groups_state }}"
    owner: root
    group: root
    mode: "0644"
  vars:
    nginx_groups_content: "{{ ([nginx_groups_header] + nginx_groups_kept) | join('\n') ~ '\n' }}"
