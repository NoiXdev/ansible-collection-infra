---
- name: Check the release
  ansible.builtin.fail:
    msg: >-
      nginx: {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }} is not
      supported yet: nginx.org has no packages for {{ ansible_facts['distribution_release'] }}
  when: >-
    ansible_facts['distribution'] != 'Ubuntu'
    or ansible_facts['distribution_release'] not in nginx_supported_releases

- name: Check the settings and the sites
  ansible.builtin.include_tasks: validate.yml

# "ii " or "hi " (held): the second letter is the installed state.
- name: Read the installed nginx packages
  ansible.builtin.command:
    argv: "{{ ['dpkg-query', '-W', '-f', '${db:Status-Abbrev}|${Package}|${Version}|${Maintainer}\n'] + nginx_distro_packages }}"
  register: nginx_installed
  changed_when: false
  failed_when: false
  check_mode: false

# dpkg keeps the Maintainer field of what is installed, whatever the package
# lists say. nginx.org's nginx conflicts with Ubuntu's nginx-common, so apt
# would remove Ubuntu's packages (and their config) to install it.
- name: Refuse Ubuntu's nginx
  ansible.builtin.fail:
    msg: >-
      nginx: installed {{ nginx_foreign[0][1] }} {{ nginx_foreign[0][2] }} is not from
      {{ nginx_apt_url | urlsplit('hostname') }}; the role manages nginx.org's packages only
  vars:
    nginx_foreign: >-
      {{ nginx_installed.stdout_lines | select('match', '^.i') | map('split', '|')
         | rejectattr(3, 'match', nginx_vendor_maintainer | regex_escape) | list }}
  when: nginx_foreign | length > 0

- name: Refuse another series
  ansible.builtin.fail:
    msg: >-
      nginx: installed nginx {{ nginx_installed_version }} is series {{ nginx_installed_series }},
      nginx_version is {{ nginx_version }}; a series change is a separate, deliberate step
  vars:
    nginx_installed_nginx: >-
      {{ nginx_installed.stdout_lines | select('match', '^.i *[|]nginx[|]') | map('split', '|') | first | default([]) }}
    nginx_installed_version: "{{ nginx_installed_nginx[2] }}"
    nginx_installed_series: "{{ nginx_installed_version | regex_replace('^([0-9]+:)?([0-9]+[.][0-9]+)[.].*$', '\\2') }}"
  when:
    - nginx_installed_nginx | length > 0
    - nginx_installed_series != nginx_version

# A task that fails after an earlier one notified the reload: the reload runs
# first, so nginx does not stay on its old config while the next run, seeing
# no change, would leave it there.
- name: Install and configure nginx
  block:
    - name: Add the nginx.org repository
      ansible.builtin.include_tasks: repository.yml

    - name: Install nginx
      ansible.builtin.apt:
        name: nginx
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Configure nginx
      ansible.builtin.include_tasks: global.yml

    - name: Configure the sites
      ansible.builtin.include_tasks: sites.yml

    - name: Start nginx
      ansible.builtin.systemd_service:
        name: nginx
        state: started
        enabled: true
  rescue:
    - name: Run the reloads notified before the failure
      ansible.builtin.meta: flush_handlers

    - name: Fail as the task did
      ansible.builtin.fail:
        msg: "{{ ansible_failed_result.msg | default('nginx: \"' ~ ansible_failed_task.name ~ '\" failed') }}"
