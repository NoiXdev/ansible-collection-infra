---
- name: Check the release
  ansible.builtin.fail:
    msg: >-
      nginx: {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }} is not
      supported yet: nginx.org has no packages for {{ ansible_facts['distribution_release'] }}
  when: >-
    ansible_facts['distribution'] != 'Ubuntu'
    or ansible_facts['distribution_release'] not in nginx_supported_releases

- name: Check the settings and the sites
  ansible.builtin.include_tasks: validate.yml

# "ii " or "hi " (held): the second letter is the installed state.
- name: Read the installed nginx packages
  ansible.builtin.command:
    argv: "{{ ['dpkg-query', '-W', '-f', '${db:Status-Abbrev}|${Package}|${Version}|${Maintainer}\n'] + nginx_distro_packages }}"
  register: nginx_installed
  changed_when: false
  failed_when: false
  check_mode: false

# dpkg keeps the Maintainer field of what is installed, whatever the package
# lists say. nginx.org's nginx conflicts with Ubuntu's nginx-common, so apt
# would remove Ubuntu's packages (and their config) to install it.
- name: Refuse Ubuntu's nginx
  ansible.builtin.fail:
    msg: >-
      nginx: installed {{ nginx_foreign[0][1] }} {{ nginx_foreign[0][2] }} is not from
      {{ nginx_apt_url | urlsplit('hostname') }}; the role manages nginx.org's packages only
  vars:
    nginx_foreign: >-
      {{ nginx_installed.stdout_lines | select('match', '^.i') | map('split', '|')
         | rejectattr(3, 'match', nginx_vendor_maintainer | regex_escape) | list }}
  when: nginx_foreign | length > 0

- name: Refuse another series
  ansible.builtin.fail:
    msg: >-
      nginx: installed nginx {{ nginx_installed_version }} is series {{ nginx_installed_series }},
      nginx_version is {{ nginx_version }}; a series change is a separate, deliberate step
  vars:
    nginx_installed_nginx: >-
      {{ nginx_installed.stdout_lines | select('match', '^.i *[|]nginx[|]') | map('split', '|') | first | default([]) }}
    nginx_installed_version: "{{ nginx_installed_nginx[2] }}"
    nginx_installed_series: "{{ nginx_installed_version | regex_replace('^([0-9]+:)?([0-9]+[.][0-9]+)[.].*$', '\\2') }}"
  when:
    - nginx_installed_nginx | length > 0
    - nginx_installed_series != nginx_version

# Read-only, before any change: the error pages are exported with Docker, and
# Anubis runs in Docker (the anubis role in host mode).
- name: Check for Docker
  ansible.builtin.include_role:
    name: noixdev.infra.docker_check
  when: nginx_error_pages or nginx_anubis_sites | length > 0

# Any answer will do: the check is that something listens there, as the
# anubis role in host mode publishes it.
- name: Ask Anubis
  ansible.builtin.uri:
    url: "{{ nginx_anubis_url }}/"
    timeout: 5
  register: nginx_anubis_probe
  failed_when: false
  check_mode: false
  when: nginx_anubis_sites | length > 0

- name: Refuse anubis without Anubis on the host
  ansible.builtin.fail:
    msg: >-
      nginx: nginx_sites {{ 'entry' if nginx_anubis_names | length == 1 else 'entries' }}
      {{ nginx_anubis_names | join(', ') }} {{ 'sets' if nginx_anubis_names | length == 1 else 'set' }}
      anubis, but Anubis does not answer on {{ nginx_anubis_url }}/; run the anubis role with
      anubis_mode host (anubis_host_port {{ nginx_anubis_port }}) first
  vars:
    nginx_anubis_names: "{{ nginx_anubis_sites | map(attribute='name') | list }}"
  when:
    - nginx_anubis_sites | length > 0
    - nginx_anubis_probe.status | default(-1) | int <= 0

# The WAF (the waf role in host mode) answers for a site it knows, and 421
# for a Host no waf_sites entry lists. The probe reaches the site's inner
# block through the WAF, or nothing there yet on a first run (502): either
# answer will do. No redirect is followed (the site's own answer).
- name: Ask the WAF
  ansible.builtin.uri:
    url: "{{ nginx_waf_url }}/"
    headers:
      Host: "{{ item.domains[0] }}"
    follow_redirects: none
    timeout: 5
  loop: "{{ nginx_waf_sites }}"
  loop_control:
    label: "{{ item.name }}"
  register: nginx_waf_probe
  failed_when: false
  check_mode: false

- name: Refuse waf without the WAF on the host
  ansible.builtin.fail:
    msg: "{{ nginx_waf_silent_msg if nginx_waf_silent | length > 0 else nginx_waf_unknown_msg }}"
  vars:
    nginx_waf_answers: "{{ nginx_waf_probe.results | map(attribute='status', default=-1) | map('int') | list }}"
    nginx_waf_silent: >-
      {{ nginx_waf_sites | map(attribute='name') | zip(nginx_waf_answers)
         | selectattr(1, 'le', 0) | map(attribute=0) | list }}
    nginx_waf_unknown: >-
      {{ nginx_waf_sites | zip(nginx_waf_answers) | selectattr(1, 'eq', 421) | map(attribute=0) | list }}
    nginx_waf_silent_msg: >-
      nginx: nginx_sites {{ 'entry' if nginx_waf_silent | length == 1 else 'entries' }}
      {{ nginx_waf_silent | join(', ') }} {{ 'sets' if nginx_waf_silent | length == 1 else 'set' }}
      waf, but the WAF does not answer on {{ nginx_waf_url }}/; run the waf role with waf_mode
      host (waf_host_port {{ nginx_waf_port }}) first
    nginx_waf_unknown_msg: >-
      nginx: nginx_sites {{ 'entry' if nginx_waf_unknown | length == 1 else 'entries' }}
      {{ nginx_waf_unknown | map(attribute='name') | join(', ') }}
      {{ 'sets' if nginx_waf_unknown | length == 1 else 'set' }} waf, but the WAF on
      {{ nginx_waf_url }}/ answers 421 for
      {{ nginx_waf_unknown | map(attribute='domains') | map('first') | join(', ') }}: no waf_sites
      entry lists {{ 'it' if nginx_waf_unknown | length == 1 else 'them' }}; add
      {{ 'the site' if nginx_waf_unknown | length == 1 else 'the sites' }} to waf_sites
  when:
    - nginx_waf_sites | length > 0
    - nginx_waf_silent | length > 0 or nginx_waf_unknown | length > 0

# A task that fails after an earlier one notified the reload: the reload runs
# first, so nginx does not stay on its old config while the next run, seeing
# no change, would leave it there.
- name: Install and configure nginx
  block:
    - name: Add the nginx.org repository
      ansible.builtin.include_tasks: repository.yml

    - name: Install nginx
      ansible.builtin.apt:
        name: nginx
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Export the error pages
      ansible.builtin.include_tasks: error_pages.yml
      when: nginx_error_pages

    - name: Configure nginx and the sites
      ansible.builtin.include_tasks: sites.yml

    - name: Start nginx
      ansible.builtin.systemd_service:
        name: nginx
        state: started
        enabled: true

    # nginx runs and answers the challenges before certbot asks.
    - name: Get the Let's Encrypt certificates
      ansible.builtin.include_tasks: acme.yml
      when: nginx_acme_sites | length > 0
  rescue:
    - name: Run the reloads notified before the failure
      ansible.builtin.meta: flush_handlers

    - name: Fail as the task did
      ansible.builtin.fail:
        msg: "{{ ansible_failed_result.msg | default('nginx: \"' ~ ansible_failed_task.name ~ '\" failed') }}"
