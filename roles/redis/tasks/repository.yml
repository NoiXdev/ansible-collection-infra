---
- name: Install what the repository needs
  ansible.builtin.apt:
    name: [ca-certificates, gnupg, python3-debian]
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create the apt keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install the packages.redis.io apt key
  ansible.builtin.get_url:
    url: "{{ redis_apt_key_url }}"
    dest: /etc/apt/keyrings/redis.asc
    owner: root
    group: root
    mode: "0644"

- name: Read the key fingerprints
  ansible.builtin.command:
    cmd: gpg --batch --show-keys --with-colons /etc/apt/keyrings/redis.asc
  register: redis_apt_key
  changed_when: false

- name: Reject an unexpected key
  when: redis_apt_key.stdout is not search('^fpr:+' ~ redis_apt_key_fingerprint | upper ~ ':', multiline=True)
  block:
    - name: Remove the key
      ansible.builtin.file:
        path: /etc/apt/keyrings/redis.asc
        state: absent

    - name: Stop
      ansible.builtin.fail:
        msg: >-
          {{ redis_apt_key_url }} does not carry the key
          {{ redis_apt_key_fingerprint }}; the key file was removed.

- name: Add the packages.redis.io apt repository
  ansible.builtin.deb822_repository:
    name: redis
    types: [deb]
    uris: "{{ redis_apt_url }}"
    suites: ["{{ redis_apt_suite }}"]
    components: [main]
    signed_by: /etc/apt/keyrings/redis.asc
  register: redis_apt_repository

# apt takes the first stanza that matches a version:
# - the distro's versions are never installed (on 26.04 the distro ships a
#   redis 8 too; the vendor's wins by origin, not by version number);
# - the series wins; the vendor's versions carry an epoch
#   (6:8.10.3-1rl1~resolute1), which the regex takes with or without;
# - any other version is never installed.
# Without the vendor's package lists there is no candidate, and the install
# fails instead of falling back to the distro's redis.
- name: Pin the series
  ansible.builtin.copy:
    dest: /etc/apt/preferences.d/redis
    content: |
      Package: {{ redis_apt_packages }}
      Pin: release o=Ubuntu
      Pin-Priority: -1

      Package: {{ redis_apt_packages }}
      Pin: version /^([0-9]+:)?{{ redis_version | regex_escape }}\./
      Pin-Priority: 990

      Package: {{ redis_apt_packages }}
      Pin: version *
      Pin-Priority: -1
    owner: root
    group: root
    mode: "0644"

# A refresh that failed in an earlier run leaves the source in place but its
# packages out of the lists; the next run refreshes then too.
- name: Read where redis-server can come from
  ansible.builtin.command:
    cmd: apt-cache policy redis-server
  register: redis_apt_policy
  changed_when: false
  check_mode: false

- name: Refresh the package lists for the repository
  ansible.builtin.apt:
    update_cache: true
  when: >-
    redis_apt_repository is changed
    or (redis_apt_url | regex_replace('/+$', '')) not in redis_apt_policy.stdout
