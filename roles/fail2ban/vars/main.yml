---
# Plain IPv4 or IPv6 address, optionally with a prefix length. Deliberately
# simple: it catches typos, it does not validate every IPv6 spelling.
fail2ban_ip_pattern: >-
  ^((25[0-5]|2[0-4][0-9]|1?[0-9]?[0-9])\.){3}(25[0-5]|2[0-4][0-9]|1?[0-9]?[0-9])(/(3[0-2]|[12]?[0-9]))?$|^[0-9a-fA-F:]*:[0-9a-fA-F:.]*(/(12[0-8]|1[01][0-9]|[1-9]?[0-9]))?$
