---
- name: Install what the repository needs
  ansible.builtin.apt:
    name: [ca-certificates, gnupg, python3-debian]
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create the apt keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install the mariadb.org apt key
  ansible.builtin.get_url:
    url: "{{ mariadb_apt_key_url }}"
    dest: /etc/apt/keyrings/mariadb.asc
    owner: root
    group: root
    mode: "0644"

- name: Read the key fingerprints
  ansible.builtin.command:
    cmd: gpg --batch --show-keys --with-colons /etc/apt/keyrings/mariadb.asc
  register: mariadb_apt_key
  changed_when: false

- name: Reject an unexpected key
  when: mariadb_apt_key.stdout is not search('^fpr:+' ~ mariadb_apt_key_fingerprint | upper ~ ':', multiline=True)
  block:
    - name: Remove the key
      ansible.builtin.file:
        path: /etc/apt/keyrings/mariadb.asc
        state: absent

    - name: Stop
      ansible.builtin.fail:
        msg: >-
          {{ mariadb_apt_key_url }} does not carry the key
          {{ mariadb_apt_key_fingerprint }}; the key file was removed.

- name: Add the mariadb.org apt repository
  ansible.builtin.deb822_repository:
    name: mariadb
    types: [deb]
    uris: "{{ mariadb_apt_url }}"
    suites: ["{{ mariadb_apt_suite }}"]
    components: [main]
    signed_by: /etc/apt/keyrings/mariadb.asc
  register: mariadb_apt_repository

# apt takes the first stanza that matches a version:
# - the distro's versions are never installed (on 26.04 the distro ships an
#   11.8 too; the vendor's wins by origin, not by version number);
# - the series wins; the vendor's versions carry an epoch
#   (1:11.8.9+maria~ubu2604), which the regex takes with or without;
# - any other version is never installed.
# Without the vendor's package lists there is no candidate, and the install
# fails instead of falling back to another series.
- name: Pin the series
  ansible.builtin.copy:
    dest: /etc/apt/preferences.d/mariadb
    content: |
      Package: {{ mariadb_apt_packages }}
      Pin: release o=Ubuntu
      Pin-Priority: -1

      Package: {{ mariadb_apt_packages }}
      Pin: version /^([0-9]+:)?{{ mariadb_version | regex_escape }}\./
      Pin-Priority: 990

      Package: {{ mariadb_apt_packages }}
      Pin: version *
      Pin-Priority: -1
    owner: root
    group: root
    mode: "0644"

# A refresh that failed in an earlier run leaves the source in place but its
# packages out of the lists; the next run refreshes then too.
- name: Read where mariadb-server can come from
  ansible.builtin.command:
    cmd: apt-cache policy mariadb-server
  register: mariadb_apt_policy
  changed_when: false
  check_mode: false

- name: Refresh the package lists for the repository
  ansible.builtin.apt:
    update_cache: true
  when: >-
    mariadb_apt_repository is changed
    or (mariadb_apt_url | regex_replace('/+$', '')) not in mariadb_apt_policy.stdout
