---
# Fetch the installer of harbor_version, render its configuration and install
# the backup scripts. Changes no running container, so an upgrade can fetch
# before it backs up and stops.
- name: Create the Harbor directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0750"
  loop:
    - "{{ harbor_dir }}"
    - "{{ harbor_dir }}/installer"
    - "{{ harbor_installer_dir }}"

- name: Create the Harbor data directory
  ansible.builtin.file:
    path: "{{ harbor_data_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Check for the extracted installer
  ansible.builtin.stat:
    path: "{{ harbor_installer_dir }}/prepare"
  register: harbor_installer_prepare

# Kept per version under harbor_dir/installer; nothing is downloaded once it
# is extracted.
- name: Download the Harbor installer
  ansible.builtin.get_url:
    url: "{{ harbor_installer_url or harbor_release_url ~ '/' ~ harbor_installer_name }}"
    dest: "{{ harbor_dir }}/installer/{{ harbor_version }}.tgz"
    checksum: >-
      {{ harbor_installer_checksum
         or ('' if harbor_installer_url else 'md5:' ~ harbor_release_url ~ '/md5sum') }}
    owner: root
    group: root
    mode: "0640"
  when: not harbor_installer_prepare.stat.exists

- name: Extract the Harbor installer
  ansible.builtin.unarchive:
    src: "{{ harbor_dir }}/installer/{{ harbor_version }}.tgz"
    dest: "{{ harbor_installer_dir }}"
    remote_src: true
    extra_opts: [--strip-components=1, --no-same-owner]
    creates: "{{ harbor_installer_dir }}/prepare"

- name: Read the configuration version of the installer
  ansible.builtin.slurp:
    src: "{{ harbor_installer_dir }}/harbor.yml.tmpl"
  register: harbor_template

- name: Write harbor.yml
  ansible.builtin.template:
    src: harbor.yml.j2
    dest: "{{ harbor_installer_dir }}/harbor.yml"
    owner: root
    group: root
    mode: "0600"
  vars:
    harbor_config_version: >-
      {{ harbor_template.content | b64decode
         | regex_search('^_version: *(\S+)', '\1', multiline=True) | first }}
  no_log: true
  register: harbor_config

- name: Write the compose override
  ansible.builtin.template:
    src: compose.override.yml.j2
    dest: "{{ harbor_dir }}/compose.override.yml"
    owner: root
    group: root
    mode: "0644"

# Holds the pre-upgrade backups and harbor-backup's latest: database dumps and
# Harbor's secret key.
- name: Create the backup directory
  ansible.builtin.file:
    path: "{{ harbor_backup_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Install harbor-backup and harbor-restore
  ansible.builtin.template:
    src: "{{ item }}.sh.j2"
    dest: /usr/local/sbin/{{ item }}
    owner: root
    group: root
    mode: "0750"
  loop: [harbor-backup, harbor-restore]
