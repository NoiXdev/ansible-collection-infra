---
# The compose project name: compose's default for the directory.
postal_project: "{{ postal_dir | basename }}"
# Mode 0644: it holds no secret, which reach the containers as files of
# postal_config_dir.
postal_compose_file: "{{ postal_dir }}/compose.yaml"
# Mode 0750 root:999 (Postal's uid). Mode 0440 root:999 files: postal.yml
# (every secret of the installation), signing.key, and with the certificate
# of SMTP TLS smtp.cert and smtp.key.
postal_config_dir: "{{ postal_dir }}/config"
# The database the installation was made with (mariadb, or the external
# server), so that another one is refused.
postal_target_file: "{{ postal_dir }}/database-target"

# Written before an install creates anything and removed once Postal is
# healthy; while it exists every run refuses.
postal_install_marker: "{{ postal_dir }}/install-incomplete"
# Written before the first change of an update and removed once it is healthy
# or rolled back; a run that stopped in between leaves it, with a copy of the
# compose file and of the config directory it replaces, for the next run.
postal_update_marker: "{{ postal_dir }}/update-in-progress"
postal_update_marker_compose: "{{ postal_dir }}/update-in-progress.compose.yaml"
postal_update_marker_config: "{{ postal_dir }}/update-in-progress.config"
# Written after a failed update; that version is not tried again while it
# exists.
postal_marker_file: "{{ postal_dir }}/update-failed"

postal_backup_dir: "{{ postal_data_dir }}/backups"
# The subdirectories of postal_data_dir whose absence means the data is
# missing (an unmounted volume): only install creates them.
postal_data_subdirs: >-
  {{ (['mariadb'] if postal_database == 'mariadb' else [])
     + (['rspamd'] if postal_spam == 'rspamd' else [])
     + (['clamav'] if postal_clamav | bool else []) }}

# The oldest release the role runs.
postal_min_version: 3.0.0

# postal_dns with the defaults of its keys that it leaves out.
postal_dns_settings: >-
  {{ {'mx_records': ['mx.' ~ postal_dns_domain],
      'spf_include': 'spf.' ~ postal_dns_domain,
      'return_path_domain': 'rp.' ~ postal_dns_domain,
      'route_domain': 'routes.' ~ postal_dns_domain,
      'track_domain': 'track.' ~ postal_dns_domain,
      'helo_hostname': postal_smtp_hostname,
      'dkim_identifier': 'postal',
      'dkim_key_size': 2048,
      'custom_return_path_prefix': 'psrp'}
     | combine(postal_dns if postal_dns is mapping else {}) }}
# postal_mail with the defaults of its keys that it leaves out.
postal_mail_settings: >-
  {{ {'host': '', 'port': 25, 'username': '', 'password': '', 'from_name': 'Postal',
      'from_address': 'postal@' ~ postal_dns_domain}
     | combine(postal_mail if postal_mail is mapping else {}) }}

# The keys of Postal's postal section that postal_settings sets (the others
# have a variable of their own or belong to the role), and the keys of its
# oidc section that postal_oidc takes.
postal_settings_keys:
  - default_maximum_delivery_attempts
  - default_maximum_hold_expiry_days
  - default_suppression_list_automatic_removal_days
  - default_spam_threshold
  - default_spam_failure_threshold
  - use_local_ns_for_domain_verification
  - use_resent_sender_header
  - queued_message_lock_stale_days
  - batch_queued_messages
postal_oidc_keys:
  - enabled
  - local_authentication_enabled
  - name
  - issuer
  - identifier
  - secret
  - scopes
  - uid_field
  - email_address_field
  - name_field
  - discovery
  - authorization_endpoint
  - token_endpoint
  - userinfo_endpoint
  - jwks_uri

# A host name, as it ends up in Traefik rules and the configuration.
postal_hostname_pattern: '^[A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?(\.[A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?)*$'

# The ports the role binds on the host, for the check that none is used
# twice.
postal_host_ports: >-
  {{ ([postal_smtp_port, postal_worker_health_port, postal_smtp_health_port]
      + ([postal_smtp_submission_port, postal_submission_health_port] if postal_smtp_submission_port | int != 0 else [])
      + ([postal_mariadb_port] if postal_database == 'mariadb' else [])
      + ([postal_rspamd_port] if postal_spam == 'rspamd' else [])
      + ([postal_clamav_port] if postal_clamav | bool else []))
     | map('int') | list }}

# The sections and keys of Postal's configuration the role owns, which
# postal_config_extra must not set: whole sections, single keys of a section,
# a key prefix of a section, and a prefix of a key in any section.
postal_config_owned_sections: [main_db, message_db, rails]
postal_config_owned_section_keys:
  postal: [web_hostname, smtp_hostname, signing_key_path, trusted_proxies]
  smtp_server: [default_port, default_bind_address]
postal_config_owned_whole_sections: [web_server]
postal_config_owned_key_prefixes:
  smtp_server: tls_
postal_config_owned_any_prefix: default_health_server_
# The owned sections and keys postal_config_extra sets, as section or
# section.key.
postal_config_extra_owned: >-
  {%- set ns = namespace(found=[]) -%}
  {%- for section, body in (postal_config_extra if postal_config_extra is mapping else {}).items() -%}
  {%- if section in postal_config_owned_sections -%}
  {%- set ns.found = ns.found + [section] -%}
  {%- elif body is mapping -%}
  {%- for key in body -%}
  {%- if section in postal_config_owned_whole_sections
        or key in postal_config_owned_section_keys.get(section, [])
        or (section in postal_config_owned_key_prefixes and key | string is match(postal_config_owned_key_prefixes[section]))
        or key | string is match(postal_config_owned_any_prefix) -%}
  {%- set ns.found = ns.found + [section ~ '.' ~ key] -%}
  {%- endif -%}
  {%- endfor -%}
  {%- endif -%}
  {%- endfor -%}
  {{ ns.found | sort }}
# Every section of postal_config_extra that is not a mapping.
postal_config_extra_scalar: >-
  {{ (postal_config_extra if postal_config_extra is mapping else {}).items()
     | rejectattr('1', 'mapping') | map(attribute='0') | sort | list }}

# Written by reconfigure.yml before it writes the compose file and the
# configuration, and removed once a run ends healthy; while it exists a run
# restarts the Postal services, which read postal.yml and the keys on start
# only.
postal_restart_marker: "{{ postal_dir }}/restart-pending"
# MariaDB's settings (not secret), bound read-only into its container.
postal_mariadb_cnf_file: "{{ postal_dir }}/mariadb.cnf"

# The long-running services of the compose project, and those of them that
# run Postal (and read postal.yml and the keys on start).
postal_app_services: >-
  {{ ['web', 'smtp'] + (['submission'] if postal_smtp_submission_port | int != 0 else []) + ['worker'] }}
postal_services: "{{ (['mariadb'] if postal_database == 'mariadb' else []) + postal_app_services }}"
# The ports the SMTP services listen on.
postal_smtp_services: >-
  {{ [{'service': 'smtp', 'port': postal_smtp_port | int}]
     + ([{'service': 'submission', 'port': postal_smtp_submission_port | int}]
        if postal_smtp_submission_port | int != 0 else []) }}
postal_smtp_service_names: "{{ postal_smtp_services | map(attribute='service') | list }}"

# Where Postal reaches its database. The own MariaDB listens on
# postal_mariadb_port inside its container too, under a name of the project
# network; the services on the host's network resolve that name to
# 127.0.0.1, where the port is published, so one postal.yml serves both.
postal_mariadb_host: "{{ postal_project }}-mariadb"
postal_db_settings: >-
  {{ {'host': postal_mariadb_host, 'port': postal_mariadb_port | int} if postal_database == 'mariadb'
     else {'host': postal_db_host | string, 'port': postal_db_port | int} }}
# Server settings of the own MariaDB: the redo log ten times the largest
# message (Postal's requirement, rounded up to whole MB, at least 128 MB),
# connections for the worker threads, then postal_mariadb_settings over them.
postal_mariadb_server_settings: >-
  {{ {'port': postal_mariadb_port | int,
      'skip-name-resolve': 'ON',
      'innodb_log_file_size': ([(postal_max_message_size | float * 10) | round(0, 'ceil') | int, 128] | max) ~ 'M',
      'max_connections': 50 + 20 * postal_worker_replicas | int * postal_worker_threads | int}
     | combine(postal_mariadb_settings) }}

# What install records in postal_target_file; no credentials. With the
# external server also where it is.
postal_database_target: >-
  {{ {'database': postal_database}
     | combine({'host': postal_db_host | string, 'port': postal_db_port | int}
               if postal_database == 'mariadb_external' else {}) }}
postal_external_target: "{{ postal_db_host }}:{{ postal_db_port | int }}"

# A one-off command of Postal's image in the runner service (on the project
# and the Traefik network, the configuration mounted), without starting
# MariaDB: postal_runner + [command...].
postal_runner: [docker, compose, run, --rm, --no-deps, -T]

# The task that failed and its error: for a command the last line of stderr
# that names an error (else its last line), for anything else the first line
# of the message.
postal_failure: >-
  {%- set stderr = (ansible_failed_result.stderr | default('') | trim).splitlines() -%}
  {%- set errors = stderr | select('search', '(?i)error') | list -%}
  {{ ansible_failed_task.name }}:
  {{ (errors or stderr or ['']) | last | trim
     if ansible_failed_result.msg | default('') is search('non-zero return code')
     else ((ansible_failed_result.msg | default('') | trim).splitlines() or ['']) | first }}

# After a failed install: nothing in it should be worth keeping yet, so what
# it made is removed and the next run installs afresh. A data subdirectory
# that was there before the install (install.yml notes them in
# postal_install_data_before; a later run cannot tell) is kept.
postal_install_hint: >-
  It left a partial installation, which the role does not take for a
  finished one. To install again, first check that nothing in it is worth
  keeping (organizations and servers in Postal), then run docker compose down
  in {{ postal_dir }} (if {{ postal_compose_file }} exists), remove
  {{ postal_compose_file }}, {{ postal_config_dir }},
  {{ postal_mariadb_cnf_file }}, {{ postal_target_file }},
  {{ postal_install_marker }}{{ postal_install_hint_data }}, then run the role
  again.
postal_install_hint_data: >-
  {%- set made = postal_data_subdirs | reject('in', postal_install_data_before | default([])) | list -%}
  {%- set kept = postal_data_subdirs | select('in', postal_install_data_before | default([])) | list -%}
  {%- if postal_install_data_before is not defined and postal_data_subdirs | length > 0 -%}
  {{ ' and the subdirectories ' ~ postal_data_subdirs | join(' and ') ~ ' of ' ~ postal_data_dir
     ~ ' (keep those that held data before the install)' }}
  {%- else -%}
  {{ ((' and the subdirectories ' ~ made | join(' and ') ~ ' of ' ~ postal_data_dir) if made | length > 0 else '')
     ~ ((' (keep ' ~ kept | join(' and ') ~ ': it was there before the install)') if kept | length > 0 else '') }}
  {%- endif -%}

# The files the role renders, as it writes them.
postal_compose: "{{ lookup('ansible.builtin.template', 'compose.yaml.j2') }}"
postal_mariadb_cnf: "{{ lookup('ansible.builtin.template', 'mariadb.cnf.j2') }}"
# postal.yml: evaluated only once postal_rails_secret_value is known
# (state.yml, config.yml).
postal_config: "{{ lookup('ansible.builtin.template', 'postal.yml.j2') }}"
# Where the containers see postal_config_dir, and its files on the host.
postal_container_config_dir: /config
postal_config_file: "{{ postal_config_dir }}/postal.yml"
postal_signing_key_file: "{{ postal_config_dir }}/signing.key"

# SMTP TLS (tls.yml): the certificate (with its chain) and the key Postal's
# SMTP servers read from postal_config_dir, once per process. With
# postal_smtp_tls traefik a script copies Traefik's certificate there, on
# every run of the role and by a systemd timer; it writes
# postal_smtp_cert_marker before it replaces the files and removes it once
# the SMTP services restarted, so a failed restart is done by the next run of
# the script or of the role (state.yml).
postal_smtp_cert_file: "{{ postal_config_dir }}/smtp.cert"
postal_smtp_key_file: "{{ postal_config_dir }}/smtp.key"
postal_smtp_cert_marker: "{{ postal_dir }}/smtp-restart-pending"
postal_tls_script_file: /usr/local/sbin/postal-smtp-cert
postal_tls_unit: postal-smtp-cert
postal_tls_service_file: /etc/systemd/system/postal-smtp-cert.service
postal_tls_timer_file: /etc/systemd/system/postal-smtp-cert.timer
postal_tls_script: "{{ lookup('ansible.builtin.template', 'postal-smtp-cert.py.j2') }}"
postal_tls_service: "{{ lookup('ansible.builtin.template', 'postal-smtp-cert.service.j2') }}"
postal_tls_timer: "{{ lookup('ansible.builtin.template', 'postal-smtp-cert.timer.j2') }}"
# The health servers health.yml asks, and the upper bound of the attempts of
# each of its waits (the deadline of postal_health_timeout ends them).
postal_health_servers: >-
  {{ [{'service': 'worker', 'port': postal_worker_health_port | int},
      {'service': 'smtp', 'port': postal_smtp_health_port | int}]
     + ([{'service': 'submission', 'port': postal_submission_health_port | int}]
        if postal_smtp_submission_port | int != 0 else []) }}
postal_health_retries: "{{ (postal_health_timeout | int / 5) | round(0, 'ceil') | int + 1 }}"
