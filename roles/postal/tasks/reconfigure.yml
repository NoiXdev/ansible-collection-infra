---
# Same installation, other settings: the compose file and the configuration
# are written, Postal brought to them, and checked. The Postal services read
# postal.yml and the keys only on start, so a changed configuration alone,
# which leaves the compose file as it is, restarts them (web, smtp,
# submission and worker; MariaDB only when its own settings change, through
# the compose file); a new certificate of the SMTP services alone restarts
# smtp and submission. A run stopped after the files are written and before
# that restart would leave files that equal the settings while the
# containers run with the old ones, so postal_restart_marker is written
# first, on every reconfigure; while it exists every run reconfigures and
# restarts the Postal services, and main.yml removes it once a run ends
# healthy. With the own MariaDB Postal's user gets postal_db_password (it
# may be new) before the restart.

- name: Note the restart before the configuration changes
  ansible.builtin.copy:
    dest: "{{ postal_restart_marker }}"
    content: |
      # Written by the noixdev.infra.postal role before it changed the
      # configuration of Postal (its compose file, postal.yml or the keys),
      # and removed once Postal runs on it. While it exists the role restarts
      # Postal.
    owner: root
    group: root
    mode: "0644"

# rspamd and ClamAV switched on, or their subdirectory gone: their state
# comes back on start (state.yml).
- name: Create the subdirectories of rspamd and ClamAV
  ansible.builtin.file:
    path: "{{ postal_data_dir }}/{{ item }}"
    state: directory
    owner: "{{ postal_subdir_owners[item] | default(omit if item in postal_data_present else 'root') }}"
    group: "{{ postal_subdir_owners[item] | default(omit if item in postal_data_present else 'root') }}"
    mode: "0755"
  loop: "{{ postal_cache_subdirs }}"

- name: Write the compose file
  ansible.builtin.copy:
    dest: "{{ postal_compose_file }}"
    content: "{{ postal_compose }}"
    owner: root
    group: root
    mode: "0644"

- name: Write the configuration
  ansible.builtin.include_tasks: config.yml

# Before compose (re)starts a service: what starts reads the new
# certificate, and a changed one only adds the SMTP services to the one
# restart below.
- name: Set up SMTP TLS
  ansible.builtin.include_tasks: tls.yml

- name: Start Postal with the new compose file
  community.docker.docker_compose_v2:
    project_src: "{{ postal_dir }}"
    state: present
    pull: missing
    remove_orphans: true

# A new mariadb.cnf (its label) recreates MariaDB above; the database user
# and the Postal services need it healthy again.
- name: Wait until MariaDB is healthy
  community.docker.docker_compose_v2:
    project_src: "{{ postal_dir }}"
    services: [mariadb]
    state: present
    wait: true
    wait_timeout: "{{ postal_health_timeout | int }}"
  when: postal_database == 'mariadb'

- name: Set up Postal's database user
  ansible.builtin.include_tasks: db_user.yml
  when: postal_database == 'mariadb'

# Once: every Postal service for a new configuration (or a restart a stopped
# run left), else the SMTP services for a new certificate; and rspamd for new
# settings of its own (or that restart) when it ran before this run (else
# compose just started it on them).
- name: Restart Postal with the new configuration
  community.docker.docker_compose_v2:
    project_src: "{{ postal_dir }}"
    services: "{{ postal_restart_services }}"
    state: restarted
  vars:
    postal_restart_services: >-
      {{ (postal_app_services if postal_config_changed | bool or postal_restart_pending | bool
          else postal_smtp_service_names if postal_tls_changed | bool else [])
         + (['rspamd'] if postal_spam == 'rspamd' and 'rspamd' in postal_ps.stdout_lines | default([])
                          and (postal_rspamd_config_changed | bool or postal_restart_pending | bool) else []) }}
  when: postal_restart_services | length > 0

- name: Check that Postal is healthy
  ansible.builtin.include_tasks: health.yml

- name: Fail when Postal is not healthy
  ansible.builtin.fail:
    msg: >-
      Postal in {{ postal_dir }} is not healthy within
      {{ postal_health_timeout }} seconds after the reconfigure
      ({{ postal_health_lines | join('; ') }}); see docker compose logs in
      {{ postal_dir }}.
  when: not postal_healthy
