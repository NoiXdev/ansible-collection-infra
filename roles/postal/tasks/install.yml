---
# A fresh install: the directories (the data subdirectories only here), the
# compose file, the configuration with its keys, the database target, then
# with the own MariaDB the server, the dump of postal_import_dump
# (import.yml) and Postal's user; postal initialize on an empty database (it
# creates the main database and loads the schema), or on a database that
# holds Postal's schema a takeover: its tables converted to
# ROW_FORMAT=DYNAMIC and postal upgrade, never initialize (state.yml refused
# it without postal_signing_key and postal_rails_secret_key); the first admin
# when postal_admin_email is set and Postal has no user yet, the certificate
# of the SMTP services (tls.yml), Postal until it is healthy, and the DNS
# records to set. The marker postal_install_marker lives from before the
# first data directory until Postal is healthy, so a run after a failed
# install refuses (state.yml) instead of taking the half-made installation
# for a finished one. A failed install stops Postal and deletes nothing
# (install_failed.yml). The own MariaDB is asked once it runs, before
# anything is done in it; the install is refused without a change to it when
# its root does not log in through the socket (the role leaves none such, and
# cannot set up Postal's user then), when postal_import_dump is set and it
# holds Postal's databases, or when it holds Postal's schema that state.yml
# did not see in its files and the keys of a takeover are missing: what this
# run wrote beside it goes again, so the next run is an install as well.

- name: Create the Postal directory
  ansible.builtin.file:
    path: "{{ postal_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

# For the hint of a failed install: these were there before it.
- name: Note the data subdirectories that were there before the install
  ansible.builtin.set_fact:
    postal_install_data_before: "{{ postal_data_present }}"

- name: Write the marker of an install in progress
  ansible.builtin.copy:
    dest: "{{ postal_install_marker }}"
    content: |
      version: {{ postal_version }}
      time: {{ now(utc=true).isoformat() }}
    owner: root
    group: root
    mode: "0644"

- name: Install Postal up to the own MariaDB
  block:
    - name: Create the data directory
      ansible.builtin.file:
        path: "{{ postal_data_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    # MariaDB and ClamAV chown theirs on start; rspamd's image runs as its
    # own user from the start. One that is there keeps its owner.
    - name: Create the data subdirectories
      ansible.builtin.file:
        path: "{{ postal_data_dir }}/{{ item }}"
        state: directory
        owner: "{{ postal_subdir_owners[item] | default(omit if item in postal_data_present else 'root') }}"
        group: "{{ postal_subdir_owners[item] | default(omit if item in postal_data_present else 'root') }}"
        mode: "0755"
      loop: "{{ postal_subdirs }}"

    - name: Write the compose file
      ansible.builtin.copy:
        dest: "{{ postal_compose_file }}"
        content: "{{ postal_compose }}"
        owner: root
        group: root
        mode: "0644"

    - name: Write the configuration
      ansible.builtin.include_tasks: config.yml

    # A later run with settings that name another database refuses: there
    # Postal would find none of its data.
    - name: Write the database target
      ansible.builtin.include_tasks: target.yml

    - name: Start MariaDB
      community.docker.docker_compose_v2:
        project_src: "{{ postal_dir }}"
        services: [mariadb]
        state: present
        pull: missing
        wait: true
        wait_timeout: "{{ postal_health_timeout | int }}"
      when: postal_database == 'mariadb'

    # state.yml read the server's files only, as it did not run yet.
    # Read-only, as root through the socket (a fresh server lets root in
    # without a password; one whose root has a password is no server the role
    # set up): whether the main database holds Postal's schema, then Postal's
    # databases, one per line.
    - name: Look for Postal's schema in the own MariaDB
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - exec
          - -T
          - mariadb
          - mariadb
          - --user=root
          - --batch
          - --skip-column-names
          - >-
            --execute=SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = '{{ postal_db_name }}'
            AND table_name = 'schema_migrations'; SELECT schema_name FROM information_schema.schemata
            WHERE schema_name = '{{ postal_db_name }}'
            OR schema_name LIKE '{{ postal_message_db_prefix | replace('_', '\_') }}-%' ORDER BY schema_name
        chdir: "{{ postal_dir }}"
      register: postal_schema_read
      changed_when: false
      failed_when: false
      when: postal_database == 'mariadb'

  rescue:
    - name: Fail with the failed install
      ansible.builtin.include_tasks: install_failed.yml

- name: Note what the own MariaDB holds
  ansible.builtin.set_fact:
    postal_db_root_refused: "{{ postal_schema_read.rc | default(0) != 0 }}"
    postal_db_has_schema: >-
      {{ postal_db_has_schema | bool
         or (postal_schema_read.stdout_lines | default(['0']) | first | default('0') | trim) not in ['', '0'] }}
    postal_own_database_names: "{{ (postal_schema_read.stdout_lines | default([]))[1:] | map('trim') | select | list }}"
  when: postal_database == 'mariadb'

# Nothing was done in the database: the containers and what this run wrote
# beside the data go again (the configuration directory stays: a takeover
# takes only the keys it is given), so the next run installs again and asks
# again.
- name: Refuse to install on the own MariaDB
  when:
    - postal_database == 'mariadb'
    - postal_own_refusal | length > 0
  vars:
    postal_own_refusal: >-
      {{ "its root does not log in through the socket, so the role cannot set up Postal's database user there:"
         ~ ' let root@localhost log in through unix_socket (ALTER USER root@localhost IDENTIFIED VIA unix_socket)'
         if postal_db_root_refused | bool
         else 'it holds ' ~ postal_own_database_names | join(', ') ~ ', and the role loads postal_import_dump only into'
              ~ ' a server without ' ~ postal_db_name ~ ' and ' ~ postal_message_db_prefix ~ '-* databases'
         if postal_import_dump | length > 0 and postal_own_database_names | length > 0
         else postal_db_name ~ " holds Postal's schema (a schema_migrations table), which its files did not show,"
              ~ ' and a takeover needs ' ~ postal_takeover_keys_missing | join(' and ')
         if postal_db_has_schema | bool and postal_takeover_keys_missing | length > 0
         else '' }}
  block:
    - name: Remove the containers of the refused install
      community.docker.docker_compose_v2:
        project_src: "{{ postal_dir }}"
        state: absent
      failed_when: false

    - name: Remove what the refused install wrote
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ postal_compose_file }}"
        - "{{ postal_mariadb_cnf_file }}"
        - "{{ postal_target_file }}"
        - "{{ postal_install_marker }}"

    - name: Fail on the own MariaDB
      ansible.builtin.fail:
        msg: >-
          {{ postal_data_dir }}/mariadb already holds a database the role does
          not install on: {{ postal_own_refusal }}. The role changed nothing in
          that database and removed again the compose file, mariadb.cnf, the
          database target and the containers it had made; the data stays as it
          was.

- name: Install Postal
  block:
    # Into the own MariaDB only (main.yml refuses it with an external one),
    # which holds none of Postal's databases (refused above); then the
    # install is a takeover.
    - name: Load the dump
      ansible.builtin.include_tasks: import.yml
      when: postal_import_dump | length > 0

    - name: Set up Postal's database user
      ansible.builtin.include_tasks: db_user.yml
      when: postal_database == 'mariadb'

    # A takeover: Postal v3 needs ROW_FORMAT=DYNAMIC (the step of its upgrade
    # guide for a schema from v2), so every table of the main and the message
    # databases that is not converts, as Postal's user, which has all
    # privileges on them. The tables, as schema<TAB>table.
    - name: Read the tables that are not ROW_FORMAT=DYNAMIC
      ansible.builtin.command:
        argv: >-
          {{ postal_db_client
             + ["--execute=SELECT table_schema, table_name FROM information_schema.tables"
                ~ " WHERE table_type = 'BASE TABLE' AND row_format <> 'Dynamic'"
                ~ " AND (table_schema = '" ~ postal_db_name ~ "'"
                ~ " OR table_schema LIKE '" ~ postal_message_db_prefix | replace('_', '\_') ~ "-%')"
                ~ " ORDER BY table_schema, table_name"] }}
        chdir: "{{ postal_dir }}"
        stdin: "{{ postal_db_password }}"
        stdin_add_newline: false
      register: postal_row_format_read
      changed_when: false
      no_log: true
      when: postal_db_has_schema | bool

    # [schema, table] each (Postal's names hold no white space); not secret.
    - name: Note the tables that are not ROW_FORMAT=DYNAMIC
      ansible.builtin.set_fact:
        postal_row_format_tables: >-
          {{ postal_row_format_read.stdout_lines | default([]) | map('split') | selectattr('1', 'defined') | list }}
      when: postal_db_has_schema | bool

    - name: Convert the tables to ROW_FORMAT=DYNAMIC
      ansible.builtin.command:
        argv: >-
          {%- set statements = [] -%}
          {%- for schema, table in postal_row_format_tables -%}
          {%-   set _ = statements.append('ALTER TABLE `' ~ schema | replace('`', '``') ~ '`.`'
                                          ~ table | replace('`', '``') ~ '` ROW_FORMAT=DYNAMIC') -%}
          {%- endfor -%}
          {{ postal_db_client + ['--execute=' ~ statements | join('; ')] }}
        chdir: "{{ postal_dir }}"
        stdin: "{{ postal_db_password }}"
        stdin_add_newline: false
      changed_when: true
      no_log: true
      when:
        - postal_db_has_schema | bool
        - postal_row_format_tables | length > 0

    - name: Report the tables converted to ROW_FORMAT=DYNAMIC
      ansible.builtin.debug:
        msg: "Converted to ROW_FORMAT=DYNAMIC: {{ postal_row_format_tables | map('join', '.') | join(', ') }}"
      when:
        - postal_db_has_schema | bool
        - postal_row_format_tables | length > 0

    # rake postal:update: db:migrate on the main database, then on every
    # message database.
    - name: Upgrade the database
      ansible.builtin.command:
        argv: [docker, compose, run, --rm, -T, runner, postal, upgrade]
        chdir: "{{ postal_dir }}"
      changed_when: true
      when: postal_db_has_schema | bool

    # rake db:create postal:update: the main database and its schema.
    - name: Initialize the database
      ansible.builtin.command:
        argv: [docker, compose, run, --rm, -T, runner, postal, initialize]
        chdir: "{{ postal_dir }}"
      changed_when: true
      when: not postal_db_has_schema | bool

    # Only when Postal has no user yet (a takeover has its users); the values
    # go through stdin as JSON (the password among them), so the task is
    # no_log, and the script prints none of them.
    - name: Create the first admin
      ansible.builtin.command:
        argv: "{{ postal_runner + ['runner', 'bundle', 'exec', 'rails', 'runner', lookup('ansible.builtin.file', 'make_admin.rb')] }}"
        chdir: "{{ postal_dir }}"
        stdin: >-
          {{ {'email': postal_admin_email | string, 'password': postal_admin_password | string,
              'first_name': postal_admin_first_name | string or 'Postal',
              'last_name': postal_admin_last_name | string or 'Admin'} | to_json }}
      register: postal_admin_created
      changed_when: postal_admin_result == 'created'
      failed_when: postal_admin_result not in ['created', 'exists']
      no_log: true
      vars:
        postal_admin_result: "{{ postal_admin_created.stdout_lines | default([]) | select('match', '^(created|exists|invalid:)') | last | default('') }}"
      when: postal_admin_email | string | length > 0

    # Before the SMTP services start: they read it once.
    - name: Set up SMTP TLS
      ansible.builtin.include_tasks: tls.yml

    - name: Start Postal
      community.docker.docker_compose_v2:
        project_src: "{{ postal_dir }}"
        state: present
        pull: missing
        remove_orphans: true

    - name: Check that Postal is healthy
      ansible.builtin.include_tasks: health.yml

    - name: Fail when Postal is not healthy
      ansible.builtin.fail:
        msg: >-
          Postal is not healthy within {{ postal_health_timeout }} seconds
          ({{ postal_health_lines | join('; ') }}); see docker compose logs in
          {{ postal_dir }}
      when: not postal_healthy

    - name: Read the DKIM record of the return-path domain
      ansible.builtin.command:
        argv: "{{ postal_runner + ['runner', 'postal', 'default-dkim-record'] }}"
        chdir: "{{ postal_dir }}"
      register: postal_dkim_read
      changed_when: false

    - name: Remove the marker of an install in progress
      ansible.builtin.file:
        path: "{{ postal_install_marker }}"
        state: absent

  rescue:
    - name: Fail with the failed install
      ansible.builtin.include_tasks: install_failed.yml

- name: Report the DNS records
  ansible.builtin.debug:
    msg: "{{ postal_dns_report }}"
  vars:
    postal_dkim_record: >-
      {{ postal_dkim_read.stdout_lines | select('match', '^v=DKIM1') | last | default('(see docker compose run --rm runner postal default-dkim-record)') }}
    postal_dns_report: >-
      {%- set d = postal_dns_settings -%}
      {%- set lines = [
        'Postal ' ~ postal_version ~ ' is installed in ' ~ postal_dir ~ '. The role changes no DNS: set these records'
        ~ ' (<address>: the public IPv4 address of this host as A, its IPv6 address as AAAA):',
        postal_web_hostname ~ ' A <address>   (the web interface and the API)'] -%}
      {%- if postal_smtp_hostname != postal_web_hostname -%}
      {%-   set _ = lines.append(postal_smtp_hostname ~ ' A <address>   (the SMTP server)') -%}
      {%- endif -%}
      {%- for mx in d.mx_records if mx not in [postal_web_hostname, postal_smtp_hostname] -%}
      {%-   set _ = lines.append(mx ~ ' A <address>   (the MX host your users point their domains at)') -%}
      {%- endfor -%}
      {%- set _ = lines.extend([
        d.spf_include ~ ' TXT "v=spf1 ip4:<address> ~all"   (add ip6:<address> for IPv6)',
        d.return_path_domain ~ ' A <address>',
        d.return_path_domain ~ ' MX 10 ' ~ postal_smtp_hostname,
        d.return_path_domain ~ ' TXT "v=spf1 a mx include:' ~ d.spf_include ~ ' ~all"',
        d.dkim_identifier ~ '._domainkey.' ~ d.return_path_domain ~ ' TXT "' ~ postal_dkim_record ~ '"'
        ~ '   (longer than 255 characters: publish it as a split TXT record)',
        d.route_domain ~ ' MX 10 ' ~ postal_smtp_hostname,
        d.track_domain ~ ' A <address>   (or a CNAME to ' ~ postal_web_hostname ~ ')',
        'and at your provider a PTR record of <address> to ' ~ d.helo_hostname ~ '.']) -%}
      {%- if postal_keys_generated | default([]) | length > 0 -%}
      {%-   set _ = lines.append('The role generated ' ~ postal_keys_generated | join(' and ') ~ ' (in '
                                 ~ postal_config_dir ~ '): copy ' ~ postal_signing_key_file
                                 ~ ' into postal_signing_key and rails.secret_key of ' ~ postal_config_file
                                 ~ ' into postal_rails_secret_key of your vault. A lost signing key breaks the'
                                 ~ ' DKIM record above.') -%}
      {%- endif -%}
      {%- if postal_db_has_schema | bool -%}
      {%-   set _ = lines.append('The role took over the Postal databases there (postal upgrade): with the'
                                 ~ ' signing key of that installation the DKIM record above is the one it published.') -%}
      {%- elif postal_admin_email | string | length == 0 -%}
      {%-   set _ = lines.append('No admin was created (postal_admin_email is empty): run docker compose run --rm'
                                 ~ ' runner postal make-user in ' ~ postal_dir ~ '.') -%}
      {%- endif -%}
      {{ lines }}
