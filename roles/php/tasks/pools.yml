---
# Every new pool config passes FPM's test before anything stops or goes: a
# mode switch or a version move stops the old masters and removes their
# configs before it writes the new ones. The files carry the env: no_log, in
# a directory only root reads, removed again.
- name: Test the new pool configs
  when: php_pools | length > 0
  block:
    - name: Create a directory for the pool config tests
      ansible.builtin.tempfile:
        state: directory
        suffix: .php-pools
      register: php_pool_test_dir
      changed_when: false

    - name: Test each pool config with FPM
      ansible.builtin.template:
        src: pool.conf.j2
        dest: "{{ php_pool_test_dir.path }}/{{ item.name }}.conf"
        owner: root
        group: root
        mode: "0600"
        validate: "php-fpm{{ item.version }} -t -y %s"
      loop: "{{ php_pools }}"
      loop_control:
        label: "{{ item.name }}"
      no_log: true
      diff: false
      changed_when: false
  always:
    - name: Remove the directory for the pool config tests
      ansible.builtin.file:
        path: "{{ php_pool_test_dir.path }}"
        state: absent
      when: php_pool_test_dir.path is defined
      changed_when: false

- name: Create the log directory
  ansible.builtin.file:
    path: /var/log/php
    state: directory
    owner: root
    group: root
    mode: "0755"

# PHP writes a pool's errors as the pool user, opening the file per message;
# logrotate creates the next one. A log stays when its pool leaves the list.
- name: Create the pool logs
  ansible.builtin.file:
    path: "/var/log/php/{{ item.name }}.log"
    state: touch
    owner: "{{ item.user }}"
    group: "{{ php_pool_groups[item.name] }}"
    mode: "0640"
    access_time: preserve
    modification_time: preserve
  loop: "{{ php_pools_public }}"
  loop_control:
    label: "{{ item.name }}"

- name: Rotate the pool logs
  ansible.builtin.template:
    src: logrotate.j2
    dest: /etc/logrotate.d/php-pools
    owner: root
    group: root
    mode: "0644"

# tmp_dir and its session, upload and sys dirs; they stay when the pool leaves.
# tmp_dir usually sits in a directory the pool user owns, and the user (or
# PHP code running as the user) can swap any part of it for a link. Root
# therefore opens every part of the path without following a link (a link
# stops the run, naming it) and changes only the directory it holds open;
# missing parents are created root-owned (0755).
- name: Create the temp dirs
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - |
        import os, stat, sys
        name, path, uid, gid = sys.argv[1], sys.argv[2], int(sys.argv[3]), int(sys.argv[4])
        flags = os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW | os.O_CLOEXEC
        parts = [part for part in path.split('/') if part]
        fd, done, changed = os.open('/', flags), '', False
        for i, part in enumerate(parts):
            done += '/' + part
            if part in ('.', '..'):
                sys.exit(f'php: php_pools entry {name} has . or .. in its tmp_dir {path}')
            try:
                os.mkdir(part, 0o755 if i < len(parts) - 1 else 0o700, dir_fd=fd)
                changed = True
            except FileExistsError:
                pass
            try:
                next_fd = os.open(part, flags, dir_fd=fd)
            except OSError:
                sys.exit(f'php: php_pools entry {name}: {done} is a link or not a directory; '
                         'the role follows no link in tmp_dir')
            os.close(fd)
            fd = next_fd
        st = os.fstat(fd)
        if (st.st_uid, st.st_gid) != (uid, gid):
            os.fchown(fd, uid, gid)
            changed = True
        if stat.S_IMODE(st.st_mode) != 0o770:
            os.fchmod(fd, 0o770)
            changed = True
        print('changed' if changed else 'ok')
      - "{{ item.name }}"
      - "{{ item.tmp_dir | regex_replace('/+$', '') }}"
      - "{{ ansible_facts.getent_passwd[item.user][1] }}"
      - "{{ ansible_facts.getent_group[php_pool_groups[item.name]][1] }}"
  loop: "{{ php_pools_public | selectattr('tmp_dir', 'defined') }}"
  loop_control:
    label: "{{ item.name }}"
  register: php_tmp_dir
  changed_when: "'changed' in php_tmp_dir.stdout_lines"

# As the pool user, with the pool's group: whatever the user has planted
# there, nothing is done with more than the user's own rights.
- name: Create the session, upload and sys dirs as the pool user
  ansible.builtin.command:
    argv:
      - runuser
      - -u
      - "{{ item.user }}"
      - -g
      - "{{ php_pool_groups[item.name] }}"
      - --
      - sh
      - -c
      - |
        set -eu
        name="$1" dir="$2" uid="$3" gid="$4" changed=
        for d in session upload sys; do
          p="$dir/$d"
          if [ -L "$p" ] || { [ -e "$p" ] && [ ! -d "$p" ]; }; then
            echo "php: php_pools entry $name: $p is a link or not a directory; the role follows no link in tmp_dir" >&2
            exit 1
          fi
          if [ ! -d "$p" ]; then
            mkdir -m 0770 "$p"
            changed=1
          fi
          if [ "$(stat -c %u "$p")" != "$uid" ]; then
            echo "php: php_pools entry $name: $p belongs to uid $(stat -c %u "$p"), not to the pool user" >&2
            exit 1
          fi
          if [ "$(stat -c %g:%a "$p")" != "$gid:770" ]; then
            chgrp "$gid" "$p"
            chmod 0770 "$p"
            changed=1
          fi
        done
        if [ -n "$changed" ]; then echo changed; fi
      - sh
      - "{{ item.name }}"
      - "{{ item.tmp_dir | regex_replace('/+$', '') }}"
      - "{{ ansible_facts.getent_passwd[item.user][1] }}"
      - "{{ ansible_facts.getent_group[php_pool_groups[item.name]][1] }}"
  loop: "{{ php_pools_public | selectattr('tmp_dir', 'defined') }}"
  loop_control:
    label: "{{ item.name }}"
  register: php_tmp_subdirs
  changed_when: "'changed' in php_tmp_subdirs.stdout_lines"

- name: Remove the packages' www pools
  ansible.builtin.file:
    path: "/etc/php/{{ item.version }}/fpm/pool.d/www.conf"
    state: absent
  loop: "{{ php_versions }}"
  loop_control:
    label: "{{ item.version }}"

# Every php<v>-fpm on the host, also of a version that left php_versions.
- name: Read the services
  ansible.builtin.service_facts:

# The other files in pool.d are left alone in both modes.
- name: Find the pool files with the role's header in the package services
  ansible.builtin.find:
    paths: "{{ php_fpm_package_versions | map('regex_replace', '^', '/etc/php/') | map('regex_replace', '$', '/fpm/pool.d') | list }}"
    patterns: "*.conf"
    contains: '(?i).*managed by noixdev\.infra'
  register: php_managed_pool_files
  when: php_fpm_package_versions | length > 0

- name: Run one master per pool
  ansible.builtin.include_tasks: per_pool.yml
  when: php_fpm_per_pool_service | bool

- name: Run the pools in the package services
  ansible.builtin.include_tasks: classic.yml
  when: not php_fpm_per_pool_service | bool
