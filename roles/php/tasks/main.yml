---
- name: Check the release
  ansible.builtin.fail:
    msg: >-
      php: {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }} is not
      supported yet: packages.sury.org has no packages for {{ ansible_facts['distribution_release'] }}
  when: >-
    ansible_facts['distribution'] != 'Ubuntu'
    or ansible_facts['distribution_release'] not in php_supported_releases

- name: Check the versions, php_ini and the pools
  ansible.builtin.include_tasks: validate.yml

- name: Check the host
  ansible.builtin.include_tasks: checks.yml
  when: php_versions | length > 0

- name: Add packages.sury.org
  ansible.builtin.include_tasks: repository.yml
  when: php_versions | length > 0

- name: Install the versions
  ansible.builtin.include_tasks: versions.yml
  when: php_versions | length > 0

- name: Configure the pools
  ansible.builtin.include_tasks: pools.yml

- name: Restart the pools after PHP updates
  ansible.builtin.include_tasks: updates.yml
