---
# unattended-upgrades installs packages.sury.org's updates in both modes (its
# pattern is written in tasks/repository.yml). One master per pool: after each
# dpkg run that upgraded a php<v>-* package, the apt hook restarts that
# version's pools one at a time. Classic mode has no hook and no script: the
# package's own restart (and needrestart's) applies there.
- name: Install the rolling restart
  ansible.builtin.template:
    src: php-fpm-rolling-restart.sh.j2
    dest: /usr/local/sbin/php-fpm-rolling-restart
    owner: root
    group: root
    mode: "0755"
  when: php_fpm_per_pool_service | bool

- name: Install the apt hook that runs it
  ansible.builtin.template:
    src: 99noixdev-php-fpm-restart.j2
    dest: /etc/apt/apt.conf.d/99noixdev-php-fpm-restart
    owner: root
    group: root
    mode: "0644"
  when: php_fpm_per_pool_service | bool

# needrestart (on Ubuntu servers by default) runs after every apt run too,
# before the hook, and would restart all pools of a version at once: it leaves
# the php-fpm@ units to the hook. The file does nothing without needrestart.
- name: Create needrestart's config directory
  ansible.builtin.file:
    path: /etc/needrestart/conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: php_fpm_per_pool_service | bool

- name: Leave the pools to the rolling restart in needrestart
  ansible.builtin.template:
    src: 50noixdev-php-fpm.conf.j2
    dest: /etc/needrestart/conf.d/50noixdev-php-fpm.conf
    owner: root
    group: root
    mode: "0644"
  when: php_fpm_per_pool_service | bool

# The hook goes first; it does nothing without the script anyway. In classic
# mode needrestart restarts the package services as usual.
- name: Remove the rolling restart, its hook and the needrestart config
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/apt.conf.d/99noixdev-php-fpm-restart
    - /usr/local/sbin/php-fpm-rolling-restart
    - /etc/needrestart/conf.d/50noixdev-php-fpm.conf
  when: not php_fpm_per_pool_service | bool

# The PPA's pattern, from before the switch to packages.sury.org. It stays
# while the PPA's source does (a run that did not reach tasks/repository.yml's
# switch, e.g. with php_versions empty): the PPA's packages keep their updates.
# Removed here, not with the PPA's other files, so a host with php_versions
# empty and without the PPA's source loses it too.
- name: Look for the PPA's source
  ansible.builtin.stat:
    path: /etc/apt/sources.list.d/ondrej-php.sources
  register: php_ppa_source

- name: Remove the PPA's pattern from unattended-upgrades
  ansible.builtin.file:
    path: /etc/apt/apt.conf.d/52noixdev-php-ppa
    state: absent
  when: not php_ppa_source.stat.exists
