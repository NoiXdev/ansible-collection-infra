---
# The pools without their env, for every loop that does not write a pool
# config: a loop prints its items with -v.
php_pools_public: >-
  {{ php_pools | map('dict2items') | map('rejectattr', 'key', 'eq', 'env') | map('list')
     | map('items2dict') | list }}
php_pool_names: "{{ php_pools_public | map(attribute='name') | list }}"
php_version_names: "{{ php_versions | map(attribute='version') | list }}"
php_pool_versions: "{{ dict(php_pool_names | zip(php_pools_public | map(attribute='version'))) }}"

php_pm_defaults:
  mode: dynamic
  max_children: 5
  start_servers: 2
  min_spare_servers: 1
  max_spare_servers: 3

# Pool ini keys the role sets itself.
php_role_ini_keys: [open_basedir, error_log, session.save_path, upload_tmp_dir, sys_temp_dir]

# The releases the PPA has packages for, and the origin its Release file names.
php_supported_releases: [noble]
php_apt_origin: LP-PPA-ondrej-php

# Each pool's group: the one it names, or its user's primary group. Needs the
# getent facts of tasks/validate.yml.
php_gid_names: >-
  {{ dict(ansible_facts.getent_group.values() | map(attribute=1) | zip(ansible_facts.getent_group.keys())) }}
php_pool_groups: >-
  {{ dict(php_pool_names | zip(php_pools_public | map(attribute='user')
       | map('extract', ansible_facts.getent_passwd) | map(attribute=2) | map('extract', php_gid_names)))
     | combine(dict(php_pools_public | selectattr('group', 'defined') | map(attribute='name')
       | zip(php_pools_public | selectattr('group', 'defined') | map(attribute='group')))) }}

# The pools to restart (version, socket owner or group, or unit changed) and to
# reload (config, php_ini or packages of their version changed) in this run, by
# name only. They come from the registered results of tasks/versions.yml and
# tasks/per_pool.yml.
php_restart_pools: >-
  {{ ((php_pool_names if php_unit is defined and php_unit is changed else [])
      + (php_env_files.results | default([]) | selectattr('changed') | map(attribute='item.name') | list))
     | unique | list }}
php_reload_versions: >-
  {{ (php_packages.results | default([]) | selectattr('changed') | map(attribute='item.version') | list)
     + (php_ini_files.results | default([]) | selectattr('changed') | selectattr('item.1', 'eq', 'fpm')
        | map(attribute='item.0.version') | list) }}
php_reload_pools: >-
  {{ ((php_fpm_files.results | default([]) | selectattr('changed') | map(attribute='item.name') | list)
      + (php_pool_files.results | default([]) | selectattr('changed') | map(attribute='item.name') | list)
      + (php_pools_public | selectattr('version', 'in', php_reload_versions) | map(attribute='name') | list))
     | unique | difference(php_restart_pools) | list }}

# The versions whose package service php<v>-fpm is installed: the listed ones
# and any other the service facts of tasks/pools.yml show.
php_fpm_package_versions: >-
  {{ (php_version_names
      + (ansible_facts.services | default({}) | list | select('match', '^php[0-9]+[.][0-9]+-fpm[.]service$')
         | map('regex_replace', '^php', '') | map('regex_replace', '-fpm[.]service$', '') | list))
     | unique | sort }}

# The pool files in the package services' pool.d that carry the role's header
# (tasks/pools.yml finds them), and where the pools go in classic mode.
php_managed_pool_paths: "{{ php_managed_pool_files.files | default([]) | map(attribute='path') | list }}"
php_classic_pool_paths: >-
  {{ php_pools_public | map(attribute='version') | map('regex_replace', '^', '/etc/php/')
     | zip(php_pool_names) | map('join', '/fpm/pool.d/') | map('regex_replace', '$', '.conf') | list }}
php_classic_versions: "{{ php_pools_public | map(attribute='version') | unique | list }}"

# Classic mode: the versions with pools that give a pool to another version.
php_classic_moved_versions: >-
  {{ php_managed_pool_paths | difference(php_classic_pool_paths)
     | select('match', '^/etc/php/[^/]+/fpm/pool[.]d/(' ~ php_pool_names | join('|') ~ ')[.]conf$')
     | map('regex_replace', '^/etc/php/([^/]+)/.*$', '\1') | unique | select('in', php_classic_versions) | list }}

# Classic mode, for the handlers: the versions to restart (a pool socket that
# has another owner or group than its pool wants) and to reload (a pool file
# added, changed or removed, php_ini or packages changed), each only when it
# has pools. They come from the registered results of tasks/versions.yml and
# tasks/classic.yml.
php_classic_restart_versions: >-
  {%- set versions = [] -%}
  {%- for socket in php_classic_sockets.results | default([]) if socket.stat.exists
      and (socket.stat.pw_name != socket.item.user or socket.stat.gr_name != php_fpm_listen_group) -%}
  {%- set _ = versions.append(socket.item.version) -%}
  {%- endfor -%}
  {{ versions | unique | list }}
php_classic_changed_versions: >-
  {{ ((php_classic_pool_files.results | default([]) | selectattr('changed') | map(attribute='item.version') | list)
      + (php_classic_removed.results | default([]) | selectattr('changed') | map(attribute='item')
         | map('regex_replace', '^/etc/php/([^/]+)/.*$', '\1') | list)
      + php_reload_versions + php_classic_restart_versions)
     | unique | select('in', php_classic_versions) | list }}
