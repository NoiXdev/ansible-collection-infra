---
# One master per pool (php_fpm_per_pool_service true). A pool whose version,
# socket owner or group, or the unit changed restarts (a reload keeps the
# inherited socket as it is); one whose config, php_ini or packages changed
# reloads (USR2: the master re-executes in its process and keeps the socket).
# Every such pool's config is tested first.
- name: Test the changed php pool configs
  ansible.builtin.command:
    argv: ["php-fpm{{ php_pool_versions[item] }}", -t, -y, "/etc/php-fpm/{{ item }}/php-fpm.conf"]
  loop: "{{ php_restart_pools + php_reload_pools }}"
  changed_when: false
  when: php_fpm_per_pool_service | bool
  listen: php pools changed

- name: Restart the php pools whose version changed
  ansible.builtin.systemd_service:
    name: "php-fpm@{{ item }}"
    state: restarted
  loop: "{{ php_restart_pools }}"
  when: php_fpm_per_pool_service | bool
  listen: php pools changed

- name: Reload the changed php pools
  ansible.builtin.systemd_service:
    name: "php-fpm@{{ item }}"
    state: reloaded
  loop: "{{ php_reload_pools }}"
  when: php_fpm_per_pool_service | bool
  listen: php pools changed

# Classic mode: the package service of each changed version that has pools. A
# version with a pool socket of another owner or group restarts; the others
# reload (USR2), and a stopped one starts. FPM tests each version's whole
# config (its php-fpm.conf with all of pool.d) first.
- name: Test the configs of the changed php versions
  ansible.builtin.command:
    argv: ["php-fpm{{ item }}", -t]
  loop: "{{ php_classic_changed_versions }}"
  changed_when: false
  when: not php_fpm_per_pool_service | bool
  listen: php pools changed

- name: Restart or reload the changed php versions
  ansible.builtin.systemd_service:
    name: "php{{ item }}-fpm"
    state: "{{ 'restarted' if item in php_classic_restart_versions else 'reloaded' }}"
  loop: "{{ php_classic_changed_versions }}"
  when: not php_fpm_per_pool_service | bool
  listen: php pools changed
