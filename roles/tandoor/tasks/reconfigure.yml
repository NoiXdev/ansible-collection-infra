---
# Same installation, other settings: the S3 secret file and the compose file
# are written, the stack brought to them, and Tandoor checked.

# The image reads it on start, and a bind of a single file keeps the old one
# after the copy replaced it. A new secret key changes the label of the web
# service (tandoor_s3_secret_hash), so compose recreates the web container.
- name: Write the S3 secret file
  ansible.builtin.copy:
    dest: "{{ tandoor_s3_secret_file }}"
    content: "{{ tandoor_s3_settings.secret_key }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  register: tandoor_s3_secret_copy
  when: tandoor_s3_enabled | bool

- name: Write the compose file
  ansible.builtin.copy:
    dest: "{{ tandoor_compose_file }}"
    content: "{{ tandoor_compose }}"
    owner: root
    group: root
    mode: "0600"
  # It holds the secret key and the passwords.
  no_log: true

- name: Start Tandoor with the new configuration
  community.docker.docker_compose_v2:
    project_src: "{{ tandoor_dir }}"
    state: present
    pull: missing
    remove_orphans: true

# A secret file rewritten while the key stayed (it was changed by hand) gives
# compose nothing to recreate, but the web container still reads the old
# file.
- name: Recreate the web container for the rewritten S3 secret file
  community.docker.docker_compose_v2:
    project_src: "{{ tandoor_dir }}"
    services: [web]
    dependencies: false
    state: present
    recreate: always
  when:
    - tandoor_s3_secret_copy is changed
    - tandoor_s3_secret_hash in tandoor_web_s3_hash.stdout_lines | default([])

- name: Check that Tandoor is healthy
  ansible.builtin.include_tasks: health.yml

- name: Fail when Tandoor is not healthy
  ansible.builtin.fail:
    msg: >-
      Tandoor in {{ tandoor_dir }} is not healthy within
      {{ tandoor_health_timeout }} seconds after the reconfigure
      ({{ tandoor_health_lines | join('; ') }}); see docker compose logs in
      {{ tandoor_dir }}.
  when: not tandoor_healthy
