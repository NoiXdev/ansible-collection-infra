---
# Rolls a failed update back to tandoor_backup: the web container stopped,
# the compose file (and with S3 the secret file) put back as they were
# before the run, the database recreated empty and loaded from the dump,
# with local media what is in mediafiles moved aside to
# <backup>-failed/mediafiles and the copy put in its place (as hard links
# again; to <backup>-failed-<time> when <backup>-failed exists), then the
# previous stack started and checked
# with health.yml, both waits bounded by tandoor_rollback_timeout. The
# previous files come first, so the database is
# restored in the previous database container. Media in S3 stay as they are:
# the backup has none. Never fails by itself: tandoor_healthy says whether
# Tandoor is healthy again, tandoor_restore_error what failed.

- name: Roll back to the backup
  block:
    - name: Stop Tandoor for the rollback
      ansible.builtin.command:
        argv: [docker, compose, stop, web]
        chdir: "{{ tandoor_dir }}"
      changed_when: true

    # They hold the secret key and the passwords, so the tasks are no_log
    # and a failure gets a message of its own.
    - name: Put the previous files back
      block:
        - name: Put the previous S3 secret file back
          ansible.builtin.copy:
            dest: "{{ tandoor_s3_secret_file }}"
            content: "{{ tandoor_s3_secret_read.content | b64decode }}"
            owner: root
            group: root
            mode: "0600"
          no_log: true
          when: tandoor_s3_secret_read.content is defined

        - name: Put the previous compose file back
          ansible.builtin.copy:
            dest: "{{ tandoor_compose_file }}"
            content: "{{ tandoor_compose_before }}"
            owner: root
            group: root
            mode: "0600"
          no_log: true
      rescue:
        - name: Fail on the previous files
          ansible.builtin.fail:
            msg: >-
              Writing the previous {{ tandoor_compose_file }}{{ (' or ' ~ tandoor_s3_secret_file) if tandoor_s3_secret_read.content is defined else '' }}
              failed; the error is not shown, as it can quote the secrets.
              Check that {{ tandoor_dir }} is writable and has space.

    - name: Start the previous database
      community.docker.docker_compose_v2:
        project_src: "{{ tandoor_dir }}"
        services: [db]
        state: present
        pull: missing

    - name: Note when the wait for the database starts
      ansible.builtin.set_fact:
        tandoor_wait_start: "{{ now().timestamp() }}"

    # Fails after tandoor_rollback_timeout seconds; retries is an upper bound.
    - name: Wait for the database
      ansible.builtin.command:
        argv: [docker, compose, exec, -T, db, pg_isready, --username=tandoor, --dbname=tandoor, --timeout=2]
        chdir: "{{ tandoor_dir }}"
      register: tandoor_db_ready
      until: >-
        tandoor_db_ready.rc == 0
        or now().timestamp() - tandoor_wait_start | float >= tandoor_rollback_timeout | int
      retries: "{{ (tandoor_rollback_timeout | int / 2) | round(0, 'ceil') | int + 1 }}"
      delay: 2
      changed_when: false

    # An empty database, not pg_restore --clean: --clean drops only what is in
    # the dump, so tables the new version added would stay. Over the local
    # socket, which needs no password.
    - name: Recreate the database
      ansible.builtin.command:
        argv: [docker, compose, exec, -T, db, psql, --username=tandoor, --dbname=postgres, --no-psqlrc, --set=ON_ERROR_STOP=1]
        chdir: "{{ tandoor_dir }}"
        stdin: |
          DROP DATABASE IF EXISTS tandoor WITH (FORCE);
          CREATE DATABASE tandoor OWNER tandoor;
      changed_when: true

    - name: Restore the database dump
      ansible.builtin.shell:
        cmd: >-
          docker compose exec -T db pg_restore --single-transaction --exit-on-error
          --username=tandoor --dbname=tandoor <{{ (tandoor_backup ~ '/tandoor.dump') | quote }}
        chdir: "{{ tandoor_dir }}"
      changed_when: true

    # The copy first; then the entries of mediafiles are moved, one rename
    # each (the first that fails stops the restore, which then fails, before
    # the copy is put in place), so mediafiles itself never goes missing
    # (state.yml refuses an installation without it) and a restore stopped
    # anywhere in between can be run again: a leftover copy is made afresh,
    # and every entry is in mediafiles, in the copy or set aside. A rollback
    # that was stopped (restored again with tandoor_restore_interrupted) may
    # have set the media of the failed attempt aside in <backup>-failed
    # already; they stay, and the media found now go to <backup>-failed-<UTC
    # time>.
    - name: Put the media back
      ansible.builtin.shell:
        cmd: |
          set -eu
          backup={{ tandoor_backup | quote }}
          root={{ tandoor_data_dir | quote }}
          aside="$backup-failed"
          if [ -e "$aside" ]; then aside="$backup-failed-$(date -u +%Y%m%dT%H%M%SZ)"; fi
          # Every entry of $1 into the directory $2, one rename each; the
          # first that fails stops the script (set -e).
          move_entries() {
            for entry in "$1"/* "$1"/.[!.]* "$1"/..?*; do
              if [ -e "$entry" ] || [ -L "$entry" ]; then mv -- "$entry" "$2/"; fi
            done
          }
          # Nothing of the failed attempt may stay beside the copy.
          expect_empty() {
            if [ -n "$(ls -A "$1")" ]; then echo "$1 is not empty after it was set aside" >&2; exit 1; fi
          }
          rm -rf "$root/.mediafiles.restore"
          cp -al "$backup/mediafiles" "$root/.mediafiles.restore"
          mkdir -m 0700 "$aside"
          mkdir "$aside/mediafiles"
          move_entries "$root/mediafiles" "$aside/mediafiles"
          expect_empty "$root/mediafiles"
          move_entries "$root/.mediafiles.restore" "$root/mediafiles"
          chown "$(stat -c %u:%g "$backup/mediafiles")" "$root/mediafiles"
          chmod "$(stat -c %a "$backup/mediafiles")" "$root/mediafiles"
          rmdir "$root/.mediafiles.restore"
      changed_when: true
      when: not tandoor_s3_enabled | bool

    - name: Start the previous Tandoor
      community.docker.docker_compose_v2:
        project_src: "{{ tandoor_dir }}"
        state: present
        pull: missing
        remove_orphans: true

    - name: Check that the previous Tandoor is healthy
      ansible.builtin.include_tasks: health.yml
      vars:
        tandoor_health_wait: "{{ tandoor_rollback_timeout }}"

    - name: Note the rollback
      ansible.builtin.set_fact:
        tandoor_restore_error: >-
          {{ '' if tandoor_healthy
             else 'Tandoor ' ~ tandoor_installed_version ~ ' is not healthy within '
                  ~ tandoor_rollback_timeout ~ ' seconds, at least 10 for each database check ('
                  ~ tandoor_health_lines | join('; ') ~ ')' }}

  rescue:
    - name: Note the failed rollback
      ansible.builtin.set_fact:
        tandoor_healthy: false
        tandoor_restore_error: "{{ tandoor_failure | trim }}"
