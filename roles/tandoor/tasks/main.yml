---
# Docker comes from the playbook (the docker role or Docker's own packages),
# not from a role dependency; fail early and clearly when it is missing.
- name: Check for Docker
  ansible.builtin.include_role:
    name: noixdev.infra.docker_check

- name: Check that tandoor_secret_key is set
  ansible.builtin.assert:
    that: tandoor_secret_key | default('') | string | length >= 32
    fail_msg: tandoor_secret_key is required and must have at least 32 characters.
    quiet: true

- name: Check that tandoor_db_password is set
  ansible.builtin.assert:
    that: tandoor_db_password | default('') | string | length > 0
    fail_msg: tandoor_db_password is required.
    quiet: true

# The names end up in compose, Traefik rules and docker filters unquoted.
- name: Check the tandoor settings
  ansible.builtin.assert:
    that:
      - tandoor_version is match('^2\.\d+\.\d+$')
      - tandoor_image | length > 0
      - tandoor_postgres_major | length > 0
      - tandoor_dir is match('^/')
      - tandoor_project is match('^[a-z0-9][a-z0-9_-]*$')
      - tandoor_data_dir is match('^/')
      - tandoor_hostname is match('^[A-Za-z0-9][A-Za-z0-9.-]*$')
      - tandoor_url is match('^https?://[A-Za-z0-9.-]+(:[0-9]+)?/?$')
      - tandoor_traefik_network is match('^[A-Za-z0-9][A-Za-z0-9_.-]*$')
      - tandoor_traefik_entrypoints | reject('match', '^[A-Za-z0-9][A-Za-z0-9_-]*$') | list | length == 0
      - (tandoor_traefik_middlewares + tandoor_traefik_api_middlewares) | reject('match', '^[A-Za-z0-9][A-Za-z0-9_.@-]*$') | list | length == 0
      - tandoor_traefik_priority | int >= 1
      - tandoor_trusted_proxy_count | int >= 0
      - tandoor_dumps_keep | int >= 1
      - tandoor_health_timeout | int > 0
      - tandoor_rollback_timeout | int > 0
    fail_msg: >-
      tandoor_version must look like 2.X.Y (major 2, no v); tandoor_dir and
      tandoor_data_dir must be absolute paths, the basename of tandoor_dir
      (the compose project) only lowercase letters, digits, - and _;
      tandoor_hostname (required) a host name; tandoor_url an http(s) origin
      without a path; tandoor_traefik_network a network name,
      tandoor_traefik_entrypoints entrypoint names and
      tandoor_traefik_middlewares and tandoor_traefik_api_middlewares
      middleware names (name@provider); tandoor_image must be set,
      tandoor_postgres_image with a tag that starts with the PostgreSQL major
      (postgres:18, postgres:18.1-alpine); tandoor_traefik_priority,
      tandoor_dumps_keep, tandoor_health_timeout and
      tandoor_rollback_timeout must be positive, tandoor_trusted_proxy_count
      not negative.
    quiet: true

# From 18 on the image keeps its cluster below /var/lib/postgresql (in
# 18/docker), which compose.yaml binds to tandoor_data_dir/postgres. Older
# images declare the volume /var/lib/postgresql/data, which Docker mounts as
# an anonymous volume over the bind: the database would live outside
# tandoor_data_dir, and docker compose down -v would take the recipes with
# it.
- name: Check the PostgreSQL major
  ansible.builtin.assert:
    that: tandoor_postgres_major | int >= 18
    fail_msg: >-
      tandoor_postgres_image {{ tandoor_postgres_image }} is PostgreSQL
      {{ tandoor_postgres_major }}; the role needs PostgreSQL 18 or newer.
      Older images keep the database on a volume of their own
      (/var/lib/postgresql/data) instead of below /var/lib/postgresql, which
      the role binds to {{ tandoor_data_dir }}/postgres, so it would live
      outside tandoor_data_dir. The role changes nothing.
    quiet: true

- name: Check tandoor_email
  ansible.builtin.assert:
    that:
      - tandoor_email is mapping
      - tandoor_email.keys() | difference(['host', 'port', 'user', 'password', 'tls', 'ssl', 'from']) | length == 0
      - tandoor_mail.host | string is match('^([A-Za-z0-9][A-Za-z0-9.-]*)?$')
      - tandoor_mail.port | int >= 1 and tandoor_mail.port | int <= 65535
      - not (tandoor_mail.tls | bool and tandoor_mail.ssl | bool)
      - tandoor_mail.host | length == 0 or tandoor_mail['from'] | string is match('^[^@\s]+@[^@\s]+$')
      - (tandoor_mail.user ~ tandoor_mail.password ~ tandoor_mail['from']) is not search('[\r\n]')
    fail_msg: >-
      tandoor_email takes host, port, user, password, tls, ssl and from;
      host must be a host name (empty turns mail off), port a port number;
      tls and ssl cannot both be on (tls is STARTTLS, ssl implicit TLS); with a host,
      from (the sender address) is required; no value may hold a line break.
    quiet: true

- name: Check tandoor_s3
  ansible.builtin.assert:
    that:
      - tandoor_s3 is mapping
      - tandoor_s3.keys() | difference(['access_key', 'secret_key', 'bucket', 'endpoint', 'region', 'querystring_auth', 'custom_domain']) | length == 0
      - not tandoor_s3_enabled | bool or tandoor_s3_settings.secret_key | string | length > 0
      - not tandoor_s3_enabled | bool or tandoor_s3_settings.bucket | string | length > 0
      - tandoor_s3_settings.bucket | string is match('^([a-z0-9][a-z0-9.-]{1,61}[a-z0-9])?$')
      - tandoor_s3_settings.endpoint | string is match('^(https?://[A-Za-z0-9.-]+(:[0-9]+)?/?)?$')
      - tandoor_s3_settings.region | string is match('^[a-z0-9-]*$')
      - tandoor_s3_settings.custom_domain | string is match('^([A-Za-z0-9][A-Za-z0-9.-]*(:[0-9]+)?(/\S*)?)?$')
      - (tandoor_s3_settings.access_key ~ tandoor_s3_settings.secret_key) is not search('[\r\n]')
    fail_msg: >-
      tandoor_s3 takes access_key, secret_key, bucket, endpoint, region,
      querystring_auth and custom_domain; with an access_key (media in S3),
      secret_key and bucket are required. bucket must be an S3 bucket name,
      endpoint an http(s) URL without a path (empty for AWS), region a region
      name, custom_domain a host name with an optional path; no value may hold
      a line break.
    quiet: true

# A half-written tandoor_s3 would leave the media local, and the
# installation would then be held to local media.
- name: Check that tandoor_s3 has an access_key with its other settings
  ansible.builtin.assert:
    that: tandoor_s3_enabled | bool or tandoor_s3_without_access_key | length == 0
    fail_msg: >-
      tandoor_s3 sets {{ tandoor_s3_without_access_key | join(', ') }}
      without access_key, which turns S3 on; without it the media would stay
      local, and an installation keeps its media where it was made. Set
      access_key, or remove them.
    quiet: true
  vars:
    tandoor_s3_without_access_key: >-
      {{ ['secret_key', 'bucket', 'endpoint', 'region', 'custom_domain']
         | select('in', tandoor_s3_settings | dict2items | selectattr('value') | map(attribute='key') | list)
         | list }}

- name: Check tandoor_env
  ansible.builtin.assert:
    that:
      - tandoor_env is mapping
      - tandoor_env.keys() | reject('match', '^[A-Z][A-Z0-9_]*$') | list | length == 0
      - tandoor_env.values() | select('mapping') | list | length == 0
      - tandoor_env.values() | reject('string') | select('iterable') | list | length == 0
      - tandoor_owned | length == 0
    fail_msg: >-
      tandoor_env keys must be environment variable names (uppercase letters,
      digits and _) with plain values, and the role sets these itself:
      {{ tandoor_owned | join(', ') if tandoor_owned else 'none' }} (and every
      {{ tandoor_env_owned_prefixes | join('*, ') }}* key). Use the role's
      variables instead (tandoor_secret_key, tandoor_db_password,
      tandoor_hostname, tandoor_url, tandoor_email, tandoor_s3, ...); open
      registration is always off.
    quiet: true
  vars:
    tandoor_owned: >-
      {{ (tandoor_env if tandoor_env is mapping else {}).keys()
         | select('in', tandoor_env_owned)
         | union((tandoor_env if tandoor_env is mapping else {}).keys()
                 | select('match', '^(' ~ tandoor_env_owned_prefixes | join('|') ~ ')'))
         | sort }}

# A key left empty in YAML (KEY:) is null, which would reach Tandoor as the
# text None. The message names the keys, not the values.
- name: Check that tandoor_env has a value for every key
  ansible.builtin.assert:
    that: tandoor_env_null | length == 0
    fail_msg: >-
      tandoor_env has no value for {{ tandoor_env_null | join(', ') }}
      (null, as a key left empty in YAML is), which would reach Tandoor as the
      text None. Set a value, '' for an empty one, or remove the key.
    quiet: true
  vars:
    tandoor_env_null: "{{ tandoor_env | dict2items | selectattr('value', 'none') | map(attribute='key') | sort }}"

# Also refuses after a failed update (its marker) and after an update that
# did not finish (its marker, step update).
- name: Read the installation
  ansible.builtin.include_tasks: state.yml

- name: Check the first admin for the install
  ansible.builtin.assert:
    that:
      - tandoor_admin_user | default('') | string is match('^[A-Za-z0-9.@+_-]+$')
      - tandoor_admin_password | default('') | string | length > 0
      - tandoor_admin_email | default('') | string is match('^[^@\s]+@[^@\s]+$')
    fail_msg: >-
      Tandoor is not installed in {{ tandoor_dir }}; a fresh install needs
      tandoor_admin_user (letters, digits and . @ + - _),
      tandoor_admin_password and tandoor_admin_email (an e-mail address).
    quiet: true
  when: tandoor_state == 'install'

- name: Install Tandoor
  ansible.builtin.include_tasks: install.yml
  when: tandoor_state == 'install'

- name: Update Tandoor
  ansible.builtin.include_tasks: update.yml
  when: tandoor_state == 'update'

# The run after an update that did not finish, with
# tandoor_restore_interrupted: the files from before it (the marker's
# copies) and the database and the media of its backup put back by
# restore.yml, as a rollback puts them back, and nothing else of the update.
# Healthy, the marker goes and the run ends; the next run without the
# variable tries the update again. Not healthy, update-failed records a
# failed rollback (rolled_back_to null), which refuses every version.
- name: Restore the backup of the interrupted update
  when: tandoor_state == 'restore_interrupted'
  vars:
    tandoor_interrupted_from: "{{ tandoor_update_in_progress.from_version | default('?') }}"
    tandoor_interrupted_to: "{{ tandoor_update_in_progress.to_version }}"
  block:
    # They hold the secret key and the passwords, so the tasks are no_log
    # and a failure gets a message of its own; state.yml has checked that
    # the copy of the compose file exists.
    - name: Read the files from before the interrupted update
      block:
        - name: Read the compose file from before the interrupted update
          ansible.builtin.slurp:
            src: "{{ tandoor_update_marker_compose }}"
          register: tandoor_update_marker_compose_read
          no_log: true

        # restore.yml puts it back when it has content; without S3 there is
        # none.
        - name: Read the S3 secret file from before the interrupted update
          ansible.builtin.slurp:
            src: "{{ tandoor_update_marker_s3_secret }}"
          register: tandoor_s3_secret_read
          failed_when: false
          no_log: true

        - name: Note the files and the backup from before the interrupted update
          ansible.builtin.set_fact:
            tandoor_compose_before: "{{ tandoor_update_marker_compose_read.content | b64decode }}"
            tandoor_backup: "{{ tandoor_update_in_progress.backup }}"
          no_log: true
      rescue:
        - name: Fail on the copy of the compose file
          ansible.builtin.fail:
            msg: >-
              Reading {{ tandoor_update_marker_compose }}, the copy of the
              compose file from before the interrupted update, failed. The
              error is not shown: it can quote the file, which holds the
              secret key and the passwords. The role changes nothing. Check
              that it is a file root can read, then run the role again.

    - name: Roll back to the backup of the interrupted update
      ansible.builtin.include_tasks: restore.yml
      vars:
        tandoor_installed_version: "{{ tandoor_interrupted_from }}"

    - name: Remove the marker of the restored update
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop: "{{ tandoor_update_marker_files }}"
      when: tandoor_healthy

    - name: Report the restore
      ansible.builtin.debug:
        msg: >-
          Tandoor in {{ tandoor_dir }} runs {{ tandoor_interrupted_from }}
          again: the interrupted update to {{ tandoor_interrupted_to }} was
          rolled back to the backup {{ tandoor_backup }}. Remove
          tandoor_restore_interrupted; the next run with a newer
          tandoor_version tries the update again.
      when: tandoor_healthy

    # As after a failed rollback: the data is in the backup, and no version
    # may run over the database the restore left.
    - name: Write the marker of the failed restore
      ansible.builtin.copy:
        dest: "{{ tandoor_marker_file }}"
        content: |
          # Written by the noixdev.infra.tandoor role: the update to
          # failed_version did not finish, and restoring the backup failed.
          # The role refuses every version while this file exists.
          {{ {'failed_version': tandoor_interrupted_to,
              'rolled_back_to': none,
              'backup': tandoor_backup,
              'time': now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ'),
              'restore_error': tandoor_restore_error}
             | to_nice_yaml(sort_keys=false) }}
        owner: root
        group: root
        mode: "0644"
      when: not tandoor_healthy

    - name: Remove the marker of the update whose restore failed
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop: "{{ tandoor_update_marker_files }}"
      when: not tandoor_healthy

    - name: Fail with the failed restore
      ansible.builtin.fail:
        msg: >-
          Restoring Tandoor {{ tandoor_interrupted_from }} in {{ tandoor_dir }}
          from the backup {{ tandoor_backup }} after the interrupted update to
          {{ tandoor_interrupted_to }} failed ({{ tandoor_restore_error }}), so
          Tandoor may be down. {{ tandoor_restore_hint }}
          {{ tandoor_marker_file }} refuses every version; remove it once
          Tandoor runs again.
      when: not tandoor_healthy

# A reconfigure keeps the version, so the schema stays and it takes no backup.
- name: Reconfigure Tandoor
  ansible.builtin.include_tasks: reconfigure.yml
  when: tandoor_state == 'reconfigure'

# Read-only: a run without changes starts and restarts nothing, but stays red
# while a container is down.
- name: Check that Tandoor runs
  when: tandoor_state == 'noop'
  block:
    - name: Fail when a container is not running
      ansible.builtin.fail:
        msg: >-
          Tandoor in {{ tandoor_dir }} is down: the services
          {{ tandoor_down | join(', ') }} are not running. The role starts
          nothing on a run without changes; start them with docker compose up
          -d in {{ tandoor_dir }}.
      when: tandoor_down | length > 0

    - name: Check that Tandoor is healthy
      ansible.builtin.include_tasks: health.yml

    - name: Fail when Tandoor is not healthy
      ansible.builtin.fail:
        msg: >-
          Tandoor in {{ tandoor_dir }} is unhealthy: the web and the database
          containers are not both healthy, or Tandoor cannot use its database,
          {{ tandoor_health_within }} ({{ tandoor_health_lines | join('; ') }}).
          The role restarts nothing
          on a run without changes; see docker compose logs in
          {{ tandoor_dir }}.
      when: not tandoor_healthy

# Reached only by a run that succeeded, so the marker names another version
# and records a rollback that worked.
- name: Remove the marker of a failed update of another version
  ansible.builtin.file:
    path: "{{ tandoor_marker_file }}"
    state: absent
  when: tandoor_marker_read.content is defined
