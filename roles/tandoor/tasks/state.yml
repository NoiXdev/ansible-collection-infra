---
# Reads the host and sets tandoor_state:
#   install      no compose file and none of tandoor_data_subdirs
#   update       tandoor_version is newer than the installed version
#   reconfigure  the compose file the role writes differs from the one on
#                disk, or the S3 secret file or the key of the web
#                container from the secret key
#   noop         everything as the role writes it
#   restore_interrupted
#                an update that did not finish (tandoor_update_marker, step
#                update) and tandoor_restore_interrupted: main.yml restores
#                its backup and does nothing else
# Also sets tandoor_installed (a compose file exists), tandoor_compose_before
# (the compose file on disk, which a rollback puts back),
# tandoor_compose_on_disk (it parsed, which tandoor_installed_version and
# tandoor_installed_media read), tandoor_s3_secret_read (with S3, the secret
# file on disk), tandoor_data_found (the subdirectories of
# tandoor_data_subdirs that exist), tandoor_data_present (any of postgres and
# mediafiles that exist) and tandoor_down (the expected services that are not
# running). Refuses, before anything else, a
# tandoor_data_dir that is not a mountpoint (with
# tandoor_data_dir_mountpoint), a compose file that is not YAML and a compose
# file without the data subdirectories of its media (an unmounted volume);
# then an install that did not complete (its marker), left-over data without
# a compose file, an update that did not finish (tandoor_update_marker with
# step update, read into tandoor_update_in_progress; without
# tandoor_restore_interrupted, or with it but without the copy of the compose
# file, with S3 of the secret file, or the dump), a marker of it the role did
# not write, a marker of a failed update (tandoor_marker_read and
# tandoor_marker; one of a failed rollback refuses every version, one of a
# rollback that worked the failed version), tandoor_restore_interrupted
# without an update to restore, a change between local media and S3, a
# compose file without a Tandoor version, a downgrade (not for a restore), a
# tandoor_db_password that the database does not take, and a PostgreSQL major
# other than the database's. Changes only what an interrupted update left
# that nothing needs: a marker of an update in progress beside update-failed
# of the same backup (the rollback ran), and, after every refusal, the
# partial backup and the marker of an update stopped during its backup (the
# files are as before it), or the copies of a marker that was removed by
# hand.

# A block volume that is not mounted leaves its mountpoint as an empty
# directory on the root filesystem; an install there would put the data
# beside the volume.
- name: Check that the data directory is a mountpoint
  ansible.builtin.command:
    argv: [mountpoint, -q, "{{ tandoor_data_dir }}"]
  register: tandoor_data_dir_mounted
  changed_when: false
  failed_when: false
  when: tandoor_data_dir_mountpoint | bool

- name: Refuse a data directory that is not a mountpoint
  ansible.builtin.fail:
    msg: >-
      tandoor_data_dir_mountpoint is on, but {{ tandoor_data_dir }} is not a
      mountpoint: is the volume mounted? The role changes nothing. Mount the
      volume at {{ tandoor_data_dir }}, then run the role again.
  when:
    - tandoor_data_dir_mountpoint | bool
    - tandoor_data_dir_mounted.rc != 0

- name: Read the compose file
  ansible.builtin.slurp:
    src: "{{ tandoor_compose_file }}"
  register: tandoor_compose_read
  failed_when: false
  # It holds the secret key and the passwords.
  no_log: true

- name: Look for the data subdirectories
  ansible.builtin.stat:
    path: "{{ tandoor_data_dir }}/{{ item }}"
    get_checksum: false
  # Both media modes: the installation may record the other one than this
  # run sets, which is refused below.
  loop: "{{ (tandoor_data_subdirs + ['postgres', 'mediafiles']) | unique }}"
  register: tandoor_subdirs_stat

- name: Note what is on the host
  ansible.builtin.set_fact:
    tandoor_compose_before: "{{ tandoor_compose_read.content | default('') | b64decode }}"
    tandoor_installed: "{{ tandoor_compose_read.content is defined }}"
    tandoor_data_present: >-
      {{ tandoor_subdirs_stat.results | selectattr('stat.exists') | map(attribute='item') | list }}
    tandoor_data_found: >-
      {{ tandoor_subdirs_stat.results | selectattr('stat.exists') | map(attribute='item')
         | select('in', tandoor_data_subdirs) | list }}
  no_log: true

# Once, in a no_log task: an error of the YAML parser can quote a line of the
# file, which holds the secret key and the passwords, so a file that is not
# YAML gets a message of its own without the error. One that is YAML but not
# a mapping parses as empty and names no version, which is refused below.
- name: Check that the compose file is YAML
  block:
    - name: Parse the compose file
      ansible.builtin.set_fact:
        tandoor_compose_on_disk: "{{ tandoor_compose_parsed if tandoor_compose_parsed is mapping else {} }}"
      vars:
        tandoor_compose_parsed: "{{ (tandoor_compose_before or '{}') | from_yaml }}"
      no_log: true
  rescue:
    - name: Fail on a compose file that is not YAML
      ansible.builtin.fail:
        msg: >-
          {{ tandoor_compose_file }} is not YAML, so the role cannot tell what
          is installed and changes nothing. The parser's error is not shown:
          it can quote a line of the file, which holds the secret key and the
          passwords. Put back the compose file the role wrote (docker compose
          config --quiet in {{ tandoor_dir }} shows the error).

# Only install creates the subdirectories, and the containers do not create a
# missing one, so their absence beside a compose file is data that is not
# there (an unmounted volume), never a state to repair. The media the compose
# file records decide whether mediafiles is expected: an S3 installation has
# none, and a run that would change the media is refused further down.
- name: Refuse an installation without its data
  ansible.builtin.fail:
    msg: >-
      Tandoor is installed in {{ tandoor_dir }} ({{ tandoor_compose_file }}),
      but {{ tandoor_data_dir }} lacks {{ tandoor_data_missing | join(', ') }}:
      is the volume mounted? The role changes nothing and creates none of
      them. Mount the volume (or put the data back) at
      {{ tandoor_data_dir }}, then run the role again.
  vars:
    tandoor_data_expected: "{{ ['postgres'] + ([] if tandoor_installed_media == 'S3' else ['mediafiles']) }}"
    # In the order of tandoor_data_expected, which difference does not keep.
    tandoor_data_missing: "{{ tandoor_data_expected | reject('in', tandoor_data_present) | list }}"
  when:
    - tandoor_installed
    - tandoor_data_missing | length > 0

- name: Look for the marker of an install in progress
  ansible.builtin.stat:
    path: "{{ tandoor_install_marker }}"
    get_checksum: false
  register: tandoor_install_marker_stat

- name: Refuse an install that did not complete
  ansible.builtin.fail:
    msg: >-
      {{ tandoor_install_marker }} exists: an install of Tandoor in
      {{ tandoor_dir }} did not complete, so the first admin or its space may
      be missing and the database half made. The role changes nothing.
      {{ tandoor_install_hint }}
  when: tandoor_install_marker_stat.stat.exists

- name: Refuse data without a compose file
  ansible.builtin.fail:
    msg: >-
      Tandoor data is in {{ tandoor_data_dir }}
      ({{ tandoor_data_found | join(', ') }}), but there is no compose file
      {{ tandoor_compose_file }}. The role does not install over left-over
      data and changes nothing; move it away, or put back the compose file
      that uses it.
  when:
    - not tandoor_installed
    - tandoor_data_found | length > 0

# Written by update.yml after a failed update; it names the failed version.
- name: Read the marker of a failed update
  ansible.builtin.slurp:
    src: "{{ tandoor_marker_file }}"
  register: tandoor_marker_read
  failed_when: false

# Left by a run that stopped during an update (update.yml). Not secret: the
# versions, the step, the backup and the time.
- name: Read the marker of an update in progress
  ansible.builtin.slurp:
    src: "{{ tandoor_update_marker }}"
  register: tandoor_update_marker_read
  failed_when: false

- name: Note that no update is in progress
  ansible.builtin.set_fact:
    tandoor_update_in_progress: {}
    tandoor_update_rolled_back: false

# A marker that is not YAML parses to nothing and is refused below. It holds
# no secret: the copy of the compose file is never read here.
- name: Check the marker of an update in progress
  when: tandoor_update_marker_read.content is defined
  block:
    - name: Parse the marker of the update in progress
      ansible.builtin.set_fact:
        tandoor_update_in_progress: "{{ tandoor_update_marker_yaml if tandoor_update_marker_yaml is mapping else {'step': none} }}"
      vars:
        tandoor_update_marker_yaml: "{{ tandoor_update_marker_read.content | b64decode | from_yaml }}"
  rescue:
    - name: Note a marker that is not YAML
      ansible.builtin.set_fact:
        tandoor_update_in_progress: {step: null}

# update-failed of the same backup (both take it from tandoor_backup) was
# written by the rescue of this update, or by the failed restore of it, which
# was stopped before it removed this marker: the rollback ran, and
# update-failed decides below. An update-failed of another backup is left
# from an earlier update that was rolled back (it stays through updates to
# other versions), so this marker is checked as without one. So is a marker
# with step backup, whoever wrote update-failed: the files are as before the
# update, and it is cleaned up as without update-failed.
- name: Check whether update-failed records the update in progress
  when:
    - tandoor_update_in_progress.step | default(none) == 'update'
    - tandoor_marker_read.content is defined
  block:
    - name: Compare the backups of the two markers
      ansible.builtin.set_fact:
        tandoor_update_rolled_back: >-
          {{ tandoor_failed_yaml is mapping
             and tandoor_update_in_progress.backup | default('', true) | string is match('^/')
             and (tandoor_failed_yaml.backup | default('', true) | string) == (tandoor_update_in_progress.backup | string) }}
      vars:
        tandoor_failed_yaml: "{{ tandoor_marker_read.content | b64decode | from_yaml }}"
  rescue:
    # Refused below.
    - name: Note a marker of a failed update that is not YAML
      ansible.builtin.set_fact:
        tandoor_update_rolled_back: false

- name: Remove the marker of an update in progress beside its failed update
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ tandoor_update_marker_files }}"
  when: tandoor_update_rolled_back | bool

- name: Note that the rolled back update is not in progress
  ansible.builtin.set_fact:
    tandoor_update_in_progress: {}
  when: tandoor_update_rolled_back | bool

- name: Refuse a marker of an update in progress the role did not write
  ansible.builtin.fail:
    msg: >-
      {{ tandoor_update_marker }} exists, but it is not YAML or lacks step or
      to_version (or, with step update, backup), so the role cannot tell how
      far the Tandoor update in {{ tandoor_dir }} got and changes nothing.
      Check Tandoor, then remove it with its copies (rm
      {{ tandoor_update_marker_files | join(' ') }}).
  when:
    - tandoor_update_in_progress | length > 0
    - >-
      tandoor_update_in_progress.step | default(none) not in ['backup', 'update']
      or not tandoor_update_in_progress.to_version | default('', true) | string is match('^\d+\.\d+\.\d+$')
      or (tandoor_update_in_progress.step == 'update'
          and not tandoor_update_in_progress.backup | default('', true) | string is match('^/'))

# Step update: the compose file may name the new version, the database may be
# migrated or half migrated, and Tandoor may run either version or neither.
# Rolling back on its own would lose what changed since, if the update had in
# fact finished and only the marker's removal was lost; the operator decides.
- name: Refuse to run after an interrupted update
  ansible.builtin.fail:
    msg: >-
      {{ tandoor_update_marker }} exists: the Tandoor update from
      {{ tandoor_update_in_progress.from_version | default('?') }} to
      {{ tandoor_update_in_progress.to_version }} did not finish (the run that
      started it on {{ tandoor_update_in_progress.time | default('?') }}
      stopped after its backup), and the backup from before it is
      {{ tandoor_update_in_progress.backup }}. Tandoor in {{ tandoor_dir }}
      may run either version or neither, with a database the new version may
      have migrated; the role changes nothing. To go back to
      {{ tandoor_update_in_progress.from_version | default('?') }},
      set tandoor_restore_interrupted: true for one run to restore it (the
      files from before the update, and the database and the media from the
      backup; media in S3 stay as they are), or remove
      {{ tandoor_update_marker }} to keep Tandoor as it is now, then check it
      and run the role again.
  when:
    - tandoor_update_in_progress.step | default(none) == 'update'
    - not tandoor_restore_interrupted | bool

- name: Look for what the restore of the interrupted update needs
  ansible.builtin.stat:
    path: "{{ item }}"
    get_checksum: false
  # With S3, the copy of the secret file too: without it the restore would
  # keep a rotated key beside the previous compose file.
  loop: >-
    {{ [tandoor_update_marker_compose, (tandoor_update_in_progress.backup | default('')) ~ '/tandoor.dump']
       + ([tandoor_update_marker_s3_secret] if tandoor_s3_enabled | bool else []) }}
  register: tandoor_restore_needs
  when:
    - tandoor_update_in_progress.step | default(none) == 'update'
    - tandoor_restore_interrupted | bool

- name: Refuse a restore without the copies of the files or the dump
  ansible.builtin.fail:
    msg: >-
      tandoor_restore_interrupted is set to restore the backup
      {{ tandoor_update_in_progress.backup }} of the interrupted Tandoor update
      from {{ tandoor_update_in_progress.from_version | default('?') }} to
      {{ tandoor_update_in_progress.to_version }}, but
      {{ tandoor_restore_missing | join(' and ') }}
      {{ 'is' if tandoor_restore_missing | length == 1 else 'are' }} missing,
      so the role cannot restore it and changes nothing.
      {{ tandoor_restore_hint }} Then remove {{ tandoor_update_marker }} and
      run the role again without the variable.
  vars:
    tandoor_backup: "{{ tandoor_update_in_progress.backup }}"
    tandoor_restore_missing: >-
      {{ tandoor_restore_needs.results | rejectattr('stat.exists') | map(attribute='item') | list }}
  when:
    - tandoor_update_in_progress.step | default(none) == 'update'
    - tandoor_restore_interrupted | bool
    - tandoor_restore_missing | length > 0

# A marker that is not YAML cannot say which version failed.
- name: Check the marker of a failed update
  when: tandoor_marker_read.content is defined
  block:
    - name: Parse the marker
      ansible.builtin.set_fact:
        tandoor_marker: "{{ tandoor_marker_yaml if tandoor_marker_yaml is mapping else {} }}"
      vars:
        tandoor_marker_yaml: "{{ tandoor_marker_read.content | b64decode | from_yaml }}"
  rescue:
    - name: Fail on a marker that is not YAML
      ansible.builtin.fail:
        msg: >-
          {{ tandoor_marker_file }} exists, but it is not YAML, so the role
          cannot tell which Tandoor update failed and changes nothing. Check
          Tandoor, then remove the file (rm {{ tandoor_marker_file }}).

# The rollback failed (or the marker does not say it worked): the database
# may be empty or half restored, and the backup holds the data. Any version
# would take a backup of that database, come up healthy and remove the
# marker, the last pointer to the real backup, so every version is refused,
# before the refusals of the media and of a downgrade: a rollback that failed
# before it put the previous compose file back leaves the failed version in
# it, and an older pin must hear this, not the downgrade refusal.
- name: Refuse every version after a failed rollback
  ansible.builtin.fail:
    msg: >-
      {{ tandoor_marker_file }} exists: the Tandoor update to
      {{ tandoor_marker.failed_version | default('?') }} failed on
      {{ tandoor_marker.time | default('?') }}, and rolling back failed too
      ({{ tandoor_marker.restore_error | default('?') }}). The database may
      be empty or half restored; the data is in the backup {{ tandoor_backup }}.
      The role refuses every version and changes nothing until Tandoor is
      restored. {{ tandoor_restore_hint }} Then check Tandoor (its recipes and
      images) and remove the marker (rm {{ tandoor_marker_file }}).
  vars:
    tandoor_backup: "{{ tandoor_marker.backup | default('?', true) }}"
  when:
    - tandoor_marker_read.content is defined
    - not tandoor_marker.rolled_back_to | default(none)

# A marker that names no version blocks every version.
- name: Refuse the version of a failed update
  ansible.builtin.fail:
    msg: >-
      {{ tandoor_marker_file }} exists: the Tandoor update to
      {{ tandoor_version }} failed on {{ tandoor_marker.time | default('?') }}
      (rolled back to {{ tandoor_marker.rolled_back_to }}; backup
      {{ tandoor_marker.backup | default('?') }}). The role does not try
      {{ tandoor_version }} again and changes nothing while the marker names
      it. To try again, remove it (rm {{ tandoor_marker_file }}); or set
      tandoor_version to another version, and the marker is removed once a
      run with it succeeds.
  when:
    - tandoor_marker_read.content is defined
    - (tandoor_marker.failed_version | default(tandoor_version) | string) == tandoor_version

# A variable left set must never turn a later interruption into a rollback
# of its own. An update stopped during its backup changed nothing to restore.
- name: Refuse tandoor_restore_interrupted without an interrupted update
  ansible.builtin.fail:
    msg: >-
      tandoor_restore_interrupted is set, but there is no interrupted update in
      {{ tandoor_dir }}; remove the variable{{ (' (' ~ tandoor_update_marker
      ~ ' records an update that stopped during its backup, before anything changed;'
      ~ ' the next run without the variable cleans it up and updates)')
      if tandoor_update_in_progress.step | default(none) == 'backup' else '' }}.
  when:
    - tandoor_restore_interrupted | bool
    - tandoor_update_in_progress.step | default(none) != 'update'

# Before any change: the media would stay behind in the old place.
- name: Refuse a change between local media and S3
  ansible.builtin.fail:
    msg: >-
      {{ tandoor_compose_file }} records the media of Tandoor as
      {{ tandoor_installed_media }}, but this run sets them to
      {{ tandoor_media }} (tandoor_s3.access_key is
      {{ 'set' if tandoor_s3_enabled | bool else 'empty' }}). The role does
      not move an installation between local media and S3, as the files
      would stay behind in the old place, and changes nothing; run it with
      the tandoor_s3 of the installation.
  when:
    - tandoor_installed
    - tandoor_installed_media != tandoor_media

- name: Check the installed version
  when: tandoor_installed
  block:
    - name: Check that the compose file names the Tandoor version
      ansible.builtin.assert:
        that: tandoor_installed_version is match('^\d+\.\d+\.\d+$')
        fail_msg: >-
          The web image in {{ tandoor_compose_file }} has no tag X.Y.Z, so
          the role cannot tell which Tandoor version is installed and changes
          nothing. Put back the compose file the role wrote.
        quiet: true

    # Tandoor cannot migrate its database down.
    - name: Refuse a downgrade
      ansible.builtin.fail:
        msg: >-
          tandoor_version {{ tandoor_version }} is lower than the installed
          version {{ tandoor_installed_version }} in {{ tandoor_dir }}; the
          role refuses to downgrade, Tandoor cannot migrate its database
          down, and changes nothing. Set tandoor_version to
          {{ tandoor_installed_version }} or newer.
      # A restore puts the previous files back, whatever tandoor_version is.
      when:
        - tandoor_version is version(tandoor_installed_version, '<')
        - tandoor_update_in_progress.step | default(none) != 'update'

# PostgreSQL takes POSTGRES_PASSWORD only when it creates the cluster: on an
# existing one a new tandoor_db_password would reach Tandoor but not the
# database, and Tandoor could not log in (its health check does not notice).
# The compose file on disk records the password the role wrote last (with $
# doubled, as the template writes it); compared in a no_log task, so that
# neither password is in the output.
- name: Compare tandoor_db_password with the compose file
  ansible.builtin.set_fact:
    tandoor_db_password_changed: >-
      {{ (((tandoor_compose_on_disk.services | default({})).db | default({})).environment | default({})).POSTGRES_PASSWORD
         | default('') | string | replace('$$', '$') != tandoor_db_password | string }}
  no_log: true
  when: tandoor_installed

# A new password may be the database's already, set by hand as the refusal
# below says. Asked over the network as Tandoor connects (the local socket
# and 127.0.0.1 need no password); the password goes through stdin into the
# environment of psql (the x keeps trailing newlines), and the task is
# no_log. The next task fails with the error.
- name: Check that the database takes the new tandoor_db_password
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - exec
      - -T
      - db
      - sh
      - -c
      - >-
        PGPASSWORD="$(cat; echo x)"; PGPASSWORD="${PGPASSWORD%x}"; export PGPASSWORD;
        PGCONNECT_TIMEOUT=10 exec psql --host=db --username=tandoor --dbname=tandoor
        --no-psqlrc --tuples-only --command='SELECT 1'
    chdir: "{{ tandoor_dir }}"
    stdin: "{{ tandoor_db_password }}"
    stdin_add_newline: false
  register: tandoor_hidden
  changed_when: false
  failed_when: false
  no_log: true
  when:
    - tandoor_installed
    - tandoor_db_password_changed | bool

- name: Refuse a tandoor_db_password the database does not take
  ansible.builtin.fail:
    msg: >-
      tandoor_db_password differs from the password in
      {{ tandoor_compose_file }}, and the database does not take it
      ({{ tandoor_hidden_error }}). PostgreSQL takes a password only when it
      creates the database, so Tandoor could not log in with the new one; the
      role changes nothing. To change the password, set it in the database
      first: in {{ tandoor_dir }} run docker compose exec db psql -U tandoor
      -d postgres and enter \password tandoor (an ALTER USER tandoor PASSWORD
      that keeps the password off the command line), then run the role again
      with the new tandoor_db_password. Or set tandoor_db_password back to the
      old one.
  when:
    - tandoor_installed
    - tandoor_db_password_changed | bool
    - tandoor_hidden.rc != 0

# The PostgreSQL image keeps its cluster in a directory per major below the
# mount (18/docker; main.yml refuses images older than 18): another major
# starts an empty cluster or none at all, so the one cluster's PG_VERSION must
# name the major of tandoor_postgres_image. More than one cluster (an old one
# left by pg_upgrade) is refused: which one is current cannot be told, and a
# stale one would start with old data. Up to three levels deep, above the
# PG_VERSION files of the databases inside a cluster.
- name: Look for the PostgreSQL cluster
  ansible.builtin.find:
    paths: "{{ tandoor_data_dir }}/postgres"
    patterns: [PG_VERSION]
    file_type: file
    recurse: true
    depth: 3
  register: tandoor_pg_version_files
  when: "'postgres' in tandoor_data_found"

- name: Read the PostgreSQL major of the cluster
  ansible.builtin.slurp:
    src: "{{ item }}"
  loop: "{{ tandoor_pg_version_files.files | default([]) | map(attribute='path') | sort }}"
  register: tandoor_pg_version_read

- name: Refuse more than one PostgreSQL cluster
  ansible.builtin.fail:
    msg: >-
      {{ tandoor_data_dir }}/postgres holds more than one PostgreSQL cluster:
      {{ tandoor_pg_clusters | join(', ') }}. The role cannot tell which one
      Tandoor uses (an old one left by pg_upgrade would start with old data)
      and changes nothing. Move every cluster but the current one out of
      {{ tandoor_data_dir }}/postgres, then run the role again.
  vars:
    tandoor_pg_clusters: >-
      {%- set found = [] -%}
      {%- for read in tandoor_pg_version_read.results -%}
      {%-   set _ = found.append(read.item ~ ' (PostgreSQL ' ~ (read.content | b64decode | trim) ~ ')') -%}
      {%- endfor -%}
      {{ found }}
  when: tandoor_pg_version_read.results | length > 1

- name: Refuse another PostgreSQL major
  ansible.builtin.fail:
    msg: >-
      tandoor_postgres_image {{ tandoor_postgres_image }} is PostgreSQL
      {{ tandoor_postgres_major }}, but the database in
      {{ tandoor_data_dir }}/postgres is PostgreSQL {{ tandoor_pg_major }}
      ({{ tandoor_pg_version_read.results[0].item }}). A new major does not
      read the old cluster; the role changes nothing. Set
      tandoor_postgres_image back to PostgreSQL {{ tandoor_pg_major }}, or
      upgrade the cluster (pg_upgrade, or a dump restored into the new
      major) first.
  vars:
    tandoor_pg_major: "{{ tandoor_pg_version_read.results[0].content | b64decode | trim }}"
  when:
    - tandoor_pg_version_read.results | length == 1
    - tandoor_postgres_major != tandoor_pg_major

- name: Read the S3 secret file
  ansible.builtin.slurp:
    src: "{{ tandoor_s3_secret_file }}"
  register: tandoor_s3_secret_read
  failed_when: false
  no_log: true
  when:
    - tandoor_installed
    - tandoor_s3_enabled | bool

# The key the web container was created with (the label of
# tandoor_s3_secret_hash). A docker compose up that failed after the files
# were written leaves the container with the old key while the files on disk
# match; the label tells, and the run is a reconfigure.
- name: Read the S3 secret key hash of the web container
  ansible.builtin.command:
    argv:
      - docker
      - ps
      - --all
      - --filter
      - label=com.docker.compose.project={{ tandoor_project }}
      - --filter
      - label=com.docker.compose.service=web
      - --format
      - "{{ '{{.Label \"' ~ tandoor_s3_secret_label ~ '\"}}' }}"
  register: tandoor_web_s3_hash
  changed_when: false
  when:
    - tandoor_installed
    - tandoor_s3_enabled | bool

- name: Read the services that run
  ansible.builtin.command:
    argv: [docker, compose, ps, --format, "{{ '{{.Service}}' }}", --status, running]
    chdir: "{{ tandoor_dir }}"
  register: tandoor_ps
  changed_when: false
  when: tandoor_installed

# After every refusal. Step backup: the files and the database are as before
# the update, and the web container stopped; the run goes on as any other,
# which with the same tandoor_version tries the update again and starts the
# stack (a run without changes fails on the stopped container, as it does
# for any). A backup being made is below <name>.partial, which only an
# interrupted backup leaves.
- name: Find the partial backups of an update stopped during its backup
  ansible.builtin.find:
    paths: "{{ tandoor_backup_dir }}"
    file_type: directory
    patterns: ['^\d{8}T\d{6}Z-\d+\.\d+\.\d+\.partial$']
    use_regex: true
  register: tandoor_partial_backups
  when: tandoor_update_in_progress.step | default(none) == 'backup'

- name: Remove what an update stopped during its backup left
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ (tandoor_partial_backups.files | default([]) | map(attribute='path') | sort) + tandoor_update_marker_files }}"
  when: tandoor_update_in_progress.step | default(none) == 'backup'

# They hold the secrets: left when the marker was removed by hand, as its
# refusal offers.
- name: Remove the copies of an update in progress without its marker
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ tandoor_update_marker_files | difference([tandoor_update_marker]) }}"
  when: tandoor_update_marker_read.content is not defined

- name: Decide what to do
  ansible.builtin.set_fact:
    tandoor_down: >-
      {{ tandoor_services | difference(tandoor_ps.stdout_lines | default([])) }}
    tandoor_state: >-
      {{ 'restore_interrupted' if tandoor_update_in_progress.step | default(none) == 'update'
         else 'install' if not tandoor_installed
         else 'update' if tandoor_version is version(tandoor_installed_version, '>')
         else 'reconfigure' if tandoor_compose_before != tandoor_compose
         or (tandoor_s3_enabled | bool
             and (tandoor_s3_secret_read.content | default('') | b64decode != tandoor_s3_settings.secret_key | string
                  or tandoor_web_s3_hash.stdout_lines | default([]) | reject('eq', tandoor_s3_secret_hash) | list | length > 0))
         else 'noop' }}
  no_log: true
