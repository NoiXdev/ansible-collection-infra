---
# Reads the host and sets tandoor_state:
#   install      no compose file and none of tandoor_data_subdirs
#   update       tandoor_version is newer than the installed version
#   reconfigure  the compose file the role writes differs from the one on
#                disk, or the S3 secret file from the secret key
#   noop         everything as the role writes it
# Also sets tandoor_installed (a compose file exists), tandoor_compose_before
# (the compose file on disk, which tandoor_installed_version reads, and which
# a rollback puts back), tandoor_s3_secret_read (with S3, the secret file on
# disk), tandoor_data_found (the data subdirectories that exist) and
# tandoor_down (the expected services that are not running). Changes
# nothing; refuses an install that did not complete (its marker), left-over
# data without a compose file, a change between local media and S3, a
# compose file without a Tandoor version, a downgrade, and a PostgreSQL
# major other than the database's.

- name: Read the compose file
  ansible.builtin.slurp:
    src: "{{ tandoor_compose_file }}"
  register: tandoor_compose_read
  failed_when: false
  # It holds the secret key and the passwords.
  no_log: true

- name: Look for the data subdirectories
  ansible.builtin.stat:
    path: "{{ tandoor_data_dir }}/{{ item }}"
    get_checksum: false
  loop: "{{ tandoor_data_subdirs }}"
  register: tandoor_subdirs_stat

- name: Note what is on the host
  ansible.builtin.set_fact:
    tandoor_compose_before: "{{ tandoor_compose_read.content | default('') | b64decode }}"
    tandoor_installed: "{{ tandoor_compose_read.content is defined }}"
    tandoor_data_found: >-
      {{ tandoor_subdirs_stat.results | selectattr('stat.exists') | map(attribute='item') | list }}
  no_log: true

- name: Look for the marker of an install in progress
  ansible.builtin.stat:
    path: "{{ tandoor_install_marker }}"
    get_checksum: false
  register: tandoor_install_marker_stat

- name: Refuse an install that did not complete
  ansible.builtin.fail:
    msg: >-
      {{ tandoor_install_marker }} exists: an install of Tandoor in
      {{ tandoor_dir }} did not complete, so the first admin or its space may
      be missing and the database half made. The role changes nothing.
      {{ tandoor_install_hint }}
  when: tandoor_install_marker_stat.stat.exists

- name: Refuse data without a compose file
  ansible.builtin.fail:
    msg: >-
      Tandoor data is in {{ tandoor_data_dir }}
      ({{ tandoor_data_found | join(', ') }}), but there is no compose file
      {{ tandoor_compose_file }}. The role does not install over left-over
      data and changes nothing; move it away, or put back the compose file
      that uses it.
  when:
    - not tandoor_installed
    - tandoor_data_found | length > 0

# Before any change: the media would stay behind in the old place.
- name: Refuse a change between local media and S3
  ansible.builtin.fail:
    msg: >-
      {{ tandoor_compose_file }} records the media of Tandoor as
      {{ tandoor_installed_media }}, but this run sets them to
      {{ tandoor_media }} (tandoor_s3.access_key is
      {{ 'set' if tandoor_s3_enabled | bool else 'empty' }}). The role does
      not move an installation between local media and S3, as the files
      would stay behind in the old place, and changes nothing; run it with
      the tandoor_s3 of the installation.
  when:
    - tandoor_installed
    - tandoor_installed_media != tandoor_media

- name: Check the installed version
  when: tandoor_installed
  block:
    - name: Check that the compose file names the Tandoor version
      ansible.builtin.assert:
        that: tandoor_installed_version is match('^\d+\.\d+\.\d+$')
        fail_msg: >-
          The web image in {{ tandoor_compose_file }} has no tag X.Y.Z, so
          the role cannot tell which Tandoor version is installed and changes
          nothing. Put back the compose file the role wrote.
        quiet: true

    # Tandoor cannot migrate its database down.
    - name: Refuse a downgrade
      ansible.builtin.fail:
        msg: >-
          tandoor_version {{ tandoor_version }} is lower than the installed
          version {{ tandoor_installed_version }} in {{ tandoor_dir }}; the
          role refuses to downgrade, Tandoor cannot migrate its database
          down, and changes nothing. Set tandoor_version to
          {{ tandoor_installed_version }} or newer.
      when: tandoor_version is version(tandoor_installed_version, '<')

# The PostgreSQL image keeps its cluster in a directory per major below the
# mount (18/docker; main.yml refuses images older than 18): another major
# starts an empty cluster or none at all, so the one cluster's PG_VERSION must
# name the major of tandoor_postgres_image. More than one cluster (an old one
# left by pg_upgrade) is refused: which one is current cannot be told, and a
# stale one would start with old data. Up to three levels deep, above the
# PG_VERSION files of the databases inside a cluster.
- name: Look for the PostgreSQL cluster
  ansible.builtin.find:
    paths: "{{ tandoor_data_dir }}/postgres"
    patterns: [PG_VERSION]
    file_type: file
    recurse: true
    depth: 3
  register: tandoor_pg_version_files
  when: "'postgres' in tandoor_data_found"

- name: Read the PostgreSQL major of the cluster
  ansible.builtin.slurp:
    src: "{{ item }}"
  loop: "{{ tandoor_pg_version_files.files | default([]) | map(attribute='path') | sort }}"
  register: tandoor_pg_version_read

- name: Refuse more than one PostgreSQL cluster
  ansible.builtin.fail:
    msg: >-
      {{ tandoor_data_dir }}/postgres holds more than one PostgreSQL cluster:
      {{ tandoor_pg_clusters | join(', ') }}. The role cannot tell which one
      Tandoor uses (an old one left by pg_upgrade would start with old data)
      and changes nothing. Move every cluster but the current one out of
      {{ tandoor_data_dir }}/postgres, then run the role again.
  vars:
    tandoor_pg_clusters: >-
      {%- set found = [] -%}
      {%- for read in tandoor_pg_version_read.results -%}
      {%-   set _ = found.append(read.item ~ ' (PostgreSQL ' ~ (read.content | b64decode | trim) ~ ')') -%}
      {%- endfor -%}
      {{ found }}
  when: tandoor_pg_version_read.results | length > 1

- name: Refuse another PostgreSQL major
  ansible.builtin.fail:
    msg: >-
      tandoor_postgres_image {{ tandoor_postgres_image }} is PostgreSQL
      {{ tandoor_postgres_major }}, but the database in
      {{ tandoor_data_dir }}/postgres is PostgreSQL {{ tandoor_pg_major }}
      ({{ tandoor_pg_version_read.results[0].item }}). A new major does not
      read the old cluster; the role changes nothing. Set
      tandoor_postgres_image back to PostgreSQL {{ tandoor_pg_major }}, or
      upgrade the cluster (pg_upgrade, or a dump restored into the new
      major) first.
  vars:
    tandoor_pg_major: "{{ tandoor_pg_version_read.results[0].content | b64decode | trim }}"
  when:
    - tandoor_pg_version_read.results | length == 1
    - tandoor_postgres_major != tandoor_pg_major

- name: Read the S3 secret file
  ansible.builtin.slurp:
    src: "{{ tandoor_s3_secret_file }}"
  register: tandoor_s3_secret_read
  failed_when: false
  no_log: true
  when:
    - tandoor_installed
    - tandoor_s3_enabled | bool

- name: Read the services that run
  ansible.builtin.command:
    argv: [docker, compose, ps, --format, "{{ '{{.Service}}' }}", --status, running]
    chdir: "{{ tandoor_dir }}"
  register: tandoor_ps
  changed_when: false
  when: tandoor_installed

- name: Decide what to do
  ansible.builtin.set_fact:
    tandoor_down: >-
      {{ tandoor_services | difference(tandoor_ps.stdout_lines | default([])) }}
    tandoor_state: >-
      {{ 'install' if not tandoor_installed
         else 'update' if tandoor_version is version(tandoor_installed_version, '>')
         else 'reconfigure' if tandoor_compose_before != tandoor_compose
         or (tandoor_s3_enabled | bool
             and tandoor_s3_secret_read.content | default('') | b64decode != tandoor_s3_settings.secret_key | string)
         else 'noop' }}
  no_log: true
