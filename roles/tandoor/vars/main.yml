---
# The compose project name: compose's default for the directory.
tandoor_project: "{{ tandoor_dir | basename }}"
# Mode 0600: it holds the secret key and the passwords.
tandoor_compose_file: "{{ tandoor_dir }}/compose.yaml"

# tandoor_email and tandoor_s3 with the defaults of the keys they leave out.
tandoor_mail: >-
  {{ {'host': '', 'port': 587, 'user': '', 'password': '', 'tls': true, 'ssl': false, 'from': ''}
     | combine(tandoor_email if tandoor_email is mapping else {}) }}
tandoor_s3_settings: >-
  {{ {'access_key': '', 'secret_key': '', 'bucket': '', 'endpoint': '', 'region': '',
      'querystring_auth': true, 'custom_domain': ''}
     | combine(tandoor_s3 if tandoor_s3 is mapping else {}) }}
# Media in S3 instead of tandoor_data_dir/mediafiles.
tandoor_s3_enabled: "{{ tandoor_s3_settings.access_key | string | length > 0 }}"
# Where the media are, S3 or local. The compose file records it
# (x-tandoor-media); a run that would change it is refused.
tandoor_media: "{{ 'S3' if tandoor_s3_enabled | bool else 'local' }}"
# The S3 secret key, mode 0600, bound read-only into the web container at
# tandoor_s3_secret_target; the image's boot script reads it from the file
# S3_SECRET_ACCESS_KEY_FILE names, so it is in neither the compose file nor
# docker inspect.
tandoor_s3_secret_file: "{{ tandoor_dir }}/s3-secret"
tandoor_s3_secret_target: /run/secrets/s3-secret
# A label of the web container with a hash of the S3 secret key, salted with
# tandoor_secret_key so that it does not give the key away: a new key changes
# the web service, so compose recreates the web container (not the
# database), and state.yml tells a container that kept the old key.
tandoor_s3_secret_label: noixdev.tandoor.s3-secret-hash
tandoor_s3_secret_hash: "{{ (tandoor_secret_key ~ ':' ~ tandoor_s3_settings.secret_key) | hash('sha256') }}"

# The subdirectories of tandoor_data_dir whose absence means the data is
# missing (an unmounted volume): only install creates them, and the
# containers bind them with create_host_path false.
tandoor_data_subdirs: "{{ ['postgres'] + ([] if tandoor_s3_enabled | bool else ['mediafiles']) }}"
# Database dumps and media copies before an update; on the filesystem of the
# media, so that the copy can be made of hard links.
tandoor_backup_dir: "{{ tandoor_data_dir }}/backups"
# Written after a failed update; that version is not tried again while it
# exists.
tandoor_marker_file: "{{ tandoor_dir }}/update-failed"
# Written before an install creates anything in tandoor_data_dir and removed
# once the first admin and its space exist; while it exists every run
# refuses.
tandoor_install_marker: "{{ tandoor_dir }}/install-incomplete"
# Written by update.yml before the first change of an update (step backup),
# rewritten once the backup is complete (step update, with the backup) and
# removed once the update is healthy or rolled back; a run that stopped in
# between (a dropped SSH session, a reboot) leaves it for the next one
# (state.yml). YAML with from_version, to_version, step, backup and time;
# root, mode 0600.
tandoor_update_marker: "{{ tandoor_dir }}/update-in-progress"
# Its copies of the files the update replaces, for a restore with
# tandoor_restore_interrupted: the compose file (it holds the secrets) and,
# with S3, the secret file. Root, mode 0600.
tandoor_update_marker_compose: "{{ tandoor_dir }}/update-in-progress.compose.yaml"
tandoor_update_marker_s3_secret: "{{ tandoor_dir }}/update-in-progress.s3-secret"
# In the order they are removed: the marker first, so that a run stopped in
# between leaves copies without a marker, which the next run removes
# (state.yml), and never the marker of a finished update.
tandoor_update_marker_files:
  - "{{ tandoor_update_marker }}"
  - "{{ tandoor_update_marker_compose }}"
  - "{{ tandoor_update_marker_s3_secret }}"

# tandoor_compose_on_disk, the compose file on disk parsed (empty when there
# is none), is set by state.yml, which parses it in a no_log task.
# The Tandoor version of the compose file on disk (the tag of the web image),
# empty when there is none.
tandoor_installed_version: >-
  {%- set image = ((tandoor_compose_on_disk.services | default({})).web | default({})).image | default('') | string -%}
  {{ image.rpartition(':')[2] if ':' in image.rpartition('/')[2] else '' }}
# The media of the compose file on disk, S3 or local. One without the record
# has local media: the role writes the S3 settings only with the record.
tandoor_installed_media: "{{ tandoor_compose_on_disk['x-tandoor-media'] | default('local') }}"

# The PostgreSQL major of tandoor_postgres_image: the leading digits of its
# tag (postgres:18, postgres:18.1-alpine), empty without them.
tandoor_postgres_major: >-
  {%- set name = (tandoor_postgres_image | string).split('@')[0].rpartition('/')[2] -%}
  {{ (name.rpartition(':')[2] if ':' in name else '') | regex_search('^[0-9]+') | default('', true) }}

# Container paths of the Tandoor image.
tandoor_container_dirs:
  media: /opt/recipes/mediafiles
  static: /opt/recipes/staticfiles

# The settings the role sets itself; tandoor_env must not hold them, nor any
# key with one of tandoor_env_owned_prefixes. DATABASE_URL and
# SECRET_KEY_FILE would override the database and the secret key.
tandoor_env_owned:
  - SECRET_KEY
  - SECRET_KEY_FILE
  - DB_ENGINE
  - DATABASE_URL
  - ALLOWED_HOSTS
  - CSRF_TRUSTED_ORIGINS
  - ENABLE_SIGNUP
  - DEFAULT_FROM_EMAIL
  - MEDIA_ROOT
  - STATIC_ROOT
  - TANDOOR_PORT
  - ALLAUTH_TRUSTED_PROXY_COUNT
tandoor_env_owned_prefixes: [POSTGRES_, EMAIL_, S3_]

# The compose services the configuration runs.
tandoor_services: [db, web]

# health.yml: the seconds left of its wait when a database check starts, at
# least 10.
tandoor_db_check_wait: >-
  {{ [(tandoor_health_wait | default(tandoor_health_timeout) | int)
      - (now().timestamp() - tandoor_health_start | float) | int, 10] | max }}
# The bound of health.yml in the messages of a failed health check: each
# database check may end up to 10 seconds after the wait.
tandoor_health_within: >-
  within {{ tandoor_health_timeout }} seconds, at least 10 for each database
  check

# The compose file as the role writes it; compared with the one on disk.
tandoor_compose: "{{ lookup('ansible.builtin.template', 'compose.yaml.j2') }}"

# The paths of the API router (the pages router takes everything else on
# tandoor_hostname): the REST API, allauth's API (the UI's login and session,
# the apps' tokens) and, with local media, the media files.
tandoor_api_paths: "{{ ['/api/', '/_allauth/'] + ([] if tandoor_s3_enabled | bool else ['/media/']) }}"

# In a rescue: the failed task and the first line of its error. For a
# command that only says it failed, the last line of stderr that names an
# error (CommandError: ..., the end of a traceback), else its last line.
tandoor_failure: >-
  {%- set stderr = (ansible_failed_result.stderr | default('') | trim).splitlines() -%}
  {%- set errors = stderr | select('search', 'Error:') | list -%}
  {{ ansible_failed_task.name }}:
  {{ (errors or stderr or ['']) | last | trim
     if ansible_failed_result.msg | default('') is search('non-zero return code')
     else ((ansible_failed_result.msg | default('') | trim).splitlines() or ['']) | first }}

# The error of a command whose task hides its arguments (no_log, failed_when
# false, registered as tandoor_hidden): the last line of stderr that names an
# error, else its last line, else the exit code. The next task fails with it.
tandoor_hidden_error: >-
  {%- set stderr = (tandoor_hidden.stderr | default('') | trim).splitlines() -%}
  {{ ((stderr | select('search', 'Error:') | list) or stderr
      or ['exit code ' ~ tandoor_hidden.rc | default('?') | string]) | last | trim }}

# After a failed install: nothing in it should be worth keeping (no admin or
# no space yet), so what it made is removed and the next run installs afresh.
tandoor_install_hint: >-
  It left a partial installation, which the role does not take for a
  finished one. To install again, first check that nothing in it is worth
  keeping (for example recipes in Tandoor), then run docker compose down in
  {{ tandoor_dir }} (if {{ tandoor_compose_file }} exists), remove
  {{ tandoor_compose_file }},{{ (' ' ~ tandoor_s3_secret_file ~ ',') if tandoor_s3_enabled | bool else '' }}
  {{ tandoor_install_marker }} and the
  {{ 'subdirectories' if tandoor_data_subdirs | length > 1 else 'subdirectory' }}
  {{ tandoor_data_subdirs | join(' and ') }} of
  {{ tandoor_data_dir }}, then run the role again.

# Added to the refusals of update-failed when tandoor_restore_interrupted is
# set, which they come before: the variable does not apply while that marker
# stands.
tandoor_marker_restore_note: >-
  {{ ('tandoor_restore_interrupted does not apply while ' ~ tandoor_marker_file ~ ' exists: '
      ~ (('deal with it first as said, then run the role again with the variable to restore the'
          ~ ' interrupted update that ' ~ tandoor_update_marker ~ ' records.')
         if tandoor_update_in_progress.step | default(none) == 'update'
         else ('no interrupted update is left to restore. Remove the variable, deal with '
               ~ tandoor_marker_file ~ ' as said, then run the role again.')))
     if tandoor_restore_interrupted | bool else '' }}

# After a failed rollback: how to put the backup back by hand.
tandoor_restore_hint: >-
  Roll back by hand in {{ tandoor_dir }}: run docker compose stop web; copy
  {{ tandoor_backup | default('?') }}/compose.yaml to
  {{ tandoor_compose_file }}; recreate the database (docker compose exec -T
  db psql -U tandoor -d postgres -c 'DROP DATABASE IF EXISTS tandoor WITH
  (FORCE)' -c 'CREATE DATABASE tandoor OWNER tandoor') and load the dump with
  docker compose exec -T db pg_restore --single-transaction -U tandoor -d
  tandoor < {{ tandoor_backup | default('?') }}/tandoor.dump;
  {{ tandoor_restore_media_hint }}then run docker compose up -d.
# The media step of tandoor_restore_hint, with its trailing space: the local
# media from the backup, or with S3 a note on the secret file, which the
# backup does not hold.
tandoor_restore_media_hint: >-
  {{ ('the backup does not hold ' ~ tandoor_s3_secret_file ~ ': if the update changed'
      ~ ' tandoor_s3.secret_key, put the previous key back into it; ')
     if tandoor_s3_enabled | bool
     else 'put ' ~ tandoor_backup | default('?') ~ '/mediafiles back in place of '
          ~ tandoor_data_dir ~ '/mediafiles (cp -al); ' }}
