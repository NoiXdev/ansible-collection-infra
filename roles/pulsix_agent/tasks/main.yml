---
- name: Check the settings and the host
  ansible.builtin.import_tasks: check.yml
  tags: [pulsix_agent_check]

- name: Install the agent
  ansible.builtin.import_tasks: install.yml

- name: Prove that the agent runs
  ansible.builtin.import_tasks: enroll.yml
  when: not ansible_check_mode

- name: Prove that the agent is connected before anything is removed
  ansible.builtin.import_tasks: connection.yml
  when: pulsix_agent_remove | length > 0 and not ansible_check_mode

- name: Say what a check run would remove
  ansible.builtin.debug:
    msg: >-
      Check mode: would remove {{ item }}.
      {% for part in ([item] + (['zabbix_shared'] if item == 'zabbix_agent' else [])) %}
      {% set tool = vars['pulsix_agent_tool_' ~ part] %}
      {{ part }}: units [{{ tool.units | join(', ') }}];
      packages matching [{{ tool.packages | join(', ') }}];
      paths [{{ tool.paths | join(', ') }}];
      files matching [{% for g in tool.globs %}{{ g.paths | product(g.patterns) | map('join', '/') | join(', ') }}{{ ', ' if not loop.last }}{% endfor %}];
      user [{{ tool.user }}].
      {% endfor %}
      {% if item == 'zabbix_agent' %}
      The zabbix_shared items go only when no other zabbix-* package is left;
      auto-installed zabbix-sender and zabbix-get go with the agent.
      {% endif %}
  loop: "{{ pulsix_agent_remove }}"
  when: ansible_check_mode

- name: Remove the requested tools
  ansible.builtin.include_tasks: "remove_{{ pulsix_agent_tool }}.yml"
  loop: "{{ pulsix_agent_remove }}"
  loop_control:
    loop_var: pulsix_agent_tool
  when: not ansible_check_mode
