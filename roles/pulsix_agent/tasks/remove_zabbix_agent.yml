---
- name: Remove the Zabbix agent
  ansible.builtin.include_tasks: remove_common.yml
  vars:
    pulsix_agent_rm_units: "{{ pulsix_agent_tool_zabbix_agent.units }}"
    pulsix_agent_rm_packages: "{{ pulsix_agent_tool_zabbix_agent.packages }}"
    pulsix_agent_rm_paths: "{{ pulsix_agent_tool_zabbix_agent.paths }}"
    pulsix_agent_rm_globs: "{{ pulsix_agent_tool_zabbix_agent.globs }}"
    pulsix_agent_rm_user: "{{ pulsix_agent_tool_zabbix_agent.user }}"

# The agent can pull in helpers (zabbix-sender on some releases) that nothing else
# needs. Those go with it: zabbix-sender and zabbix-get when apt marked them as
# auto-installed and an autoremove would take them. Never anything else. Both reads are dry; only these names are purged.
- name: Read the auto-installed packages
  ansible.builtin.command: apt-mark showauto
  register: pulsix_agent_zabbix_auto
  changed_when: false

- name: Ask apt which packages nothing needs any more
  ansible.builtin.command: apt-get --dry-run autoremove  # noqa: command-instead-of-module (a dry run has no module)
  environment:
    LC_ALL: C
  register: pulsix_agent_zabbix_autoremove
  changed_when: false

- name: Select the helpers of the agent
  ansible.builtin.set_fact:
    pulsix_agent_zabbix_helpers: >-
      {{ pulsix_agent_zabbix_autoremove.stdout_lines
         | select('match', '^Remv zabbix-(sender|get) ')
         | map('regex_replace', '^Remv (\S+).*$', '\1')
         | select('in', pulsix_agent_zabbix_auto.stdout_lines)
         | reject('eq', 'zabbix-release')
         | list }}

- name: Check that purging the helpers takes nothing else
  ansible.builtin.include_tasks: check_purge.yml
  vars:
    pulsix_agent_purge: "{{ pulsix_agent_zabbix_helpers }}"
  when: pulsix_agent_zabbix_helpers | length > 0

- name: Purge the helpers of the agent
  ansible.builtin.apt:
    name: "{{ pulsix_agent_zabbix_helpers }}"
    state: absent
    purge: true
    lock_timeout: 120
  when: pulsix_agent_zabbix_helpers | length > 0

- name: Read the packages that are left
  ansible.builtin.command: dpkg-query -W -f='${Package} ${db:Status-Status}\n'
  register: pulsix_agent_zabbix_dpkg
  changed_when: false

# Any state but not-installed counts: a server that was removed but not purged
# (config-files) still has its configuration in /etc/zabbix. The agent's own
# packages are purged by now, and zabbix-release is not another package.
- name: Look for other Zabbix packages
  ansible.builtin.set_fact:
    pulsix_agent_zabbix_others: >-
      {{ pulsix_agent_zabbix_dpkg.stdout_lines
         | select('match', '^zabbix-\S+ ')
         | reject('match', '^zabbix-release ')
         | reject('search', ' not-installed$')
         | list }}

- name: Remove what only the Zabbix agent used
  ansible.builtin.include_tasks: remove_common.yml
  vars:
    pulsix_agent_rm_units: "{{ pulsix_agent_tool_zabbix_shared.units }}"
    pulsix_agent_rm_packages: "{{ pulsix_agent_tool_zabbix_shared.packages }}"
    pulsix_agent_rm_paths: "{{ pulsix_agent_tool_zabbix_shared.paths }}"
    pulsix_agent_rm_globs: "{{ pulsix_agent_tool_zabbix_shared.globs }}"
    pulsix_agent_rm_user: "{{ pulsix_agent_tool_zabbix_shared.user }}"
  when: pulsix_agent_zabbix_others | length == 0
