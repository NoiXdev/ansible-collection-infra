---
# Agent release, without a leading "v".
pulsix_agent_version: 0.1.0-rc.4

# URL of the binary; "<url>.sha256" must sit next to it. May use
# {{ pulsix_agent_arch }} (amd64 or arm64).
pulsix_agent_download_url: >-
  https://github.com/NoiXdev/pulsix/releases/download/v{{ pulsix_agent_version }}/pulsix-agent-linux-{{ pulsix_agent_arch }}

# The manager's agent endpoint, host:port (required); an IPv6 host is written
# in brackets: [2001:db8::1]:8444.
pulsix_agent_manager_addr: ""

# Name in the manager's certificate, when it differs from the dialed host.
pulsix_agent_server_name: ""

# Agent name; empty: the agent uses the host name.
pulsix_agent_name: ""

# Enrollment tokens (pxa1.…) for hosts without identity. Pass them at run
# time from a file kept out of version control, never on the command line:
#   ansible-playbook agents.yml -e @tokens.yml
# with tokens.yml holding
#   pulsix_agent_enroll_tokens:
#     web-1.example.test: pxa1.…
# The per-host token wins over the shared one.
pulsix_agent_enroll_token: ""
pulsix_agent_enroll_tokens: {}
pulsix_agent_enroll_timeout: 120

# Monitoring tools to remove completely once the agent is proven to run and
# to be connected. Any of: netdata, zabbix_agent, checkmk_agent.
pulsix_agent_remove: []
