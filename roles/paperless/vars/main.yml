---
# The compose project name: compose's default for the directory.
paperless_project: "{{ paperless_dir | basename }}"
# Mode 0600: it holds the secret key and the database password.
paperless_compose_file: "{{ paperless_dir }}/compose.yaml"
paperless_smb_conf: "{{ paperless_dir }}/smb.conf"
# Mode 0600; mounted at /run/secrets/pass, where the Samba image reads the
# user's password from.
paperless_samba_pass_file: "{{ paperless_dir }}/samba-pass"

# The subdirectories of paperless_data_dir whose absence means the data is
# missing (an unmounted volume): only install and import create them, and the
# containers bind them with create_host_path false.
paperless_data_subdirs: [media, data, consume, postgres, redis]
# Owned by paperless_uid:paperless_gid; postgres and redis belong to their
# images, which chown them on start.
paperless_owned_subdirs: [media, data, consume]
# Not in paperless_data_subdirs: an empty export directory is no data.
paperless_export_dir: "{{ paperless_data_dir }}/export"
# Database dumps and file snapshots before an update; on the filesystem of
# media, so that the snapshot of media can be a hard-link copy.
paperless_backup_dir: "{{ paperless_data_dir }}/backups"
# Written after a failed update; that version is not tried again while it
# exists.
paperless_marker_file: "{{ paperless_dir }}/update-failed"
# Written before an install creates anything in paperless_data_dir and
# removed once the first admin exists; while it exists every run refuses.
paperless_install_marker: "{{ paperless_dir }}/install-incomplete"
# Written by update.yml before the first change of an update (step backup),
# rewritten once the backup is complete (step update, with the backup) and
# removed once the update is healthy or rolled back; a run that stopped in
# between (a dropped SSH session, a reboot) leaves it for the next one
# (state.yml). YAML with from_version, to_version, step, backup and time;
# root, mode 0600.
paperless_update_marker: "{{ paperless_dir }}/update-in-progress"
# Its copies of the files the update replaces, for a restore with
# paperless_restore_interrupted: the compose file (it holds the secrets) and
# the Samba files, when they exist. Root, mode 0600.
paperless_update_marker_compose: "{{ paperless_dir }}/update-in-progress.compose.yaml"
paperless_update_marker_smb_conf: "{{ paperless_dir }}/update-in-progress.smb.conf"
paperless_update_marker_samba_pass: "{{ paperless_dir }}/update-in-progress.samba-pass"
# Each file the role writes, with its mode and where its copy is saved.
paperless_update_marker_copies:
  - path: "{{ paperless_compose_file }}"
    mode: "0600"
    saved: "{{ paperless_update_marker_compose }}"
  - path: "{{ paperless_smb_conf }}"
    mode: "0644"
    saved: "{{ paperless_update_marker_smb_conf }}"
  - path: "{{ paperless_samba_pass_file }}"
    mode: "0600"
    saved: "{{ paperless_update_marker_samba_pass }}"
# In the order they are removed: the marker last, so that a run stopped in
# between leaves it.
paperless_update_marker_files: "{{ paperless_update_marker_copies | map(attribute='saved') | list + [paperless_update_marker] }}"
# Written after an import, so a run with the same paperless_import_dir is not
# a second import.
paperless_import_record: "{{ paperless_dir }}/imported.yml"
# The export to import: paperless_import_dir without a trailing /, its path
# below paperless_export_dir (empty when it is not below it) and where the
# Paperless container sees it.
paperless_import_source: "{{ paperless_import_dir | string | trim | regex_replace('/+$', '') }}"
paperless_import_rel: >-
  {{ paperless_import_source[(paperless_export_dir | length) + 1:]
     if paperless_import_source.startswith(paperless_export_dir ~ '/') else '' }}
paperless_import_container_dir: "{{ paperless_container_dirs.export }}/{{ paperless_import_rel }}"

# The Paperless version of the compose file on disk (the tag of the
# webserver image), empty when there is none. paperless_compose_on_disk, the
# compose file on disk parsed (empty when there is none), is set by
# state.yml, which parses it in a no_log task.
paperless_installed_version: >-
  {%- set image = ((paperless_compose_on_disk.services | default({})).webserver | default({})).image | default('') | string -%}
  {{ image.rpartition(':')[2] if ':' in image.rpartition('/')[2] else '' }}

# The services of the compose file on disk.
paperless_services_before: "{{ paperless_compose_on_disk.services | default({}) | list }}"

# The PostgreSQL major of paperless_postgres_image: the leading digits of its
# tag (postgres:18, postgres:18.1-alpine), empty without them. It must match
# the PG_VERSION of the database in paperless_data_dir/postgres.
paperless_postgres_major: >-
  {%- set name = (paperless_postgres_image | string).split('@')[0].rpartition('/')[2] -%}
  {{ (name.rpartition(':')[2] if ':' in name else '') | regex_search('^[0-9]+') | default('', true) }}

# Container paths of the Paperless image.
paperless_container_dirs:
  data: /usr/src/paperless/data
  media: /usr/src/paperless/media
  consume: /usr/src/paperless/consume
  export: /usr/src/paperless/export

# The settings the role sets itself; paperless_env must not hold them. The
# admin is created with createsuperuser on install, never from the
# environment.
paperless_env_owned:
  - PAPERLESS_DBENGINE
  - PAPERLESS_DBHOST
  - PAPERLESS_DBNAME
  - PAPERLESS_DBUSER
  - PAPERLESS_DBPASS
  - PAPERLESS_REDIS
  - PAPERLESS_SECRET_KEY
  - PAPERLESS_URL
  - PAPERLESS_TIKA_ENABLED
  - PAPERLESS_TIKA_ENDPOINT
  - PAPERLESS_TIKA_GOTENBERG_ENDPOINT
  - PAPERLESS_ALLAUTH_TRUSTED_PROXY_COUNT
  - USERMAP_UID
  - USERMAP_GID
  - PAPERLESS_ADMIN_USER
  - PAPERLESS_ADMIN_PASSWORD
  - PAPERLESS_CONSUMPTION_DIR
  - PAPERLESS_DATA_DIR
  - PAPERLESS_MEDIA_ROOT

# The compose services the configuration runs.
paperless_services: >-
  {{ ['broker', 'db', 'webserver']
     + (['gotenberg', 'tika'] if paperless_tika | bool else [])
     + (['samba'] if paperless_samba | bool else []) }}

# health.yml: the seconds left of its wait when a database check starts, at
# least 10.
paperless_db_check_wait: >-
  {{ [(paperless_health_timeout | int)
      - (now().timestamp() - paperless_health_start | float) | int, 10] | max }}

# The files as the role writes them; compared with the ones on disk. none
# means the file must not exist (Samba off).
paperless_compose: "{{ lookup('ansible.builtin.template', 'compose.yaml.j2') }}"
paperless_files:
  - path: "{{ paperless_compose_file }}"
    content: "{{ paperless_compose }}"
    mode: "0600"
  - path: "{{ paperless_smb_conf }}"
    content: "{{ lookup('ansible.builtin.template', 'smb.conf.j2') if paperless_samba | bool else none }}"
    mode: "0644"
  - path: "{{ paperless_samba_pass_file }}"
    content: "{{ paperless_samba_password | default('') if paperless_samba | bool else none }}"
    mode: "0600"

# In a rescue: the failed task and the first line of its error. For a
# command that only says it failed, the last line of stderr that names an
# error (CommandError: ..., the end of a traceback), else its last line.
paperless_failure: >-
  {%- set stderr = (ansible_failed_result.stderr | default('') | trim).splitlines() -%}
  {%- set errors = stderr | select('search', 'Error:') | list -%}
  {{ ansible_failed_task.name }}:
  {{ (errors or stderr or ['']) | last | trim
     if ansible_failed_result.msg | default('') is search('non-zero return code')
     else ((ansible_failed_result.msg | default('') | trim).splitlines() or ['']) | first }}

# The error of a command whose task hides its arguments (no_log, failed_when
# false, registered as paperless_hidden): the last line of stderr that names
# an error, else its last line, else the exit code. The next task fails with
# it.
paperless_hidden_error: >-
  {%- set stderr = (paperless_hidden.stderr | default('') | trim).splitlines() -%}
  {{ ((stderr | select('search', 'Error:') | list) or stderr
      or ['exit code ' ~ paperless_hidden.rc | default('?') | string]) | last | trim }}

# After a failed install: nothing in it should be worth keeping (no admin,
# no documents yet), so what it made is removed and the next run installs
# afresh; the export directory stays, it may hold an export staged for an
# import.
paperless_install_hint: >-
  It left a partial installation, which the role does not take for a
  finished one. To install again, first check that nothing in it is worth
  keeping (for example the documents in Paperless), then run docker compose
  down in
  {{ paperless_dir }} (if {{ paperless_compose_file }} exists), remove
  {{ paperless_compose_file }}, {{ paperless_install_marker }} and the
  subdirectories {{ paperless_data_subdirs[:-1] | join(', ') }} and
  {{ paperless_data_subdirs[-1] }} of {{ paperless_data_dir }} (only these:
  keep {{ paperless_export_dir }}, which may hold an export), then run the
  role again.

# After a failed import: the database and the files may be half filled, so
# everything the import made goes; the export stays for the next attempt.
paperless_import_hint: >-
  It left a partly imported installation, which the role does not take for a
  finished one. To import again, first check that nothing in it is worth
  keeping (for example the documents in Paperless), then run docker compose
  down in
  {{ paperless_dir }}, remove {{ paperless_compose_file }},
  {{ paperless_install_marker }} and the subdirectories
  {{ paperless_data_subdirs[:-1] | join(', ') }} and
  {{ paperless_data_subdirs[-1] }} of {{ paperless_data_dir }} (only these:
  keep {{ paperless_export_dir }}, which holds the export), then run the role
  again.

# After a failed rollback: how to put the backup back by hand.
paperless_restore_hint: >-
  Roll back by hand in {{ paperless_dir }}: run docker compose stop
  webserver; recreate the database (docker compose exec -T db psql -U
  paperless -d postgres -c 'DROP DATABASE IF EXISTS paperless WITH (FORCE)'
  -c 'CREATE DATABASE paperless OWNER paperless') and load the dump with
  docker compose exec -T db pg_restore --single-transaction -U paperless -d
  paperless < {{ paperless_backup | default('?') }}/paperless.dump; put
  {{ paperless_backup | default('?') }}/data and media back in place of
  {{ paperless_data_dir }}/data and media (cp -a, and cp -al for media); copy
  {{ paperless_backup | default('?') }}/compose.yaml to
  {{ paperless_compose_file }}; then run docker compose up -d.
