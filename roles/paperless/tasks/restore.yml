---
# Rolls a failed update back to paperless_backup: the webserver stopped, the
# files the role writes put back as they were before the run (from
# paperless_files_read; the ones that did not exist removed), the database
# recreated empty and loaded from the dump, data/ and media/ moved aside to
# <backup>-failed and the snapshot copied back (media as hard links again),
# then the previous stack started and checked with health.yml. The previous
# files come first, so the database is restored in the previous database
# container. Never fails by itself: paperless_healthy says whether Paperless
# is healthy again, paperless_restore_error what failed.

- name: Roll back to the backup
  block:
    - name: Stop the webserver for the rollback
      ansible.builtin.command:
        argv: [docker, compose, stop, webserver]
        chdir: "{{ paperless_dir }}"
      changed_when: true

    - name: Put the previous files back
      ansible.builtin.copy:
        dest: "{{ item.item.path }}"
        content: "{{ item.content | b64decode }}"
        owner: root
        group: root
        mode: "{{ item.item.mode }}"
      loop: "{{ paperless_files_read.results | selectattr('content', 'defined') | list }}"
      loop_control:
        label: "{{ item.item.path }}"
      # They hold the secret key and the passwords.
      no_log: true

    - name: Remove the files the previous version did not have
      ansible.builtin.file:
        path: "{{ item.item.path }}"
        state: absent
      loop: "{{ paperless_files_read.results | rejectattr('content', 'defined') | list }}"
      loop_control:
        label: "{{ item.item.path }}"

    - name: Start the previous database
      community.docker.docker_compose_v2:
        project_src: "{{ paperless_dir }}"
        services: [db]
        state: present
        pull: missing

    - name: Note when the wait for the database starts
      ansible.builtin.set_fact:
        paperless_wait_start: "{{ now().timestamp() }}"

    # Fails after paperless_health_timeout seconds; retries is an upper bound.
    - name: Wait for the database
      ansible.builtin.command:
        argv: [docker, compose, exec, -T, db, pg_isready, --username=paperless, --dbname=paperless, --timeout=2]
        chdir: "{{ paperless_dir }}"
      register: paperless_db_ready
      until: >-
        paperless_db_ready.rc == 0
        or now().timestamp() - paperless_wait_start | float >= paperless_health_timeout | int
      retries: "{{ (paperless_health_timeout | int / 2) | round(0, 'ceil') | int + 1 }}"
      delay: 2
      changed_when: false

    # An empty database, not pg_restore --clean: --clean drops only what is in
    # the dump, so tables the new version added would stay. Over the local
    # socket, which needs no password.
    - name: Recreate the database
      ansible.builtin.command:
        argv: [docker, compose, exec, -T, db, psql, --username=paperless, --dbname=postgres, --no-psqlrc, --set=ON_ERROR_STOP=1]
        chdir: "{{ paperless_dir }}"
        stdin: |
          DROP DATABASE IF EXISTS paperless WITH (FORCE);
          CREATE DATABASE paperless OWNER paperless;
      changed_when: true

    - name: Restore the database dump
      ansible.builtin.shell:
        cmd: >-
          docker compose exec -T db pg_restore --single-transaction --exit-on-error
          --username=paperless --dbname=paperless <{{ (paperless_backup ~ '/paperless.dump') | quote }}
        chdir: "{{ paperless_dir }}"
      changed_when: true

    # The copies first, so data and media are missing only between two
    # renames.
    - name: Put the data and media directories back
      ansible.builtin.shell:
        cmd: |
          set -eu
          backup={{ paperless_backup | quote }}
          root={{ paperless_data_dir | quote }}
          mkdir -m 0700 "$backup-failed"
          rm -rf "$root/.data.restore" "$root/.media.restore"
          cp -a "$backup/data" "$root/.data.restore"
          cp -al "$backup/media" "$root/.media.restore"
          for d in data media; do
            mv "$root/$d" "$backup-failed/$d"
            mv "$root/.$d.restore" "$root/$d"
          done
      changed_when: true

    - name: Start the previous Paperless
      community.docker.docker_compose_v2:
        project_src: "{{ paperless_dir }}"
        state: present
        pull: missing
        remove_orphans: true

    - name: Check that the previous Paperless is healthy
      ansible.builtin.include_tasks: health.yml

    - name: Note the rollback
      ansible.builtin.set_fact:
        paperless_restore_error: >-
          {{ '' if paperless_healthy
             else 'Paperless ' ~ paperless_installed_version ~ ' is not healthy within '
                  ~ paperless_health_timeout ~ ' seconds (' ~ paperless_health_lines | join('; ') ~ ')' }}

  rescue:
    - name: Note the failed rollback
      ansible.builtin.set_fact:
        paperless_healthy: false
        paperless_restore_error: "{{ paperless_failure | trim }}"
