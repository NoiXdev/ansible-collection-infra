---
# The one-time import into a fresh installation (paperless_state import):
# the directories and files as on install, the stack without Samba (no scan
# arrives during the import), Paperless healthy (its migrations made the
# empty database), document_importer on the export, the record
# paperless_import_record, then Samba. The marker paperless_install_marker,
# naming the export as its source, lives from before the first data
# directory until the record exists. A failed import stops the stack,
# deletes nothing and keeps the marker, so every later run refuses
# (state.yml) until the partly imported installation is removed as the
# message says. A Samba that does not start after the record fails the run
# but leaves the import done.

- name: Create the Paperless directory
  ansible.builtin.file:
    path: "{{ paperless_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Write the marker of an import in progress
  ansible.builtin.copy:
    dest: "{{ paperless_install_marker }}"
    content: |
      version: {{ paperless_version }}
      time: {{ now(utc=true).strftime('%Y-%m-%dT%H:%M:%SZ') }}
      source: {{ paperless_import_source | to_json }}
    owner: root
    group: root
    mode: "0644"

- name: Import into a fresh installation
  block:
    - name: Create the directories and write the files
      ansible.builtin.include_tasks: files.yml

    - name: Start Paperless without Samba
      community.docker.docker_compose_v2:
        project_src: "{{ paperless_dir }}"
        services: "{{ paperless_services | difference(['samba']) }}"
        state: present
        pull: missing

    - name: Check that Paperless is healthy
      ansible.builtin.include_tasks: health.yml

    - name: Fail when Paperless is not healthy
      ansible.builtin.fail:
        msg: >-
          Paperless is not healthy {{ paperless_health_within }}
          ({{ paperless_health_lines | join('; ') }}); see docker
          compose logs in {{ paperless_dir }}
      when: not paperless_healthy

    # The image's document_importer runs manage.py as the paperless user. A
    # passphrase goes through stdin (the x keeps trailing newlines), so it is
    # in neither the compose file, the docker command line nor the run's
    # output: a task environment would show in the -vvv output, and no_log
    # hides the arguments. The next task fails with the error.
    # expand_argument_vars false keeps the command module from expanding the
    # script's $ itself.
    - name: Import the export
      ansible.builtin.command:
        argv: >-
          {{ ['docker', 'compose', 'exec', '-T', 'webserver']
             + (['sh', '-c',
                 'p="$(cat; echo x)"; exec document_importer "$1" --no-progress-bar --passphrase "${p%x}"',
                 'sh', paperless_import_container_dir]
                if paperless_import_passphrase | length > 0
                else ['document_importer', paperless_import_container_dir, '--no-progress-bar']) }}
        chdir: "{{ paperless_dir }}"
        stdin: "{{ paperless_import_passphrase if paperless_import_passphrase | length > 0 else omit }}"
        stdin_add_newline: false
        expand_argument_vars: false
      register: paperless_hidden
      changed_when: true
      failed_when: false
      no_log: true

    - name: Fail when the import failed
      ansible.builtin.fail:
        msg: "{{ paperless_hidden_error }}"
      when: paperless_hidden.rc != 0

    - name: Write the import record
      ansible.builtin.copy:
        dest: "{{ paperless_import_record }}"
        content: >-
          {{ {'version': paperless_import_version,
              'source': paperless_import_source,
              'manifest_sha256': paperless_import_manifest_sha256,
              'time': now(utc=true).strftime('%Y-%m-%dT%H:%M:%SZ')} | to_nice_yaml(sort_keys=false) }}
        owner: root
        group: root
        mode: "0644"

    - name: Remove the marker of an import in progress
      ansible.builtin.file:
        path: "{{ paperless_install_marker }}"
        state: absent

  rescue:
    - name: Note why the import failed
      ansible.builtin.set_fact:
        paperless_import_failure: "{{ paperless_failure | trim }}"

    # Stopped, not removed: the database and the files stay as they are.
    - name: Stop Paperless after the failed import
      community.docker.docker_compose_v2:
        project_src: "{{ paperless_dir }}"
        state: stopped
      failed_when: false

    - name: Fail with what to remove
      ansible.builtin.fail:
        msg: >-
          The import of {{ paperless_import_source }} into Paperless
          {{ paperless_version }} in {{ paperless_dir }} failed
          ({{ paperless_import_failure }}). {{ paperless_import_hint }}

# After the record and the marker's removal: the import is done whether or
# not Samba starts.
- name: Start Samba after the import
  when: paperless_samba | bool
  block:
    - name: Start Samba
      community.docker.docker_compose_v2:
        project_src: "{{ paperless_dir }}"
        state: present
  rescue:
    - name: Fail when Samba did not start
      ansible.builtin.fail:
        msg: >-
          The import of {{ paperless_import_source }} into Paperless
          {{ paperless_version }} in {{ paperless_dir }} is complete, but Samba
          did not start ({{ paperless_failure | trim }}). The role does not undo
          the import ({{ paperless_import_record }} records it). Fix the cause
          (is port 445 taken on {{ paperless_samba_bind }}?), then start Samba
          with docker compose up -d in {{ paperless_dir }}.
