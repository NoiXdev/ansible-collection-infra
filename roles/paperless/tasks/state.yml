---
# Reads the host and sets paperless_state:
#   import       paperless_import_dir set, no import record, and no compose
#                file nor any of paperless_data_subdirs
#   install      no compose file and none of paperless_data_subdirs
#   update       paperless_version is newer than the installed version
#   reconfigure  a file the role writes (compose file, smb.conf, Samba
#                password) differs from the one on disk
#   noop         everything as the role writes it
# Also sets paperless_installed (a compose file exists),
# paperless_compose_before (the compose file on disk, which
# paperless_installed_version reads), paperless_files_read (the files on
# disk, which a rollback puts back), paperless_files_changed (the paths of
# the files that differ) and paperless_down (the expected services that are
# not running). With an import record, paperless_import_dir is ignored.
# Changes nothing; refuses, before anything else, a paperless_data_dir that is
# not a mountpoint (with paperless_data_dir_mountpoint) and a compose file
# without all of paperless_data_subdirs (an unmounted volume); then a marker
# beside the record of a completed import, an install or import that did
# not complete, left-over data without a compose
# file, a compose file without a Paperless version, a
# downgrade, a PostgreSQL major other than the database's, and an import
# into an installation (no record), of an export outside
# paperless_export_dir, without a manifest, of another Paperless version,
# made with a passphrase that is not given, or that paperless_uid cannot
# read.

# A block volume that is not mounted leaves its mountpoint as an empty
# directory on the root filesystem; an install there would put the data
# beside the volume.
- name: Check that the data directory is a mountpoint
  ansible.builtin.command:
    argv: [mountpoint, -q, "{{ paperless_data_dir }}"]
  register: paperless_data_dir_mounted
  changed_when: false
  failed_when: false
  when: paperless_data_dir_mountpoint | bool

- name: Refuse a data directory that is not a mountpoint
  ansible.builtin.fail:
    msg: >-
      paperless_data_dir_mountpoint is on, but {{ paperless_data_dir }} is
      not a mountpoint: is the volume mounted? The role changes nothing.
      Mount the volume at {{ paperless_data_dir }}, then run the role again.
  when:
    - paperless_data_dir_mountpoint | bool
    - paperless_data_dir_mounted.rc != 0

- name: Read the files the role writes
  ansible.builtin.slurp:
    src: "{{ item.path }}"
  loop: "{{ paperless_files }}"
  loop_control:
    label: "{{ item.path }}"
  register: paperless_files_read
  failed_when: false
  # They hold the secret key and the passwords.
  no_log: true

- name: Look for the data subdirectories
  ansible.builtin.stat:
    path: "{{ paperless_data_dir }}/{{ item }}"
    get_checksum: false
  loop: "{{ paperless_data_subdirs }}"
  register: paperless_subdirs_stat

# Each file on disk (none when it is missing) against the one the role
# writes (none when it must not exist).
- name: Note what is on the host
  ansible.builtin.set_fact:
    paperless_compose_before: "{{ paperless_compose_read.content | default('') | b64decode }}"
    paperless_installed: "{{ paperless_compose_read.content is defined }}"
    paperless_files_changed: >-
      {%- set changed = [] -%}
      {%- for read in paperless_files_read.results -%}
      {%-   set before = read.content | b64decode if read.content is defined else none -%}
      {%-   if before != read.item.content -%}
      {%-     set _ = changed.append(read.item.path) -%}
      {%-   endif -%}
      {%- endfor -%}
      {{ changed }}
    paperless_data_found: >-
      {{ paperless_subdirs_stat.results | selectattr('stat.exists') | map(attribute='item') | list }}
  vars:
    paperless_compose_read: >-
      {{ paperless_files_read.results | selectattr('item.path', 'equalto', paperless_compose_file) | first }}
  no_log: true

# Only install and import create the subdirectories, and the containers do
# not create a missing one, so their absence beside a compose file is data
# that is not there (an unmounted volume), never a state to repair.
- name: Refuse an installation without its data
  ansible.builtin.fail:
    msg: >-
      Paperless is installed in {{ paperless_dir }} ({{ paperless_compose_file }}),
      but {{ paperless_data_dir }} lacks {{ paperless_data_missing | join(', ') }}:
      is the volume mounted? The role changes nothing and creates none of
      them. Mount the volume (or put the data back) at
      {{ paperless_data_dir }}, then run the role again.
  vars:
    # In the order of paperless_data_subdirs, which difference does not keep.
    paperless_data_missing: "{{ paperless_data_subdirs | reject('in', paperless_data_found) | list }}"
  when:
    - paperless_installed
    - paperless_data_missing | length > 0

- name: Read the marker of an install or import in progress
  ansible.builtin.slurp:
    src: "{{ paperless_install_marker }}"
  register: paperless_install_marker_read
  failed_when: false

- name: Note what the marker is from
  ansible.builtin.set_fact:
    paperless_incomplete_source: >-
      {{ (paperless_incomplete.source | default('') if paperless_incomplete is mapping else '') | string }}
  when: paperless_install_marker_read.content is defined
  vars:
    paperless_incomplete: "{{ paperless_install_marker_read.content | b64decode | from_yaml }}"

- name: Look for the record of a completed import
  ansible.builtin.stat:
    path: "{{ paperless_import_record }}"
    get_checksum: false
  register: paperless_import_record_done
  when: paperless_incomplete_source | default('') | length > 0

# The run that imported stopped between the record and the marker's removal:
# the installation is complete and may be in use, so only the marker goes.
- name: Refuse a marker beside the record of a completed import
  ansible.builtin.fail:
    msg: >-
      {{ paperless_install_marker }} exists, but {{ paperless_import_record }}
      records that the import of {{ paperless_incomplete_source }} completed:
      the run that imported it stopped before it removed the marker. The role
      changes nothing. Check Paperless (its documents), then remove only the
      marker (rm {{ paperless_install_marker }}), not the data, and run the
      role again.
  when:
    - paperless_install_marker_read.content is defined
    - paperless_incomplete_source | length > 0
    - paperless_import_record_done.stat.exists | default(false)

# An import's marker names its source.
- name: Refuse an import that did not complete
  ansible.builtin.fail:
    msg: >-
      {{ paperless_install_marker }} exists: an import of
      {{ paperless_incomplete_source }} into Paperless in {{ paperless_dir }}
      did not complete, so the installation is not empty (the database may
      be half filled) and the import needs a fresh installation. The role
      changes nothing. {{ paperless_import_hint }}
  when:
    - paperless_install_marker_read.content is defined
    - paperless_incomplete_source | length > 0

- name: Refuse an install that did not complete
  ansible.builtin.fail:
    msg: >-
      {{ paperless_install_marker }} exists: an install of Paperless in
      {{ paperless_dir }} did not complete, so the first admin may be
      missing and the database half made. The role changes nothing.
      {{ paperless_install_hint }}
  when: paperless_install_marker_read.content is defined

- name: Refuse data without a compose file
  ansible.builtin.fail:
    msg: >-
      Paperless data is in {{ paperless_data_dir }}
      ({{ paperless_data_found | join(', ') }}), but there is no compose file
      {{ paperless_compose_file }}. The role does not install over left-over
      data and changes nothing; move it away, or put back the compose file
      that uses it.
  when:
    - not paperless_installed
    - paperless_data_found | length > 0

- name: Check the installed version
  when: paperless_installed
  block:
    - name: Check that the compose file names the Paperless version
      ansible.builtin.assert:
        that: paperless_installed_version is match('^\d+\.\d+\.\d+$')
        fail_msg: >-
          The webserver image in {{ paperless_compose_file }} has no tag X.Y.Z,
          so the role cannot tell which Paperless version is installed and
          changes nothing. Put back the compose file the role wrote.
        quiet: true

    # Paperless cannot migrate its database down.
    - name: Refuse a downgrade
      ansible.builtin.fail:
        msg: >-
          paperless_version {{ paperless_version }} is lower than the
          installed version {{ paperless_installed_version }} in
          {{ paperless_dir }}; the role refuses to downgrade, Paperless cannot
          migrate its database down, and changes nothing. Set
          paperless_version to {{ paperless_installed_version }} or newer.
      when: paperless_version is version(paperless_installed_version, '<')

# The PostgreSQL image keeps its cluster in a directory per major below the
# mount (18/docker; main.yml refuses images older than 18): another major starts
# an empty cluster or none at all, so the one cluster's PG_VERSION must name
# the major of paperless_postgres_image. More than one cluster (an old one
# left by pg_upgrade) is refused: which one is current cannot be told, and a
# stale one would start with old data. Up to three levels deep, above the
# PG_VERSION files of the databases inside a cluster.
- name: Look for the PostgreSQL cluster
  ansible.builtin.find:
    paths: "{{ paperless_data_dir }}/postgres"
    patterns: [PG_VERSION]
    file_type: file
    recurse: true
    depth: 3
  register: paperless_pg_version_files
  when: "'postgres' in paperless_data_found"

- name: Read the PostgreSQL major of the cluster
  ansible.builtin.slurp:
    src: "{{ item }}"
  loop: "{{ paperless_pg_version_files.files | default([]) | map(attribute='path') | sort }}"
  register: paperless_pg_version_read

- name: Refuse more than one PostgreSQL cluster
  ansible.builtin.fail:
    msg: >-
      {{ paperless_data_dir }}/postgres holds more than one PostgreSQL
      cluster: {{ paperless_pg_clusters | join(', ') }}. The role cannot
      tell which one Paperless uses (an old one left by pg_upgrade would
      start with old data) and changes nothing. Move every cluster but the
      current one out of {{ paperless_data_dir }}/postgres, then run the
      role again.
  vars:
    paperless_pg_clusters: >-
      {%- set found = [] -%}
      {%- for read in paperless_pg_version_read.results -%}
      {%-   set _ = found.append(read.item ~ ' (PostgreSQL ' ~ (read.content | b64decode | trim) ~ ')') -%}
      {%- endfor -%}
      {{ found }}
  when: paperless_pg_version_read.results | length > 1

- name: Refuse another PostgreSQL major
  ansible.builtin.fail:
    msg: >-
      paperless_postgres_image {{ paperless_postgres_image }} is PostgreSQL
      {{ paperless_postgres_major }}, but the database in
      {{ paperless_data_dir }}/postgres is PostgreSQL {{ paperless_pg_major }}
      ({{ paperless_pg_version_read.results[0].item }}). A new major does
      not read the old cluster; the role changes nothing. Set
      paperless_postgres_image back to PostgreSQL {{ paperless_pg_major }},
      or upgrade the cluster (pg_upgrade, or a dump restored into the new
      major) first.
  vars:
    paperless_pg_major: "{{ paperless_pg_version_read.results[0].content | b64decode | trim }}"
  when:
    - paperless_pg_version_read.results | length == 1
    - paperless_postgres_major != paperless_pg_major

- name: Look for the import record
  ansible.builtin.stat:
    path: "{{ paperless_import_record }}"
    get_checksum: false
  register: paperless_import_record_stat
  when: paperless_import_dir | default('', true) | length > 0

# An import record means the import is done: paperless_import_dir is ignored
# from then on, also after later updates.
- name: Note whether to import
  ansible.builtin.set_fact:
    paperless_import_wanted: >-
      {{ paperless_import_dir | default('', true) | length > 0
         and not (paperless_import_record_stat.stat.exists | default(false)) }}

# The importer itself only warns on another version and on a database that
# is not empty, so the role refuses both before it changes anything.
- name: Check the export to import
  when: paperless_import_wanted | bool
  block:
    - name: Check that the export is below the export directory
      ansible.builtin.assert:
        that:
          - paperless_import_rel | length > 0
          - paperless_import_rel.split('/') | select('in', ['', '.', '..']) | list | length == 0
        fail_msg: >-
          paperless_import_dir {{ paperless_import_dir }} is outside the
          export directory {{ paperless_export_dir }}; it must be a directory
          below it, which Paperless sees below
          {{ paperless_container_dirs.export }}. The role changes nothing.
        quiet: true

    - name: Refuse an import into an installation
      ansible.builtin.fail:
        msg: >-
          Paperless in {{ paperless_dir }} is not empty; the import needs a
          fresh installation. There is a compose file
          {{ paperless_compose_file }} but no record
          {{ paperless_import_record }} of an import, so an import would
          mix the export into the documents there. The role changes nothing.
      when: paperless_installed

    - name: Look at the export
      ansible.builtin.stat:
        path: "{{ paperless_import_source }}/{{ item }}"
        checksum_algorithm: sha256
        get_checksum: "{{ item == 'manifest.json' }}"
      loop: ["", manifest.json]
      register: paperless_export_stat

    - name: Check that the export has a manifest
      ansible.builtin.assert:
        that:
          - paperless_export_stat.results[0].stat.isdir | default(false)
          - paperless_export_stat.results[1].stat.isreg | default(false)
        fail_msg: >-
          paperless_import_dir {{ paperless_import_source }} must be a
          directory with a manifest.json, as document_exporter writes it. The
          role changes nothing.
        quiet: true

    # metadata.json, or version.json in older exports; the importer reads
    # them in that order.
    - name: Read the version of the export
      ansible.builtin.slurp:
        src: "{{ paperless_import_source }}/{{ item }}"
      loop: [metadata.json, version.json]
      register: paperless_export_meta
      failed_when: false

    - name: Note the version and the manifest of the export
      ansible.builtin.set_fact:
        paperless_import_version: "{{ (paperless_export_meta_data.version | default('')) | string }}"
        # The exporter's key for the parameters of a passphrase.
        paperless_import_encrypted: "{{ '__crypto__' in paperless_export_meta_data }}"
        paperless_import_manifest_sha256: "{{ paperless_export_stat.results[1].stat.checksum }}"
      vars:
        paperless_export_meta_found: "{{ paperless_export_meta.results | selectattr('content', 'defined') | list }}"
        paperless_export_meta_parsed: >-
          {{ paperless_export_meta_found[0].content | b64decode | from_json if paperless_export_meta_found else {} }}
        paperless_export_meta_data: "{{ paperless_export_meta_parsed if paperless_export_meta_parsed is mapping else {} }}"

    - name: Check the version of the export
      ansible.builtin.assert:
        that: paperless_import_version == paperless_version
        fail_msg: >-
          The export in {{ paperless_import_source }} was made by Paperless
          {{ paperless_found }}, but paperless_version is
          {{ paperless_version }}; Paperless imports only an export of its own
          version. Bring the old installation to {{ paperless_version }} and
          export again. The role changes nothing.
        quiet: true
      vars:
        paperless_found: >-
          {{ paperless_import_version if paperless_import_version | length > 0
             else 'of an unknown version (no version in metadata.json or version.json)' }}

    # Without it the importer fails after the database was made.
    - name: Check the passphrase of the export
      ansible.builtin.assert:
        that: not paperless_import_encrypted or paperless_import_passphrase | length > 0
        fail_msg: >-
          The export in {{ paperless_import_source }} was made with a
          passphrase (its metadata.json holds __crypto__), but
          paperless_import_passphrase is empty. The role changes nothing.
        quiet: true

    # document_importer runs as paperless_uid:paperless_gid and fails on what
    # it cannot read only after the database was made. Read from the modes
    # (owner, group, other; ACLs aside): the directories down to the export
    # need x, the export's directories r and x, its files r.
    # paperless_export_dir itself is the user's (files.yml).
    - name: Look for what Paperless cannot read in the export
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import os, sys
            export, rel, uid, gid = sys.argv[1], sys.argv[2], int(sys.argv[3]), int(sys.argv[4])
            def allowed(path, need):
                try:
                    st = os.stat(path)
                except OSError:
                    return False
                if uid == 0:
                    return True
                shift = 6 if st.st_uid == uid else 3 if st.st_gid == gid else 0
                return ((st.st_mode >> shift) & need) == need
            path = export
            for part in rel.split('/')[:-1]:
                path = os.path.join(path, part)
                if not allowed(path, 1):
                    print(path)
            for root, dirs, files in os.walk(os.path.join(export, rel)):
                if not allowed(root, 5):
                    print(root)
                for name in dirs:
                    if os.path.islink(os.path.join(root, name)) and not allowed(os.path.join(root, name), 5):
                        print(os.path.join(root, name))
                for name in files:
                    if not allowed(os.path.join(root, name), 4):
                        print(os.path.join(root, name))
          - "{{ paperless_export_dir }}"
          - "{{ paperless_import_rel }}"
          - "{{ paperless_uid }}"
          - "{{ paperless_gid }}"
      register: paperless_unreadable
      changed_when: false

    - name: Check that Paperless can read the export
      ansible.builtin.assert:
        that: paperless_unreadable.stdout_lines | length == 0
        fail_msg: >-
          paperless_import_dir {{ paperless_import_source }} holds what
          Paperless, which imports as paperless_uid:paperless_gid
          ({{ paperless_uid }}:{{ paperless_gid }}), cannot read:
          {{ paperless_unreadable.stdout_lines[:5] | join(', ') }}{{
          (' and ' ~ (paperless_unreadable.stdout_lines | length - 5) ~ ' more')
          if paperless_unreadable.stdout_lines | length > 5 else '' }}. Make
          the export readable by that user, for example with chown -R
          {{ paperless_uid }}:{{ paperless_gid }} {{ paperless_import_source }}.
          The role changes nothing.
        quiet: true

- name: Read the services that run
  ansible.builtin.command:
    argv: [docker, compose, ps, --format, "{{ '{{.Service}}' }}", --status, running]
    chdir: "{{ paperless_dir }}"
  register: paperless_ps
  changed_when: false
  when: paperless_installed

- name: Decide what to do
  ansible.builtin.set_fact:
    paperless_down: >-
      {{ paperless_services | difference(paperless_ps.stdout_lines | default([])) }}
    paperless_state: >-
      {{ 'import' if paperless_import_wanted | bool
         else 'install' if not paperless_installed
         else 'update' if paperless_version is version(paperless_installed_version, '>')
         else 'reconfigure' if paperless_files_changed | length > 0
         else 'noop' }}
