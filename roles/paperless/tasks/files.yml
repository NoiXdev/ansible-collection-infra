---
# The data directory with its subdirectories and the files the role writes,
# for install and import (inside their block, so a failure here is theirs).

- name: Create the data directory
  ansible.builtin.file:
    path: "{{ paperless_data_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

# Samba writes the scans into consume as paperless_uid:paperless_gid; its
# image makes an empty share 0770, so it is created that way.
- name: Create the Paperless data directories
  ansible.builtin.file:
    path: "{{ paperless_data_dir }}/{{ item }}"
    state: directory
    owner: "{{ paperless_uid }}"
    group: "{{ paperless_gid }}"
    mode: "{{ '0770' if item == 'consume' else '0750' }}"
  loop: "{{ paperless_owned_subdirs + [paperless_export_dir | basename] }}"

# PostgreSQL and Valkey run as their own users and chown their data on start.
- name: Create the database and broker directories
  ansible.builtin.file:
    path: "{{ paperless_data_dir }}/{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: "{{ paperless_data_subdirs | difference(paperless_owned_subdirs) }}"

- name: Write the compose file and the Samba files
  ansible.builtin.copy:
    dest: "{{ item.path }}"
    content: "{{ item.content }}"
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop: "{{ paperless_files | rejectattr('content', 'none') | list }}"
  loop_control:
    label: "{{ item.path }}"
  # They hold the secret key and the passwords.
  no_log: true
