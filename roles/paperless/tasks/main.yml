---
# Docker comes from the playbook (the docker role or Docker's own packages),
# not from a role dependency; fail early and clearly when it is missing.
- name: Check for Docker
  ansible.builtin.include_role:
    name: noixdev.infra.docker_check

- name: Check that paperless_secret_key is set
  ansible.builtin.assert:
    that: paperless_secret_key | default('') | string | length >= 32
    fail_msg: paperless_secret_key is required and must have at least 32 characters.
    quiet: true

- name: Check that paperless_db_password is set
  ansible.builtin.assert:
    that: paperless_db_password | default('') | string | length > 0
    fail_msg: paperless_db_password is required.
    quiet: true

- name: Check the Samba settings
  ansible.builtin.assert:
    that:
      - paperless_samba_bind | default('') | string | length > 0
      - paperless_samba_password | default('') | string | length > 0
      - paperless_samba_password | default('') | string is not search('[\r\n]')
      - paperless_samba_share is match('^[A-Za-z0-9][A-Za-z0-9_-]*$')
      - paperless_samba_user is match('^[a-z_][a-z0-9_-]*$')
    fail_msg: >-
      With paperless_samba on, paperless_samba_bind (the address port 445 is
      published on) and paperless_samba_password (one line) are required;
      paperless_samba_share may hold only letters, digits, - and _, and
      paperless_samba_user only lowercase letters, digits, - and _.
    quiet: true
  when: paperless_samba | bool

# The names end up in compose, Traefik rules and docker filters unquoted.
- name: Check the paperless settings
  ansible.builtin.assert:
    that:
      - paperless_version is match('^3\.\d+\.\d+$')
      - paperless_image | length > 0
      - paperless_postgres_major | length > 0
      - paperless_dir is match('^/')
      - paperless_project is match('^[a-z0-9][a-z0-9_-]*$')
      - paperless_data_dir is match('^/')
      - paperless_hostname is match('^[A-Za-z0-9][A-Za-z0-9.-]*$')
      - paperless_url is match('^https?://')
      - paperless_traefik_network is match('^[A-Za-z0-9][A-Za-z0-9_.-]*$')
      - paperless_traefik_priority | int >= 1
      - paperless_trusted_proxy_count | int >= 0
      - paperless_uid | int >= 0 and paperless_gid | int >= 0
      - paperless_dumps_keep | int >= 1
      - paperless_health_timeout | int > 0
    fail_msg: >-
      paperless_version must look like 3.X.Y (major 3, no v); paperless_dir
      and paperless_data_dir must be absolute paths, the basename of
      paperless_dir (the compose project) only lowercase letters, digits, -
      and _; paperless_hostname (required) a host name; paperless_url an
      http(s) URL; paperless_traefik_network a network name;
      paperless_image must be set, paperless_postgres_image with a tag that
      starts with the PostgreSQL major (postgres:18, postgres:18.1-alpine);
      paperless_traefik_priority,
      paperless_dumps_keep and paperless_health_timeout must be positive,
      paperless_trusted_proxy_count, paperless_uid and paperless_gid not
      negative.
    quiet: true

# From 18 on the image keeps its cluster below /var/lib/postgresql (in
# 18/docker), which compose.yaml binds to paperless_data_dir/postgres. Older
# images declare the volume /var/lib/postgresql/data, which Docker mounts as
# an anonymous volume over the bind: the database would live outside
# paperless_data_dir, the PostgreSQL checks in state.yml would find no
# cluster, and docker compose down would leave the documents without it.
- name: Check the PostgreSQL major
  ansible.builtin.assert:
    that: paperless_postgres_major | int >= 18
    fail_msg: >-
      paperless_postgres_image {{ paperless_postgres_image }} is PostgreSQL
      {{ paperless_postgres_major }}; the role needs PostgreSQL 18 or newer.
      Older images keep the database on a volume of their own
      (/var/lib/postgresql/data) instead of below /var/lib/postgresql, which
      the role binds to {{ paperless_data_dir }}/postgres, so it would live
      outside paperless_data_dir. The role changes nothing.
    quiet: true

- name: Check paperless_env
  ansible.builtin.assert:
    that:
      - paperless_env.keys() | reject('match', '^[A-Z][A-Z0-9_]*$') | list | length == 0
      - paperless_owned | length == 0
    fail_msg: >-
      paperless_env keys must be environment variable names (uppercase
      letters, digits and _), and the role sets these itself:
      {{ paperless_owned | join(', ') if paperless_owned else 'none' }}.
      Use the role's variables instead (paperless_db_password,
      paperless_secret_key, paperless_url, paperless_tika, ...).
    quiet: true
  vars:
    paperless_owned: "{{ paperless_env.keys() | select('in', paperless_env_owned) | list }}"

# Also reads the marker of a failed update (paperless_marker_read, written by
# update.yml; it names the failed version) and refuses after an update that
# did not finish (its marker, step update).
- name: Read the installation
  ansible.builtin.include_tasks: state.yml

# A marker that is not YAML cannot say which version failed.
- name: Check the marker of a failed update
  when: paperless_marker_read.content is defined
  block:
    - name: Parse the marker
      ansible.builtin.set_fact:
        paperless_marker: "{{ paperless_marker_yaml if paperless_marker_yaml is mapping else {} }}"
      vars:
        paperless_marker_yaml: "{{ paperless_marker_read.content | b64decode | from_yaml }}"
  rescue:
    - name: Fail on a marker that is not YAML
      ansible.builtin.fail:
        msg: >-
          {{ paperless_marker_file }} exists, but it is not YAML, so the role
          cannot tell which Paperless update failed and changes nothing. Check
          Paperless, then remove the file (rm {{ paperless_marker_file }}).

# The rollback failed (or the marker does not say it worked): the database
# and the files may be empty or half restored, and the backup holds the
# data. Any version would take a backup of that state, come up healthy and
# remove the marker, the last pointer to the real backup, so every version
# is refused.
- name: Refuse every version after a failed rollback
  ansible.builtin.fail:
    msg: >-
      {{ paperless_marker_file }} exists: the Paperless update to
      {{ paperless_marker.failed_version | default('?') }} failed on
      {{ paperless_marker.time | default('?') }}, and rolling back failed too
      ({{ paperless_marker.restore_error | default('?') }}). The database and
      the files may be empty or half restored; the data is in the backup
      {{ paperless_backup }}. The role refuses every version and changes
      nothing until Paperless is restored. {{ paperless_restore_hint }} Then
      check Paperless (its documents) and remove the marker (rm
      {{ paperless_marker_file }}).
  vars:
    paperless_backup: "{{ paperless_marker.backup | default('?', true) }}"
  when:
    - paperless_marker_read.content is defined
    - not paperless_marker.rolled_back_to | default(none)

# A marker that names no version blocks every version.
- name: Refuse the version of a failed update
  ansible.builtin.fail:
    msg: >-
      {{ paperless_marker_file }} exists: the Paperless update to
      {{ paperless_version }} failed on {{ paperless_marker.time | default('?') }}
      (rolled back to {{ paperless_marker.rolled_back_to }}; backup
      {{ paperless_marker.backup | default('?') }}). The role does not try
      {{ paperless_version }} again and changes nothing while the marker
      names it. To try again, remove it (rm {{ paperless_marker_file }}); or
      set paperless_version to another version, and the marker is removed
      once a run with it succeeds.
  when:
    - paperless_marker_read.content is defined
    - (paperless_marker.failed_version | default(paperless_version) | string) == paperless_version

- name: Check the first admin for the install
  ansible.builtin.assert:
    that:
      - paperless_admin_user | length > 0
      - paperless_admin_password | length > 0
    fail_msg: >-
      Paperless is not installed in {{ paperless_dir }}; a fresh install needs
      paperless_admin_user and paperless_admin_password (an import with
      paperless_import_dir brings the users of the export instead).
    quiet: true
  when: paperless_state == 'install'

- name: Install Paperless
  ansible.builtin.include_tasks: install.yml
  when: paperless_state == 'install'

- name: Import the export into the fresh installation
  ansible.builtin.include_tasks: import.yml
  when: paperless_state == 'import'

- name: Update Paperless
  ansible.builtin.include_tasks: update.yml
  when: paperless_state == 'update'

# The run after an update that did not finish, with
# paperless_restore_interrupted: the files from before it (the marker's
# copies) and the database, data and media of its backup put back by
# restore.yml, as a rollback puts them back, and nothing else of the update.
# Healthy, the marker goes and the run ends; the next run without the
# variable tries the update again. Not healthy, update-failed records a
# failed rollback (rolled_back_to null), which refuses every version.
- name: Restore the backup of the interrupted update
  when: paperless_state == 'restore_interrupted'
  vars:
    paperless_interrupted_from: "{{ paperless_update_in_progress.from_version | default('?') }}"
    paperless_interrupted_to: "{{ paperless_update_in_progress.to_version }}"
  block:
    # What restore.yml puts back: a file without a copy did not exist (the
    # Samba files with Samba off), and the restore removes it. state.yml has
    # checked that the compose file's copy exists. They hold the secret key
    # and the passwords.
    - name: Read the files from before the interrupted update
      ansible.builtin.slurp:
        src: "{{ item.saved }}"
      loop: "{{ paperless_update_marker_copies }}"
      loop_control:
        label: "{{ item.path }}"
      register: paperless_files_read
      failed_when: false
      no_log: true

    - name: Note the backup from before the interrupted update
      ansible.builtin.set_fact:
        paperless_backup: "{{ paperless_update_in_progress.backup }}"

    - name: Roll back to the backup of the interrupted update
      ansible.builtin.include_tasks: restore.yml
      vars:
        paperless_installed_version: "{{ paperless_interrupted_from }}"

    - name: Remove the marker of the restored update
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop: "{{ paperless_update_marker_files }}"
      when: paperless_healthy

    - name: Report the restore
      ansible.builtin.debug:
        msg: >-
          Paperless in {{ paperless_dir }} runs {{ paperless_interrupted_from }}
          again: the interrupted update to {{ paperless_interrupted_to }} was
          rolled back to the backup {{ paperless_backup }}. Remove
          paperless_restore_interrupted; the next run with a newer
          paperless_version tries the update again.
      when: paperless_healthy

    # As after a failed rollback: the data is in the backup, and no version
    # may run over the database the restore left.
    - name: Write the marker of the failed restore
      ansible.builtin.copy:
        dest: "{{ paperless_marker_file }}"
        content: |
          # Written by the noixdev.infra.paperless role: the update to
          # failed_version did not finish, and restoring the backup failed.
          # The role refuses every version while this file exists.
          {{ {'failed_version': paperless_interrupted_to,
              'rolled_back_to': none,
              'backup': paperless_backup,
              'time': now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ'),
              'restore_error': paperless_restore_error}
             | to_nice_yaml(sort_keys=false) }}
        owner: root
        group: root
        mode: "0644"
      when: not paperless_healthy

    - name: Remove the marker of the update whose restore failed
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop: "{{ paperless_update_marker_files }}"
      when: not paperless_healthy

    - name: Fail with the failed restore
      ansible.builtin.fail:
        msg: >-
          Restoring Paperless {{ paperless_interrupted_from }} in {{ paperless_dir }}
          from the backup {{ paperless_backup }} after the interrupted update to
          {{ paperless_interrupted_to }} failed ({{ paperless_restore_error }}), so
          Paperless may be down. {{ paperless_restore_hint }}
          {{ paperless_marker_file }} refuses every version; remove it once
          Paperless runs again.
      when: not paperless_healthy

# A reconfigure keeps the version, so the schema stays and it takes no backup.
- name: Reconfigure Paperless
  ansible.builtin.include_tasks: reconfigure.yml
  when: paperless_state == 'reconfigure'

# Read-only: a run without changes starts and restarts nothing, but stays red
# while a container is down.
- name: Check that Paperless runs
  when: paperless_state == 'noop'
  block:
    - name: Fail when a container is not running
      ansible.builtin.fail:
        msg: >-
          Paperless in {{ paperless_dir }} is down: the services
          {{ paperless_down | join(', ') }} are not running. The role starts
          nothing on a run without changes; start them with docker compose up
          -d in {{ paperless_dir }}.
      when: paperless_down | length > 0

    - name: Check that Paperless is healthy
      ansible.builtin.include_tasks: health.yml

    - name: Fail when Paperless is not healthy
      ansible.builtin.fail:
        msg: >-
          Paperless in {{ paperless_dir }} is unhealthy: the webserver and the
          database are not both healthy, or Paperless cannot use its
          database, within {{ paperless_health_timeout }} seconds
          ({{ paperless_health_lines | join('; ') }}). The role restarts
          nothing on a run without changes; see docker compose logs in
          {{ paperless_dir }}.
      when: not paperless_healthy

# Reached only by a run that succeeded, so the marker names another version
# and records a rollback that worked.
- name: Remove the marker of a failed update of another version
  ansible.builtin.file:
    path: "{{ paperless_marker_file }}"
    state: absent
  when: paperless_marker_read.content is defined
