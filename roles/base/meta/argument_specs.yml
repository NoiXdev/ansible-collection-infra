---
argument_specs:
  main:
    short_description: Baseline for Debian and Ubuntu servers
    options:
      base_packages:
        type: list
        elements: str
        description: Packages installed on every host.
      base_timezone:
        type: str
        description: System time zone.
      base_swap_size_mb:
        type: int
        description: Size of the swap file in MiB; 0 leaves swap alone.
      base_swap_file:
        type: path
        description: Path of the swap file.
      base_swappiness:
        type: int
        description: vm.swappiness while a swap file is managed.
      base_journald_max_use:
        type: str
        description: journald SystemMaxUse.
      base_unattended_upgrades:
        type: bool
        description: Enable unattended security upgrades.
      base_unattended_reboot:
        type: bool
        description: Let unattended-upgrades reboot when an upgrade needs it.
      base_unattended_reboot_time:
        type: str
        description: Time of day for such a reboot.
      base_sshd_hardening:
        type: bool
        description: >-
          Harden sshd with a drop-in: key-only login, no forwarding of agents,
          X11 or tunnels, VERBOSE logging (key fingerprints, used by fail2ban
          and CrowdSec), connection limits and modern algorithms only. The
          base_sshd_* options below tune it; none of them applies while this
          is off.
      base_sshd_listen_addresses:
        type: list
        elements: str
        description: >-
          Addresses sshd binds to. Empty keeps the distribution default. When
          set, socket activation is turned off and the nonlocal bind
          sysctls are enabled, so sshd starts even before an address is up.
      base_sshd_port:
        type: int
        description: sshd port.
      base_sshd_permit_root_login:
        type: str
        choices: ["yes", prohibit-password, forced-commands-only, "no"]
        description: >-
          PermitRootLogin. The default lets root log in with a key only; set
          "no" once every play connects as an unprivileged user.
      base_sshd_allow_users:
        type: list
        elements: str
        description: >-
          AllowUsers patterns (user or user@host). Empty writes no AllowUsers
          line. Include the user Ansible connects as, or the next run is
          locked out.
      base_sshd_max_auth_tries:
        type: int
        description: MaxAuthTries; keep it above the number of keys a client offers.
      base_sshd_login_grace_time:
        type: int
        description: LoginGraceTime in seconds.
      base_sshd_max_sessions:
        type: int
        description: MaxSessions per connection; Ansible's multiplexing needs several.
      base_sshd_max_startups:
        type: str
        description: MaxStartups (start:rate:full) for unauthenticated connections.
      base_sshd_client_alive_interval:
        type: int
        description: ClientAliveInterval in seconds.
      base_sshd_client_alive_count_max:
        type: int
        description: >-
          ClientAliveCountMax; an idle, unresponsive session is closed after
          interval times count seconds.
      base_sshd_allow_tcp_forwarding:
        type: str
        choices: ["yes", "no", all, local, remote]
        description: AllowTcpForwarding; "local" is enough for ssh -L tunnels to private services.
      base_sshd_kex_algorithms:
        type: list
        elements: str
        description: >-
          KexAlgorithms. The default works on OpenSSH 9.6 (Ubuntu 24.04) and
          later; add mlkem768x25519-sha256 first where every host runs
          OpenSSH 9.9 or later.
      base_sshd_ciphers:
        type: list
        elements: str
        description: Ciphers.
      base_sshd_macs:
        type: list
        elements: str
        description: MACs (only used by non-AEAD ciphers).
      base_nonlocal_bind:
        type: bool
        default: false
        description: >-
          Enable net.ipv4.ip_nonlocal_bind and net.ipv6.ip_nonlocal_bind, so
          services (sshd, published container ports) can bind an address before it is up at boot.
          The IPv6 key is skipped on a kernel without IPv6. Always on when
          base_sshd_listen_addresses is set.
      base_static_routes:
        type: list
        elements: dict
        description: >-
          Routes (to, via) set by a oneshot unit after the network is up, on the
          interface the gateway is reached through. For example a home LAN
          behind a private network gateway on a host that also has a public
          interface.
