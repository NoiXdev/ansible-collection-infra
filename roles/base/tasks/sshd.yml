---
# sshd -t needs it; it only exists once sshd has run.
- name: Create the sshd runtime directory
  ansible.builtin.file:
    path: /run/sshd
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Write the sshd drop-in
  ansible.builtin.template:
    src: sshd.conf.j2
    dest: /etc/ssh/sshd_config.d/50-base.conf
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart ssh

- name: Check for socket activation
  ansible.builtin.stat:
    path: /usr/lib/systemd/system/ssh.socket
  register: base_ssh_socket

# A plain sshd binds exactly the listen addresses, the same way on every
# release, instead of a socket unit holding port 22 on all addresses.
- name: Run sshd as a plain service
  when:
    - base_sshd_listen_addresses | length > 0
    - base_ssh_socket.stat.exists
  block:
    # Disabling removes the socket's RequiredBy link from ssh.service;
    # masking alone leaves it, and ssh.service then refuses to start.
    - name: Stop and disable ssh.socket
      ansible.builtin.systemd_service:
        name: ssh.socket
        state: stopped
        enabled: false
      notify: Restart ssh

    - name: Mask ssh.socket
      ansible.builtin.systemd_service:
        name: ssh.socket
        masked: true
      notify: Restart ssh

    - name: Enable ssh.service
      ansible.builtin.systemd_service:
        name: ssh.service
        enabled: true
      notify: Restart ssh
