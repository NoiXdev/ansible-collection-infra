---
traefik_image: traefik:v3.7.17
traefik_socket_proxy_image: tecnativa/docker-socket-proxy:v0.5.0
traefik_dir: /opt/traefik
traefik_project: traefik
traefik_log_level: INFO
traefik_access_log: false
traefik_mtu: 1500

# Shared network for the containers Traefik routes to. Traefik gets a fixed
# address on it, outside ip_range, so a backend can trust exactly it.
traefik_network: proxy
traefik_network_subnet: 172.31.255.0/24
traefik_network_range: 172.31.255.0/25
traefik_address: 172.31.255.254

# - name: entrypoint name
#   port: container port (and host port unless host_port is set)
#   host_port: port published on the host (default: port); lets two
#              entrypoints share a host port on different bind addresses
#   bind: host addresses to publish on (empty: all)
#   protocol: tcp or udp
#   tls: terminate TLS with the cert resolver
#   as_default: routers without an explicit entrypoint use it
#   redirect_to: redirect HTTP to this entrypoint (to its host_port when set)
#   middlewares: middlewares every router on this entrypoint gets, e.g.
#                [name@file]; not allowed together with redirect_to
traefik_entrypoints:
  - name: web
    port: 80
    redirect_to: websecure
  - name: websecure
    port: 443
    tls: true
    as_default: true

traefik_acme_email: ""
traefik_acme_ca_server: https://acme-v02.api.letsencrypt.org/directory
traefik_dns_provider: hetzner
traefik_dns_resolvers: [1.1.1.1:53, 9.9.9.9:53]
traefik_dns_env: {}
# - main: example.com
#   sans: ["*.example.com"]
traefik_cert_domains: []

# Keep the routers of containers without a healthy server instead of dropping
# them; Traefik v3 answers those requests with 500, not 503.
traefik_docker_allow_empty_services: false

# Error pages: a service that serves /<code>.html. The role runs
# noixdev/error-pages in the Traefik compose project (service error-pages,
# alias error-pages on the shared network) and writes dynamic/error-pages.yml
# with the middlewares error-pages-errors and error-pages-compress, one router
# per route and the service error-pages.
traefik_error_pages_enabled: false
# false: run the error pages service elsewhere and point the URL at it.
traefik_error_pages_container: true
traefik_error_pages_image: noixdev/error-pages:1
# Container environment; replaces the whole dict when set (see the image's
# documentation for THEME, LANGUAGES, LINKS and the rest).
traefik_error_pages_env:
  THEME: glass
  LANGUAGES: en,de
  DEFAULT_LANGUAGE: en
  SHOW_DETAILS: "false"
traefik_error_pages_cpus: "0.25"
traefik_error_pages_memory: 64M
traefik_error_pages_url: http://error-pages:8080
# Backend statuses replaced by the matching page.
traefik_error_pages_status: ["502-504"]
# Entrypoints whose routers all get compress (if enabled) and the errors
# middleware, before the entrypoint's own middlewares.
traefik_error_pages_entrypoints: []
traefik_error_pages_compress: true
traefik_error_pages_compress_types: [text/html, text/plain, application/json]
# Routers that answer with one fixed page (higher priority wins):
#   - name: catchall          # [a-z0-9-]+, unique
#     entrypoints: [web]
#     rule: HostRegexp(`.+`)  # default
#     priority: 1             # default
#     page: "404"             # a status code or "internal"
traefik_error_pages_routes: []

# Extra files for the file provider: {file name: YAML content}.
traefik_dynamic_files: {}
