---
- name: Require an ACME e-mail for TLS entrypoints
  ansible.builtin.assert:
    that: traefik_acme_email | length > 0
    fail_msg: traefik_acme_email is required when an entrypoint has tls enabled.
    quiet: true
  when: traefik_entrypoints | selectattr('tls', 'defined') | selectattr('tls') | list | length > 0

- name: Check the HTTP-01 settings
  ansible.builtin.assert:
    that:
      - traefik_entrypoints | selectattr('name', 'equalto', traefik_acme_http_entrypoint) | list | length == 1
      - (traefik_entrypoints | selectattr('name', 'equalto', traefik_acme_http_entrypoint) | first).host_port
        | default((traefik_entrypoints | selectattr('name', 'equalto', traefik_acme_http_entrypoint) | first).port)
        | int == 80
      - traefik_cert_domains | map(attribute='main') | select('match', '^\\*') | list | length == 0
      - traefik_cert_domains | map(attribute='sans', default=[]) | flatten | select('match', '^\\*') | list | length == 0
    fail_msg: >-
      HTTP-01 needs traefik_acme_http_entrypoint to name an entrypoint on host
      port 80, and traefik_cert_domains cannot contain wildcards.
    quiet: true
  when: traefik_acme_challenge == 'http'

- name: Check the entrypoints
  ansible.builtin.assert:
    that:
      - traefik_entrypoints | selectattr('redirect_to', 'defined') | selectattr('redirect_to')
        | selectattr('middlewares', 'defined') | selectattr('middlewares') | list | length == 0
    fail_msg: An entrypoint with redirect_to cannot have middlewares.
    quiet: true

- name: Check the error pages settings
  ansible.builtin.assert:
    that:
      - traefik_error_pages_url is match('^https?://')
      - traefik_error_pages_routes | selectattr('entrypoints', 'undefined') | list | length == 0
      - (traefik_error_pages_entrypoints + traefik_error_pages_routes | map(attribute='entrypoints') | flatten)
        | difference(traefik_entrypoints | map(attribute='name')
          | difference(traefik_entrypoints | selectattr('redirect_to', 'defined') | selectattr('redirect_to') | map(attribute='name')))
        | length == 0
      - traefik_error_pages_routes | map(attribute='name') | unique | length == traefik_error_pages_routes | length
      - traefik_error_pages_routes | map(attribute='name') | reject('match', '^[a-z0-9-]+$') | list | length == 0
      - traefik_error_pages_routes | map(attribute='page', default='404') | map('string')
        | reject('match', '^([1-5][0-9]{2}|internal)$') | list | length == 0
      - "'error-pages.yml' not in traefik_dynamic_files"
    fail_msg: >-
      Error pages entrypoints must exist and not redirect; routes need unique names
      ([a-z0-9-]+), entrypoints and a page that is a status code or "internal";
      traefik_error_pages_url must be an http(s) URL; traefik_dynamic_files cannot
      contain error-pages.yml.
    quiet: true
  when: traefik_error_pages_enabled

- name: Create the Traefik directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ traefik_dir }}", mode: "0750" }
    - { path: "{{ traefik_dir }}/acme", mode: "0700" }
    - { path: "{{ traefik_dir }}/dynamic", mode: "0755" }

- name: Write the DNS provider environment
  ansible.builtin.copy:
    dest: "{{ traefik_dir }}/dns.env"
    content: |
      # Managed by Ansible
      {% for key, value in traefik_dns_env.items() %}
      {{ key }}={{ value }}
      {% endfor %}
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: Restart traefik

# Before the static configuration: the entrypoints reference these
# middlewares, so they must exist when Traefik restarts. No restart needed,
# the file provider watches the directory.
- name: Write the error pages configuration
  ansible.builtin.template:
    src: error-pages.yml.j2
    dest: "{{ traefik_dir }}/dynamic/error-pages.yml"
    owner: root
    group: root
    mode: "0644"
  when: traefik_error_pages_enabled

- name: Write the static configuration
  ansible.builtin.template:
    src: traefik.yml.j2
    dest: "{{ traefik_dir }}/traefik.yml"
    owner: root
    group: root
    mode: "0644"
  register: traefik_static
  notify:
    - Restart traefik
    - Remove the error pages configuration

- name: Write the dynamic configuration files
  ansible.builtin.copy:
    dest: "{{ traefik_dir }}/dynamic/{{ item.key }}"
    content: "{{ item.value if item.value is string else item.value | to_nice_yaml(indent=2) }}"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ traefik_dynamic_files | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

# Only while the running static configuration no longer references the
# middlewares; otherwise the handler removes the file after the restart.
- name: Remove the error pages configuration
  ansible.builtin.file:
    path: "{{ traefik_dir }}/dynamic/error-pages.yml"
    state: absent
  when: not traefik_error_pages_enabled and traefik_static is not changed

- name: Write the compose file
  ansible.builtin.template:
    src: compose.yaml.j2
    dest: "{{ traefik_dir }}/compose.yaml"
    owner: root
    group: root
    mode: "0644"

- name: Start Traefik
  community.docker.docker_compose_v2:
    project_src: "{{ traefik_dir }}"
    project_name: "{{ traefik_project }}"
    state: present
    pull: missing
    remove_orphans: true
