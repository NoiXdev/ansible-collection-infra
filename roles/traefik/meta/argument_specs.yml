---
argument_specs:
  main:
    short_description: Standalone Traefik with DNS-01 certificates
    description:
      - Runs Traefik and a read-only Docker socket proxy as one compose project.
      - Containers join the shared network and opt in with traefik.enable=true.
    options:
      traefik_image:
        type: str
        description: Traefik image.
      traefik_socket_proxy_image:
        type: str
        description: Docker socket proxy image; Traefik never sees the socket itself.
      traefik_dir:
        type: path
        description: Directory of the compose project and its state.
      traefik_project:
        type: str
        description: Compose project name.
      traefik_log_level:
        type: str
        choices: [DEBUG, INFO, WARN, ERROR]
        description: Traefik log level.
      traefik_access_log:
        type: bool
        description: Write an access log to stdout.
      traefik_mtu:
        type: int
        description: MTU of the compose networks (1450 on Hetzner private networks).
      traefik_network:
        type: str
        description: Name of the shared network.
      traefik_network_subnet:
        type: str
        description: Subnet of the shared network.
      traefik_network_range:
        type: str
        description: Part of the subnet Docker assigns from; must not contain traefik_address.
      traefik_address:
        type: str
        description: Fixed address of Traefik on the shared network.
      traefik_entrypoints:
        type: list
        elements: dict
        description:
          - Entrypoints; see defaults/main.yml for the keys.
          - Keys are name, port, host_port, bind, protocol, tls, as_default, redirect_to and
            middlewares.
          - host_port publishes the container port on another host port, so two entrypoints
            can share a host port on different bind addresses. A redirect to such an
            entrypoint goes to its host_port.
          - middlewares lists middlewares (for example name@file) that every router on the
            entrypoint gets; an entrypoint with redirect_to cannot have them.
      traefik_acme_email:
        type: str
        description: ACME account e-mail; required when an entrypoint terminates TLS.
      traefik_acme_ca_server:
        type: str
        description: ACME directory (use the staging directory for tests).
      traefik_dns_provider:
        type: str
        description: lego DNS provider for the DNS-01 challenge.
      traefik_dns_env:
        type: dict
        description: Environment for the DNS provider (API tokens); written to a 0600 file.
      traefik_dns_resolvers:
        type: list
        elements: str
        description: Resolvers used to check DNS propagation.
      traefik_cert_domains:
        type: list
        elements: dict
        description: Certificates requested on TLS entrypoints (main, sans).
      traefik_docker_allow_empty_services:
        type: bool
        description: >-
          Docker provider allowEmptyServices: keep the routers of containers without
          a healthy server, so they answer 503 instead of disappearing.
      traefik_error_pages_enabled:
        type: bool
        description:
          - Route errors to an error pages service. The role writes dynamic/error-pages.yml with
            the middlewares error-pages-errors and error-pages-compress, a router
            error-pages-<name> per route and the service error-pages; disabling removes it.
          - The role also runs the error pages container unless traefik_error_pages_container is
            false.
      traefik_error_pages_container:
        type: bool
        description:
          - Run the error pages container (service error-pages) in the Traefik compose project,
            read-only, as 65532, with the image's healthcheck and a volume on /data for
            maintenance mode.
          - Set to false to run the service elsewhere; then point traefik_error_pages_url at it.
      traefik_error_pages_image:
        type: str
        description: Error pages image (noixdev/error-pages or compatible).
      traefik_error_pages_env:
        type: dict
        description: Environment of the error pages container; replaces the defaults as a whole.
      traefik_error_pages_cpus:
        type: str
        description: CPU limit of the error pages container.
      traefik_error_pages_memory:
        type: str
        description: Memory limit of the error pages container, for example 64M.
      traefik_error_pages_url:
        type: str
        description: URL of the error pages service, which serves /<code>.html; the default is the bundled container.
      traefik_error_pages_status:
        type: list
        elements: str
        description: Backend statuses (codes or ranges like 502-504) replaced by the matching page.
      traefik_error_pages_entrypoints:
        type: list
        elements: str
        description:
          - Entrypoints whose routers all get error-pages-compress (if enabled) and
            error-pages-errors, before the entrypoint's own middlewares.
          - Must exist in traefik_entrypoints and must not redirect.
      traefik_error_pages_compress:
        type: bool
        description: Compress responses on those entrypoints, limited to traefik_error_pages_compress_types.
      traefik_error_pages_compress_types:
        type: list
        elements: str
        description: Content types the compress middleware compresses.
      traefik_error_pages_routes:
        type: list
        elements: dict
        description:
          - Routers that always answer with one page, for unknown hosts or names that must not
            be served on an entrypoint.
          - Keys are name ([a-z0-9-]+, unique), entrypoints (required), rule (default
            HostRegexp(`.+`)), priority (default 1; higher wins) and page (a status code or
            internal, default 404). The page is requested as /<page>.html.
      traefik_dynamic_files:
        type: dict
        description: File-provider files, name to YAML content.
