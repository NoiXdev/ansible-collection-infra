---
# Mode 0644: it holds no secret, which reach the containers as files of
# graylog_secrets_dir.
graylog_compose_file: "{{ graylog_dir }}/compose.yaml"
# Mode 0700. Mode 0600 files: password_secret, root_password_sha2 and
# root_password (only if the API helper needs it on the host).
graylog_secrets_dir: "{{ graylog_dir }}/secrets"
# Mode 0600: for each input of the role its Graylog id and a SHA-256 of the
# configuration applied, so that a changed entry is found without asking
# Graylog for every setting.
graylog_inputs_state: "{{ graylog_dir }}/inputs.json"

# The subdirectories of graylog_data_dir whose absence means the data is
# missing (an unmounted volume): only install creates them.
graylog_data_subdirs: [mongodb, datanode, graylog, backups]
graylog_backup_dir: "{{ graylog_data_dir }}/backups"
# Written after a failed update; that version is not tried again while it
# exists.
graylog_marker_file: "{{ graylog_dir }}/update-failed"
# Written before an install creates anything and removed once Graylog is
# healthy; while it exists every run refuses.
graylog_install_marker: "{{ graylog_dir }}/install-incomplete"
# Written before the first change of an update and removed once it is healthy
# or rolled back; a run that stopped in between leaves it for the next run.
# Beside it, copies of the compose file and the secrets it replaces.
graylog_update_marker: "{{ graylog_dir }}/update-in-progress"
graylog_update_marker_compose: "{{ graylog_dir }}/update-in-progress.compose.yaml"
graylog_update_marker_secrets: "{{ graylog_dir }}/update-in-progress.secrets"
# Written marker first (update.yml), so a run stopped in between can leave a
# marker without its copies; removed marker first, so one stopped in between
# can leave copies without the marker. state.yml handles both: the restore
# reads the backup, not the copies, and copies without a marker are removed.
graylog_update_marker_files:
  - "{{ graylog_update_marker }}"
  - "{{ graylog_update_marker_compose }}"
  - "{{ graylog_update_marker_secrets }}"
# The name of a complete backup below graylog_backup_dir:
# <UTC time>-<from version>-to-<to version>, the Graylog versions (the
# backup's versions file names MongoDB's). Pruning takes only these, not the
# <backup>-failed directories of rolled back updates.
graylog_backup_pattern: '^\d{8}T\d{6}Z-\d+\.\d+\.\d+-to-\d+\.\d+\.\d+$'
# The database of Graylog and the Data Node in MongoDB (compose.yaml.j2),
# which the backup dumps.
graylog_mongodb_database: graylog
# The featureCompatibilityVersion of graylog_mongodb_version (its major and
# minor), which an update raises to once the new versions are healthy.
graylog_mongodb_fcv: "{{ (graylog_mongodb_version | string).split('.')[:2] | join('.') }}"
# The installed Graylog and MongoDB versions and a SHA-256 of the password
# secret (never the secret itself), so that a changed secret is refused.
graylog_versions_file: "{{ graylog_dir }}/versions"

# The oldest release the role runs.
graylog_min_version: 7.0.0
# MongoDB majors the role runs.
graylog_mongodb_majors: ["7", "8"]

# The input types: Graylog's class and the transport the port is published
# on.
graylog_input_types:
  gelf_udp: {class: org.graylog2.inputs.gelf.udp.GELFUDPInput, transport: udp}
  gelf_tcp: {class: org.graylog2.inputs.gelf.tcp.GELFTCPInput, transport: tcp}
  gelf_http: {class: org.graylog2.inputs.gelf.http.GELFHttpInput, transport: tcp}
  syslog_udp: {class: org.graylog2.inputs.syslog.udp.SyslogUDPInput, transport: udp}
  syslog_tcp: {class: org.graylog2.inputs.syslog.tcp.SyslogTCPInput, transport: tcp}
# The inputs as the role applies them, in the order of graylog_inputs: name,
# type, transport, port (the host's), container_port (the port itself, or
# port + 10000 below 1024: the server does not run as root), bind, traefik,
# body (what the role sends to Graylog's API: title, class, global and the
# configuration, the options first, then the address and port, and for a
# token the authorization header) and sha256 (of the body, which
# graylog_inputs_state records). The body can hold a token: never print it.
graylog_inputs_wanted: >-
  {%- set wanted = [] -%}
  {%- for input in graylog_inputs -%}
  {%-   set port = input.port | int -%}
  {%-   set container_port = port if port >= 1024 else port + 10000 -%}
  {%-   set configuration = (input.options | default({})) | combine({'bind_address': '0.0.0.0', 'port': container_port}) -%}
  {%-   if input.token is defined -%}
  {%-     set configuration = configuration | combine({'authorization_header_name': 'Authorization',
                                                      'authorization_header_value': 'Bearer ' ~ input.token}) -%}
  {%-   endif -%}
  {%-   set body = {'title': graylog_input_title_prefix ~ input.name, 'type': graylog_input_types[input.type].class,
                    'global': true, 'configuration': configuration} -%}
  {%-   set _ = wanted.append({'name': input.name, 'type': input.type,
                               'transport': graylog_input_types[input.type].transport,
                               'port': port, 'container_port': container_port, 'bind': input.bind | default([]),
                               'traefik': input.traefik | default(none), 'body': body,
                               'sha256': body | to_json(sort_keys=true) | hash('sha256')}) -%}
  {%- endfor -%}
  {{ wanted }}
# The keys of an input and of its traefik block.
graylog_input_keys: [name, type, port, bind, traefik, token, options]
graylog_input_traefik_keys: [hostname, entrypoints, middlewares, sni]

# The retention of the default index set (retention.yml): a new index every
# day, and the oldest deleted beyond graylog_retention_days indices.
graylog_rotation_strategy:
  class: org.graylog2.indexer.rotation.strategies.TimeBasedRotationStrategy
  config:
    type: org.graylog2.indexer.rotation.strategies.TimeBasedRotationStrategyConfig
    rotation_period: P1D
    rotate_empty_index_set: false
graylog_retention_strategy:
  class: org.graylog2.indexer.retention.strategies.DeletionRetentionStrategy
  config:
    type: org.graylog2.indexer.retention.strategies.DeletionRetentionStrategyConfig
    max_number_of_indices: "{{ graylog_retention_days | int }}"

# The settings the role sets itself; graylog_env must not hold them, nor a
# key with one of the prefixes or the suffix below.
graylog_env_owned:
  - GRAYLOG_PASSWORD_SECRET
  - GRAYLOG_ROOT_PASSWORD_SHA2
  - GRAYLOG_ROOT_USERNAME
  - GRAYLOG_HTTP_EXTERNAL_URI
  - GRAYLOG_MONGODB_URI
  - GRAYLOG_SERVER_JAVA_OPTS
  # The unattended first start (the CA and the Data Node's certificates
  # without the preflight); off, the role cannot provision the Data Node.
  - GRAYLOG_SELFSIGNED_STARTUP
graylog_env_owned_prefixes: [GRAYLOG_ROOT_, GRAYLOG_DATANODE_]
graylog_env_owned_suffix: __FILE

# Written by reconfigure.yml before it writes the secrets and the compose
# file, and removed once a run ends healthy; while it exists the role
# restarts the server and the Data Node, which read the secrets files only on
# start.
graylog_restart_marker: "{{ graylog_dir }}/restart-pending"

# Seconds the Data Node's and the server's checks take as their start period
# (checked every 5 seconds, failures not counted). Fixed, not
# graylog_health_timeout: how long the role waits is no setting of the
# containers, so changing it recreates nothing.
graylog_start_period: 600

# The services of the compose project, in their start order.
graylog_services: [mongodb, datanode, graylog]
# Where the containers read the secrets files (each bound alone, read-only).
graylog_container_secrets_dir: /run/secrets-graylog
# The users the images run as, who own their data subdirectory: MongoDB's
# mongodb, the Data Node's graylog (its entrypoint starts as root, reads the
# secrets, then drops to it) and the server's graylog, who also reads the
# secrets files.
graylog_mongodb_uid: 999
graylog_datanode_uid: 999
graylog_server_uid: 1100
# The Data Node's search engine refuses to start below this; the drop-in
# never lowers a higher value the host has (Ubuntu's default is higher).
graylog_max_map_count: 262144
graylog_sysctl_file: /etc/sysctl.d/60-noixdev-graylog.conf

graylog_compose: "{{ lookup('ansible.builtin.template', 'compose.yaml.j2') }}"

# The task that failed and its error: for a command the last line of stderr
# that names an error (else its last line), for anything else the first line
# of the message.
graylog_failure: >-
  {%- set stderr = (ansible_failed_result.stderr | default('') | trim).splitlines() -%}
  {%- set errors = stderr | select('search', 'Error:') | list -%}
  {{ ansible_failed_task.name }}:
  {{ (errors or stderr or ['']) | last | trim
     if ansible_failed_result.msg | default('') is search('non-zero return code')
     else ((ansible_failed_result.msg | default('') | trim).splitlines() or ['']) | first }}

# After a failed install: nothing in it should be worth keeping yet, so what
# it made is removed and the next run installs afresh.
graylog_install_hint: >-
  It left a partial installation, which the role does not take for a
  finished one. To install again, first check that nothing in it is worth
  keeping (messages and settings in Graylog), then run docker compose down
  in {{ graylog_dir }} (if {{ graylog_compose_file }} exists), remove
  {{ graylog_compose_file }}, {{ graylog_secrets_dir }},
  {{ graylog_versions_file }}, {{ graylog_install_marker }} and the
  subdirectories {{ graylog_data_subdirs | join(', ') }} of
  {{ graylog_data_dir }}, then run the role again.

# After a failed rollback: what restore.yml does, by hand, from the backup
# graylog_restore_from.
graylog_restore_hint: >-
  Roll back by hand in {{ graylog_dir }}: run docker compose stop; copy
  {{ graylog_restore_from }}/compose.yaml to {{ graylog_compose_file }},
  {{ graylog_restore_from }}/versions to {{ graylog_versions_file }},
  {{ graylog_restore_from }}/inputs.json to {{ graylog_inputs_state }} and the
  files of {{ graylog_restore_from }}/secrets into {{ graylog_secrets_dir }};
  run docker compose up -d mongodb; drop the database (docker compose exec -T
  mongodb mongosh --quiet --eval
  'db.getSiblingDB("{{ graylog_mongodb_database }}").dropDatabase()') and load
  the dump (docker compose exec -T mongodb mongorestore --archive --gzip
  --drop < {{ graylog_restore_from }}/mongodb.archive); put the entries of
  {{ graylog_restore_from }}/datanode, when the backup has that copy, in place
  of those of {{ graylog_data_dir }}/datanode (cp -a; keep the directory
  itself); then run docker compose up -d.
graylog_restore_from: "{{ graylog_backup | default('?', true) }}"

# Prints the address of the server's container on the project's network
# (compose names it <project>-<service>-1), where the role asks the API from
# the host.
graylog_address_command:
  - docker
  - inspect
  - --format
  - "{{ '{{' }} (index .NetworkSettings.Networks \"{{ graylog_project }}_default\").IPAddress {{ '}}' }}"
  - "{{ graylog_project }}-graylog-1"
