---
# Writes graylog_secrets (file name to content, set by state.yml) to
# graylog_secrets_dir, root's 0700, and removes files the role does not
# write. Each file is bound alone into the containers, so the directory's mode
# does not keep them out; they belong to the server's user (graylog_server_uid),
# who reads them, mode 0600; the Data Node's entrypoint reads its file as
# root. The containers read them through GRAYLOG_<SETTING>__FILE on their
# start. The tasks that touch a secret are no_log, so a failure gets a
# message of its own that quotes nothing of them.

- name: Write the secrets
  block:
    - name: Create the secrets directory
      ansible.builtin.file:
        path: "{{ graylog_secrets_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Write the secrets files
      ansible.builtin.copy:
        dest: "{{ graylog_secrets_dir }}/{{ item.key }}"
        content: "{{ item.value }}"
        owner: "{{ graylog_server_uid }}"
        group: "{{ graylog_server_uid }}"
        mode: "0600"
      loop: "{{ graylog_secrets | dict2items }}"
      no_log: true

    - name: Find the secrets files
      ansible.builtin.find:
        paths: "{{ graylog_secrets_dir }}"
        file_type: any
        hidden: true
      register: graylog_secrets_found

    - name: Remove the files the role does not write
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop: >-
        {{ graylog_secrets_found.files | map(attribute='path')
           | reject('in', graylog_secrets.keys() | map('regex_replace', '^', graylog_secrets_dir ~ '/') | list)
           | sort }}

  rescue:
    - name: Fail with the task that could not write the secrets
      ansible.builtin.fail:
        msg: >-
          The secrets of Graylog could not be written to
          {{ graylog_secrets_dir }} ({{ ansible_failed_task.name }}); the
          error is not shown, as it can quote a secret. A running Graylog
          keeps the secrets it started with. Check the directory (its owner,
          the free space), then run the role again.
