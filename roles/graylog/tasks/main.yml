---
# Docker comes from the playbook (the docker role or Docker's own packages),
# not from a role dependency; fail early and clearly when it is missing.
- name: Check for Docker
  ansible.builtin.include_role:
    name: noixdev.infra.docker_check

# A key left empty in YAML is null: default(..., true) takes it as unset, here,
# for the secrets and for the tokens, not as the text None.
- name: Check that graylog_hostname is set
  ansible.builtin.assert:
    that: graylog_hostname | default('', true) | string is match('^[A-Za-z0-9][A-Za-z0-9.-]*$')
    fail_msg: >-
      graylog_hostname is required and must be a host name: the web interface
      is reached only through Traefik at that name. The role changes nothing.
    quiet: true

# The two secrets: no_log hides the task's result, and so its message, hence
# the rescue with a message of its own that quotes nothing of the value.
- name: Check that graylog_root_password is set
  block:
    - name: Check graylog_root_password
      ansible.builtin.assert:
        that: graylog_root_password | default('', true) | string | length > 0
      no_log: true
  rescue:
    - name: Fail without graylog_root_password
      ansible.builtin.fail:
        msg: >-
          graylog_root_password is required: the password of the root user of
          the web interface (the host keeps only its SHA-256). Keep it in a
          vault. The role changes nothing.

- name: Check graylog_password_secret
  block:
    - name: Check that graylog_password_secret is set and long enough
      ansible.builtin.assert:
        that: graylog_password_secret | default('', true) | string | length >= 16
      no_log: true
  rescue:
    - name: Fail without a usable graylog_password_secret
      ansible.builtin.fail:
        msg: >-
          graylog_password_secret is required and must be at least 16
          characters: the secret the Graylog server and the Data Node encrypt
          their stored values with. Keep it in a vault. The value is not
          shown. The role changes nothing.

- name: Check graylog_version
  ansible.builtin.assert:
    that:
      - graylog_version | string is match('^\d+\.\d+\.\d+$')
      - graylog_version | string is version(graylog_min_version, '>=')
    fail_msg: >-
      graylog_version {{ graylog_version }} is not a release the role runs:
      it must look like X.Y.Z (no v, no latest, no moving tag) and be
      {{ graylog_min_version }} or newer. The role changes nothing.
    quiet: true

- name: Check graylog_mongodb_version
  ansible.builtin.assert:
    that:
      - graylog_mongodb_version | string is match('^\d+\.\d+\.\d+$')
      - graylog_mongodb_version | string | split('.') | first in graylog_mongodb_majors
    fail_msg: >-
      graylog_mongodb_version {{ graylog_mongodb_version }} is not a release
      the role runs: it must look like X.Y.Z (no latest, no moving tag) with
      the major {{ graylog_mongodb_majors | join(' or ') }}. The role changes
      nothing.
    quiet: true

# The names end up in compose, Traefik rules and docker filters unquoted.
- name: Check the Graylog settings
  ansible.builtin.assert:
    that:
      - graylog_image | length > 0
      - graylog_datanode_image | length > 0
      - graylog_mongodb_image | length > 0
      - graylog_dir is match('^/')
      - graylog_project is match('^[a-z0-9][a-z0-9_-]*$')
      - graylog_data_dir is match('^/')
      - graylog_url is match('^https?://[A-Za-z0-9.-]+(:[0-9]+)?/?$')
      - graylog_traefik_network is match('^[A-Za-z0-9][A-Za-z0-9_.-]*$')
      - graylog_traefik_entrypoints | reject('match', '^[A-Za-z0-9][A-Za-z0-9_-]*$') | list | length == 0
      - graylog_traefik_middlewares | reject('match', '^[A-Za-z0-9][A-Za-z0-9_.@-]*$') | list | length == 0
      - graylog_traefik_priority | int >= 1
      - graylog_root_username is match('^[A-Za-z0-9][A-Za-z0-9_.-]*$')
      - graylog_input_title_prefix | string | length > 0
      - graylog_retention_days | int >= 1
      - graylog_backups_keep | int >= 1
      - graylog_health_timeout | int > 0
      - graylog_rollback_timeout | int > 0
    fail_msg: >-
      graylog_dir and graylog_data_dir must be absolute paths, graylog_project
      only lowercase letters, digits, - and _; graylog_url an http(s) origin
      without a path; graylog_traefik_network a network name,
      graylog_traefik_entrypoints entrypoint names and
      graylog_traefik_middlewares middleware names (name@provider);
      graylog_root_username a plain user name; graylog_image,
      graylog_datanode_image, graylog_mongodb_image and
      graylog_input_title_prefix must be set; graylog_traefik_priority,
      graylog_retention_days, graylog_backups_keep, graylog_health_timeout
      and graylog_rollback_timeout must be positive. The role changes
      nothing.
    quiet: true

# Sizes end up in JVM options and in MongoDB's configuration.
- name: Check the memory settings
  ansible.builtin.assert:
    that:
      - graylog_server_heap | string is match('^[1-9][0-9]*[mg]$')
      - graylog_datanode_heap | string is match('^[1-9][0-9]*[mg]$')
      - graylog_mongodb_cache_gb | string is match('^[0-9]+(\.[0-9]+)?$')
      - graylog_mongodb_cache_gb | float >= 0.25
    fail_msg: >-
      graylog_server_heap and graylog_datanode_heap must be a whole number
      and m or g (as 512m or 2g, not 1GB), and graylog_mongodb_cache_gb a
      number of GB of at least 0.25. The role changes nothing.
    quiet: true

- name: Check the switches
  ansible.builtin.assert:
    that:
      - graylog_data_dir_mountpoint is boolean
      - graylog_update_backup_logs is boolean
      - graylog_restore_interrupted is boolean
    fail_msg: >-
      graylog_data_dir_mountpoint, graylog_update_backup_logs and
      graylog_restore_interrupted must be true or false. The role changes
      nothing.
    quiet: true

# The inputs: the list first, then each entry (a loop over indices, so that
# no token reaches the loop's output), then the entries together.
- name: Check that graylog_inputs is a list of mappings
  ansible.builtin.assert:
    that:
      - graylog_inputs is sequence
      - graylog_inputs is not string
      - graylog_inputs is not mapping
      - graylog_inputs | reject('mapping') | list | length == 0
    fail_msg: >-
      graylog_inputs must be a list of mappings with the keys
      {{ graylog_input_keys | join(', ') }}. The role changes nothing.
    quiet: true

- name: Check the keys of the inputs
  ansible.builtin.assert:
    that:
      - graylog_inputs[input_index].keys() | difference(graylog_input_keys) | length == 0
      - graylog_inputs[input_index].name | default('') | string is match('^[a-z0-9][a-z0-9-]*$')
      - graylog_inputs[input_index].type | default('') in graylog_input_types
      - graylog_inputs[input_index].port | default('') | string is match('^[0-9]+$')
      - graylog_inputs[input_index].port | default(0) | int >= 1
      - graylog_inputs[input_index].port | default(0) | int <= 65535
    fail_msg: >-
      Input number {{ input_index + 1 }} of graylog_inputs is not valid: it
      takes only the keys {{ graylog_input_keys | join(', ') }}; name
      (lowercase letters, digits and -), type
      ({{ graylog_input_types.keys() | list | join(', ') }}) and port (1 to
      65535) are required. The role changes nothing.
    quiet: true
  loop: "{{ range(graylog_inputs | length) | list }}"
  loop_control:
    loop_var: input_index

- name: Check the bind addresses of the inputs
  ansible.builtin.assert:
    that:
      - graylog_inputs[input_index].bind | default([]) is sequence
      - graylog_inputs[input_index].bind | default([]) is not string
      - graylog_inputs[input_index].bind | default([]) | reject('match', '^[0-9A-Fa-f.:]+$') | list | length == 0
    fail_msg: >-
      The input {{ graylog_inputs[input_index].name }}: bind must be a list of
      host addresses (an empty list publishes nothing). The role changes
      nothing.
    quiet: true
  loop: "{{ range(graylog_inputs | length) | list }}"
  loop_control:
    loop_var: input_index

# Traefik's UDP routers take neither TLS nor middlewares.
- name: Check that only TCP inputs have a Traefik block
  ansible.builtin.assert:
    that: graylog_input_types[graylog_inputs[input_index].type].transport == 'tcp'
    fail_msg: >-
      The input {{ graylog_inputs[input_index].name }} is a UDP input and has
      a traefik block: traefik is for the TCP types (gelf_http, gelf_tcp,
      syslog_tcp) only, as Traefik's UDP routers take no TLS and no
      middlewares. The role changes nothing.
    quiet: true
  loop: "{{ range(graylog_inputs | length) | list }}"
  loop_control:
    loop_var: input_index
  when: graylog_inputs[input_index].traefik is defined

- name: Check the Traefik blocks of the inputs
  ansible.builtin.assert:
    that:
      - graylog_inputs[input_index].traefik is mapping
      - graylog_inputs[input_index].traefik.keys() | difference(graylog_input_traefik_keys) | length == 0
      - graylog_inputs[input_index].traefik.hostname | default('') | string is match('^[A-Za-z0-9][A-Za-z0-9.-]*$')
      - graylog_inputs[input_index].traefik.entrypoints | default([]) | length > 0
      - graylog_inputs[input_index].traefik.entrypoints | default([]) | reject('match', '^[A-Za-z0-9][A-Za-z0-9_-]*$') | list | length == 0
      - graylog_inputs[input_index].traefik.middlewares | default([]) | reject('match', '^[A-Za-z0-9][A-Za-z0-9_.@-]*$') | list | length == 0
    fail_msg: >-
      The input {{ graylog_inputs[input_index].name }}: traefik takes
      hostname and entrypoints (both required, entrypoints not empty),
      middlewares (name@provider) and sni. The role changes nothing.
    quiet: true
  loop: "{{ range(graylog_inputs | length) | list }}"
  loop_control:
    loop_var: input_index
  when: graylog_inputs[input_index].traefik is defined

# The server name a TCP route takes (default the route's host name); * takes
# any and none, for senders that connect to an IP address.
- name: Check the SNI of the inputs
  ansible.builtin.assert:
    that:
      - graylog_inputs[input_index].type != 'gelf_http'
      - graylog_inputs[input_index].traefik.sni | string is match('^(\*|[A-Za-z0-9][A-Za-z0-9.-]*)$')
    fail_msg: >-
      The input {{ graylog_inputs[input_index].name }}: traefik.sni is * or a
      host name, for the TCP routes of gelf_tcp and syslog_tcp inputs only (a
      gelf_http input is routed by its host name). The role changes nothing.
    quiet: true
  loop: "{{ range(graylog_inputs | length) | list }}"
  loop_control:
    loop_var: input_index
  when: graylog_inputs[input_index].traefik.sni is defined

# A route for any SNI takes every connection of its entrypoint, so nothing
# else of the role may use that entrypoint: not another input, nor the web
# interface's router.
- name: Check that a route for any SNI has its entrypoint alone
  ansible.builtin.assert:
    that: graylog_sni_shared | length == 0
    fail_msg: >-
      The inputs with traefik.sni '*' share an entrypoint
      ({{ graylog_sni_shared | join('; ') }}): an entrypoint with a
      catch-all route serves one input only, as it takes every connection
      on it. Give that input an entrypoint of its own (add one to the
      traefik role). The role changes nothing.
    quiet: true
  vars:
    graylog_sni_shared: >-
      {%- set shared = [] -%}
      {%- set routed = graylog_inputs | selectattr('traefik', 'defined') | list -%}
      {%- for input in routed if input.traefik.sni | default('') == '*' -%}
      {%-   for entrypoint in input.traefik.entrypoints -%}
      {%-     set users = routed | selectattr('traefik.entrypoints', 'contains', entrypoint) | map(attribute='name') | list -%}
      {%-     if entrypoint in graylog_traefik_entrypoints -%}
      {%-       set users = users + ['the web interface'] -%}
      {%-     endif -%}
      {%-     if users | length > 1 -%}
      {%-       set _ = shared.append(entrypoint ~ ': ' ~ users | join(', ')) -%}
      {%-     endif -%}
      {%-   endfor -%}
      {%- endfor -%}
      {{ shared | unique | list }}

# The message quotes nothing of the token.
- name: Check the tokens of the inputs
  block:
    - name: Check the token of each input
      ansible.builtin.assert:
        that:
          - graylog_inputs[input_index].type == 'gelf_http'
          - graylog_inputs[input_index].token | default('', true) | string | length > 0
      loop: "{{ range(graylog_inputs | length) | list }}"
      loop_control:
        loop_var: input_index
      when: graylog_inputs[input_index].token is defined
      no_log: true
  rescue:
    - name: Fail with a token that does not belong to its input
      ansible.builtin.fail:
        msg: >-
          An input of graylog_inputs has a token that is empty or belongs to
          an input that is not a gelf_http one: only gelf_http inputs take a
          token. The value is not shown. The role changes nothing.

- name: Check the options of the inputs
  ansible.builtin.assert:
    that:
      - graylog_inputs[input_index].options is mapping
      - graylog_inputs[input_index].options.keys() | reject('match', '^[a-z][a-z0-9_]*$') | list | length == 0
      - graylog_inputs[input_index].options.values() | select('none') | list | length == 0
      - graylog_inputs[input_index].options.values() | select('mapping') | list | length == 0
      - graylog_inputs[input_index].options.values() | reject('string') | select('iterable') | list | length == 0
    fail_msg: >-
      The input {{ graylog_inputs[input_index].name }}: options must be a
      mapping of setting names (lowercase letters, digits and _) to plain
      values (a string, number or boolean), not lists, mappings or null. The
      role changes nothing.
    quiet: true
  loop: "{{ range(graylog_inputs | length) | list }}"
  loop_control:
    loop_var: input_index
  when: graylog_inputs[input_index].options is defined

- name: Check that the names of the inputs are unique
  ansible.builtin.assert:
    that: graylog_inputs | map(attribute='name') | list | length == graylog_inputs | map(attribute='name') | unique | list | length
    fail_msg: >-
      graylog_inputs names an input more than once
      ({{ graylog_inputs | map(attribute='name') | list | join(', ') }}):
      names must be unique, as they identify the inputs. The role changes
      nothing.
    quiet: true

# One UDP and one TCP input may share a port; two of one transport may not.
# Compared as numbers, so that "012201" and 12201 are the same port.
- name: Check that no port is published twice per transport
  ansible.builtin.assert:
    that: graylog_input_ports | length == graylog_input_ports | unique | list | length
    fail_msg: >-
      graylog_inputs uses a port twice for the same transport
      ({{ graylog_input_ports | join(', ') }}): one UDP and one TCP input may
      share a port, two UDP or two TCP inputs may not. The role changes
      nothing.
    quiet: true
  vars:
    graylog_input_ports: >-
      {%- set ports = [] -%}
      {%- for input in graylog_inputs -%}
      {%- set _ = ports.append((input.port | int | string) ~ '/' ~ graylog_input_types[input.type].transport) -%}
      {%- endfor -%}
      {{ ports }}

- name: Check graylog_env
  ansible.builtin.assert:
    that:
      - graylog_env is mapping
      - graylog_env.keys() | reject('match', '^GRAYLOG_[A-Z0-9_]+$') | list | length == 0
      - graylog_env.values() | select('mapping') | list | length == 0
      - graylog_env.values() | reject('string') | select('iterable') | list | length == 0
      - graylog_owned | length == 0
    fail_msg: >-
      graylog_env keys must be environment variable names starting with
      GRAYLOG_ (uppercase letters, digits and _) with plain values, and the
      role sets these itself: {{ graylog_env_owned | join(', ') }} (and every
      {{ graylog_env_owned_prefixes | join('*, ') }}* and *{{ graylog_env_owned_suffix }}
      key). Use the role's variables instead (graylog_root_username,
      graylog_root_password, graylog_password_secret, graylog_url,
      graylog_server_heap, ...). The role changes nothing.
    quiet: true
  vars:
    graylog_owned: >-
      {{ (graylog_env if graylog_env is mapping else {}).keys()
         | select('in', graylog_env_owned)
         | union((graylog_env if graylog_env is mapping else {}).keys()
                 | select('match', '^(' ~ graylog_env_owned_prefixes | join('|') ~ ')'))
         | union((graylog_env if graylog_env is mapping else {}).keys()
                 | select('search', graylog_env_owned_suffix ~ '$'))
         | sort }}

# A key left empty in YAML (KEY:) is null, which would reach Graylog as the
# text None. The message names the keys, not the values.
- name: Check that graylog_env has a value for every key
  ansible.builtin.assert:
    that: graylog_env_null | length == 0
    fail_msg: >-
      graylog_env has no value for {{ graylog_env_null | join(', ') }} (null,
      as a key left empty in YAML is), which would reach Graylog as the text
      None. Set a value, '' for an empty one, or remove the key. The role
      changes nothing.
    quiet: true
  vars:
    graylog_env_null: "{{ graylog_env | dict2items | selectattr('value', 'none') | map(attribute='key') | sort }}"

# What is installed and what to do (graylog_state); refuses, before any
# change, a data directory that is not mounted, an installation without its
# data or its versions file, the versions of a failed update (every version
# after a failed rollback), an install that did not complete, an update that
# did not finish (unless graylog_restore_interrupted asks to restore it), a
# downgrade and another graylog_password_secret.
- name: Read the installation
  ansible.builtin.include_tasks: state.yml

# The Data Node's search engine refuses to start below the minimum. The
# drop-in keeps a higher value the host has, and is applied only when the
# current one is lower; never lowered.
- name: Read vm.max_map_count
  ansible.builtin.command:
    argv: [sysctl, -n, vm.max_map_count]
  register: graylog_max_map_count_read
  changed_when: false

- name: Write the drop-in of vm.max_map_count
  ansible.builtin.template:
    src: sysctl.conf.j2
    dest: "{{ graylog_sysctl_file }}"
    owner: root
    group: root
    mode: "0644"
  vars:
    graylog_sysctl_max_map_count: "{{ [graylog_max_map_count | int, graylog_max_map_count_read.stdout | int] | max }}"

- name: Raise vm.max_map_count
  ansible.builtin.command:
    argv: [sysctl, --load, "{{ graylog_sysctl_file }}"]
  changed_when: true
  when: graylog_max_map_count_read.stdout | int < graylog_max_map_count | int

- name: Install Graylog
  ansible.builtin.include_tasks: install.yml
  when: graylog_state == 'install'

# A backup first, then the new versions, checked with the inputs and the
# retention; a failed update is rolled back to the backup, and update-failed
# keeps the role from trying those versions again.
- name: Update Graylog
  ansible.builtin.include_tasks: update.yml
  when: graylog_state == 'update'

# The run after an update that did not finish, with
# graylog_restore_interrupted: the compose file, the secrets, the versions
# file, the state of the inputs, the database and (when the backup has it)
# the Data Node's data of its backup put back by restore.yml, as a rollback
# puts them back, and nothing else of the update. Healthy, the marker goes
# and the run ends; the next run without the variable tries the update
# again. Not healthy, update-failed records a failed rollback
# (rolled_back_to null), which refuses every version.
- name: Restore the backup of the interrupted update
  when: graylog_state == 'restore_interrupted'
  vars:
    graylog_interrupted_from: "{{ graylog_update_in_progress.from_version | default('?') }}"
    graylog_interrupted_from_mongodb: "{{ graylog_update_in_progress.from_mongodb_version | default('?') }}"
    graylog_interrupted_to: "{{ graylog_update_in_progress.to_version }}"
    graylog_interrupted_to_mongodb: "{{ graylog_update_in_progress.to_mongodb_version }}"
  block:
    # restore.yml reads them; the versions file on disk may name either
    # versions.
    - name: Note the backup and the versions of the interrupted update
      ansible.builtin.set_fact:
        graylog_backup: "{{ graylog_update_in_progress.backup }}"
        graylog_installed_version: "{{ graylog_interrupted_from }}"
        graylog_installed_mongodb_version: "{{ graylog_interrupted_from_mongodb }}"

    - name: Roll back to the backup of the interrupted update
      ansible.builtin.include_tasks: restore.yml

    - name: Remove the marker of the restored update
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop: "{{ graylog_update_marker_files }}"
      when: graylog_healthy | bool

    - name: Report the restore
      ansible.builtin.debug:
        msg: >-
          Graylog in {{ graylog_dir }} runs {{ graylog_interrupted_from }} with
          MongoDB {{ graylog_interrupted_from_mongodb }} again: the interrupted
          update to {{ graylog_interrupted_to }} with MongoDB
          {{ graylog_interrupted_to_mongodb }} was rolled back to the backup
          {{ graylog_backup }}{{ (" (the Data Node's data found is in " ~ graylog_backup ~ '-failed)')
          if graylog_restore_datanode else '' }}. Remove
          graylog_restore_interrupted; the next run tries the update again.
      when: graylog_healthy | bool

    # As after a failed rollback: the data is in the backup, and no version
    # may run over what the restore left.
    - name: Write the marker of the failed restore
      ansible.builtin.copy:
        dest: "{{ graylog_marker_file }}"
        content: |
          # Written by the noixdev.infra.graylog role: the update to
          # failed_version did not finish, and restoring the backup failed.
          # The role refuses every version while this file exists.
          {{ {'failed_version': graylog_interrupted_to,
              'failed_mongodb_version': graylog_interrupted_to_mongodb,
              'rolled_back_to': none,
              'rolled_back_to_mongodb': none,
              'backup': graylog_backup,
              'time': now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ'),
              'restore_error': graylog_restore_error}
             | to_nice_yaml(sort_keys=false) }}
        owner: root
        group: root
        mode: "0644"
      when: not graylog_healthy | bool

    - name: Remove the marker of the update whose restore failed
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop: "{{ graylog_update_marker_files }}"
      when: not graylog_healthy | bool

    - name: Fail with the failed restore
      ansible.builtin.fail:
        msg: >-
          Restoring Graylog {{ graylog_interrupted_from }} with MongoDB
          {{ graylog_interrupted_from_mongodb }} in {{ graylog_dir }} from the
          backup {{ graylog_backup }} after the interrupted update to
          {{ graylog_interrupted_to }} failed ({{ graylog_restore_error }}), so
          Graylog may be down. {{ graylog_restore_hint }}
          {{ graylog_marker_file }} refuses every version; remove it once
          Graylog runs again.
      when: not graylog_healthy | bool

- name: Reconfigure Graylog
  ansible.builtin.include_tasks: reconfigure.yml
  when: graylog_state == 'reconfigure'

# Read-only: a run without changes starts and restarts nothing, but stays red
# while a container is down or Graylog is unhealthy.
- name: Check that Graylog runs
  when: graylog_state == 'noop'
  block:
    - name: Fail when a container is not running
      ansible.builtin.fail:
        msg: >-
          Graylog in {{ graylog_dir }} is down: the services
          {{ graylog_down | join(', ') }} are not running. The role starts
          nothing on a run without changes; start them with docker compose up
          -d in {{ graylog_dir }}.
      when: graylog_down | length > 0

    - name: Check that Graylog is healthy
      ansible.builtin.include_tasks: health.yml

    - name: Fail when Graylog is not healthy
      ansible.builtin.fail:
        msg: >-
          Graylog in {{ graylog_dir }} is unhealthy
          ({{ graylog_health_lines | join('; ') }}) within
          {{ graylog_health_timeout }} seconds. The role restarts nothing on a
          run without changes; see docker compose logs in {{ graylog_dir }}.
      when: not graylog_healthy

# Reached only by a run that ended healthy (installed, reconfigured or
# without changes): the inputs and the retention are Graylog's own settings,
# kept through its API on every run. An update has kept them already, as part
# of its checks; the restore of an interrupted update keeps the backup's.
- name: Reconcile the inputs
  ansible.builtin.include_tasks: inputs.yml
  when: graylog_state not in ['update', 'restore_interrupted']

- name: Set the retention
  ansible.builtin.include_tasks: retention.yml
  when: graylog_state not in ['update', 'restore_interrupted']

# Reached only by a run that succeeded, so the marker names other versions
# and records a rollback that worked. Not after the restore of an
# interrupted update: that run ran only the versions it had, not ones that
# succeeded in place of the failed ones, so the marker stays until such a
# run.
- name: Remove the marker of a failed update of other versions
  ansible.builtin.file:
    path: "{{ graylog_marker_file }}"
    state: absent
  when:
    - graylog_marker_read.content is defined
    - graylog_state != 'restore_interrupted'

# Graylog was (re)started on the compose file and the secrets files as they
# are and is healthy: the restart a stopped reconfigure left pending is
# done.
- name: Remove the marker of a pending restart
  ansible.builtin.file:
    path: "{{ graylog_restart_marker }}"
    state: absent
