---
# Reads the host and sets graylog_state:
#   install      no compose file
#   update       graylog_version or graylog_mongodb_version is not the
#                installed one (graylog_versions_file)
#   reconfigure  the compose file the role writes differs from the one on
#                disk, a secrets file from what the role writes, or a
#                restart is pending (graylog_restart_marker)
#   noop         everything as the role writes it
# Also sets graylog_installed (a compose file exists), graylog_compose_before
# (the compose file on disk), graylog_marker_read and graylog_marker (the
# marker of a failed update), graylog_installed_version and
# graylog_installed_mongodb_version (from graylog_versions_file, empty
# without an installation), graylog_secrets (file name to content of the
# secrets the role writes), graylog_secrets_changed (the names of the secrets
# files that differ from it), graylog_restart_pending and graylog_down (the
# services that are not running). Refuses, before any change and in this
# order: a graylog_data_dir that is not a mountpoint (with
# graylog_data_dir_mountpoint), an installation without its data
# subdirectories (an unmounted volume), after a failed update every version
# when its rollback failed too, else the failed versions, an install that did
# not complete (its marker), an update that did not finish (its marker), an
# installation without a versions file the role can read, a Graylog or
# MongoDB version older than the installed one, and a
# graylog_password_secret that is not the one of the installation. It makes
# no change.

# A block volume that is not mounted leaves its mountpoint as an empty
# directory on the root filesystem; an install there would put the data
# beside the volume.
- name: Check that the data directory is a mountpoint
  ansible.builtin.command:
    argv: [mountpoint, -q, "{{ graylog_data_dir }}"]
  register: graylog_data_dir_mounted
  changed_when: false
  failed_when: false
  when: graylog_data_dir_mountpoint | bool

- name: Refuse a data directory that is not a mountpoint
  ansible.builtin.fail:
    msg: >-
      graylog_data_dir_mountpoint is on, but {{ graylog_data_dir }} is not a
      mountpoint: is the volume mounted? The role changes nothing. Mount the
      volume at {{ graylog_data_dir }}, then run the role again.
  when:
    - graylog_data_dir_mountpoint | bool
    - graylog_data_dir_mounted.rc != 0

# The role writes no secret into it, but one changed by hand could hold one,
# so it is read and noted in no_log tasks.
- name: Read the compose file
  ansible.builtin.slurp:
    src: "{{ graylog_compose_file }}"
  register: graylog_compose_read
  failed_when: false
  no_log: true

- name: Look for the data subdirectories
  ansible.builtin.stat:
    path: "{{ graylog_data_dir }}/{{ item }}"
    get_checksum: false
  loop: "{{ graylog_data_subdirs }}"
  register: graylog_subdirs_stat

- name: Note what is on the host
  ansible.builtin.set_fact:
    graylog_compose_before: "{{ graylog_compose_read.content | default('') | b64decode }}"
    graylog_installed: "{{ graylog_compose_read.content is defined }}"
    graylog_data_present: >-
      {{ graylog_subdirs_stat.results | selectattr('stat.exists') | map(attribute='item') | list }}
  no_log: true

# Only install creates the subdirectories, and compose does not create a
# missing one (create_host_path: false), so their absence beside a compose
# file is data that is not there (an unmounted volume), never a state to
# repair: Graylog would start on an empty database and index.
- name: Refuse an installation without its data
  ansible.builtin.fail:
    msg: >-
      Graylog is installed in {{ graylog_dir }} ({{ graylog_compose_file }}),
      but {{ graylog_data_dir }} lacks {{ graylog_data_missing | join(', ') }}:
      is the volume mounted? The role changes nothing and creates none of
      them. Mount the volume (or put the data back) at {{ graylog_data_dir }},
      then run the role again.
  vars:
    # In the order of graylog_data_subdirs, which difference does not keep.
    graylog_data_missing: "{{ graylog_data_subdirs | reject('in', graylog_data_present) | list }}"
  when:
    - graylog_installed
    - graylog_data_missing | length > 0

# Written by update.yml after a failed update; it names the failed versions.
# Not secret: the versions, the backup, the time and the error.
- name: Read the marker of a failed update
  ansible.builtin.slurp:
    src: "{{ graylog_marker_file }}"
  register: graylog_marker_read
  failed_when: false

# A marker that is not YAML cannot say which update failed.
- name: Check the marker of a failed update
  when: graylog_marker_read.content is defined
  block:
    - name: Parse the marker of a failed update
      ansible.builtin.set_fact:
        graylog_marker: "{{ graylog_marker_yaml if graylog_marker_yaml is mapping else {} }}"
      vars:
        graylog_marker_yaml: "{{ graylog_marker_read.content | b64decode | from_yaml }}"
  rescue:
    - name: Fail on a marker of a failed update that is not YAML
      ansible.builtin.fail:
        msg: >-
          {{ graylog_marker_file }} exists, but it is not YAML, so the role
          cannot tell which Graylog update failed and changes nothing. Check
          Graylog, then remove the file (rm {{ graylog_marker_file }}).

# The rollback failed (or the marker does not say it worked): the database
# and the Data Node's data may be empty, half restored or migrated, and the
# backup holds them. Any version would take a backup of that state and,
# healthy, remove the marker, the last pointer to the real backup, so every
# version is refused, before the version checks: a rollback that failed
# before it put the previous versions file back leaves the failed versions in
# it, and an older pin must hear this, not the downgrade refusal.
- name: Refuse every version after a failed rollback
  ansible.builtin.fail:
    msg: >-
      {{ graylog_marker_file }} exists: the Graylog update to
      {{ graylog_marker.failed_version | default('?') }} with MongoDB
      {{ graylog_marker.failed_mongodb_version | default('?') }} failed on
      {{ graylog_marker.time | default('?') }}, and rolling back failed too
      ({{ graylog_marker.restore_error | default('?') }}). The database and
      the Data Node's data may be empty, half restored or as the new versions
      left them; they are in the backup {{ graylog_backup }}. The role
      refuses every version and changes nothing until Graylog is restored.
      {{ graylog_restore_hint }} Then check Graylog (log in, search the
      messages) and remove the marker (rm {{ graylog_marker_file }}).
  vars:
    graylog_backup: "{{ graylog_marker.backup | default('?', true) }}"
  when:
    - graylog_marker_read.content is defined
    - not graylog_marker.rolled_back_to | default(none)

# A marker that names no versions refuses every version.
- name: Refuse the versions of a failed update
  ansible.builtin.fail:
    msg: >-
      {{ graylog_marker_file }} exists: the Graylog update to
      {{ graylog_version }} with MongoDB {{ graylog_mongodb_version }} failed
      on {{ graylog_marker.time | default('?') }} (rolled back to
      {{ graylog_marker.rolled_back_to }} with MongoDB
      {{ graylog_marker.rolled_back_to_mongodb | default('?') }}; backup
      {{ graylog_marker.backup | default('?') }}). The role does not try
      these versions again and changes nothing while the marker names them.
      To try again, remove it (rm {{ graylog_marker_file }}); or set
      graylog_version or graylog_mongodb_version to another version, and the
      marker is removed once a run with it succeeds.
  when:
    - graylog_marker_read.content is defined
    - (graylog_marker.failed_version | default(graylog_version) | string) == graylog_version | string
    - (graylog_marker.failed_mongodb_version | default(graylog_mongodb_version) | string) == graylog_mongodb_version | string

- name: Look for the marker of an install in progress
  ansible.builtin.stat:
    path: "{{ graylog_install_marker }}"
    get_checksum: false
  register: graylog_install_marker_stat

- name: Refuse an install that did not complete
  ansible.builtin.fail:
    msg: >-
      {{ graylog_install_marker }} exists: an install of Graylog in
      {{ graylog_dir }} did not complete. The role changes nothing.
      {{ graylog_install_hint }}
  when: graylog_install_marker_stat.stat.exists

# Left by a run that stopped during an update (update.yml). Not secret: the
# versions, the step, the backup and the time.
- name: Read the marker of an update in progress
  ansible.builtin.slurp:
    src: "{{ graylog_update_marker }}"
  register: graylog_update_marker_read
  failed_when: false

# Whether it exists, which a read that failed does not tell.
- name: Look for the marker of an update in progress
  ansible.builtin.stat:
    path: "{{ graylog_update_marker }}"
    get_checksum: false
  register: graylog_update_marker_stat

# The compose file, the secrets, the database and the Data Node's data may
# be either version's, and Graylog may run either or neither; rolling back on
# its own would lose what changed since, if the update had in fact finished
# and only the marker's removal was lost. The operator decides.
- name: Refuse to run after an update that did not finish
  ansible.builtin.fail:
    msg: >-
      {{ graylog_update_marker }} exists: an update of Graylog in
      {{ graylog_dir }} did not finish (the run that started it stopped), so
      Graylog may run either version or neither; the role changes nothing.
      Check Graylog. To keep it as it is, remove the marker with its copies
      (rm -r {{ graylog_update_marker_files | join(' ') }}) and run the role
      again. To go back to the versions before it, restore its backup
      {{ graylog_backup }} by hand. {{ graylog_restore_hint }}
  vars:
    graylog_update_in_progress: >-
      {{ (graylog_update_marker_read.content | default('') | b64decode | from_yaml)
         if graylog_update_marker_read.content is defined else {} }}
    graylog_backup: >-
      {{ (graylog_update_in_progress.backup | default('?', true))
         if graylog_update_in_progress is mapping else '?' }}
  when: graylog_update_marker_stat.stat.exists

# Mode 0600: beside the versions it holds the SHA-256 of the password secret,
# so it is read and parsed in no_log tasks.
- name: Read the versions file
  ansible.builtin.slurp:
    src: "{{ graylog_versions_file }}"
  register: graylog_versions_read
  failed_when: false
  no_log: true
  when: graylog_installed

# A file that is not YAML, or lacks a key, parses as empty and is refused
# below; the parser's error could quote the hash.
- name: Parse the versions file
  block:
    - name: Note the versions file
      ansible.builtin.set_fact:
        graylog_versions: "{{ graylog_versions_yaml if graylog_versions_yaml is mapping else {} }}"
      vars:
        graylog_versions_yaml: "{{ (graylog_versions_read.content | default('') | b64decode or '{}') | from_yaml }}"
      no_log: true
  rescue:
    - name: Note a versions file that is not YAML
      ansible.builtin.set_fact:
        graylog_versions: {}

- name: Note the installed versions
  ansible.builtin.set_fact:
    graylog_installed_version: "{{ graylog_versions.graylog | default('', true) | string }}"
    graylog_installed_mongodb_version: "{{ graylog_versions.mongodb | default('', true) | string }}"

- name: Refuse an installation without its versions
  ansible.builtin.fail:
    msg: >-
      Graylog is installed in {{ graylog_dir }} ({{ graylog_compose_file }}),
      but {{ graylog_versions_file }} is missing, is not YAML or lacks
      graylog, mongodb or password_secret_sha256, so the role cannot tell
      which versions run and which password secret the installation was made
      with; it changes nothing. Put back the versions file the role wrote.
  when:
    - graylog_installed
    - >-
      not graylog_installed_version is match('^\d+\.\d+\.\d+$')
      or not graylog_installed_mongodb_version is match('^\d+\.\d+\.\d+$')
      or not graylog_versions.password_secret_sha256 | default('', true) | string is match('^[0-9a-f]{64}$')

# Graylog migrates its database on start, and MongoDB its data files once
# the featureCompatibilityVersion is raised (update.yml); neither goes back.
- name: Refuse a downgrade of Graylog
  ansible.builtin.fail:
    msg: >-
      graylog_version {{ graylog_version }} is lower than the installed
      version {{ graylog_installed_version }} in {{ graylog_dir }}; the role
      refuses to downgrade, as Graylog cannot migrate its database down, and
      changes nothing. Set graylog_version to {{ graylog_installed_version }}
      or newer.
  when:
    - graylog_installed
    - graylog_version is version(graylog_installed_version, '<')

- name: Refuse a downgrade of MongoDB
  ansible.builtin.fail:
    msg: >-
      graylog_mongodb_version {{ graylog_mongodb_version }} is lower than the
      installed version {{ graylog_installed_mongodb_version }} in
      {{ graylog_dir }}; the role refuses to downgrade MongoDB, which cannot
      open data files a newer release has raised, and changes nothing. Set
      graylog_mongodb_version to {{ graylog_installed_mongodb_version }} or
      newer.
  when:
    - graylog_installed
    - graylog_mongodb_version is version(graylog_installed_mongodb_version, '<')

# The secret encrypts values in the database (access tokens, the Data Node's
# certificates and credentials): with another one Graylog cannot read them.
# Compared by SHA-256 in a no_log task; the message quotes neither.
- name: Compare graylog_password_secret with the installation's
  ansible.builtin.set_fact:
    graylog_password_secret_changed: >-
      {{ graylog_installed and graylog_versions.password_secret_sha256 | string
         != graylog_password_secret | string | hash('sha256') }}
  no_log: true

- name: Refuse another graylog_password_secret
  ansible.builtin.fail:
    msg: >-
      graylog_password_secret is not the one the installation in
      {{ graylog_dir }} was made with (its SHA-256 in
      {{ graylog_versions_file }} differs; neither value is shown). Graylog
      encrypts stored values with it (access tokens, the Data Node's
      certificates), which another secret cannot read, so the role refuses to
      change it and changes nothing. Set graylog_password_secret back to the
      secret of the installation.
  when: graylog_password_secret_changed | bool

# What the secrets files hold: the password secret (the server's and the
# Data Node's) and the SHA-256 of the root password, which is all the host
# keeps of it.
- name: Note the secrets the role writes
  ansible.builtin.set_fact:
    graylog_secrets:
      password_secret: "{{ graylog_password_secret | string }}"
      root_password_sha2: "{{ graylog_root_password | string | hash('sha256') }}"
  no_log: true

- name: Find the secrets files
  ansible.builtin.find:
    paths: "{{ graylog_secrets_dir }}"
    file_type: any
    hidden: true
  register: graylog_secrets_on_disk
  when: graylog_installed

- name: Read the secrets files
  ansible.builtin.slurp:
    src: "{{ item }}"
  loop: "{{ graylog_secrets_on_disk.files | default([]) | map(attribute='path') | sort }}"
  register: graylog_secrets_read
  failed_when: false
  no_log: true

# By name, the files that differ from what the role writes (one that cannot
# be read, is missing or is not the role's among them); the names are no
# secret.
- name: Compare the secrets files with what the role writes
  ansible.builtin.set_fact:
    graylog_secrets_changed: >-
      {%- set found = {} -%}
      {%- for read in graylog_secrets_read.results | default([]) -%}
      {%-   set _ = found.update({read.item | basename: (read.content | b64decode) if read.content is defined else none}) -%}
      {%- endfor -%}
      {%- set changed = [] -%}
      {%- for name, value in graylog_secrets.items() if found[name] | default(none) != value -%}
      {%-   set _ = changed.append(name) -%}
      {%- endfor -%}
      {%- for name in found if name not in graylog_secrets -%}
      {%-   set _ = changed.append(name) -%}
      {%- endfor -%}
      {{ changed | sort }}
  no_log: true

- name: Read the services that run
  ansible.builtin.command:
    argv: [docker, compose, ps, --format, "{{ '{{.Service}}' }}", --status, running]
    chdir: "{{ graylog_dir }}"
  register: graylog_ps
  changed_when: false
  when: graylog_installed

# Written by reconfigure.yml before it writes the secrets and the compose
# file, and removed by main.yml once a run ends healthy: a run stopped in
# between leaves files that equal the settings while the containers still
# run with the old ones (they read them on start only), so the next run
# restarts them.
- name: Look for a pending restart
  ansible.builtin.stat:
    path: "{{ graylog_restart_marker }}"
    get_checksum: false
  register: graylog_restart_marker_stat

- name: Decide what to do
  ansible.builtin.set_fact:
    graylog_down: "{{ graylog_services | difference(graylog_ps.stdout_lines | default([])) }}"
    graylog_restart_pending: "{{ graylog_installed and graylog_restart_marker_stat.stat.exists }}"
    graylog_state: >-
      {{ 'install' if not graylog_installed
         else 'update' if graylog_version | string != graylog_installed_version
                          or graylog_mongodb_version | string != graylog_installed_mongodb_version
         else 'reconfigure' if graylog_compose_before != graylog_compose or graylog_secrets_changed | length > 0
                               or graylog_restart_marker_stat.stat.exists
         else 'noop' }}
