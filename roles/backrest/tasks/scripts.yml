---
# Prepares and compares only: the two scripts are rendered into the temporary
# directory and compared with the installed ones; apply.yml writes them after
# the wait for a running backup. The plan's hooks call them: the prepare script
# before each snapshot, the finish script after it, both fatal, so a failure of
# either marks the backup as failed. The report is sent in two ways, so that one
# failure sends one message: Backrest's own hook on the repository for what it
# sees fail (restic, the start hook), and backrest-finish for the failures the
# prepare script recorded, which Backrest does not count as an error. The URL
# of the report is a secret: it is written to a 0600 curl configuration and
# otherwise only handed to the hook in config.json; the tasks that handle it
# are no_log, with a fixed message when they fail.
- name: Render the scripts for comparison
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ backrest_work.path }}/{{ item.name }}"
    mode: "0600"
  loop:
    - {src: backrest-prepare.sh.j2, name: backrest-prepare}
    - {src: backrest-finish.sh.j2, name: backrest-finish}
  loop_control:
    label: "{{ item.name }}"
  changed_when: false

- name: Look at the new and the installed scripts
  ansible.builtin.stat:
    path: "{{ item.path }}"
    checksum_algorithm: sha256
  loop:
    - {key: new_prepare, path: "{{ backrest_work.path }}/backrest-prepare"}
    - {key: prepare, path: "{{ backrest_prepare_script }}"}
    - {key: new_finish, path: "{{ backrest_work.path }}/backrest-finish"}
    - {key: finish, path: "{{ backrest_finish_script }}"}
  loop_control:
    label: "{{ item.key }}"
  register: backrest_script_stats

- name: Compare them and set the hooks of the plan
  ansible.builtin.set_fact:
    backrest_scripts_changed: >-
      {{ not stat.prepare.exists or not stat.finish.exists
         or stat.prepare.checksum != stat.new_prepare.checksum
         or stat.finish.checksum != stat.new_finish.checksum }}
    backrest_plan_hooks:
      - conditions: [CONDITION_SNAPSHOT_START]
        onError: ON_ERROR_FATAL
        actionCommand: {command: "{{ backrest_prepare_script | quote }}"}
      - conditions: [CONDITION_SNAPSHOT_SUCCESS]
        onError: ON_ERROR_FATAL
        actionCommand: {command: "{{ backrest_finish_script | quote }}"}
  vars:
    stat: "{{ dict(backrest_script_stats.results | map(attribute='item.key') | zip(backrest_script_stats.results | map(attribute='stat')) | list) }}"

# Each report file is a curl configuration with one url line; its content is
# empty when the file must not exist. The success file is for healthchecks only.
# validate.yml refuses whitespace, quotes and backslashes in the URL, so it
# needs no escaping between the quotes.
- name: Work out the report
  ansible.builtin.set_fact:
    backrest_notify_files:
      - path: "{{ backrest_notify_file }}"
        content: >-
          {{ ('url = "' ~ backrest_notify_target ~ '"') if backrest_notify_url | length > 0 else '' }}
      - path: "{{ backrest_notify_success_file }}"
        content: >-
          {{ ('url = "' ~ backrest_notify_base ~ '"')
             if backrest_notify_url | length > 0 and backrest_notify_type == 'healthchecks' else '' }}
    backrest_repo_hooks: >-
      {{ [{
           'conditions': ['CONDITION_ANY_ERROR', 'CONDITION_SNAPSHOT_WARNING'],
           'onError': 'ON_ERROR_IGNORE',
           backrest_notify_action: {'webhookUrl': backrest_notify_url},
         }] if backrest_notify_url | length > 0 else [] }}
  vars:
    backrest_notify_action: "{{ 'actionDiscord' if backrest_notify_type == 'discord' else 'actionHealthchecks' }}"
    backrest_notify_base: "{{ backrest_notify_url | regex_replace('/+$', '') }}"
    # backrest-finish posts failures to the same address that Backrest's healthchecks hook does.
    backrest_notify_target: "{{ backrest_notify_url if backrest_notify_type == 'discord' else backrest_notify_base ~ '/fail' }}"
  no_log: true
  ignore_errors: true
  register: backrest_notify_build

- name: Stop when the report cannot be worked out
  ansible.builtin.fail:
    msg: The report cannot be worked out from backrest_notify_type and backrest_notify_url.
  when: backrest_notify_build is failed

- name: Look at the report files
  ansible.builtin.stat:
    path: "{{ item.path }}"
  loop: "{{ backrest_notify_files }}"
  loop_control:
    label: "{{ item.path }}"
  register: backrest_notify_stats
  no_log: true
  ignore_errors: true

- name: Stop when the report files cannot be read
  ansible.builtin.fail:
    msg: The report files below {{ backrest_config_dir }} cannot be read.
  when: backrest_notify_stats is failed

- name: Compare the report files
  ansible.builtin.set_fact:
    backrest_notify_changed: >-
      {% set ns = namespace(changed=false) %}{% for r in backrest_notify_stats.results %}{% set c = r.item.content %}{%
           if (c | length > 0 and (not r.stat.exists or r.stat.checksum != c | hash('sha1') or r.stat.mode != '0600'))
              or (c | length == 0 and r.stat.exists) %}{% set ns.changed = true %}{% endif %}{% endfor %}{{ ns.changed }}
  no_log: true
