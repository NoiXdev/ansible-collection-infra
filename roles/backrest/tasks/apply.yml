---
# Every change to the host and the running service happens here, from what
# install.yml and config.yml prepared. A restart kills a running backup (restic,
# or the hooks around it: backrest-prepare while it dumps, backrest-finish), so
# the wait for a running backup comes before the first write; when it gives up
# the host is unchanged. The brackets keep the pattern from matching the shell
# that runs pgrep, whose command line holds it.
- name: Wait for a running backup
  ansible.builtin.shell: >-
    pgrep -x restic >/dev/null; restic=$?;
    pgrep -f -- {{ backrest_hook_pattern | quote }} >/dev/null; hooks=$?;
    if [ "$restic" = 0 ] || [ "$hooks" = 0 ]; then exit 0; fi;
    if [ "$restic" = 1 ] && [ "$hooks" = 1 ]; then exit 1; fi;
    exit 2
  vars:
    backrest_hook_pattern: >-
      {{ [backrest_prepare_script, backrest_finish_script] | map('regex_replace', '^/', '[/]') | join('|') }}
  register: backrest_restic
  changed_when: false
  failed_when: backrest_restic.rc not in [0, 1]
  until: backrest_restic.rc == 1
  retries: "{{ [((backrest_restart_wait | int) / 5) | round(0, 'ceil') | int, 1] | max }}"
  delay: 5
  ignore_errors: true
  when: backrest_writes_pending | bool

- name: Stop while a backup is running
  ansible.builtin.fail:
    msg: >-
      A backup is running (restic, backrest-prepare or backrest-finish) and the role has to change the host. Nothing was changed.
      Run it again when the backup is done, or raise backrest_restart_wait (now {{ backrest_restart_wait }} seconds).
  when: backrest_writes_pending | bool and backrest_restic.rc | default(1) != 1

# backrest-finish sends the report with curl.
- name: Install curl
  ansible.builtin.apt:
    name: curl
    state: present

- name: Create the directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  loop:
    - "{{ backrest_config_dir }}"
    - "{{ backrest_data_dir }}"
    - "{{ backrest_cache_dir }}"
    - "{{ backrest_dump_dir }}"

# From here until Backrest has restarted, a run that dies would leave Backrest
# on what it read at its last start, while the files already match; the marker
# makes the next run restart it.
- name: Mark the restart as pending
  ansible.builtin.copy:
    content: ""
    dest: "{{ backrest_restart_marker }}"
    owner: root
    group: root
    mode: "0600"
    force: false
  when: backrest_restart_needed | bool

# copy replaces the file atomically, so a running Backrest keeps its binary.
- name: Install the binary
  ansible.builtin.copy:
    src: "{{ backrest_work.path }}/{{ backrest_binary_in_archive }}"
    dest: "{{ backrest_binary }}"
    remote_src: true
    owner: root
    group: root
    mode: "0755"
  when: backrest_binary_changed | bool

- name: Write the environment file
  ansible.builtin.template:
    src: backrest.env.j2
    dest: "{{ backrest_env_file }}"
    owner: root
    group: root
    mode: "0600"

- name: Write the unit
  ansible.builtin.template:
    src: backrest.service.j2
    dest: "{{ backrest_unit_file }}"
    owner: root
    group: root
    mode: "0644"

- name: Write the scripts
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    mode: "0700"
  loop:
    - {src: backrest-prepare.sh.j2, dest: "{{ backrest_prepare_script }}"}
    - {src: backrest-finish.sh.j2, dest: "{{ backrest_finish_script }}"}
  loop_control:
    label: "{{ item.dest }}"

- name: Write the report files
  ansible.builtin.copy:
    content: "{{ item.content }}"
    dest: "{{ item.path }}"
    owner: root
    group: root
    mode: "0600"
  loop: "{{ backrest_notify_files | selectattr('content', 'ne', '') | list }}"
  no_log: true
  diff: false
  ignore_errors: true
  register: backrest_notify_write

- name: Stop when the report files cannot be written
  ansible.builtin.fail:
    msg: The report files below {{ backrest_config_dir }} could not be written.
  when: backrest_notify_write is failed

- name: Remove the report files that are not needed
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ backrest_notify_files | selectattr('content', 'eq', '') | map(attribute='path') | list }}"

# The marker of the age check on a host without a good backup; written once.
- name: Note the first run
  ansible.builtin.copy:
    content: ""
    dest: "{{ backrest_first_run_file }}"
    owner: root
    group: root
    mode: "0600"
    force: false

- name: Write the configuration
  ansible.builtin.copy:
    content: "{{ backrest_desired | combine({'modno': backrest_modno | int}) | to_nice_json(indent=2) }}\n"
    dest: "{{ backrest_config_file }}"
    owner: root
    group: root
    mode: "0600"
  when: backrest_config_changed | bool
  no_log: true
  diff: false
  ignore_errors: true
  register: backrest_config_write

- name: Stop when the configuration cannot be written
  ansible.builtin.fail:
    msg: "{{ backrest_config_file }} could not be written."
  when: backrest_config_write is failed

- name: Write the list of active apps
  ansible.builtin.copy:
    content: "{{ backrest_active_apps_content }}"
    dest: "{{ backrest_active_apps_file }}"
    owner: root
    group: root
    mode: "0600"

# Without them restic fails; the prepare script replaces them at each backup.
- name: Create an empty exclude file and targets file when there are none
  ansible.builtin.copy:
    content: ""
    dest: "{{ item }}"
    owner: root
    group: root
    mode: "0600"
    force: false
  loop:
    - "{{ backrest_excludes_file }}"
    - "{{ backrest_targets_file }}"

- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: backrest_unit_changed | bool or backrest_exists.restart_marker | bool

- name: Enable the service and start it, or restart it after a change
  ansible.builtin.systemd_service:
    name: backrest
    enabled: true
    state: "{{ 'restarted' if backrest_restart_needed | bool else 'started' }}"

# Backrest sets the repository id after the first init; the next run must find it.
- name: Wait until Backrest has written the repository id
  ansible.builtin.slurp:
    src: "{{ backrest_config_file }}"
  register: backrest_written
  until: (backrest_written.content | b64decode | from_json).repos[0].guid | default('') | length == 64
  retries: 120
  delay: 1
  no_log: true
  ignore_errors: true
  when: (backrest_config_changed | bool or backrest_exists.restart_marker | bool) and 'guid' not in backrest_desired.repos[0]

- name: Stop when the repository was not initialised
  ansible.builtin.fail:
    msg: Backrest did not initialise the repository; see journalctl -u backrest.
  when: backrest_written is failed

- name: Clear the pending restart
  ansible.builtin.file:
    path: "{{ backrest_restart_marker }}"
    state: absent
