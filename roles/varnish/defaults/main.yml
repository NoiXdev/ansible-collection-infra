---
# major.minor series from Varnish Software's repository (9.1 as of 2026-11).
# Updates within the series come through unattended-upgrades. A varnish of
# another series that is installed already is refused, never replaced.
varnish_version: "9.1"

varnish_apt_url: https://packages.varnish-software.com/varnish/ubuntu
varnish_apt_suite: "{{ ansible_facts['distribution_release'] }}"
varnish_apt_key_url: https://packages.varnish-software.com/varnish/varnish.pub.asc
# The key that signs the repository.
varnish_apt_key_fingerprint: 694566269779DFAC975ED9BDD0525EAE838B3344

# Where Varnish listens for nginx (loopback only), and its admin port. The
# role writes:
# - /etc/varnish/noixdev-front.key, the front key (64 hex digits, root 0600,
#   created once; delete it and the next run creates a new one): Varnish
#   answers only requests that carry it in X-Noix-Front (and GET or HEAD of
#   /.noix-front-probe, the nginx role's probe through the WAF, with 204);
# - /etc/varnish/noixdev.vcl, which holds the key: root:varnish 0640, as
#   varnishd reads its VCL as the user varnish (a root 0600 file does not
#   load);
# - /etc/systemd/system/varnish.service.d/noixdev.conf, the listeners and the
#   storage; a change restarts Varnish (the cache is lost), a VCL change alone
#   reloads it;
# - /var/lib/varnish (varnishd's working directory, with every compiled VCL)
#   root:varnish 0750, and varnishd runs with umask 027: other users cannot
#   read the key or the purge tokens there.
varnish_port: 6081
varnish_admin_port: 6082

# The backend: nginx's inner server (nginx_inner_port of the nginx role).
varnish_backend_host: 127.0.0.1
varnish_backend_port: 8931

# The cache (malloc) and the transient storage, as varnishd -s takes them: a
# number and k, m or g.
varnish_memory: 512M
varnish_transient_memory: 128M

# Grace, in seconds: how long a stale object is served while the backend is
# healthy (and refreshed in the background), and while it is sick. An object
# stays in the cache for the sick grace.
varnish_grace_healthy: 30
varnish_grace_sick: 21600

# Backend timeouts, in seconds.
varnish_connect_timeout: 2
varnish_first_byte_timeout: 60
varnish_between_bytes_timeout: 60

# The sites the cache serves. A site that is not listed is not cached: its
# requests pass, and its purge token stops working.
#   - name: prod                       # the nginx site's name; ^[a-z0-9_-]+$, unique
#     profile: generic                 # generic (the default), shopware or typo3
#     purge_token: "..."               # required, at least 32 of A-Za-z0-9._~-, unique
#     microcache: 0                    # seconds, 0..300; not with shopware: a 200, 301
#                                      # or 404 the app does not make cacheable (no
#                                      # max-age, s-maxage or Expires; private, no-cache,
#                                      # no-store) is kept that long, never one with
#                                      # Set-Cookie. Without it such a page is not cached.
#     health_path: ""                  # e.g. /health; probed every 5 s (200 = healthy, sick
#                                      # after 3 failures of 5); while sick, stale pages
#                                      # are served for varnish_grace_sick
#     health_host: ""                  # the Host header of the probe; required with health_path
#     debug_header: false              # X-Cache on the answers
#     strip_cookies: []                # cookie names this site adds to varnish_strip_cookies;
#                                      # a trailing * means prefix
#
# Invalidation goes straight to Varnish (127.0.0.1, varnish_port) from the
# host, never through nginx (a request with the front key gets 403), with the
# site's name and purge_token: Basic auth (http://<name>:<token>@127.0.0.1:6081)
# or the headers X-Noix-Site: <name> and X-Purge-Token: <token>. Without them
# (or for a site that is not listed) 401, on invalid input 400. Each request
# acts on the objects of that site only:
#   PURGE <url>                     the URL, on every host of the site
#   PURGE with xkey: <tag> <tag>    the objects tagged with any of the tags (the
#                                   app's xkey header); tags of A-Za-z0-9_.:-,
#                                   at most 256 each, one space apart
#   BAN <regex>                     the objects whose URL matches; BAN / is the
#                                   whole site
#   BAN with X-Cache-Tags: <regex>  the objects whose X-Cache-Tags match; .* is
#                                   the whole site
# The regular expressions take A-Za-z0-9_.:;,|/*+?^$()[]{}\- only, at most
# 1024 characters; a URL to purge has no quote, backslash or space.
varnish_sites: []

# Cookies removed from every request before the cache decides (a trailing *
# means prefix): analytics and tracking, and Anubis's own (Anubis checked the
# request in nginx already). A request with any other cookie left passes
# (generic, typo3). No consent cookies: stripping one is right only for an
# app that reads consent in the browser, so a site that knows adds its own
# to strip_cookies.
varnish_strip_cookies:
  - _ga
  - _ga_*
  - _gid
  - _gat*
  - _gcl_*
  - _fbp
  - _fbc
  - _pk_*
  - mtm_*
  - _hj*
  - _uetsid
  - _uetvid
  - _clck
  - _clsk
  # Anubis v1.28.2 (anubis_image of the anubis role; lib/http.go and
  # cmd/anubis/main.go at that tag): <prefix>-auth, -cookie-verification and
  # -original-referer with the default prefix techaro.lol-anubis, and by
  # default a suffix of "-" and 8 hex digits from the cookie settings.
  - techaro.lol-anubis-auth*
  - techaro.lol-anubis-cookie-verification*
  - techaro.lol-anubis-original-referer*
