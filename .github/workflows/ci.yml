name: ci

# Cheap checks only. The Docker test suites (tests/run.sh, tests/host,
# tests/harbor, tests/listmonk, tests/anubis, tests/mailcow,
# tests/cloudpanel) run locally with tests/all.sh before pushing; a release
# needs a signed attestation of that run (tests/attest.sh, checked by
# release-gate.yml); see CONTRIBUTING.md.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install ansible-core ansible-lint
      - run: ansible-galaxy collection install community.docker community.general ansible.posix
      - run: ansible-lint

  shellcheck:
    # The test scripts, the release gate's scripts and the stubs' shell
    # scripts. The roles' shell templates all contain Jinja; the suites run
    # them rendered.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: shellcheck
        run: |
          shopt -s globstar
          shellcheck --version
          shellcheck tests/**/*.sh .github/scripts/*.sh tests/mailcow/stub/data/conf/stub/{apk,composer,php}

  attest-selftest:
    # tests/attest.sh and the release gate's verifier against throwaway keys
    # in a throwaway repository; no Docker, no network.
    name: attestation self-test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: tests/attest/selftest.sh
